é", "solution": null, "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "chia hết", "tích các chữ số"], "mock": false, "mc": null, "key": ["77175"], "gradable": true}, {"id": "AMS-2010-11", "school": "AMS", "year": "2010", "part": "TL", "q_no": 11, "points": null, "statement": "Lớp 5A có 24 bạn tham gia câu lạc bộ cờ vua, 16 bạn tham gia câu lạc bộ bóng bàn còn lại 8 bạn không tham gia hai câu lạc bộ đó. Tính số học sinh của lớp 5A, biết rằng có 8 bạn tham gia cả hai câu lạc bộ cờ vua và bóng bàn.", "has_figure": false, "garbled": false, "answer": "40", "solution": "Số bạn chỉ tham gia câu lạc bộ cờ vua là 24 − 8 = 16 bạn.\nSố bạn chỉ tham gia câu lạc bộ bóng bàn là 16 − 8 = 8 bạn.\nVì có 8 bạn tham gia cả hai câu lạc bộ nên số bạn tham gia câu lạc bộ cờ vua hoặc bóng bàn là 16 + 8 + 8 = 32. Vì lớp còn 8 bạn không tham gia hai câu lạc bộ đó nên số học sinh lớp 5A là 32 + 8 = 40.\nĐáp số: 40.", "unit": "c6", "unit_alt": "u12", "difficulty": 2, "vn_grade": 4, "skills": ["sơ đồ Venn", "đếm", "suy luận"], "mock": false, "mc": null, "key": ["40"], "gradable": true}, {"id": "AMS-2010-12", "school": "AMS", "year": "2010", "part": "TL", "q_no": 12, "points": null, "statement": "Trên quãng đường từ A đến B có hai người đi xe đạp cùng khởi hành từ A đến B. Người thứ nhất đi với vận tốc 10 km/h, người thứ hai đi với vận tốc 8 km/h. Sau khi đi 2 giờ, người thứ hai tăng vận tốc lên 14 km/h nên đuổi kịp người thứ nhất ở địa điểm C. Tính thời gian người thứ hai đã đi trên quãng đường AC và tính quãng đường AB biết người thứ hai đi từ C đến B hết 2 giờ.", "has_figure": false, "garbled": false, "answer": "3 giờ; AB = 58 km (theo đáp án in: 2 × 3 + 3 × 14 = 58 km)", "solution": "Hai giờ đầu, người thứ nhất đi được quãng đường 20 km, người thứ hai đi được 16 km.\nNhư vậy người thứ hai cách người thứ nhất 4 km.\nĐể đuổi kịp, người thứ hai phải đi trong 4/(14 − 10) = 1 giờ.\nVậy người thứ hai đã đi quãng đường AC trong thời gian là 2 + 1 = 3 giờ.\nQuãng đường AB người thứ hai đã đi là 2 × 3 + 3 × 14 = 58 km.\n(Lời giải in như vậy; lưu ý nếu tính AC = 16 + 14 = 30 km và CB = 2 × 14 = 28 km thì AB = 58 km.)", "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động cùng chiều", "đuổi kịp", "quãng đường"], "mock": false, "mc": null, "key": ["14", "2", "3", "3", "3", "58", "58"], "gradable": true}, {"id": "AMS-2011-1", "school": "AMS", "year": "2011", "part": "DT", "q_no": 1, "points": null, "statement": "Viết số tự nhiên nhỏ nhất có năm chữ số khác nhau sao cho tổng các chữ số của số đó là 23.", "has_figure": false, "garbled": false, "answer": "10589", "solution": null, "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["cấu tạo số", "số nhỏ nhất", "chữ số khác nhau"], "mock": false, "mc": null, "key": ["10589"], "gradable": true}, {"id": "AMS-2011-2", "school": "AMS", "year": "2011", "part": "DT", "q_no": 2, "points": null, "statement": "Tìm ab biết rằng ab = ba × 3 + 6.", "has_figure": false, "garbled": false, "answer": "51", "solution": null, "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "đổi chỗ chữ số"], "mock": false, "mc": null, "key": ["51"], "gradable": true}, {"id": "AMS-2011-3", "school": "AMS", "year": "2011", "part": "DT", "q_no": 3, "points": null, "statement": "Giá 11 cái bút bằng giá của 2 quyển vở và 1 quyển sách. Giá của 5 quyển vở bằng giá của 3 quyển sách. Hỏi giá 10 quyển vở và 9 quyển sách bằng giá của bao nhiêu cái bút?", "has_figure": false, "garbled": false, "answer": "75", "solution": null, "unit": "c3", "unit_alt": "c5", "difficulty": 2, "vn_grade": 4, "skills": ["phương pháp khử", "quy đổi"], "mock": false, "mc": null, "key": ["75"], "gradable": true}, {"id": "AMS-2011-4", "school": "AMS", "year": "2011", "part": "DT", "q_no": 4, "points": null, "statement": "Hiện nay tuổi bố bằng tuổi mẹ cộng với tuổi con. Khi tuổi mẹ bằng tuổi bố hiện nay thì tuổi mẹ gấp ba lần tuổi con và tổng số tuổi của ba người lúc đó sẽ là 90. Tính tuổi con hiện nay.", "has_figure": false, "garbled": false, "answer": "6", "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu không đổi", "tổng–tỉ"], "mock": false, "mc": null, "key": ["6"], "gradable": true}, {"id": "AMS-2011-5", "school": "AMS", "year": "2011", "part": "DT", "q_no": 5, "points": null, "statement": "Xếp các hình lập phương nhỏ có cạnh 2 cm thành hình lập phương lớn có thể tích 216 cm3. Sau đó lấy đi một hình lập phương nhỏ ở chính giữa mặt bên của hình lập phương lớn. Tính diện tích toàn phần của hình còn lại.", "has_figure": false, "garbled": false, "answer": "232 cm2", "solution": null, "unit": "c7", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["diện tích toàn phần", "hình lập phương", "thể tích"], "mock": false, "mc": null, "key": ["2", "232"], "gradable": true}, {"id": "AMS-2011-6", "school": "AMS", "year": "2011", "part": "DT", "q_no": 6, "points": null, "statement": "Nhân ngày quốc tế thiếu nhi, một cửa hàng giảm giá 10% so với giá định bán nhưng vẫn có lãi 12,5% so với tiền vốn. Hỏi nếu không hạ giá thì cửa hàng đó lãi bao nhiêu phần trăm so với tiền vốn?", "has_figure": false, "garbled": false, "answer": "25%", "solution": null, "unit": "u4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "lãi", "giá vốn giá bán"], "mock": false, "mc": null, "key": ["25"], "gradable": true}, {"id": "AMS-2011-7", "school": "AMS", "year": "2011", "part": "DT", "q_no": 7, "points": null, "statement": "Một người đi từ A đến B bằng xe đạp trong 4 giờ với vận tốc 12 km/giờ, sau đó đi bằng xe máy trong 6 giờ thì đến B. Lúc về, người đó đi bằng xe máy trong 2 giờ rồi đi ô tô trong 3 giờ thì về đến A, biết vận tốc xe máy bằng nửa vận tốc ô tô, tính quãng đường AB.", "has_figure": false, "garbled": false, "answer": "192 km", "solution": null, "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động", "quãng đường", "tỉ số vận tốc"], "mock": false, "mc": null, "key": ["192"], "gradable": true}, {"id": "AMS-2011-8", "school": "AMS", "year": "2011", "part": "DT", "q_no": 8, "points": null, "statement": "Cho tam giác ABC biết BM = MC, CN = 3NA, và diện tích tam giác AEN bằng 27 cm2 (M trên BC, N trên AC, E là giao của BN kéo dài với đường thẳng qua A — xem hình vẽ). Tính diện tích tam giác ABC.", "has_figure": true, "garbled": false, "answer": "216 cm2", "solution": null, "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "tam giác chung chiều cao"], "mock": false, "mc": null, "key": ["2", "216"], "gradable": true}, {"id": "AMS-2011-9", "school": "AMS", "year": "2011", "part": "DT", "q_no": 9, "points": null, "statement": "Tổng của ba số nguyên là 2904. Nếu lấy số thứ nhất chia cho số thứ hai thì được thương là 3 dư 1. Nếu lấy số thứ hai chia cho số thứ ba cũng được thương là 3 dư 1. Tìm số thứ nhất.", "has_figure": false, "garbled": false, "answer": "2011", "solution": null, "unit": "c3", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["tổng–tỉ", "phép chia có dư"], "mock": false, "mc": null, "key": ["2011"], "gradable": true}, {"id": "AMS-2011-10", "school": "AMS", "year": "2011", "part": "DT", "q_no": 10, "points": null, "statement": "Tìm x sao cho (x + 1/(1×3)) + (x + 1/(3×5)) + (x + 1/(5×7)) + ··· + (x + 1/(23×25)) = 11 × (x + 1/3 + 1/9 + 1/27 + 1/81 + 1/243).", "has_figure": false, "garbled": false, "answer": "109/6075", "solution": null, "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tìm x", "tính nhanh"], "mock": false, "mc": null, "key": ["109/6075"], "gradable": true}, {"id": "AMS-2011-11", "school": "AMS", "year": "2011", "part": "TL", "q_no": 11, "points": null, "statement": "Một giải bóng đá có bốn đội A, B, C, D tham gia. Mỗi đội đấu với từng đội còn lại một trận. Đội thắng được 3 điểm, thua được 0 điểm, nếu hòa thì mỗi đội được 1 điểm. Kết quả là đội A được 7 điểm, đội B được 5 điểm, đội C được 3 điểm, đội D được 1 điểm. Hỏi có tất cả mấy trận hòa trong giải bóng đá và trận đấu giữa đội A và đội C có kết quả thế nào?", "has_figure": false, "garbled": false, "answer": "2 trận hòa; C thua A", "solution": "Tổng số trận đấu là 3 + 2 + 1 = 6, tổng số điểm của các đội là 7 + 5 + 3 + 1 = 16. Tổng điểm của hai đội trong một trận thắng là 3, trong mỗi trận hòa là 2. Giả sử nếu không có trận hòa nào thì tổng điểm của bốn đội bóng khi kết thúc giải là 6 × 3 = 18 điểm.\nNhưng tổng số điểm của bốn đội là 16, thành ra có hai trận hòa trong giải đấu này.\nĐội A đấu ba trận được tổng số điểm là 7 nên suy ra đội A không thua trận nào.\nĐội C đấu ba trận được tổng số điểm là 3, mà chỉ có tất cả hai trận hòa trong giải nên đội C thua hai trận, thắng một trận.\nDo đó, C thua đội A.", "unit": "c6", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["suy luận logic", "bóng đá", "tổng điểm"], "mock": false, "mc": null, "key": ["2"], "gradable": true}, {"id": "AMS-2011-12", "school": "AMS", "year": "2011", "part": "TL", "q_no": 12, "points": null, "statement": "Cho bốn số tự nhiên bất kỳ a, b, c, d và a > b > c > d. Chứng tỏ rằng tích của tất cả các số tự nhiên là hiệu của hai trong bốn số đã cho là một số chia hết cho 12.", "has_figure": false, "garbled": false, "answer": "Chứng minh (p chia hết cho 12)", "solution": "Ta cần chứng minh rằng p = (a − b)(a − c)(a − d)(b − c)(b − d)(c − d) chia hết cho 12. Nhận xét rằng khi chia một số cho 3 thì số dư là một trong ba số 0, 1, 2.\nXét tính chia hết của p với 3 và 4, riêng rẽ.\nTheo nguyên lý Dirichlet, tồn tại ít nhất hai số nguyên trong bốn số a, b, c, d cho cùng số dư khi chia cho 3. Hiệu của hai số này chia hết cho 3.\nDo đó, p chia hết cho 3. Nếu tồn tại hai trong bốn số nguyên a, b, c, d cho cùng số dư khi chia cho 4, thì p chia hết cho 4, theo cách lập luận như trên.\nNếu không, các số dư của a, b, c, d khi chia cho 4 sẽ khác nhau.\nNhưng khi đó, hai trong bốn số cùng tính chẵn lẻ, cặp còn lại cũng cùng tính chẵn lẻ, thì hiệu của chúng đều chẵn.\nTích của hai số chẵn chia hết cho 4.\nDo đó, p chia hết cho 4. Vậy, p chia hết cho 12.", "unit": "c2", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["chia hết", "Dirichlet", "chứng minh"], "mock": false, "mc": null, "key": ["12"], "gradable": true}, {"id": "AMS-2012-1", "school": "AMS", "year": "2012", "part": "DT", "q_no": 1, "points": null, "statement": "Tính giá trị của biểu thức (154 + 919 + 146 + 781) / (823 − 217 + 533 − 139).", "has_figure": false, "garbled": false, "answer": "2", "solution": null, "unit": "c1", "unit_alt": "u1", "difficulty": 1, "vn_grade": 4, "skills": ["tính nhanh", "nhóm số hạng"], "mock": false, "mc": null, "key": ["2"], "gradable": true}, {"id": "AMS-2012-2", "school": "AMS", "year": "2012", "part": "DT", "q_no": 2, "points": null, "statement": "Tìm x biết rằng (1/(3×5) + 1/(5×7) + 1/(7×9) + ··· + 1/(19×21)) × x = 9/7.", "has_figure": false, "garbled": false, "answer": "9", "solution": null, "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tìm x"], "mock": false, "mc": null, "key": ["9"], "gradable": true}, {"id": "AMS-2012-3", "school": "AMS", "year": "2012", "part": "DT", "q_no": 3, "points": null, "statement": "Mỗi một phút người ta hít thở 15 lần, mỗi lần hít 0,55 lít không khí, mỗi lít không khí nặng 1,3 g. Hỏi trong năm ngày người đó hít bao nhiêu gam không khí?", "has_figure": false, "garbled": false, "answer": "77220", "solution": null, "unit": "u2", "unit_alt": "u5", "difficulty": 2, "vn_grade": 5, "skills": ["số thập phân", "đổi đơn vị thời gian", "nhân số thập phân"], "mock": false, "mc": null, "key": ["77220"], "gradable": true, "ed_note": "bản in ghi \"1,3 kg\""}, {"id": "AMS-2012-4", "school": "AMS", "year": "2012", "part": "DT", "q_no": 4, "points": null, "statement": "Tổ I trồng được mười lăm cây, tổ II trồng được hơn tổ I là bốn cây. Tổ III trồng hơn trung bình cộng của ba tổ là sáu cây. Tính số cây tổ III trồng được.", "has_figure": false, "garbled": false, "answer": "26", "solution": null, "unit": "u14", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["trung bình cộng", "hơn mức trung bình"], "mock": false, "mc": null, "key": ["26"], "gradable": true}, {"id": "AMS-2012-5", "school": "AMS", "year": "2012", "part": "DT", "q_no": 5, "points": null, "statement": "Cho ba số có tổng là 2052. Biết số thứ nhất bằng 3/4 số thứ hai, số thứ hai bằng 1/3 số thứ ba. Tìm mỗi số.", "has_figure": false, "garbled": false, "answer": "324, 432, 1296", "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng–tỉ", "ba số", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["1296", "324", "432"], "gradable": true}, {"id": "AMS-2012-6", "school": "AMS", "year": "2012", "part": "DT", "q_no": 6, "points": null, "statement": "Hai ô tô cùng khởi hành một lúc tại A và B để đi cùng chiều tới địa điểm C. Biết rằng A và B cách nhau 48 km. Sau ba giờ, ô tô xuất phát từ A đuổi kịp ô tô xuất phát từ B tại điểm C. Biết tỉ số vận tốc của ô tô đi từ A và ô tô đi từ B là 5/3. Tính quãng đường BC.", "has_figure": false, "garbled": false, "answer": "72 km", "solution": null, "unit": "c4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động cùng chiều", "đuổi kịp", "tỉ số vận tốc"], "mock": false, "mc": null, "key": ["72"], "gradable": true}, {"id": "AMS-2012-7", "school": "AMS", "year": "2012", "part": "DT", "q_no": 7, "points": null, "statement": "Tổng hai bán kính của hai hình tròn là 16 cm. Hình tròn lớn có diện tích gấp 9 lần diện tích hình tròn nhỏ. Tìm chu vi của mỗi hình tròn.", "has_figure": false, "garbled": false, "answer": "25,12 cm, 75,36 cm", "solution": null, "unit": "u6", "unit_alt": "c3", "difficulty": 2, "vn_grade": 5, "skills": ["chu vi hình tròn", "diện tích hình tròn", "tổng–tỉ"], "mock": false, "mc": null, "key": ["25.12", "75.36"], "gradable": true}, {"id": "AMS-2012-8", "school": "AMS", "year": "2012", "part": "DT", "q_no": 8, "points": null, "statement": "Tuổi của bố năm nay gấp 2,2 lần tuổi của con. Hai mươi lăm năm về trước, tuổi bố gấp 8,2 lần tuổi con. Hỏi khi tuổi bố gấp ba lần tuổi con thì con bao nhiêu tuổi?", "has_figure": false, "garbled": false, "answer": "18 tuổi", "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["bài toán tuổi", "hiệu không đổi", "số thập phân"], "mock": false, "mc": null, "key": ["18"], "gradable": true}, {"id": "AMS-2012-9", "school": "AMS", "year": "2012", "part": "DT", "q_no": 9, "points": null, "statement": "Cho dãy số 2, 17, 47, 92, 152, ..., hãy tìm số hạng thứ 120 của dãy.", "has_figure": false, "garbled": false, "answer": "107102", "solution": null, "unit": "u15", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy số", "quy luật", "số hạng thứ n"], "mock": false, "mc": null, "key": ["107102"], "gradable": true}, {"id": "AMS-2012-10", "school": "AMS", "year": "2012", "part": "DT", "q_no": 10, "points": null, "statement": "Sách khoa học và sách lịch sử được xếp vào 5 ngăn: Ngăn một có 23 cuốn, ngăn hai có 5 cuốn, ngăn ba có 16 cuốn, ngăn bốn có 22 cuốn, ngăn năm có 14 cuốn. Sau khi lấy đi số sách trong một ngăn thì số sách khoa học trong bốn ngăn còn lại gấp ba lần số sách lịch sử. Hỏi bốn ngăn còn lại có bao nhiêu sách mỗi loại.", "has_figure": false, "garbled": false, "answer": "16 sách lịch sử, 48 sách khoa học", "solution": null, "unit": "c6", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["chia hết cho 4", "suy luận", "tổng–tỉ"], "mock": false, "mc": null, "key": ["16", "48"], "gradable": true}, {"id": "AMS-2012-11", "school": "AMS", "year": "2012", "part": "TL", "q_no": 11, "points": null, "statement": "Có 22 ô tô gồm ba loại: loại bốn bánh chở được 6 tấn, loại sáu bánh chở được 8 tấn, loại tám bánh chở được 8 tấn. Số xe đó có tất cả là 126 bánh và có thể chở cùng một lúc được 158 tấn. Hỏi mỗi loại có bao nhiêu xe?", "has_figure": false, "garbled": false, "answer": "9 xe bốn bánh; 7 xe 6 bánh; 6 xe 8 bánh", "solution": null, "unit": "c3", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["giả thiết tạm", "ba ẩn", "suy luận"], "mock": false, "mc": null, "key": ["6", "6", "7", "8", "9"], "gradable": true}, {"id": "AMS-2012-12", "school": "AMS", "year": "2012", "part": "TL", "q_no": 12, "points": null, "statement": "Cho tứ giác ABCD có diện tích là 1216 cm2. Cho M, N, P trên AB sao cho AM = MN = NP = PB. Cho E, F, G trên CD sao cho DE = EF = FG = GC. Tính diện tích tứ giác NPFE.", "has_figure": false, "garbled": false, "answer": "304 cm2", "solution": "Đặc biệt hóa tứ giác ABCD là hình chữ nhật.\nTừ đó suy ra ngay diện tích của NPEF là 1216 : 4 = 304 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "tứ giác", "chia đều cạnh"], "mock": false, "mc": null, "key": ["2", "304"], "gradable": true}, {"id": "AMS-2013-1", "school": "AMS", "year": "2013", "part": "DT", "q_no": 1, "points": null, "statement": "Cho các chữ số 1; 2; 3; 4; 5. Hỏi từ các chữ số trên lập được bao nhiêu số chẵn có ba chữ số khác nhau?", "has_figure": false, "garbled": false, "answer": "24", "solution": null, "unit": "c6", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["lập số", "đếm số", "số chẵn"], "mock": false, "mc": null, "key": ["24"], "gradable": true}, {"id": "AMS-2013-2", "school": "AMS", "year": "2013", "part": "DT", "q_no": 2, "points": null, "statement": "Tìm x biết rằng x × (3 + 3/20 + 3/13 + 3/2013) / (5 + 5/20 + 5/13 + 5/2013) = 5/3.", "has_figure": false, "garbled": false, "answer": "25/9", "solution": null, "unit": "c1", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tính nhanh", "thừa số chung", "tìm x"], "mock": false, "mc": null, "key": ["25/9"], "gradable": true}, {"id": "AMS-2013-3", "school": "AMS", "year": "2013", "part": "DT", "q_no": 3, "points": null, "statement": "Tổng của ba số chẵn liên tiếp bằng 2028. Tìm ba số đó.", "has_figure": false, "garbled": false, "answer": "674, 676, 678", "solution": null, "unit": "u14", "unit_alt": "c3", "difficulty": 1, "vn_grade": 4, "skills": ["trung bình cộng", "số chẵn liên tiếp"], "mock": false, "mc": null, "key": ["674", "676", "678"], "gradable": true}, {"id": "AMS-2013-4", "school": "AMS", "year": "2013", "part": "DT", "q_no": 4, "points": null, "statement": "Trong một cuộc thi có 60 câu hỏi. Mỗi câu trả lời đúng được 1/6 điểm, mỗi câu trả lời sai bị trừ 1/2 điểm. Một bạn học sinh được tổng điểm là 8. Hỏi học sinh đó trả lời đúng mấy câu.", "has_figure": false, "garbled": false, "answer": "57", "solution": null, "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["giả thiết tạm", "phân số"], "mock": false, "mc": null, "key": ["57"], "gradable": true}, {"id": "AMS-2013-5", "school": "AMS", "year": "2013", "part": "DT", "q_no": 5, "points": null, "statement": "Một người đi từ A đến D phải đi qua hai điểm B và C. Vận tốc lúc đi trên các quãng đường AB, BC, CD lần lượt là 9 km/h, 12 km/h và 18 km/h. Lúc về vận tốc các quãng đường DC, CB, BA lần lượt là 9 km/h, 12 km/h, và 18 km/h. Cả đi lẫn về hết 5 giờ. Tính quãng đường AD.", "has_figure": false, "garbled": false, "answer": "30 km", "solution": null, "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động", "vận tốc", "thời gian"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "AMS-2013-6", "school": "AMS", "year": "2013", "part": "DT", "q_no": 6, "points": null, "statement": "Hai máy cùng gặt xong một thửa ruộng hết 12 giờ. Nếu máy I gặt một mình trong 4 giờ, rồi máy II gặt tiếp thêm 9 giờ nữa thì được 7/12 thửa ruộng. Hỏi nếu máy I gặt một mình thì gặt xong thửa ruộng trong bao lâu?", "has_figure": false, "garbled": false, "answer": "30 giờ", "solution": null, "unit": "c5", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["công việc chung", "năng suất", "phân số"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "AMS-2013-7", "school": "AMS", "year": "2013", "part": "DT", "q_no": 7, "points": null, "statement": "Người ta sử dụng các khối lập phương nhỏ có cạnh bằng 1 cm để xếp thành một khối lập phương lớn. Biết tổng tất cả các khối lập phương nhỏ xếp trên các cạnh và đỉnh của hình lập phương lớn là 104. Tính thể tích khối lập phương lớn được tạo thành.", "has_figure": false, "garbled": false, "answer": "1000 cm3", "solution": null, "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình lập phương", "đếm khối", "thể tích"], "mock": false, "mc": null, "key": ["1000", "3"], "gradable": true}, {"id": "AMS-2013-8", "school": "AMS", "year": "2013", "part": "DT", "q_no": 8, "points": null, "statement": "Một cửa hàng định giá bán một chiếc áo lãi 10% so với giá nhập hàng. Trên thực tế chiếc áo chỉ bán được với giá bằng 85% so với giá định bán và đã lỗ 6500 đồng. Hỏi chiếc áo được nhập với giá bao nhiêu?", "has_figure": false, "garbled": false, "answer": "10000 đồng", "solution": null, "unit": "u4", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "lãi lỗ", "giá vốn"], "mock": false, "mc": null, "key": ["10000"], "gradable": true}, {"id": "AMS-2013-9", "school": "AMS", "year": "2013", "part": "DT", "q_no": 9, "points": null, "statement": "Cho ba hình vuông MNPG, ABCD và HEFG như hình vẽ. Tính tỉ số diện tích của hình tròn nằm trong hình vuông ABCD và hình tròn nằm trong hình vuông HEFG.", "has_figure": true, "garbled": false, "answer": "9/8 (đáp án in \"98\", có lẽ là 9/8)", "solution": null, "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 5, "skills": ["diện tích hình tròn", "hình vuông", "tỉ số diện tích"], "mock": false, "mc": null, "key": ["9/8", "9/8", "98"], "gradable": true}, {"id": "AMS-2013-10", "school": "AMS", "year": "2013", "part": "DT", "q_no": 10, "points": null, "statement": "Tính tổng A = 38/25 + 9/10 − 11/5 + 13/21 − 15/18 + 17/36 − ... + 197/4851 − 199/4950.", "has_figure": false, "garbled": false, "answer": "2", "solution": null, "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh"], "mock": false, "mc": null, "key": ["2"], "gradable": true}, {"id": "AMS-2013-11", "school": "AMS", "year": "2013", "part": "TL", "q_no": 11, "points": null, "statement": "Cho hình chữ nhật ABCD, F là một điểm bất kì trên cạnh AD, BF cắt CD kéo dài tại điểm E. Nối điểm A với điểm E. Tính diện tích tam giác AEF, biết AF = 3 cm, BC = 5 cm, AB = 7 cm.", "has_figure": true, "garbled": false, "answer": "7 cm2", "solution": "Diện tích tam giác ABC (đúng ra là ABE, chung đáy AB và chiều cao bằng BC) là 1/2 AB × BC = 17,5 cm2. Diện tích tam giác ABF = 1/2 AB × AF = 10,5 cm2.\nSuy ra diện tích tam giác AEF là 17,5 − 10,5 = 7.\nĐáp số 7 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["diện tích tam giác", "hình chữ nhật", "tam giác chung đáy"], "mock": false, "mc": null, "key": ["2", "7"], "gradable": true}, {"id": "AMS-2013-12", "school": "AMS", "year": "2013", "part": "TL", "q_no": 12, "points": null, "statement": "Tìm số có bốn chữ số khác nhau abcd sao cho abcd + bcd + cd + d = 8098.", "has_figure": false, "garbled": false, "answer": "7532", "solution": "Vì số cần tìm là số có bốn chữ số nên a, b, c là những chữ số khác 0. Vì bốn chữ số phân biệt đôi một nên ta có bcd ≥ 123 nên abcd < 8098 − 123 < 8000, suy ra a < 8. Lại có bcd + cd + d ≤ 987 + 87 + 7 = 1081.\nDo đó, abcd ≥ 8098 − 1081 = 7017.\nSuy ra a = 7. Cho nên 7000 + 100b + 10c + d + 100b + 10c + d + 10c + d + d = 8098, hay 200 × b + 30 × c + 4 × d = 1098.\nSuy ra b ≤ 1098/200, tức là b ≤ 5. Vì 30 × c + 4 × d ≤ 30 × 9 + 4 × 8 = 302 nên 200 × b ≥ 1098 − 302 = 796, do đó b ≥ 4. Nếu b = 4 thì dễ tìm được c = 9, d = 7, trùng với a nên loại.\nNếu b = 5 thì suy ra c = 3, d = 2. Kết luận a = 7, b = 5, c = 3, d = 2.", "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "phân tích cấu tạo số", "chặn giá trị"], "mock": false, "mc": null, "key": ["7532"], "gradable": true}, {"id": "AMS-2014-1", "school": "AMS", "year": "2014", "part": "DT", "q_no": 1, "points": null, "statement": "Tính giá trị của S = 1/(5 × 9) + 1/(9 × 13) + 1/(13 × 17) + ··· + 1/(41 × 45).", "has_figure": false, "garbled": false, "answer": "2/45", "solution": "Sử dụng đồng nhất thức 1/m − 1/n = (n − m)/(n × m), ta thu được S = 1/4 × ((9 − 5)/(5 × 9) + (13 − 9)/(9 × 13) + ··· + (45 − 41)/(41 × 45)).\nTừ đó S = 1/4 × (1/5 − 1/9 + 1/9 − 1/13 + 1/13 − 1/17 + ··· + 1/41 − 1/45).\nSuy ra S = 1/4 × (1/5 − 1/45) = 2/45.\nĐáp số: 2/45.", "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh"], "mock": false, "mc": null, "key": ["2/45"], "gradable": true}, {"id": "AMS-2014-2", "school": "AMS", "year": "2014", "part": "DT", "q_no": 2, "points": null, "statement": "Một đoàn tàu đánh cá có 400 chiếc tàu, gồm hai loại: loại tàu nhỏ thì mỗi tàu có 15 ngư dân làm việc, loại tàu lớn thì có 18 ngư dân làm việc. Tổng số ngư dân trên 45 chiếc tàu là 789 người. Hỏi tổng cộng có bao nhiêu tàu lớn?", "has_figure": false, "garbled": false, "answer": "38", "solution": "Nếu mỗi tàu lớn chỉ có 15 ngư dân làm việc thì tổng số ngư dân trên 45 chiếc tàu là 45 × 15 = 675. Tổng số ngư dân ít hơn so với thực tế là 789 − 675 = 114. Số ngư dân trên mỗi tàu lớn giảm so với thực tế là 18 − 15 = 3.\nDo đó, số tàu lớn là 114 : 3 = 38.\nĐáp số 38.", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["giả thiết tạm", "gà chó"], "mock": false, "mc": null, "key": ["38"], "gradable": true, "ed_note": "đề in \"400 chiếc tàu\" nhưng lời giải dùng 45 chiếc"}, {"id": "AMS-2014-3", "school": "AMS", "year": "2014", "part": "DT", "q_no": 3, "points": null, "statement": "Một hình hộp chữ nhật có số đo chiều rộng, chiều dài, chiều cao (đơn vị tính là dm) theo thứ tự là ba số tự nhiên liên tiếp tăng dần. Nếu giảm độ dài chiều cao đi 2 dm thì diện tích xung quanh hình hộp chữ nhật mới bằng 60% diện tích xung quanh của hình hộp chữ nhật ban đầu. Tính thể tích của hình hộp chữ nhật ban đầu.", "has_figure": false, "garbled": false, "answer": "60 dm3", "solution": "Diện tích xung quanh của hình hộp chữ nhật mới bằng 60% diện tích xung quanh của hình chữ nhật ban đầu nên chiều cao mới cũng bằng 60% chiều cao của hình hộp ban đầu.\nSuy ra 2 dm tương ứng với 40% chiều cao của hình hộp chữ nhật ban đầu.\nChiều cao của hình hộp cũ là 2 : 40% = 5 dm.\nKích thước của hình hộp là các số tự nhiên liên tiếp nên đáp số là 3 × 4 × 5 = 60.", "unit": "c7", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["diện tích xung quanh", "thể tích hình hộp chữ nhật", "tỉ số phần trăm"], "mock": false, "mc": null, "key": ["3", "60"], "gradable": true}, {"id": "AMS-2014-4", "school": "AMS", "year": "2014", "part": "DT", "q_no": 4, "points": null, "statement": "Một bà mẹ có một con gái và một con trai. Năm nay mẹ 32 tuổi, con gái 6 tuổi và con trai 2 tuổi. Sau bao nhiêu năm nữa thì số tuổi của mẹ gấp rưỡi tổng số tuổi của cả hai con?", "has_figure": false, "garbled": false, "answer": "10 năm", "solution": "Đáp số.\n42 − 32 = 10.", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu–tỉ"], "mock": false, "mc": null, "key": ["10"], "gradable": true}, {"id": "AMS-2014-5", "school": "AMS", "year": "2014", "part": "DT", "q_no": 5, "points": null, "statement": "Cho bốn hình tròn, mỗi hình tròn được chia thành năm phần (như hình vẽ). Người ta điền các số tự nhiên 5; 6; 7; ···; 19; 20 vào mỗi phần trên sao cho hai phần khác nhau được điền hai số khác nhau. Biết rằng tổng các số điền trong các phần của mỗi hình tròn bằng 60. Tính tổng bốn số được điền ở bốn phần có kí hiệu A; B; C; D.", "has_figure": true, "garbled": false, "answer": "40", "solution": "Số nguyên trong dãy số cách đều 5, 6, ..., 20 là 16 nên tổng của chúng là (5 + 20)\n× 16 × 1/2 = 200. Tổng các số điền trong các phần của hình tròn trên đều bằng 60 nên tổng các số điền trong cả bốn đường tròn là 4 × 60 = 240. Các số điền tại vị trí A, B, C, D được tính hai lần nên tổng các số trong bốn vị trí đó là 240 − 200 = 40.", "unit": "c6", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["suy luận", "tổng dãy cách đều", "đếm hai lần"], "mock": false, "mc": null, "key": ["40"], "gradable": true}, {"id": "AMS-2014-6", "school": "AMS", "year": "2014", "part": "DT", "q_no": 6, "points": null, "statement": "Cho hình bình hành ABCD. Gọi P là điểm chính giữa của BC; Q là điểm chính giữa của DC; I là điểm thuộc đoạn DC sao cho DC = 3IC. Hai đoạn thẳng PQ và BI cắt nhau tại O. Tính diện tích tam giác APQ khi biết diện tích tam giác OPI bằng 3 cm2.", "has_figure": true, "garbled": false, "answer": "54 cm2", "solution": "Gợi ý.\nSử dụng công thức tỉ lệ diện tích, ta thu được S(OPB) = 6, S(IPB) = 9, S(IBC) = 18, S(CPQ) = 18, S(BCQ) = 36, và S(ABCD) = 4 × 36 = 144, cùng đơn vị diện tích.\nVậy, S(APQ) = 144 : 2 − 18 = 54.\nĐáp số: 54 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "hình bình hành", "tam giác chung chiều cao"], "mock": false, "mc": null, "key": ["2", "54"], "gradable": true}, {"id": "AMS-2014-7", "school": "AMS", "year": "2014", "part": "DT", "q_no": 7, "points": null, "statement": "Một ô tô đi từ A đến B với vận tốc dự định và trong một thời gian dự định. Sau khi đi được một giờ thì ô tô giảm tốc độ chỉ còn 80% vận tốc ban đầu nên đến B chậm một giờ so với dự định. Nếu từ A sau khi đi được một giờ, ô tô lại đi thêm 80 km nữa mới giảm vận tốc còn bằng 80% so với vận tốc ban đầu thì ô tô đến B chậm 36 phút so với thời gian dự định. Tính quãng đường AB.", "has_figure": false, "garbled": false, "answer": "250 km", "solution": "Sau khi đi được một giờ, ô tô giảm vận tốc còn 80% vận tốc ban đầu, tức là bằng 4/5 vận tốc ban đầu.\nSuy ra thời gian đi quãng đường sau sẽ bằng 5/4 so với dự định.\nThực tế xe ô tô đến B chậm hơn dự định một giờ nên thời gian dự định đi quãng đường sau là bốn giờ, thời gian đi thực tế là năm giờ.\nNhư vậy ô tô dự định đi cả quãng đường trong năm giờ.\nNếu sau khi ô tô đi một giờ và đi thêm 80 km nữa mới giảm tốc độ thì chỉ đến chậm so với dự định 36 phút, nên thời gian ô tô đi 80 km đó nhanh hơn so với khi giảm tốc độ là 24 phút.\nDo tỉ lệ thời gian cũng là 5/4 nên thời gian ô tô đi 80 km đó là 24 × 4 = 96 phút.\nVận tốc dự định của ô tô là 80 : 96 × 60 = 50 km/h.\nĐộ dài quãng đường AB là 5 × 50 = 250.", "unit": "c4", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động", "tỉ lệ nghịch vận tốc–thời gian", "tỉ số phần trăm"], "mock": false, "mc": null, "key": ["250"], "gradable": true}, {"id": "AMS-2014-8", "school": "AMS", "year": "2014", "part": "DT", "q_no": 8, "points": null, "statement": "Cho 14 số tự nhiên khác 0 và không có hai số nào bằng nhau. Biết tổng của chúng bằng 106. Tìm số lớn nhất trong các số đó.", "has_figure": false, "garbled": false, "answer": "15", "solution": "Tổng 14 số nguyên dương đầu tiên là 1 + 2 + 3 + ··· + 14 = (1 + 14)\n× 14 × 1/2 = 105. Nhưng tổng 14 số đã cho là 106 nên các số đó phải là 1, 2, 3, ..., 13, và 15.\nĐáp số: 15.", "unit": "c6", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "tổng dãy cách đều", "giá trị lớn nhất"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "AMS-2014-9", "school": "AMS", "year": "2014", "part": "DT", "q_no": 9, "points": null, "statement": "Một công việc nếu đội thứ nhất làm một mình thì hoàn thành trong 30 giờ, nếu đội thứ hai làm một mình thì trong 12 giờ. Cũng công việc đó khi đội thứ nhất làm trong một thời gian rồi nghỉ và đội thứ hai làm tiếp, thì tổng số thời gian hai đội hoàn thành công việc là 18 giờ. Hỏi khi đó thì đội thứ hai đã làm trong bao nhiêu giờ?", "has_figure": false, "garbled": false, "answer": "8 giờ", "solution": "Phần công việc mà hai đội đã làm chung nhanh hơn so với đội thứ nhất là 12 giờ.\nĐể hoàn thành công việc, đội hai làm nhanh hơn đội một là 18 giờ.\nSuy ra phần công việc mà đội hai đã làm chiếm 12/18 = 2/3 lượng công việc.\nVậy, đội hai đã làm trong 12 × 2/3 = 8 giờ.\nĐáp số: 8 giờ.", "unit": "c5", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["công việc chung", "năng suất", "giả thiết tạm"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "AMS-2014-10", "school": "AMS", "year": "2014", "part": "DT", "q_no": 10, "points": null, "statement": "Cho một số tự nhiên có 2014 chữ số. Biết rằng với hai chữ số liên tiếp theo thứ tự đã viết thì tạo thành số có hai chữ số chia hết cho 17 hoặc chia hết cho 23. Nếu chữ số cuối cùng của số đó là chữ số 1 thì chữ số đầu tiên là chữ số nào?", "has_figure": false, "garbled": false, "answer": "6", "solution": "Các số có hai chữ số chia hết cho 17 gồm 17, 34, 51, 68, 85; các số có hai chữ số chia hết cho 23 gồm có 23, 46, 69, 92. Để ý các chữ số cuối cùng của các số trên đôi một khác nhau, do đó, nếu biết chữ số cuối cùng thì xác định được duy nhất chữ số đứng trước nó.\nVì chữ số cuối cùng là 1 nên chữ số trước nó là chữ số 5. Đứng trước chữ số 5 là chữ số 8. Lập luận tương tự ta có số tự nhiên đã cho dạng ...6923469234692346851. Như vậy, trừ ba chữ số cuối là 851, các chữ số trong số đã cho lặp theo chu kỳ 69234. Vậy, đáp số là 6.", "unit": "c2", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["chia hết", "chu kỳ", "suy luận"], "mock": false, "mc": null, "key": ["6"], "gradable": true}, {"id": "AMS-2014-11", "school": "AMS", "year": "2014", "part": "TL", "q_no": 11, "points": null, "statement": "Chứng minh rằng nếu có n số tự nhiên có tích bằng n và có tổng bằng 2012 thì n chia hết cho 4.", "has_figure": false, "garbled": false, "answer": "Chứng minh (n chia hết cho 4)", "solution": "Xét tính chẵn lẻ của n.\nNếu n là số lẻ thì tích n số tự nhiên bằng n lẻ nên tất cả n số đều là các số lẻ.\nDo đó tổng của n số là số lẻ, khác 2012. Nếu n là số chẵn thì suy ra ít nhất một trong n số phải là số chẵn.\nXét các trường hợp sau.\nNếu trong n số chỉ có đúng một số chẵn thì n − 1 số còn lại đều là số lẻ.\nTổng của n − 1 số lẻ là một số lẻ, kết hợp với số chẵn duy nhất thì tổng của n số đã cho là một số lẻ và không thể bằng 2012 (loại khả năng này).\nNếu có ít nhất hai số chẵn trong n số thì tích của hai số này phải chia hết cho 4. Theo giả thiết, tích của n số tự nhiên bằng n nên suy ra n chia hết cho 4.", "unit": "c2", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["tính chẵn lẻ", "chia hết cho 4", "chứng minh"], "mock": false, "mc": null, "key": ["4"], "gradable": true}, {"id": "AMS-2014-12", "school": "AMS", "year": "2014", "part": "TL", "q_no": 12, "points": null, "statement": "Cho tam giác ABC có diện tích bằng 600 cm2. Trên cạnh BC lấy các điểm M, N sao cho BM = CN = 1/4 BC. Trên cạnh AB lấy điểm E, trên cạnh AC lấy F sao cho ACME là hình thang có đáy là AC, ME; còn ABNF là hình thang có đáy là AB, NF. Kéo dài EM và FN cắt nhau tại K. Tính diện tích hình ABKC.", "has_figure": true, "garbled": false, "answer": "900 cm2", "solution": "Nối A với K.\nDo ANKB là hình thang và BN = 3/4 BC nên ta có S(KAB) = S(NAB) = S(ABN) = 3/4 S(ABC) = 450. Tương tự, AMKC là hình thang và CM = 3/4 CB nên S(KAC) = S(MAC) = S(ACM) = 3/4 S(ACB) = 450.\nSuy ra S(ABKC) = S(KAB) + S(KAC) = 900 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["hình thang", "tam giác chung đáy", "tỉ số diện tích"], "mock": false, "mc": null, "key": ["2", "900"], "gradable": true}, {"id": "AMS-2018-1", "school": "AMS", "year": "2018", "part": "DT", "q_no": 1, "points": null, "statement": "Tìm số nhỏ nhất có 3 chữ số chia hết cho 5 và tổng các chữ số của số đó bằng 10.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c2", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["chia hết cho 5", "tổng các chữ số", "số nhỏ nhất"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-2", "school": "AMS", "year": "2018", "part": "DT", "q_no": 2, "points": null, "statement": "Cho phân số 14/17. Hỏi cùng thêm vào cả tử số và mẫu số bao nhiêu đơn vị để được phân số mới có giá trị bằng 6/7?", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["phân số", "hiệu không đổi", "hiệu–tỉ"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-3", "school": "AMS", "year": "2018", "part": "DT", "q_no": 3, "points": null, "statement": "Cho dãy số 2, 22, 222, … Hỏi số thứ 21 của dãy chia 9 dư mấy?", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c2", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["số dư", "chia hết cho 9", "dãy số"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-4", "school": "AMS", "year": "2018", "part": "DT", "q_no": 4, "points": null, "statement": "Hiện nay tuổi mẹ gấp 4 lần tuổi con, 5 năm sau thì tuổi mẹ gấp 3 lần tuổi con. Tính tuổi con hiện nay.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu không đổi", "hiệu–tỉ"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-5", "school": "AMS", "year": "2018", "part": "DT", "q_no": 5, "points": null, "statement": "Tính diện tích của hình vẽ sau: (hình vẽ)", "has_figure": true, "garbled": false, "answer": null, "solution": null, "unit": "u6", "unit_alt": "c7", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích", "hình ghép"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-6", "school": "AMS", "year": "2018", "part": "DT", "q_no": 6, "points": null, "statement": "Cho diện tích phần tô đậm là 2 cm2. Tính diện tích hình vuông ABCD. (hình vẽ)", "has_figure": true, "garbled": false, "answer": null, "solut _figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c6", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "tổng dãy cách đều", "giá trị lớn nhất"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-11", "school": "AMS", "year": "2018", "part": "DT", "q_no": 11, "points": null, "statement": "Bạn An chạy quanh một sân vận động có hình chữ nhật với chiều rộng là 50 m và chiều dài là 71,5 m và hai nửa hình tròn như hình vẽ. Biết rằng An chạy liên tục từ 7 giờ 30 đến 8 giờ với vận tốc trung bình 2,7 km/giờ. Hỏi bạn ấy chạy được nhiều nhất bao nhiêu vòng trọn vẹn?", "has_figure": true, "garbled": false, "answer": null, "solution": null, "unit": "u6", "unit_alt": "c4", "difficulty": 2, "vn_grade": 5, "skills": ["chu vi hình tròn", "quãng đường", "vận tốc"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-12", "school": "AMS", "year": "2018", "part": "TL", "q_no": 12, "points": null, "statement": "Cho hình bình hành ABCD. E là 1 điểm trên AB. Nối E với C và B với D. Gọi điểm giao nhau giữa EC và BD là F. Diện tích tam giác EFB là 20 cm2 và BFC là 50 cm2. Tính diện tích hình bình hành ABCD.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số diện tích", "hình bình hành", "tam giác chung chiều cao"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2018-13", "school": "AMS", "year": "2018", "part": "TL", "q_no": 13, "points": null, "statement": "Giá của 2 quyển sách, 6 quyển vở và 5 cái bút hết 154.000 đồng. Giá của 10 quyển sách, 6 quyển vở, 10 cái bút là 374.000 đồng. So sánh giá 1 quyển vở với giá 1 quyển sách.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["phương pháp khử", "so sánh giá", "giả thiết tạm"], "mock": false, "mc": null, "key": [], "
