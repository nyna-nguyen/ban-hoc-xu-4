tement": "Một hộp đựng 60 viên bi trong đó gồm 15 viên bi màu xanh, 15 viên bi màu đỏ, 15 viên bi màu vàng, 15 viên bi màu trắng. Không nhìn vào hộp, cần lấy ít nhất bao nhiêu viên bi để chắc chắn trong số đó có không ít hơn 8 viên bi cùng màu.", "has_figure": false, "garbled": false, "answer": "29 viên bi", "solution": "Trong hộp có 4 loại bi khác nhau.\nSố viên bi cần lấy ít nhất để có 8 viên bi cùng màu là: 7 × 4 + 1 = 29 (viên bi).\nVậy cần lấy ít nhất 29 viên bi để chắc chắn có 8 viên cùng màu.", "unit": "c6", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["Dirichlet", "trường hợp xấu nhất", "suy luận"], "mock": false, "mc": null, "key": ["29"], "gradable": true}, {"id": "NS-2020-6", "school": "NS", "year": "2020", "part": "TN", "q_no": 6, "points": null, "statement": "Vòi nhất tháo nước chảy ra / Hồ đầy, hết nước mất 30 giờ / Vòi nhì cho nước chảy vào / 15 giờ nước đầy hồ bạn ơi / Hai vòi cùng chảy cùng chơi / Mấy giờ nhanh tính hồ với thành đầy?", "has_figure": false, "garbled": false, "answer": "30 giờ", "solution": "Trong 1 giờ, vòi thứ nhất chảy ra được số phần bể là 1/30 (bể).\nTrong 1 giờ, vòi thứ hai chảy vào được số phần bể là 1/15 (bể).\nTrong 1 giờ, cả hai vòi chảy được số phần bể là: 1/15 − 1/30 = 1/30 (bể).\nNếu hai vòi cùng chảy thì mất 1 : 1/30 = 30 (giờ).", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["vòi nước", "công việc chung", "phân số"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "NS-2020-7", "school": "NS", "year": "2020", "part": "TN", "q_no": 7, "points": null, "statement": "Hình vẽ sau gồm có một hình vuông màu cam cạnh 21cm và hai nửa đường tròn, B và C là tâm của các nửa đường tròn tương ứng. Tính diện tích của hình này.", "has_figure": true, "garbled": false, "answer": "1825,74 cm2", "solution": "Diện tích hình vuông màu cam là: 21 × 21 = 441 (cm2).\nDiện tích 2 nửa hình tròn bán kính 21 cm là: 21 × 21 × 3,14 = 1384,74 (cm2).\nDiện tích của hình đã cho là: 441 + 1384,74 = 1825,74 (cm2).", "unit": "u6", "unit_alt": "c7", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích hình tròn", "diện tích hình vuông", "hình ghép"], "mock": false, "mc": null, "key": ["1825.74", "2"], "gradable": true}, {"id": "NS-2020-8", "school": "NS", "year": "2020", "part": "TN", "q_no": 8, "points": null, "statement": "Tìm M biết: M = [1 + (1 + 2) + (1 + 2 + 3) + … + (1 + 2 + 3 + … + 2020)] / [1 × 2020 + 2 × 2019 + 3 × 2018 + … + 2020 × 1]", "has_figure": false, "garbled": false, "answer": "M = 1", "solution": "M = [1 + (1 + 2) + (1 + 2 + 3) + … + (1 + 2 + 3 + … + 2020)] / [1 × 2020 + 2 × 2019 + 3 × 2018 + … + 2020 × 1].\nTử số bằng 1 × 2020 + 2 × 2019 + 3 × 2018 + … + 2020 × 1 (số 1 xuất hiện 2020 lần, số 2 xuất hiện 2019 lần, …, số 2020 xuất hiện 1 lần).\nVậy M = [1 × 2020 + 2 × 2019 + 3 × 2018 + … + 2020 × 1] / [1 × 2020 + 2 × 2019 + 3 × 2018 + … + 2020 × 1] = 1.", "unit": "c1", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["dãy số đặc biệt", "tính nhanh", "biến đổi tử số"], "mock": false, "mc": null, "key": ["1"], "gradable": true}, {"id": "NS-2020-9", "school": "NS", "year": "2020", "part": "TN", "q_no": 9, "points": null, "statement": "Cho phân số 17/63. Hãy tìm a sao cho khi lấy tử số của phân số đó trừ đi a và lấy mẫu số của phân số đó cộng với a thì được phân số bằng 1/4.", "has_figure": false, "garbled": false, "answer": "a = 1", "solution": "Tổng của tử số và mẫu số của phân số 17/63 là 17 + 63 = 80. Khi lấy tử số của phân số đó trừ đi a và lấy mẫu số của phân số đó cộng với a thì tổng của tử số và mẫu số của phân số mới không đổi → tử số mới + mẫu số mới = 80. Lại có: tử số mới/mẫu số mới = 1/4. Tử số mới là 80 : (1 + 4)\n× 1 = 16.\nVậy a là 17 – 16 = 1.\nĐáp số: a = 1.", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["tổng–tỉ", "phân số", "tổng không đổi"], "mock": false, "mc": null, "key": ["1"], "gradable": true}, {"id": "NS-2020-10", "school": "NS", "year": "2020", "part": "TN", "q_no": 10, "points": null, "statement": "Để thực hiện cách li xã hội phòng chống dịch Covid 19, một gia đình lo lắng dự trữ lương thực cho 4 người ăn trong 30 ngày. Thực tế có thêm bà ngoại ở quê lên ở cùng. Như vậy, số lương thực đã dự trữ đủ ăn trong bao nhiêu ngày? Biết số lượng lương thực mỗi người ăn trong 1 ngày là như nhau.", "has_figure": false, "garbled": false, "answer": "24 ngày", "solution": "Số gạo dự trữ đủ cho 1 người ăn trong số ngày là: 30 × 4 = 120 (ngày).\nThực tế có số người ăn là: 4 + 1 = 5 (người).\nSố lương thực đã dự trữ đủ ăn trong số ngày là: 120 : 5 = 24 (ngày).\nĐáp số: 24 ngày.", "unit": "c5", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "rút về đơn vị"], "mock": false, "mc": null, "key": ["24"], "gradable": true}, {"id": "NS-2020-11", "school": "NS", "year": "2020", "part": "TN", "q_no": 11, "points": null, "statement": "Trong các dãy phân số dưới đây, dãy số nào mà mỗi phân số đều có thể viết thành số thập phân?\nA. 3/4; 10/7; 1/5\nB. 2/5; 1/2; 5/8\nC. 1/10; 1/2; 1/3\nD. 3/4; 5/9; 3/5", "has_figure": false, "garbled": false, "answer": "B", "solution": "Dãy số mà mỗi phân số đều có thể viết thành số thập phân là 2/5; 1/2; 5/8.\nChọn B.", "unit": "u2", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["phân số thập phân", "đổi phân số ra số thập phân"], "mock": false, "mc": {"A": "3/4; 10/7; 1/5", "B": "2/5; 1/2; 5/8", "C": "1/10; 1/2; 1/3", "D": "3/4; 5/9; 3/5"}, "key": "B", "gradable": true}, {"id": "NS-2020-12", "school": "NS", "year": "2020", "part": "TN", "q_no": 12, "points": null, "statement": "Một người bán 6 giỏ cam và xoài. Mỗi giỏ chỉ đựng một loại cam hoặc xoài với số lượng như sau: 36; 39; 40; 41; 42; 44. Sau khi bán một giỏ xoài thì số cam còn lại gấp 4 lần số xoài còn lại. Hỏi người đó đã bán đi bao nhiêu quả xoài?", "has_figure": false, "garbled": false, "answer": "42 quả", "solution": "Sau khi bán một giỏ xoài thì số cam còn lại gấp 4 lần số xoài còn lại.\nSuy ra, tổng số cam và xoài còn lại sau khi bán chia hết cho 5.\nVậy giỏ xoài đã bán đi là 42 quả.\nĐáp số: 42 quả.", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["suy luận", "chia hết", "tổng–tỉ"], "mock": false, "mc": null, "key": ["42"], "gradable": true}, {"id": "NS-2020-13", "school": "NS", "year": "2020", "part": "TN", "q_no": 13, "points": null, "statement": "Tìm a để: a,97 < 1,97", "has_figure": false, "garbled": false, "answer": "a = 0", "solution": "Ta có a,97 < 1,97 nên a = 0.", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["so sánh số thập phân"], "mock": false, "mc": null, "key": ["0"], "gradable": true}, {"id": "NS-2020-14", "school": "NS", "year": "2020", "part": "TN", "q_no": 14, "points": null, "statement": "Tìm x biết x : 8 + 31,2 = 41", "has_figure": false, "garbled": false, "answer": "x = 78,4", "solution": "x : 8 + 31,2 = 41; x : 8 = 41 − 31,2; x : 8 = 9,8; x = 9,8 × 8; x = 78,4.", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tìm x", "số thập phân"], "mock": false, "mc": null, "key": ["78.4"], "gradable": true}, {"id": "NS-2020-15", "school": "NS", "year": "2020", "part": "TN", "q_no": 15, "points": null, "statement": "Điền dấu thích hợp vào chỗ trống: 3/11 ..... 4/9", "has_figure": false, "garbled": false, "answer": "3/11 < 4/9", "solution": "Ta có 3/11 = 27/99; 4/9 = 44/99.\nVậy 3/11 < 4/9.", "unit": "u3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["so sánh phân số", "quy đồng mẫu số"], "mock": false, "mc": null, "key": ["3/11", "4/9"], "gradable": true}, {"id": "NS-2021-1", "school": "NS", "year": "2021", "part": "TN", "q_no": 1, "points": null, "statement": "Tính: 4 2/5 + 2 3/7 + 5 4/7 − 2 2/5", "has_figure": false, "garbled": false, "answer": "10", "solution": "4 2/5 + 2 3/7 + 5 4/7 − 2 2/5 = (4 2/5 − 2 2/5) + (2 3/7 + 5 4/7) = (22/5 − 12/5) + (17/7 + 39/7) = 2 + 8 = 10.", "unit": "c1", "unit_alt": "u3", "difficulty": 1, "vn_grade": 4, "skills": ["tính nhanh", "hỗn số", "nhóm số hạng"], "mock": false, "mc": null, "key": ["10"], "gradable": true}, {"id": "NS-2021-2", "school": "NS", "year": "2021", "part": "TN", "q_no": 2, "points": null, "statement": "Biểu thức thích hợp để điền vào chỗ chấm sau là: 15,02 = ……\nA. 10 + 5 + 2/1000\nB. 10 + 2 + 2/100\nC. 10 + 5/2 + 2/100\nD. 10 + 5 + 2/100", "has_figure": false, "garbled": false, "answer": "D", "solution": "15,02 = 10 + 5 + 0,02 = 10 + 5 + 2/100.\nChọn D.", "unit": "u2", "unit_alt": "u1", "difficulty": 1, "vn_grade": 5, "skills": ["cấu tạo số thập phân", "phân số thập phân"], "mock": false, "mc": {"A": "10 + 5 + 2/1000", "B": "10 + 2 + 2/100", "C": "10 + 5/2 + 2/100", "D": "10 + 5 + 2/100"}, "key": "D", "gradable": true}, {"id": "NS-2021-3", "school": "NS", "year": "2021", "part": "TN", "q_no": 3, "points": null, "statement": "Một cửa hàng bán vải ngày thứ nhất bán được 32,7m, ngày thứ hai bán nhiều hơn ngày thứ nhất 4,6m. Ngày thứ ba bán được số vải bằng trung bình cộng số vải của hai ngày đầu. Hỏi cả ba ngày cửa hàng đó bán được bao nhiêu mét vải?", "has_figure": false, "garbled": false, "answer": "105 m", "solution": "Ngày thứ hai cửa hàng bán được số mét vải là: 32,7 + 4,6 = 37,3 (m).\nNgày thứ ba cửa hàng bán được số mét vải là: (32,7 + 37,3) : 2 = 35 (m).\nCả ba ngày cửa hàng đó bán được số mét vải là: 32,7 + 37,3 + 35 = 105 (m).\nĐáp số: 105 m vải.", "unit": "u14", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["trung bình cộng", "số thập phân"], "mock": false, "mc": null, "key": ["105"], "gradable": true}, {"id": "NS-2021-4", "school": "NS", "year": "2021", "part": "TN", "q_no": 4, "points": null, "statement": "Một nhóm học sinh cộng ngày và tháng sinh nhật của mỗi bạn lại thì thấy kết quả đều bằng 35. Biết rằng tất cả các ngày sinh nhật của họ là khác nhau. Hỏi nhóm học sinh đó có nhiều nhất bao nhiêu em?", "has_figure": false, "garbled": false, "answer": "8 em", "solution": "Khi cộng ngày và tháng sinh nhật của mỗi bạn lại thì thấy kết quả đều bằng 35.\nVậy ngày sinh nhật của các học sinh đó có thể là: 23/12; 24/11; 25/10; 26/9; 27/8; 28/7; 29/6; 30/5.\nVậy nhóm học sinh đó có nhiều nhất 8 em.", "unit": "c6", "unit_alt": "u5", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "liệt kê", "lịch"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "NS-2021-5", "school": "NS", "year": "2021", "part": "TN", "q_no": 5, "points": null, "statement": "Hình vẽ trên mô tả bàn cờ vua có kích thước 8 x 8. Quân Mã ban đầu đứng ở ô có chữ “M”. Hỏi sau 15 nước di chuyển trên bàn cờ, quân Mã đứng ở ô có màu gì? Biết con Mã đi theo đường chéo của hình chữ nhật 2 x 3. Chọn đáp án đúng:\nA. Không xác định được do tùy cách đi.\nB. Màu trắng.\nC. Màu đen.\nD. Cả ba đáp án đều sai", "has_figure": true, "garbled": false, "answer": "C", "solution": "Ban đầu con Mã đang đứng ở ô trắng, mà con Mã đi theo đường chéo của hình chữ nhật 2 x 3 nên nước di chuyển tiếp theo con Mã sẽ di chuyển vào ô đen.\nTương tự như vậy, nước di chuyển thứ hai con Mã sẽ di chuyển vào ô trắng.\nVậy cứ qua 2 lần di chuyển, con Mã sẽ quay trở về ô màu trắng.\nMà 15 : 2 = 7 (dư 1) nên ở nước di chuyển thứ 14, con Mã sẽ di chuyển vào ô màu trắng.\nVậy ở nước di chuyển thứ 15, con Mã sẽ di chuyển vào ô màu đen.\nChọn C.", "unit": "c6", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "tô màu", "tính chẵn lẻ"], "mock": false, "mc": {"A": "Không xác định được do tùy cách đi.", "B": "Màu trắng.", "C": "Màu đen.", "D": "Cả ba đáp án đều sai"}, "key": "C", "gradable": true}, {"id": "NS-2021-6", "school": "NS", "year": "2021", "part": "TN", "q_no": 6, "points": null, "statement": "Hai người thợ cùng nhận làm chung một công việc sau 8 ngày thì xong. Nhưng sau 5 ngày cùng làm thì người thứ nhất bận không làm tiếp được nữa. Một mình người thứ hai phải làm thêm 9 ngày nữa mới xong phần công việc còn lại. Hỏi một mình người thứ nhất làm công việc đó trong bao lâu thì xong?", "has_figure": false, "garbled": false, "answer": "12 ngày", "solution": "Trong 1 ngày 2 người thợ làm chung được số phần công việc là 1 : 8 = 1/8 (công việc).\nTrong 5 ngày 2 người thợ làm chung được số phần công việc là 5/8 (công việc).\nSố phần công việc người thứ hai làm trong 9 ngày là 1 − 5/8 = 3/8 (công việc).\nTrong 1 ngày, người thứ hai làm được số phần công việc là: 3/8 : 9 = 1/24 (công việc).\nTrong 1 ngày, người thứ nhất làm được số phần công việc là: 1/8 − 1/24 = 1/12 (công việc).\nMột mình người thứ nhất làm công việc đó trong số ngày là: 1 : 1/12 = 12 (ngày).\nĐáp số: 12 ngày.", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["công việc chung", "năng suất", "phân số"], "mock": false, "mc": null, "key": ["12"], "gradable": true}, {"id": "NS-2021-7", "school": "NS", "year": "2021", "part": "TN", "q_no": 7, "points": null, "statement": "Trong một buổi họp nhóm. Một bạn trai tên là Hùng nhận thấy mình có số bạn trai bằng số bạn gái. Một bạn gái tên là Mai nhận thấy mình có số bạn gái chỉ bằng một nửa số bạn trai. Hỏi nhóm đó có bao nhiêu bạn?", "has_figure": false, "garbled": false, "answer": "7 bạn", "solution": "Hùng nhận thấy mình có số bạn trai bằng số bạn gái → số bạn trai trong nhóm nhiều hơn số bạn gái là 1 bạn.\nKhi đó, số bạn gái của Mai kém số bạn trai của Mai là 2 bạn.\nSố bạn gái của Mai là: 2 : (2 – 1)\n× 1 = 2 (bạn).\nSố bạn trai của Mai là: 2 + 2 = 4 (bạn).\nNhóm có số bạn là: 2 + 4 + 1 = 7 (bạn).\nĐáp số: 7 bạn.", "unit": "c6", "unit_alt": "c3", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "hiệu–tỉ"], "mock": false, "mc": null, "key": ["7"], "gradable": true}, {"id": "NS-2021-8", "school": "NS", "year": "2021", "part": "TN", "q_no": 8, "points": null, "statement": "Một ô tô phải chạy từ A đến B. Sau khi chạy được 1 giờ thì ô tô giảm vận tốc chỉ còn bằng 5/6 vận tốc ban đầu. Vì thế, ô tô đến B chậm mất 1 giờ 24 phút. Nếu từ A, sau khi chạy được 1 giờ, ô tô chạy thêm 50 km nữa rồi mới giảm vận tốc thì ô tô đến B chỉ chậm 1 giờ 12 phút. Tính quãng đường AB.", "has_figure": false, "garbled": false, "answer": "400 km", "solution": "Giả sử từ A ô tô chạy được 1 giờ đến C, rồi từ C chạy thêm 50 km nữa đến D mới giảm vận tốc thì thời gian đến B ít hơn là: 1 giờ 24 phút – 1 giờ 12 phút = 12 phút = 0,2 (giờ).\nVì ô tô giảm vận tốc bằng 5/6 vận tốc ban đầu và thời gian tỉ lệ nghịch với vận tốc nên thời gian ô tô đi quãng đường CD với vận tốc ban đầu bằng 5/6 thời gian ô tô đi với vận tốc mới.\nThời gian ô tô đi quãng đường CD với vận tốc ban đầu là: 0,2 : (6 – 5)\n× 5 = 1 (giờ).\nVận tốc của ô tô là: 50 : 1 = 50 (km/giờ).\nĐổi: 1 giờ 24 phút = 1,4 giờ.\nSau khi chạy được 1 giờ thì ô tô giảm vận tốc chỉ còn bằng 5/6 vận tốc ban đầu thì ô tô đến B chậm mất 1 giờ 24 phút.\nVậy thời gian ô tô đi hết quãng đường CB là: 1,4 : (6 – 5)\n× 5 = 7 (giờ).\nĐộ dài quãng đường AB là: 50 × (7 + 1) = 400 (km).\nĐáp số: 400 km.", "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đều", "tỉ lệ nghịch vận tốc–thời gian", "giả thiết tạm"], "mock": false, "mc": null, "key": ["400"], "gradable": true}, {"id": "NS-2021-9", "school": "NS", "year": "2021", "part": "TN", "q_no": 9, "points": null, "statement": "Hình bên dưới được xếp bởi các hình lập phương có cạnh 1 cm. Tính diện tích toàn phần của hình đó.", "has_figure": true, "garbled": false, "answer": "60 cm2", "solution": "Chia hình đã cho thành ba hình G, H, I như hình vẽ.\nDiện tích toàn phần của hình đã cho bằng tổng diện tích toàn phần của ba hình G, H, I trừ đi diện tích các mặt vàng (mặt tiếp xúc).\nDiện tích toàn phần của hình G bằng 18 cm2. Diện tích toàn phần của hình H bằng 6 cm2. Diện tích toàn phần của hình I bằng 40 cm2.\nVậy diện tích hình đã cho là: 18 + 6 + 40 – 4 = 60 (cm2).", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích toàn phần", "hình lập phương", "hình ghép"], "mock": false, "mc": null, "key": ["2", "60"], "gradable": true}, {"id": "NS-2021-10", "school": "NS", "year": "2021", "part": "TN", "q_no": 10, "points": null, "statement": "Quan sát các hình vẽ dưới đây để xác định hình thứ 222 có bao nhiêu hình lục giác?", "has_figure": true, "garbled": false, "answer": "147187 hình", "solution": "Quy luật: Số hình lục giác của hình thứ n bằng 1 + 6 × [0 + 1 + 2 + … + (n – 1)].\nSố hình lục giác của hình thứ 222 là: 1 + 6 × [0 + 1 + 2 + … + 221] = 147187 (hình).", "unit": "u15", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["quy luật hình", "tổng dãy cách đều"], "mock": false, "mc": null, "key": ["147187"], "gradable": true}, {"id": "NS-2021-11", "school": "NS", "year": "2021", "part": "TL", "q_no": 1, "points": null, "statement": "Tìm x biết:\na) x × 1,2 + x × 0,7 = 61,94\nb) 1/(3 × 10) + 1/(10 × 17) + 1/(17 × 24) + … + 1/((7 × x − 10) × (7 × x − 3)) = 13/282", "has_figure": false, "garbled": false, "answer": "a) x = 32,6; b) x = 12", "solution": "a) x × 1,2 + x × 0,7 = 61,94; x × (1,2 + 0,7) = 61,94; x × 1,9 = 61,94; x = 61,94 : 1,9; x = 32,6.\nb) 1/(3×10) + 1/(10×17) + 1/(17×24) + … + 1/((7×x−10)×(7×x−3)) = 13/282. Nhân cả hai vế với 7: 7/(3×10) + 7/(10×17) + 7/(17×24) + … + 7/((7×x−10)×(7×x−3)) = 91/282; 1/3 − 1/10 + 1/10 − 1/17 + 1/17 − 1/24 + … + 1/(7×x−10) − 1/(7×x−3) = 91/282; 1/3 − 1/(7×x−10) = 91/282; 1/(7×x−10) = 1/3 − 91/282 = 1/94; 7×x−10 = 94; 7×x = 84; x = 12.", "unit": "c1", "unit_alt": "u2", "difficulty": 3, "vn_grade": 5, "skills": ["tìm x", "dãy phân số đặc biệt", "số thập phân"], "mock": false, "mc": null, "key": ["12", "32.6"], "gradable": true}, {"id": "NS-2021-12", "school": "NS", "year": "2021", "part": "TL", "q_no": 2, "points": null, "statement": "Khi trả bài kiểm tra cuối học kì I môn Toán, cô giáo nói: “Số điểm 10 chiếm 25%, số điểm 9 hơn điểm 10 là 6,25%. Như vậy có 18 bạn được điểm 9 hoặc 10, tất cả học sinh trong lớp đều nộp bài kiểm tra”. Hỏi:\na) Số học sinh đạt điểm 9 chiếm bao nhiêu phần trăm số học sinh cả lớp?\nb) Tổng số học sinh điểm 9 hoặc 10 chiếm bao nhiêu phần trăm số học sinh cả lớp?\nc) Lớp đó có tất cả bao nhiêu học sinh?\nd) Lớp đó có bao nhiêu học sinh không đạt điểm 9 hoặc 10?", "has_figure": false, "garbled": false, "answer": "a) 31,25%; b) 56,25%; c) 32 học sinh; d) 14 học sinh", "solution": "a)\nSố học sinh đạt điểm 9 chiếm: 25% + 6,25% = 31,25% (số học sinh cả lớp).\nb)\nTổng số học sinh điểm 9 hoặc 10 chiếm: 25% + 31,25% = 56,25% (số học sinh cả lớp).\nc)\nLớp đó có tất cả số học sinh là 18 : 56,25 × 100 = 32 (học sinh).\nd)\nLớp đó có số học sinh không đạt điểm 9 hoặc 10 là: 32 – 18 = 14 (học sinh).\nĐáp số:\na) 31,25%\nb) 56,25%\nc) 32 học sinh\nd) 14 học sinh.", "unit": "u4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tìm số khi biết phần trăm"], "mock": false, "mc": null, "key": ["14", "31.25", "32", "56.25"], "gradable": true}, {"id": "NS-2021-13", "school": "NS", "year": "2021", "part": "TL", "q_no": 3, "points": null, "statement": "Cho hình thang ABCD có đáy bé AB bằng 1/3 đáy lớn. Chiều cao bằng 12,6m và bằng hiệu độ dài hai đáy.\na) Tính diện tích hình thang ABCD.\nb) Hai đường chéo AC và BD cắt nhau tại O. So sánh S_OBC và S_OAD.\nc) Kéo dài cạnh DA và CB cắt nhau tại P. Tính tỉ số diện tích của hai tam giác DBP và DPC.", "has_figure": false, "garbled": false, "answer": "a) 158,76 m2; b) S_OBC = S_OAD; c) S_DBP / S_DPC = 1/3", "solution": "a)\nĐộ dài đáy bé AB là: 12,6 : (3 – 1)\n× 1 = 6,3 (m).\nĐộ dài đáy lớn CD là: 6,3 × 3 = 18,9 (m).\nDiện tích hình thang ABCD là: (6,3 + 18,9)\n× 12,6 : 2 = 158,76 (m2).\nb)\nTa có S_DAB = S_CAB (hai tam giác có chung đáy AB và chiều cao bằng nhau).\nMà S_DAB = S_OAD + S_OAB; S_CAB = S_OBC + S_OAB.\nNên S_OBC = S_OAD.\nc)\nXét tam giác ABD và tam giác ACD có chiều cao hạ từ D xuống AB bằng chiều cao hạ từ B xuống CD nên S_ABD / S_ACD = AB / CD = 1/3. Mà tam giác ABD và tam giác ACD lại có chung đáy AD nên chiều cao hạ từ B xuống AD bằng 1/3 chiều cao hạ từ C xuống AD → S_ABP / S_APC = 1/3. Mà tam giác ABP và tam giác APC lại chung chiều cao hạ từ A xuống BC nên PB / PC = 1/3.\nVậy S_DBP / S_DPC = PB / PC = 1/3 (hai tam giác chung chiều cao hạ từ D xuống PC).", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 5, "skills": ["hình thang", "hiệu–tỉ", "tỉ số diện tích", "tam giác chung chiều cao"], "mock": false, "mc": null, "key": ["1/3", "158.76", "2"], "gradable": true}, {"id": "NS-2023-1", "school": "NS", "year": "2023", "part": "TN", "q_no": 1, "points": null, "statement": "Tìm giá trị của chữ số 5 trong số 2756,29.", "has_figure": false, "garbled": false, "answer": "50", "solution": "Chữ số 5 trong số 2756,29 có giá trị là 50.", "unit": "u1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["hàng và giá trị", "số thập phân"], "mock": false, "mc": null, "key": ["50"], "gradable": true}, {"id": "NS-2023-2", "school": "NS", "year": "2023", "part": "TN", "q_no": 2, "points": null, "statement": "Tính: 2 4/9 + 6 7/11 + 7 5/9 + 13 4/11", "has_figure": false, "garbled": false, "answer": "30", "solution": "2 4/9 + 6 7/11 + 7 5/9 + 13 4/11 = (2 + 6 + 7 + 13) + (4/9 + 7/11 + 5/9 + 4/11) = 28 + [(4/9 + 5/9) + (7/11 + 4/11)] = 28 + (9/9 + 11/11) = 28 + (1 + 1) = 30.", "unit": "c1", "unit_alt": "u3", "difficulty": 1, "vn_grade": 4, "skills": ["tính nhanh", "hỗn số", "nhóm số hạng"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "NS-2023-3", "school": "NS", "year": "2023", "part": "TN", "q_no": 3, "points": null, "statement": "Một đơn vị bộ đội chuẩn bị lương thực đủ cho 50 người ăn trong 30 ngày. Trên thực tế, đã có 20 người chuyển sang đơn vị khác. Hỏi với số lượng thực tế đã chuẩn bị như ban đầu, đơn vị bộ đội đó sẽ đủ ăn trong bao nhiêu ngày? (Biết mức ăn của mỗi người là như nhau).", "has_figure": false, "garbled": false, "answer": "50 ngày", "solution": "Coi lượng lương thực mỗi người ăn trong 1 ngày là 1 suất thì tổng số suất chuẩn bị ban đầu là: 50 × 30 = 1500 (suất).\nSau khi chuyển đi thì số người còn lại là: 50 – 20 = 30 (người).\nVới số lương thực đã chuẩn bị như ban đầu, đơn vị bộ đội sẽ đủ ăn trong số ngày là: 1500 : 30 = 50 (ngày).\nĐáp số: 50 ngày.", "unit": "c5", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "rút về đơn vị"], "mock": false, "mc": null, "key": ["50"], "gradable": true}, {"id": "NS-2023-4", "school": "NS", "year": "2023", "part": "TN", "q_no": 4, "points": null, "statement": "Câu lạc bộ World’s Scholar Cup của trường có 60 học sinh, trong đó có 10% là học sinh nam. Sau đó, có một số học sinh nữ đăng ký thêm vào câu lạc bộ nên số học sinh nam lúc này chỉ chiếm 8%. Hỏi có bao nhiêu học sinh nữ đã đăng ký thêm?", "has_figure": false, "garbled": false, "answer": "15 học sinh", "solution": "Số học sinh nam ban đầu là: 60 × 10 : 100 = 6 (học sinh).\nSau đó có thêm học sinh nữ đăng kí nên số học sinh nam không thay đổi.\n6 học sinh nam ứng với 8% tổng số học sinh trong câu lạc bộ lúc sau.\nSố học sinh trong câu lạc bộ lúc sau khi có thêm học sinh nữ đăng kí là: 6 : 8 × 100 = 75 (học sinh).\nVậy số học sinh nữ đăng kí thêm vào câu lạc bộ là: 75 – 60 = 15 (học sinh).\nĐáp số: 15 học sinh.", "unit": "u4", "unit_alt": "c3", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "đại lượng không đổi"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "NS-2023-5", "school": "NS", "year": "2023", "part": "TN", "q_no": 5, "points": null, "statement": "Mẹ mua hai bó hoa hồng và hoa cúc có số lượng bằng nhau, sau đó mẹ mua thêm 5 bông hoa hồng và 3 bông hoa cúc nên số hoa hồng bằng 51% tổng số hoa mẹ đã mua. Hỏi mẹ đã mua tất cả bao nhiêu bông hoa?", "has_figure": false, "garbled": false, "answer": "100 bông hoa", "solution": "Số bông hoa cúc lúc sau chiếm số phần trăm là: 100% − 51% = 49% (tổng số hoa lúc sau).\nSố bông hoa hồng lúc sau nhiều hơn số bông hoa cúc lúc sau là: 5 – 3 = 2 (bông hoa).\n2 bông hoa chiếm số phần trăm là: 51% − 49% = 2% (tổng số hoa lúc sau).\nTổng số hoa mẹ đã mua là: 2 : 2 × 100 = 100 (bông hoa).\nĐáp số: 100 bông hoa.", "unit": "u4", "unit_alt": "c3", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "hiệu số phần trăm"], "mock": false, "mc": null, "key": ["100"], "gradable": true}, {"id": "NS-2023-6", "school": "NS", "year": "2023", "part": "TN", "q_no": 6, "points": null, "statement": "Bố mua hai đôi giày tặng Khánh nhưng đều bị nhỏ nên bố quyết định bán hai đôi giày đã mua. Mỗi đôi bố đều bán với giá 1 500 000 đồng, trong đó, một đôi giày bố bán được nhiều hơn 20% giá mua, đôi thứ hai được ít hơn 20% giá mua. Hỏi bố Khánh đã có lãi hay bị lỗ, số tiền lãi lỗ là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "Bị lỗ 125 000 đồng", "solution": "Tổng số tiền bán giày là: 1 500 000 × 2 = 3 000 000 (đồng).\nĐôi giày thứ nhất bán được nhiều hơn 20% giá mua tức là bằng 120% giá mua.\nĐôi thứ hai được ít hơn 20% giá mua tức là bằng 80% giá mua.\nBố mua đôi giày thứ nhất hết số tiền là: 1 500 000 : 120 × 100 = 1 250 000 (đồng).\nBố mua đôi giày thứ hai hết số tiền là: 1 500 000 : 80 × 100 = 1 875 000 (đồng).\nTổng số tiền bố mua giày là: 1 250 000 + 1 875 000 = 3 125 000 (đồng).\nVậy bố Khánh bị lỗ số tiền là: 3 125 000 – 3 000 000 = 125 000 (đồng).\nĐáp số: 125 000 đồng.", "unit": "c5", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["lãi lỗ", "tỉ số phần trăm", "tìm số khi biết phần trăm"], "mock": false, "mc": null, "key": ["0", "125"], "gradable": true}, {"id": "NS-2023-7", "school": "NS", "year": "2023", "part": "TN", "q_no": 7, "points": null, "statement": "Hình vẽ dưới đây được tạo từ các hình tam giác đều bằng nhau. Biết diện tích của hình tam giác đều nhỏ nhất là 2 cm2. Tính diện tích hình tô đậm.", "has_figure": true, "garbled": false, "answer": "24 cm2", "solution": "Hình tam giác to gồm 36 hình tam giác có diện tích 2 cm2 (tổng 72 cm2).\nHình số 1 bao gồm 9 tam giác nhỏ và 1 phần tam giác bằng 1 nửa hình được tạo bởi 6 tam giác nhỏ nên diện tích là: 2 × 9 + 2 × 6 : 2 = 24 (cm2).\nHình số 2 bao gồm 4 tam giác nhỏ và 1 phần tam giác bằng 1 nửa hình được tạo bởi 4 tam giác nhỏ nên diện tích là: 2 × 4 + 2 × 4 : 2 = 12 (cm2).\nHình số 3 tương tự có diện tích: 2 × 4 + 2 × 4 : 2 = 12 (cm2).\nDiện tích hình tô đậm là: 72 – 24 – 12 – 12 = 24 (cm2).\nĐáp số: 24 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["đếm hình", "tỉ số diện tích", "cắt ghép hình"], "mock": false, "mc": null, "key": ["2", "24"], "gradable": true}, {"id": "NS-2023-8", "school": "NS", "year": "2023", "part": "TN", "q_no": 8, "points": null, "statement": "Trường Ngôi Sao Hà Nội 2 dự định mở cuộc thi chạy “Vì nụ cười trẻ thơ”. Các vận động viên chạy xung quanh một khu đất hình chữ nhật có chiều dài và chiều rộng lần lượt là 100 m và 65 m. Đường chạy được chia thành nhiều chặng mỗi chặng dài 75 m. Biết điểm xuất phát và kết thúc cùng một chỗ. Hỏi đường chạy có ít nhất mấy chặng?", "has_figure": false, "garbled": false, "answer": "22 chặng", "solution": "Chu vi khu đất là: (100 + 65)\n× 2 = 330 (m).\nVì mỗi chặng có chiều dài là 75 m nên độ dài đường chạy sẽ là: 75 × số chặng (m).\nDo điểm xuất phát và kết thúc ở cùng một chỗ nên tổng độ dài số chặng phải chia hết cho chu vi của khu đất.\nKhi đó ta có: (75 × số chặng) chia hết cho 330. Mà 75/330 = 5/22.\nVậy đường chạy phải có ít nhất 22 chặng.", "unit": "c2", "unit_alt": "u6", "difficulty": 3, "vn_grade": 4, "skills": ["chu vi hình chữ nhật", "chia hết", "bội chung nhỏ nhất", "rút gọn phân số"], "mock": false, "mc": null, "key": ["22"], "gradable": true}, {"id": "NS-2023-9", "school": "NS", "year": "2023", "part": "TN", "q_no": 9, "points": null, "statement": "Cho tam giác ABC vuông tại A có AB = 6 cm, AC = 8 cm, BC = 10 cm và ba nửa hình tròn có đường kính lần lượt là AB, AC và BC (như hình dưới đây). Tính diện tích phần tô đậm.", "has_figure": true, "garbled": false, "answer": "24 cm2", "solution": "Diện tích nửa hình tròn đường kính BC là: [(10 : 2)\n× (10 : 2)\n× 3,14] : 2 = 39,25 (cm2).\nDiện tích nửa hình tròn đường kính AB là: [(6 : 2)\n× (6 : 2)\n× 3,14] : 2 = 14,13 (cm2).\nDiện tích nửa hình tròn đường kính AC là: [(8 : 2)\n× (8 : 2)\n× 3,14] : 2 = 25,12 (cm2).\nDiện tích tam giác ABC là: 6 × 8 : 2 = 24 (cm2).\nDiện tích phần tô đậm là: 24 + 25,12 + 14,13 – 39,25 = 24 (cm2).\nĐáp số: 24 cm2.", "unit": "u6", "unit_alt": "c7", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích hình tròn", "diện tích tam giác", "hình ghép"], "mock": false, "mc": null, "key": ["2", "24"], "gradable": true}, {"id": "NS-2023-10", "school": "NS", "year": "2023", "part": "TN", "q_no": 10, "points": null, "statement": "Một đoạn mật mã gồm 4 chữ số, biết tổng và hiệu của hai số được lập từ hai chữ số đầu và hai chữ số cuối đều chia hết cho 14. Hỏi phải thử ít nhất bao nhiêu lần để chắc chắn mở được đoạn mật mã này? (chẳng hạn 1428 thì 14 + 28 và 28 – 14 đều chia hết cho 14).", "has_figure": false, "garbled": false, "answer": "113 lần", "solution": "Gọi đoạn mật mã có dạng abcd trong đó ab + cd và ab − cd đều chia hết cho 14. Điều này có nghĩa là ab, cd phải cùng chia hết cho 7 và cùng tính chẵn lẻ.\nTrường hợp 1: ab, cd cùng chia hết cho 7 và cùng chẵn.\nKhi đó ab, cd sẽ nhận 2 trong các giá trị: 00, 14, 28, 42, 56, 70, 84, 98. Vì ab, cd có thể nhận giá trị bằng nhau nên có thể tạo ra số mật mã từ trường hợp này là: 8 × 8 = 64 (mật mã).\nTrường hợp 2: ab, cd cùng chia hết cho 7 và cùng lẻ.\nKhi đó ab, cd sẽ nhận 2 trong các giá trị: 07, 21, 35, 49, 63, 77, 91. Số mật mã từ trường hợp này là: 7 × 7 = 49 (mật mã).\nTổng số mật mã có thể tạo ra từ 2 trường hợp trên là: 64 + 49 = 113 (mật mã).\nVì vậy cần thử ít nhất 113 lần để chắc chắn mở được đoạn mật mã.", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["đếm", "chia hết", "tính chẵn lẻ"], "mock": false, "mc": null, "key": ["113"], "gradable": true}, {"id": "NS-2023-11", "school": "NS", "year": "2023", "part": "TL", "q_no": 1, "points": null, "statement": "Tính giá trị biểu thức (4,17 + 8,77) – (3,17 – 2,23)", "has_figure": false, "garbled": false, "answer": "12", "solution": "(4,17 + 8,77) – (3,17 – 2,23) = 4,17 + 8,77 – 3,17 + 2,23 = (4,17 – 3,17) + (8,77 + 2,23) = 1 + 11 = 12.", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "số thập phân", "phá ngoặc"], "mock": false, "mc": null, "key": ["12"], "gradable": true}, {"id": "NS-2023-12", "school": "NS", "year": "2023", "part": "TL", "q_no": 2, "points": null, "statement": "Tìm x biết x × 7 − 6 = 0,3", "has_figure": false, "garbled": false, "answer": "x = 0,9", "solution": "x × 7 − 6 = 0,3; x × 7 = 0,3 + 6; x × 7 = 6,3; x = 6,3 : 7; x = 0,9.", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tìm x", "số thập phân"], "mock": false, "mc": null, "key": ["0.9"], "gradable": true}, {"id": "NS-2023-13", "school": "NS", "year": "2023", "part": "TL", "q_no": 3, "points": null, "statement": "Trong kho có ba thùng dầu. Thùng thứ nhất đựng 28,5 lít dầu, thùng thứ hai đựng nhiều hơn thùng thứ nhất 12,3 lít dầu nhưng ít hơn thùng thứ ba 3,6 lít dầu. Hỏi trung bình mỗi thùng đựng được bao nhiêu lít dầu?", "has_figure": false, "garbled": false, "answer": "37,9 lít dầu", "solution": "Thùng thứ hai đựng được số lít dầu là: 28,5 + 12,3 = 40,8 (lít dầu).\nThùng thứ ba đựng được số lít dầu là: 40,8 + 3,6 = 44,4 (lít dầu).\nTrung bình mỗi thùng đựng được số lít dầu là: (28,5 + 40,8 + 44,4) : 3 = 37,9 (lít dầu).\nĐáp số: 37,9 lít dầu.", "unit": "u14", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["trung bình cộng", "số thập phân"], "mock": false, "mc": null, "key": ["37.9"], "gradable": true}, {"id": "NS-2023-14", "school": "NS", "year": "2023", "part": "TL", "q_no": 4, "points": null, "statement": "Cho tam giác ABC có BC = 6 cm. Trên cạnh BC lấy điểm D cách C là 2 cm. Nối A với D được tam giác ADC có diện tích bằng 4 cm2.\na) Tính diện tích tam giác ABC.\nb) Lấy điểm E trên AB sao cho ACDE là hình thang. Tính diện tích tam giác BDE.", "has_figure": false, "garbled": false, "answer": "a) 12 cm2; b) 16/3 cm2", "solution": "a)\nXét tam giác ADC và tam giác ABC có chung chiều cao hạ từ đỉnh A xuống BC nên S_ADC / S_ABC = DC / BC = 2/6 = 1/3.\nVậy S_ABC = 3 × S_ADC = 3 × 4 = 12 (cm2).\nb)\nNối E với C.\nS_AEC = S_ADC = 4 (cm2) (vì chung đáy AC, chiều cao hạ từ đỉnh E xuống AC bằng chiều cao hạ từ đỉnh D xuống đáy AC).\nS_EBC = S_ABC – S_AEC = 12 – 4 = 8 (cm2).\nS_EBD / S_EBC = BD / BC = 4/6 = 2/3 (hai tam giác có chung chiều cao hạ từ E xuống BC).\nSuy ra S_EBD = 2/3 × S_EBC = 2/3 × 8 = 16/3 (cm2).", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số diện tích", "tam giác chung chiều cao", "hình thang"], "mock": false, "mc": null, "key": ["12", "16/3", "2", "2"], "gradable": true}, {"id": "NS-2023-15", "school": "NS", "year": "2023", "part": "TL", "q_no": 5, "points": null, "statement": "Cho ba đống sỏi gồm 7, 33 và 65 viên. Trong mỗi bước, chọn một trong hai thao tác sau để thực hiện: Thao tác 01: Dồn hai đống tùy ý thành một đống. Thao tác 02: Chọn một đống tùy ý có số chẵn viên sỏi để chia thành hai đống có số lượng viên sỏi bằng nhau. Hỏi có khi nào nhận được 105 đống mà mỗi đống chỉ có một viên sỏi không? Vì sao?", "has_figure": false, "garbled": false, "answer": "Không thể", "solution": "Vì 7, 33 và 65 đều lẻ nên bước đầu tiên ta chỉ có thao tác 1 là dồn hai đống tùy ý thành một đống.\nTrường hợp 1: Dồn 2 đống 7; 33 thành đống 40, khi đó ta được hai đống 40; 65. Số sỏi mỗi đống chia hết cho 5 nên các thao tác sau dù chia đôi hay gộp lại cũng sẽ tạo ra kết quả là số sỏi chia hết cho 5 nên không thể xảy ra trường hợp mỗi đống 1 viên.\nTrường hợp 2: Dồn 2 đống 7; 65 thành đống 72, khi đó ta được hai đống 33; 72. Số sỏi chia hết cho 3 nên các thao tác sau cũng tạo ra số sỏi chia hết cho 3 nên không thể có mỗi đống 1 viên.\nTrường hợp 3: Dồn 2 đống 33; 65 thành đống 98, khi đó ta được hai đống 7; 98. Số sỏi chia hết cho 7 nên các thao tác sau cũng tạo ra số sỏi chia hết cho 7 nên không thể có mỗi đống 1 viên.\nVậy không thể nhận được 105 đống mà mỗi đống chỉ có một viên sỏi.", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["suy luận logic", "bất biến", "chia hết"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "NS-2025-1", "school": "NS", "year": "2025", "part": "TN", "q_no": 1, "points": null, "statement": "Viết số gồm 3 trăm, 6 đơn vị và 2 phần trăm.", "has_figure": false, "garbled": false, "answer": "306,02", "solution": "Số gồm 3 trăm, 6 đơn vị và 2 phần trăm là 306,02.\nĐáp án: 306,02.", "unit": "u2", "unit_alt": "u1", "difficulty": 1, "vn_grade": 5, "skills": ["cấu tạo số thập phân", "hàng và giá trị"], "mock": false, "mc": null, "key": ["306.02"], "gradable": true}, {"id": "NS-2025-2", "school": "NS", "year": "2025", "part": "TN", "q_no": 2, "points": null, "statement": "Tính diện tích phần tô đậm, biết hình tròn lớn có đường kính là 10 cm, hình tròn bé có đường kính là 7 cm.", "has_figure": true, "garbled": false, "answer": "40,035 cm2", "solution": "Bán kính hình tròn lớn là 10 : 2 = 5 (cm).\nDiện tích hình tròn lớn là 5 × 5 × 3,14 = 78,5 (cm2).\nBán kính hình tròn bé là 7 : 2 = 3,5 (cm).\nDiện tích hình tròn bé là 3,5 × 3,5 × 3,14 = 38,465 (cm2).\nDiện tích phần tô đậm là 78,5 − 38,465 = 40,035 (cm2).\nĐáp án: 40,035 cm2.", "unit": "u6", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["diện tích hình tròn", "hiệu diện tích"], "mock": false, "mc": null, "key": ["2", "40.035"], "gradable": true}, {"id": "NS-2025-3", "school": "NS", "year": "2025", "part": "TN", "q_no": 3, "points": null, "statement": "Hiện nay tuổi em gấp bốn lần tuổi em khi tuổi anh bằng tuổi em hiện nay. Khi tuổi em bằng tuổi anh hiện nay thì tổng số tuổi hai anh em là 51 tuổi. Tính tuổi mỗi người hiện nay.", "has_figure": false, "garbled": false, "answer": "Tuổi anh: 21 tuổi; tuổi em: 12 tuổi", "solution": "Sơ đồ khi tuổi anh bằng tuổi em hiện nay: Em 1 phần, Anh 4 phần.\nHiệu số tuổi của hai anh em không đổi nên tuổi anh sẽ hơn tuổi em số phần là: 4 – 1 = 3 (phần).\nSơ đồ hiện nay: Em 4 phần, Anh 7 phần.\nSơ đồ khi tuổi em bằng tuổi anh hiện nay: Em 7 phần, Anh 10 phần.\n51 tuổi ứng với số phần là: 7 + 10 = 17 (phần).\nGiá trị của một phần là: 51 : 17 = 3 (tuổi).\nTuổi em hiện nay là: 3 × 4 = 12 (tuổi).\nTuổi anh hiện nay là: 3 × 7 = 21 (tuổi).\nĐáp án: Tuổi anh: 21 tuổi; tuổi em: 12 tuổi.", "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu không đổi", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["12", "21"], "gradable": true}, {"id": "NS-2025-4", "school": "NS", "year": "2025", "part": "TN", "q_no": 4, "points": null, "statement": "Hai người dự định cùng làm một công việc trong 5 giờ sẽ xong. Làm được 2 giờ người thứ nhất có việc bận cần phải đi nên chỉ còn người thứ hai làm. Người thứ hai làm nốt công việc đó trong 9 giờ. Hỏi nếu làm riêng thì mỗi người làm công việc đó trong bao lâu?", "has_figure": false, "garbled": false, "answer": "Người thứ nhất: 7,5 giờ; người thứ hai: 15 giờ", "solution": "1 giờ hai người làm được số phần công việc là: 1 : 5 = 1/5 (công việc).\n2 giờ hai người làm được số phần công việc là: 1/5 × 2 = 2/5 (công việc).\nSố phần công việc còn lại là: 1 − 2/5 = 3/5 (công việc).\n1 giờ người thứ hai làm được số phần công việc là: 3/5 : 9 = 1/15 (công việc).\nNgười thứ hai làm một mình thì sau số thời gian hoàn thành công việc là: 1 : 1/15 = 15 (giờ).\n1 giờ người thứ nhất làm được số phần công việc là: 1/5 − 1/15 = 2/15 (công việc).\nNgười thứ nhất làm một mình thì sau số thời gian hoàn thành công việc là: 1 : 2/15 = 7,5 (giờ).\nĐáp án: Người thứ nhất: 7,5 giờ; người thứ hai: 15 giờ.", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["công việc chung", "năng suất", "phân số"], "mock": false, "mc": null, "key": ["15", "7.5"], "gradable": true}, {"id": "NS-2025-5", "school": "NS", "year": "2025", "part": "TN", "q_no": 5, "points": null, "statement": "Cho A = 1/2 + 1/4 + 1/8 + … + 1/512; B = 1/(1 + 2) + 1/(1 + 2 + 3) + 1/(1 + 2 + 3 + 4) + … + 1/(1 + 2 + 3 + … + 511). Tính A/B.", "has_figure": false, "garbled": false, "answer": "A/B = 511/510", "solution": "A = 1/2 + 1/4 + 1/8 + … + 1/512. A × 2 = 1 + 1/2 + 1/4 + … + 1/256. A × 2 − A = 1 − 1/512. A = 511/512. B = 1/(1+2) + 1/(1+2+3) + 1/(1+2+3+4) + … + 1/(1+2+3+…+511) = 1/((1+2)×2:2) + 1/((1+3)×3:2) + 1/((1+4)×4:2) + … + 1/((1+511)×511:2) = 1/(2×3:2) + 1/(3×4:2) + 1/(4×5:2) + … + 1/(511×512:2) = 2 × [1/(2×3) + 1/(3×4) + 1/(4×5) + … + 1/(511×512)] = 2 × [1/2 − 1/3 + 1/3 − 1/4 + 1/4 − 1/5 + … + 1/511 − 1/512] = 2 × (1/2 − 1/512) = 2 × 255/512 = 510/512.\nTa có A/B = 511/512 : 510/512 = 511/510.\nĐáp án: 511/510.", "unit": "c1", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh", "tổng dãy cách đều"], "mock": false, "mc": null, "key": ["511/510"], "gradable": true}, {"id": "NS-2025-6", "school": "NS", "year": "2025", "part": "TN", "q_no": 6, "points": null, "statement": "Cho tam giác ABC. Lấy M và N lần lượt là trung điểm của cạnh AB và AC, nối M với C và N với B cắt nhau tại O. Tính S_ABC, biết S_MOB = 20 cm2.", "has_figure": true, "garbled": false, "answer": "120 cm2", "solution": "Nối A với O.\nVì M là trung điểm của AB nên AM = MB = 1/2 AB nên: S_BMO = 1/2 S_ABO (chung chiều cao từ O) nên S_ABO = 20 × 2 = 40 (cm2).\nS_BMO = S_AMO (chung chiều cao từ O).\nS_BCM = S_ACM (chung chiều cao từ C, đáy BM = AM).\nSuy ra S_BCM – S_BMO = S_ACM – S_AMO hay S_BCO = S_ACO = 40 cm2. Vì N là trung điểm của AC nên AN = NC = 1/2 AC nên: S_AON = S_CON (chung chiều cao từ O); S_ABN = S_CBN (chung chiều cao từ B).\nSuy ra S_ABN – S_AON = S_CBN – S_CON hay S_ABO = S_BOC = 40 cm2. Diện tích tam giác ABC là 40 + 40 + 40 = 120 (cm2).\nĐáp án: 120 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "trung điểm", "tam giác chung chiều cao"], "mock": false, "mc": null, "key": ["120", "2"], "gradable": true}, {"id": "NS-2025-7", "school": "NS", "year": "2025", "part": "TL", "q_no": 1, "points": null, "statement": "Tìm x biết x + 3,8 = 3,5 × 1,5", "has_figure": false, "garbled": false, "answer": "x = 1,45", "solution": "x + 3,8 = 3,5 × 1,5; x + 3,8 = 5,25; x = 5,25 − 3,8; x = 1,45.", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tìm x", "số thập phân"], "mock": false, "mc": null, "key": ["1.45"], "gradable": true}, {"id": "NS-2025-8", "school": "NS", "year": "2025", "part": "TL", "q_no": 2, "points": null, "statement": "Tổng số gạo bán cả 3 ngày là 125,6 tạ gạo. Số gạo bán ngày thứ ba hơn số gạo bán ngày thứ nhất và ngày thứ hai là 19 tạ gạo. Số gạo bán ngày thứ hai bằng 30% số gạo bán ngày thứ nhất. Hỏi mỗi ngày bán được bao nhiêu tạ gạo?", "has_figure": false, "garbled": false, "answer": "Ngày thứ nhất: 41 tạ; ngày thứ hai: 12,3 tạ; ngày thứ ba: 72,3 tạ", "solution": "Số gạo bán được trong ngày thứ ba là: (125,6 + 19) : 2 = 72,3 (tạ).\nSố gạo bán được trong ngày thứ nhất và ngày thứ hai là: 125,6 − 72,3 = 53,3 (tạ).\nTỉ số của số gạo bán ngày thứ hai và số gạo bán ngày thứ nhất là 30% = 3/10. Số gạo bán ngày thứ nhất là: 53,3 : (3 + 10)\n× 10 = 41 (tạ).\nSố gạo bán ngày thứ hai là: 53,3 – 41 = 12,3 (tạ).\nĐáp số: Ngày thứ nhất: 41 tạ gạo; Ngày thứ hai: 12,3 tạ gạo; Ngày thứ ba: 72,3 tạ gạo.", "unit": "c3", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["tổng–hiệu", "tổng–tỉ", "tỉ số phần trăm", "số thập phân"], "mock": false, "mc": null, "key": ["12.3", "41", "72.3"], "gradable": true}, {"id": "NS-2025-9", "school": "NS", "year": "2025", "part": "TL", "q_no": 3, "points": null, "statement": "Cho hình vẽ bên.\na) Có bao nhiêu hình tam giác được cấu tạo bởi các hình tam giác có cạnh là 1 cm?\nb) Xóa 2 đoạn 1 cm để được ít hình tam giác nhất.", "has_figure": true, "garbled": false, "answer": "a) 16 hình tam giác; b) xóa hai đoạn thuộc đường chéo hoặc trung tâm của hình (xem hình vẽ trong đáp án)", "solution": "a)\nCó số tam giác được cấu tạo bởi các hình tam giác có cạnh là 1 cm là: 1 + 3 + 5 + 7 = 16 (hình tam giác).\nb)\nXóa hai đoạn thuộc đường chéo hoặc trung tâm của hình sẽ làm mất nhiều tam giác nhất (ví dụ minh họa bằng hình vẽ trong đáp án, không có trong văn bản).", "unit": "c7", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["đếm hình", "suy luận"], "mock": false, "mc": null, "key": ["16"], "gradable": true}, {"id": "NTT-2018-1", "school": "NTT", "year": "2018", "part": "TN", "q_no": 1, "points": 0.5, "statement": "Số liệu thống kê xếp loại học lực của học sinh Trường Nguyễn Tất Thành trong 4 năm được cho trong bảng dưới đây. Biết rằng học lực của học sinh được chia làm ba loại: Giỏi, Khá và Trung bình. Hỏi năm học nào tỉ lệ học sinh xếp loại Trung bình của trường là cao nhất?\nBảng (Năm học – Giỏi – Khá): 2014 – 2015: 69,8% – 28,5%; 2015 – 2016: 79,6% – 19,4%; 2016 – 2017: 83,4% – 16,2%; 2017 – 2018: 85,7% – 13,4%.\nA. Năm học 2014 – 2015\nB. Năm học 2015 – 2016\nC. Năm học 2016 – 2017\nD. Năm học 2017 – 2018", "has_figure": false, "garbled": false, "answer": "A", "solution": "Cách 1: phần trăm TB = 100% – (phần trăm học lực Giỏi + phần trăm học lực Khá).\nCách 2: Để phần trăm học lực trung bình là cao nhất thì tổng số phần trăm Giỏi và Khá phải thấp nhất trong các năm.\nĐáp án A", "unit": "u12", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["đọc bảng số liệu", "tỉ số phần trăm"], "mock": false, "mc": {"A": "Năm học 2014 – 2015", "B": "Năm học 2015 – 2016", "C": "Năm học 2016 – 2017", "D": "Năm học 2017 – 2018"}, "key": "A", "gradable": true}, {"id": "NTT-2018-2", "school": "NTT", "year": "2018", "part": "TN", "q_no": 2, "points": 0.5, "statement": "Đội tình nguyện trường Nguyễn Tất Thành làm từ thiện tại một trường học của tỉnh Hà Giang. Theo kế hoạch, đội sẽ dọn cỏ ở một mảnh đất hình chữ nhật dài 220m, rộng 130m trong khuôn viên của trường. Đội đã dọn được cỏ với diện tích 1,2 héc-ta (ha). Hỏi diện tích phần đất còn lại chưa được dọn cỏ?\nA. 16,6 ha\nB. 12,6 ha\nC. 1,66 ha\nD. 28,6 ha", "has_figure": false, "garbled": false, "answer": "C", "solution": "Diện tích của mảnh đất hình chữ nhật là: 220 x 130 = 28.600 (m2) = 2,86 (ha)\nDiện tích đất chưa dọn cỏ còn lại là: 2,86 – 1,2 = 1,66 (ha)\nĐáp án: C", "unit": "u6", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["diện tích hình chữ nhật", "đổi đơn vị diện tích", "héc-ta"], "mock": false, "mc": {"A": "16,6 ha", "B": "12,6 ha", "C": "1,66 ha", "D": "28,6 ha"}, "key": "C", "gradable": true}, {"id": "NTT-2018-3", "school": "NTT", "year": "2018", "part": "TN", "q_no": 3, "points": 0.5, "statement": "Hưởng ứng dự án “Áo ấm cho học sinh vùng khó khăn ở tỉnh Hà Giang” của trường Nguyễn Tất Thành, lớp 6A phân công các bạn tự làm bữa sáng để cả lớp cùng ăn, tiết kiệm tiền để thực hiện dự án. Đến lượt nhóm của bạn An làm bánh mì kẹp, An cùng nhóm trộn thịt xay với khoai tây nghiền với tỉ lệ 3:2 để làm 4 kilôgam nhân bánh. Hỏi nhóm của An đã dùng bao nhiêu kilôgam thịt xay?\nA. 2,4 kg\nB. 2,5 kg\nC. 1,6 kg\nD. 1,5 kg", "has_figure": false, "garbled": false, "answer": "A", "solution": "Số kilogam thịt xay đã dùng là: 4 : (3 + 2) x 3 = 2,4 (kg)\nĐáp án: A", "unit": "c3", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["tổng – tỉ", "tỉ số", "số thập phân"], "mock": false, "mc": {"A": "2,4 kg", "B": "2,5 kg", "C": "1,6 kg", "D": "1,5 kg"}, "key": "A", "gradable": true}, {"id": "NTT-2018-4", "school": "NTT", "year": "2018", "part": "TN", "q_no": 4, "points": 0.5, "statement": "Viết liên tiếp câu “TRƯỜNG NGUYỄN TẤT THÀNH” 20 lần. Hỏi âm Ê cuối cùng đứng ở vị trí thứ mấy?\nA. 400\nB. 325\nC. 350\nD. 391", "has_figure": false, "garbled": false, "answer": "D", "solution": "Coi cụm “TRƯỜNG NGUYỄN TẤT THÀNH” gồm có 20 kí tự và âm Ê đứng vị trí thứ 11.\nVị trí của âm Ê cuối cùng đứng ở vị trí thứ: 19 x 20 + 11 = 391\nĐáp án: D", "unit": "u15", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["dãy lặp lại", "quy luật", "đếm vị trí"], "mock": false, "mc": {"A": "400", "B": "325", "C": "350", "D": "391"}, "key": "D", "gradable": true}, {"id": "NTT-2018-5", "school": "NTT", "year": "2018", "part": "DT", "q_no": 5, "points": 0.5, "statement": "Xe ô tô chở đoàn từ thiện của trường Nguyễn Tất Thành rời Hà Nội lúc 6 giờ sáng và đi lên tỉnh Hà Giang với vận tốc trung bình là 55 km/h. Cùng lúc đó, một xe tải đi từ tỉnh Hà Giang về Hà Nội trên cùng tuyến đường và hai xe gặp nhau lúc 9 giờ. Hỏi vận tốc trung bình của xe tải? Biết quãng đường từ Hà Nội tới Hà Giang là 300km.", "has_figure": false, "garbled": false, "answer": "45 km/h", "solution": "Thời gian 2 xe chuyển động đến lúc gặp nhau là: 9 – 6 = 3 (giờ)\nTổng vận tốc của 2 xe là: 300 : 3 = 100 (km/h)\nVận tốc của xe tải là: 100 – 55 = 45 (km/h)\nĐáp số: 45 km/h", "unit": "c4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "vận tốc", "tổng vận tốc"], "mock": false, "mc": null, "key": ["45"], "gradable": true}, {"id": "NTT-2018-6", "school": "NTT", "year": "2018", "part": "DT", "q_no": 6, "points": 0.5, "statement": "Trong đợt đăng kí tham gia các câu lạc bộ (CLB) ở trường Nguyễn Tất Thành, mỗi học sinh được đăng kí tham gia từ 1 đến 2 CLB. Có tổng số 30 học sinh lớp 6 đăng kí vào CLB Phóng viên và CLB Khoa học, trong đó có 15 học sinh đăng kí CLB Phóng viên, 20 học sinh đăng kí CLB Khoa học. Hỏi có ít nhất bao nhiêu học sinh lớp 6 đăng kí tham gia cả hai CLB?", "has_figure": false, "garbled": false, "answer": "5 học sinh", "solution": "Sử dụng sơ đồ Ven ta có:\nSố học sinh tham gia cả 2 câu lạc bộ là: 15 + 20 – 30 = 5 (học sinh)\nĐáp số: 5 học sinh", "unit": "c6", "unit_alt": "u12", "difficulty": 2, "vn_grade": 4, "skills": ["sơ đồ Venn", "suy luận", "đếm"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "NTT-2018-7", "school": "NTT", "year": "2018", "part": "DT", "q_no": 7, "points": 0.75, "statement": "Các bạn trong Câu lạc bộ Khoa học đố nhau cùng giải một bài toán: Một thùng rỗng hình hộp chữ nhật dài 60 cm, rộng 50 cm, đặt trong đó 3 khối lập phương kim loại cạnh 10 cm (như hình vẽ). Sau đó đổ được vào thùng từ một vòi với tốc độ chảy 4 lít/phút thì sau 15 phút thùng đầy nước. Hỏi chiều cao của thùng là bao nhiêu centimet?", "has_figure": true, "garbled": false, "answer": "21 cm", "solution": "Sau 15 phút thùng chứa số lít nước là: 15 x 4 = 60 (lít) = 60.000 cm3\nThể tích của 3 khối kim loại hình lập phương là: 3 x 10 x 10 x 10 = 3000 (cm3)\nThể tích thực của thùng là: 60.000 + 3000 = 63.000 (cm3)\nChiều cao của thùng nước là: 63.000 : (60 x 50) = 21 (cm)\nĐáp số: 21 cm", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "thể tích hình lập phương", "đổi đơn vị thể tích"], "mock": false, "mc": null, "key": ["21"], "gradable": true}, {"id": "NTT-2018-8", "school": "NTT", "year": "2018", "part": "DT", "q_no": 8, "points": 0.75, "statement": "Trên cây ở sân trường Nguyễn Tất Thành có 10 con chim đang đậu ở hai cành cây. Có 1 con từ cành trên bay xuống cành dưới và 3 con bay từ cành dưới lên cành trên, khi ấy số chim ở cành trên bằng hai phần ba số chim ở cành dưới. Hỏi lúc đầu cành dưới có bao nhiêu con chim?", "has_figure": false, "garbled": false, "answer": "8 con", "solution": "Sau khi cho nhận:\nSố chim ở cành trên sau khi cho nhận là: 10 : (2 + 3) x 2 = 4 (con)\nSố chim ở cành dưới sau khi cho nhận là: 10 – 4 = 6 (con)\nSố chim ở cành dưới lúc đầu là: 6 + 3 – 1 = 8 (con)\nSố chim ở cành trên lúc đầu là: 10 – 8 = 2 (con)\nĐáp số: 8 con", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "tính ngược", "cho nhận"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "NTT-2018-9", "school": "NTT", "year": "2018", "part": "DT", "q_no": 9, "points": 0.75, "statement": "Nhà trường tổ chức hội chợ để gây quỹ ủng hộ “Vì Trường Sa thân yêu”. Lớp 6A vẽ một bức tranh và đem bán đấu giá với giá dự kiến là 280000 đồng. Người thứ nhất trả cao hơn giá dự kiến 10%, người thứ hai trả cao hơn giá người thứ nhất đưa ra là 10%, người thứ ba trả cao hơn giá người thứ hai đưa ra là 5% và mua được bức tranh. Hỏi cuối cùng, bức tranh được bán với giá bao nhiêu?", "has_figure": false, "garbled": false, "answer": "355 740 đồng", "solution": "Giá người thứ nhất trả là: 280 000 x (100 + 10)% = 308 000 (đ)\nGiá người thứ hai trả là: 308 000 x (100 + 10)% = 338 800 (đ)\nGiá người thứ ba trả là: 338 800 x (100 + 5)% = 355 740 (đ)\nĐáp số: 355 740 đồng", "unit": "u4", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tăng phần trăm liên tiếp"], "mock": false, "mc": null, "key": ["355", "740"], "gradable": true}, {"id": "NTT-2018-10", "school": "NTT", "year": "2018", "part": "DT", "q_no": 10, "points": 0.75, "statement": "Lớp 6A đi từ thiện tại Bệnh viện Huyết Học, Ban tổ chức cần mua 200 hộp sữa và 50 gói bánh. Biết rằng một hộp sữa giá 5000 đồng, một gói bánh giá 25000 đồng. Cửa hàng khuyến mại mua 5 hộp sữa được tặng 1 hộp, mua 10 gói bánh được tặng 1 gói. Hỏi tổng số tiền Ban tổ chức phải trả là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "1 985 000 đồng", "solution": "Giá tiền mua 1 lốc sữa là 5000 x 5 = 25 000 (đồng)\nSố lốc sữa cần mua là 200 : 6 = 33 (lốc) + 2 hộp\nSố tiền để mua sữa là 25 000 x 33 + 5000 x 2 = 835 000 (đồng)\nGiá tiền để mua 1 túi bánh là 25 000 x 10 = 250 000 (đồng)\nSố túi bánh cần mua là 50 : 11 = 4 (túi) + 6 gói\nSố tiền để mua bánh là 250 000 x 4 + 25 000 x 6 = 1 150 000 (đồng)\nTổng số tiền để mua sữa và bánh là 835 000 + 1 150 000 = 1 985 000 (đồng)\nĐáp số: 1 985 000 đồng", "unit": "c5", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["bài toán mua bán", "khuyến mại", "phép chia có dư"], "mock": false, "mc": null, "key": ["0", "1", "985"], "gradable": true}, {"id": "NTT-2018-11", "school": "NTT", "year": "2018", "part": "TL", "q_no": 11, "points": 2, "statement": "Trong số học sinh tham gia dự án chăm sóc hoa, cây cảnh ở khuôn viên trường Nguyễn Tất Thành, số học sinh lớp 9 chiếm 2/5, số học sinh lớp 8 chiếm 1/3, còn lại là số học sinh lớp 7 và lớp 6. Biết rằng tổng số học sinh lớp 6, 7, 8 tham gia là 126, số học sinh lớp 6 tham gia bằng 3/4 số học sinh lớp 7. Hãy tìm số học sinh lớp 6 đã tham gia dự án?", "has_figure": false, "garbled": false, "answer": "24 học sinh", "solution": "Số học sinh khối 6 và khối 7 chiếm 1 – 2/5 – 1/3 = 4/15 (tổng số học sinh)\nSố học sinh khối 6, khối 7 và khối 8 chiếm 4/15 + 1/3 = 9/15 (tổng số học sinh)\nTổng số học sinh là 126 : 9/15 = 210 (học sinh)\nSố học sinh của khối 6 và khối 7 là 4/15 x 210 = 56 (học sinh)\nSố học sinh của khối 6 là 56 : (3 + 4) x 3 = 24 (học sinh)\nĐáp số: 24 học sinh", "unit": "u3", "unit_alt": "c3", "difficulty": 2, "vn_grade": 4, "skills": ["phân số của một số", "tìm số khi biết phân số", "tổng – tỉ"], "mock": false, "mc": null, "key": ["24"], "gradable": true}, {"id": "NTT-2018-12", "school": "NTT", "year": "2018", "part": "TL", "q_no": 12, "points": 2, "statement": "Mỗi sáng Nam cùng anh chạy bộ quanh bờ hồ Nghĩa Tân. Hai anh em chạy cùng chiều với vận tốc không đổi, xuất phát cùng một lúc, từ cùng một điểm thì sau 45 phút lại gặp nhau. Tính vận tốc trung bình của Nam. Biết rằng một vòng quanh bờ hồ dài 3km, Nam chạy chậm hơn anh và nếu chạy ngược chiều thì sau 10 phút lại gặp nhau.", "has_figure": false, "garbled": false, "answer": "7 km/giờ", "solution": "Đổi 10 phút = 1/6 giờ; 45 phút = 3/4 giờ.\nGọi s1 và v1 lần lượt là quãng đường và vận tốc chạy của Nam; s2 và v2 lần lượt là quãng đường và vận tốc chạy của anh.\n- Nếu chạy ngược chiều, xuất phát cùng lúc thì sau 10 phút lại gặp nhau.\nTổng vận tốc của hai anh em là: v1 + v2 = 3 : 1/6 = 18 (km/giờ) (1)\n- Hai anh em chạy cùng chiều, xuất phát cùng một lúc, từ cùng một điểm thì sau 45 phút lại gặp nhau.\nHiệu vận tốc của hai người là: v2 – v1 = 3 : 3/4 = 4 (km/giờ) (2)\nVậy vận tốc trung bình của Nam là: (18 – 4) : 2 = 7 (km/giờ)\nĐáp số: 7 km/giờ", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động cùng chiều", "chuyển động ngược chiều", "tổng – hiệu", "đường tròn"], "mock": false, "mc": null, "key": ["7"], "gradable": true}, {"id": "NTT-2019-1", "school": "NTT", "year": "2019", "part": "TN", "q_no": 1, "points": null, "statement": "(Đề được ghi lại theo trí nhớ học sinh.) Là một bài về giao thông có hình vẽ. Câu hỏi là: Nam gặp biểu tượng nào?", "has_figure": true, "garbled": true, "answer": "siêu thị", "solution": "Đáp án: siêu thị", "unit": "c6", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["đọc hình", "suy luận", "thực tế"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "NTT-2019-2", "school": "NTT", "year": "2019", "part": "TN", "q_no": 2, "points": null, "statement": "Năm 2019 sinh nhật Bình vào ngày thứ Ba tháng 5. Hỏi sang năm sinh nhật Bình vào ngày thứ mấy?", "has_figure": false, "garbled": false, "answer": "thứ Năm", "solution": "Sinh nhật vào 5/2020. Năm 2020 là năm nhuận có 366 ngày.\nSố tuần của năm 2020 là: 366 : 7 = 52 (tuần) + 2 ngày\nVậy ngày sinh nhật của Bình vào sang năm sẽ là thứ Năm.\nĐáp số: thứ Năm", "unit": "u5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["lịch", "năm nhuận", "thứ trong tuần", "phép chia có dư"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "NTT-2019-3", "school": "NTT", "year": "2019", "part": "TN", "q_no": 3, "points": null, "statement": "Cho một bể đầy nước hình hộp chữ nhật. Người ta thả 2 cục sắt hình lập phương thì thấy nước tràn ra 54 lít. Tìm cạnh 1 cục sắt.", "has_figure": false, "garbled": false, "answer": "3 dm", "solution": "Thể tích của mỗi cục sắt là: 54 : 2 = 27 (dm3) = 3 x 3 x 3 (dm)\nMà thể tích hình lập phương cạnh a là: a x a x a nên a = 3 dm.\nĐáp số: 3 dm", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình lập phương", "nước tràn", "đổi lít – dm3"], "mock": false, "mc": null, "key": ["3"], "gradable": true}, {"id": "NTT-2019-4", "school": "NTT", "year": "2019", "part": "TN", "q_no": 4, "points": null, "statement": "Sân trường Nguyễn Tất Thành có chu vi là 142 m. Nếu tăng chiều rộng lên 0,5 m và giảm chiều dài đi 0,5 m thì mảnh đất thành hình vuông. Tính diện tích sân trường.", "has_figure": false, "garbled": false, "answer": "1260 m2", "solution": "Gọi chiều dài là a (m), chiều rộng là b (m).\nTăng chiều rộng lên 0,5m, giảm chiều dài đi 0,5m thì mảnh đất thành hình vuông, suy ra a – b = 1 (m).\nNửa chu vi của sân trường là a + b = 142 : 2 = 71 (m)\nChiều dài của sân trường là: (71 + 1) : 2 = 36 (m)\nChiều rộng của sân trường là: 36 – 1 = 35 (m)\nDiện tích của sân trường là: 36 x 35 = 1260 (m2)\nĐáp số: 1260 m2", "unit": "c3", "unit_alt": "u6", "difficulty": 2, "vn_grade": 4, "skills": ["tổng – hiệu", "chu vi hình chữ nhật", "diện tích hình chữ nhật"], "mock": false, "mc": null, "key": ["1260", "2"], "gradable": true}, {"id": "NTT-2019-5", "school": "NTT", "year": "2019", "part": "TN", "q_no": 5, "points": null, "statement": "An viết một số bằng 3/14 của số M. Nhưng do sơ suất nên An đã viết một số bằng 3/4 của số M. Biết hiệu của số mới và số cũ bằng 150. Tìm M.", "has_figure": false, "garbled": false, "answer": "M = 280", "solution": "Tích đúng cần viết là 3/14 x M.\nTích sai đã viết là 3/4 x M.\nTheo bài ra ta có: 3/4 x M – 3/14 x M = 150\n(3/4 – 3/14) x M = 150\n15/28 x M = 150\nM = 150 : 15/28 = 280\nĐáp số: M = 280", "unit": "u3", "unit_alt": "c1", "difficulty": 2, "vn_grade": 4, "skills": ["phân số của một số", "hiệu hai phân số", "tìm số"], "mock": false, "mc": null, "key": ["280"], "gradable": true}, {"id": "NTT-2019-6", "school": "NTT", "year": "2019", "part": "TN", "q_no": 6, "points": null, "statement": "Một chiếc xe đạp có đường kính bánh trước là 0,7 m và đường kính bánh sau là 0,9 m. Nếu bánh trước quay được 135 vòng thì bánh sau quay được mấy vòng?", "has_figure": false, "garbled": false, "answer": "105 vòng", "solution": "Chu vi của bánh trước là: 0,7 x 3,14 = 2,198 (m)\nChu vi của bánh sau là: 0,9 x 3,14 = 2,862 (m)\nQuãng đường bánh trước đi được là: 135 x 2,198 = 296,73 (m)\nBánh sau quay được số vòng là: 296,73 : 2,862 = 105 (vòng)\nĐáp số: 105 vòng", "unit": "u6", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["chu vi hình tròn", "số thập phân", "bánh xe"], "mock": false, "mc": null, "key": ["105"], "gradable": true}, {"id": "NTT-2019-7", "school": "NTT", "year": "2019", "part": "TN", "q_no": 7, "points": null, "statement": "Một người lái xe tính: Nếu đi với vận tốc 40km/giờ thì sẽ đến lúc 10 giờ 15 phút còn nếu đi với vận tốc 50km/giờ thì sẽ đến lúc 9 giờ 45 phút. Tính quãng đường xe đã đi.", "has_figure": false, "garbled": false, "answer": "100 km", "solution": "Gọi t1, v1 lần lượt là thời gian và vận tốc xe đi 40km/h; t2, v2 lần lượt là thời gian và vận tốc xe đi 50km/h.\nKhi đó t1 – t2 = 10 giờ 15 phút – 9 giờ 45 phút = 30 phút = 1/2 (giờ)\nTa có v1/v2 = t2/t1 = 40/50 = 4/5\nt2 = 0,5 : (5 – 4) x 4 = 2 (giờ)\nQuãng đường dài số km là: S = t2 x v2 = 2 x 50 = 100 (km)\nĐáp số: 100 km", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động", "tỉ lệ nghịch vận tốc – thời gian", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["100"], "gradable": true}, {"id": "NTT-2019-8", "school": "NTT", "year": "2019", "part": "TN", "q_no": 8, "points": null, "statement": "Có hai ngăn sách. Tổng số sách hai ngăn là 150 quyển. Nếu chuyển 5 quyển từ ngăn dưới lên ngăn trên thì số sách ngăn trên bằng 2/3 số sách ngăn dưới. Tìm số sách ngăn dưới.", "has_figure": false, "garbled": false, "answer": "95 quyển", "solution": "Sơ đồ bài toán (sau khi chuyển: ngăn trên 2 phần, ngăn dưới 3 phần).\nSố sách ở ngăn dưới sau khi chuyển là: 150 : (3 + 2) x 3 = 90 (quyển)\nSố sách ở ngăn dưới lúc đầu là: 90 + 5 = 95 (quyển)\nĐáp số: 95 quyển", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "chuyển qua lại", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["95"], "gradable": true}, {"id": "NTT-2019-9", "school": "NTT", "year": "2019", "part": "TN", "q_no": 9, "points": null, "statement": "Lan và Hoa làm một công việc. Lan làm một mình mất 5 giờ. Hoa làm một mình mất 7 giờ. Hỏi hai bạn cùng làm thì sau bao lâu sẽ xong?", "has_figure": false, "garbled": false, "answer": "35/12 giờ", "solution": "1 giờ Lan làm được số phần công việc là 1 : 5 = 1/5 (công việc)\n1 giờ Hoa làm được số phần công việc là 1 : 7 = 1/7 (công việc)\nTrong 1 giờ cả hai bạn làm được số phần công việc là 1/5 + 1/7 = 12/35 (công việc)\nThời gian hai bạn cùng làm hết công việc là 1 : 12/35 = 35/12 (giờ)", "unit": "c5", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["công việc chung", "phân số", "năng suất"], "mock": false, "mc": null, "key": ["35/12"], "gradable": true}, {"id": "NTT-2019-10", "school": "NTT", "year": "2019", "part": "TN", "q_no": 10, "points": null, "statement": "Một nhóm người gồm 9 người làm trên một mảnh đất 30m2 thì mất 60 phút. Hỏi nếu 18 người làm trên mảnh đất 15m2 thì bao lâu sẽ xong công việc? Biết sức làm mỗi người như nhau.", "has_figure": false, "garbled": false, "answer": "15 phút", "solution": "1 người làm trên mảnh đất 30 m2 hết thời gian là: 9 x 60 = 540 (phút)\n1 người làm trên mảnh đất 15 m2 hết số thời gian là: 540 : 2 = 270 (phút)\n18 người làm trên mảnh đất 15 m2 hết số thời gian là: 270 : 18 = 15 (phút)\nĐáp số: 15 phút", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tỉ lệ thuận", "tỉ lệ nghịch", "rút về đơn vị"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "NTT-2019-11", "school": "NTT", "year": "2019", "part": "TL", "q_no": 11, "points": null, "statement": "Một đội tình nguyện trường Nguyễn Tất Thành đi trồng cây ở tỉnh Hà Giang trong 3 ngày. Ngày 1 đội trồng 1/3 tổng số cây. Ngày 2 đội trồng 6/11 số cây còn lại. Ngày 3 trồng ít hơn ngày 2 là 30 cây. Tính số cây mà đội đã trồng.", "has_figure": false, "garbled": false, "answer": "495 cây", "solution": "Phân số chỉ số cây còn lại sau ngày 1 là: 1 – 1/3 = 2/3 (tổng số cây)\nPhân số chỉ số cây đội đó trồng trong ngày 2 là: 6/11 x 2/3 = 4/11 (tổng số cây)\nPhân số chỉ số cây đội đó trồng trong ngày 3 là: 1 – 1/3 – 4/11 = 10/33 (tổng số cây)\nPhân số chỉ 30 cây là: 4/11 – 10/33 = 2/33 (tổng số cây)\nTổng số cây đội đó trồng là: 30 : 2 x 33 = 495 (cây)\nĐáp số: 495 cây", "unit": "u3", "unit_alt": "c3", "difficulty": 2, "vn_grade": 4, "skills": ["phân số của một số", "phân số của phần còn lại", "tìm số khi biết phân số"], "mock": false, "mc": null, "key": ["495"], "gradable": true}, {"id": "NTT-2019-12", "school": "NTT", "year": "2019", "part": "TL", "q_no": 12, "points": null, "statement": "Đoạn đường từ Hà Nội đến Hà Giang dài 330km. Một ô tô xuất phát từ Hà Nội lúc 6 giờ với vận tốc 55km/giờ. Cùng lúc 2 xe taxi và xe tải xuất phát từ Hà Giang với vận tốc 65km/giờ và 45km/giờ.\na) Vào lúc mấy giờ thì taxi gặp ô tô?\nb) Vào lúc mấy giờ thì khoảng cách giữa ô tô và taxi bằng khoảng cách giữa ô tô và xe tải?", "has_figure": false, "garbled": false, "answer": "a) 8 giờ 45 phút; b) 9 giờ", "solution": "a)\nThời gian để taxi gặp ô tô là: 330 : (55 + 65) = 2,75 (giờ) = 2 giờ 45 phút\nThời điểm 2 xe gặp nhau là: 6 giờ + 2 giờ 45 phút = 8 giờ 45 phút\nb)\nGiả sử có 1 xe Mazda có vận tốc bằng trung bình cộng vận tốc taxi và xe tải và cũng đi từ Hà Giang lúc 6h thì xe Mazda này luôn nằm giữa taxi và xe tải.\nVì vậy, lúc mà khoảng cách giữa ô tô và taxi bằng khoảng cách giữa ô tô và xe tải cũng là lúc ô tô gặp xe Mazda.\nVận tốc xe Mazda là: (65 + 45) : 2 = 55 (km/giờ)\nThời gian để ô tô gặp xe Mazda là: 330 : (55 + 55) = 3 (giờ)\nVậy thời điểm để ô tô gặp xe Mazda hay khoảng cách giữa ô tô và taxi bằng khoảng cách giữa ô tô và xe tải là: 6 giờ + 3 giờ = 9 giờ\nĐáp số:\na) 8 giờ 45 phút;\nb) 9 giờ", "unit": "c4", "unit_alt": "c6", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "thời điểm gặp nhau", "xe trung gian", "vận tốc trung bình"], "mock": false, "mc": null, "key": ["45", "8", "9"], "gradable": true}, {"id": "NTT-2020-1", "school": "NTT", "year": "2020", "part": "DT", "q_no": 1, "points": null, "statement": "Một lớp 6 của trường Nguyễn Tất Thành tham gia quyên góp ủng hộ người nghèo bằng cách bán sữa chua Mộc Châu. Được biết lớp lãi 20% so với giá bán. Hỏi lớp lãi bao nhiêu % giá mua?", "has_figure": false, "garbled": false, "answer": "25%", "solution": "Ta có: Giá mua + lãi = giá bán, tức 80% + 20% = 100% (giá bán).\nVậy lãi so với giá mua là: 20% : 80% = 25%\nĐáp án: 25%", "unit": "u4", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "lãi so với giá mua", "lãi so với giá bán"], "mock": false, "mc": null, "key": ["25"], "gradable": true}, {"id": "NTT-2020-2", "school": "NTT", "year": "2020", "part": "DT", "q_no": 2, "points": null, "statement": "Nếu gấp bán kính đường tròn 2 lần thì diện tích hình tròn gấp bao nhiêu lần?", "has_figure": false, "garbled": false, "answer": "4 lần", "solution": "Diện tích hình tròn ban đầu là: S1 = 3,14 x R x R\nSau khi tăng bán kính lên 2 lần thì diện tích hình tròn mới là: S2 = 3,14 x (2 x R) x (2 x R) = 2 x 2 x (3,14 x R x R) = 4 x S1\nVậy sau khi tăng bán kính lên 2 lần thì diện tích hình tròn tăng 4 lần.\nĐáp số: 4 lần", "unit": "u6", "unit_alt": "c7", "difficulty": 1, "vn_grade": 5, "skills": ["diện tích hình tròn", "gấp bán kính"], "mock": false, "mc": null, "key": ["4"], "gradable": true}, {"id": "NTT-2020-3", "school": "NTT", "year": "2020", "part": "DT", "q_no": 3, "points": null, "statement": "Một bể nước có chiều dài là 120cm, chiều rộng 60cm, chiều cao 70cm. Người ta thả 1 hòn non bộ cao 35cm và có thể tích là 57dm3. Hỏi cần đổ bao nhiêu lít nước để mực nước trong bể cao hơn 15cm so với hòn non bộ? Biết bể không có nước và hòn non bộ không thấm nước.", "has_figure": false, "garbled": false, "answer": "303 lít", "solution": "Để mực nước cao hơn hòn non bộ 15 cm thì mực nước phải ở độ cao: 35 + 15 = 50 (cm)\nThể tích nước và hòn non bộ là: 120 x 60 x 50 = 360.000 (cm3) = 360 dm3 = 360 (lít)\nThể tích nước là: 360 – 57 = 303 (lít)\nĐáp số: 303 lít", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "đổi đơn vị thể tích", "vật chìm trong nước"], "mock": false, "mc": null, "key": ["303"], "gradable": true}, {"id": "NTT-2020-4", "school": "NTT", "year": "2020", "part": "DT", "q_no": 4, "points": null, "statement": "Một lớp thu gom giấy vụn. Ngày 1 thu 1/4 số giấy. Ngày thứ 2 thu 3/5 số còn lại. [Đề in thiếu phần cuối; theo hướng dẫn giải: ngày thứ 3 thu được 36 kg. Hỏi tổng số giấy lớp cần thu là bao nhiêu kg?]", "has_figure": false, "garbled": true, "answer": "120 kg", "solution": "Số giấy còn lại cần thu sau ngày thứ nhất là 1 – 1/4 = 3/4 (số giấy cần thu)\nNgày thứ hai thu được 3/5 x 3/4 = 9/20 (số giấy cần thu)\nNgày thứ ba thu được 1 – 1/4 – 9/20 = 3/10 (số giấy cần thu)\n36 kg ứng với 3/10 số giấy cần thu.\nTổng số giấy cần thu là 36 : 3/10 = 120 (kg)\nĐáp số: 120 kg", "unit": "u3", "unit_alt": "c3", "difficulty": 2, "vn_grade": 4, "skills": ["phân số của phần còn lại", "tìm số khi biết phân số", "phân số"], "mock": false, "mc": null, "key": ["120"], "gradable": true}, {"id": "NTT-2020-5", "school": "NTT", "year": "2020", "part": "DT", "q_no": 5, "points": null, "statement": "Một đoàn tàu đi qua cầu với vận tốc v = 40 km/h, mất 3 phút. Tìm chiều dài đoàn tàu, biết đoạn hầm dài 1840m.", "has_figure": false, "garbled": false, "answer": "160 m", "solution": "Đoàn tàu đi qua hầm mất 3 phút tức là: từ khi đầu tàu bắt đầu vào hầm cho đến khi đuôi tàu ra khỏi hầm mất thời gian 3 phút và khi đó đoàn tàu sẽ đi được quãng đường bằng tổng độ dài của hầm và độ dài của tàu.\nĐổi: 40 km/giờ = 2000/3 (m/phút)\nSau 3 phút đoàn tàu đi được quãng đường là: 2000/3 x 3 = 2000 (m)\nĐộ dài của đoàn tàu là: 2000 – 1840 = 160 (m)\nĐáp số: 160 m", "unit": "c4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tàu qua cầu/hầm", "đổi đơn vị vận tốc", "chuyển động đều"], "mock": false, "mc": null, "key": ["160"], "gradable": true}, {"id": "NTT-2020-6", "school": "NTT", "year": "2020", "part": "DT", "q_no": 6, "points": null, "statement": "Tính đến ngày 26/5 (hoặc 26/6) số ca nhiễm Covid 19 ở châu Á bằng 9,73% dân số thế giới. Biết số người nhiễm ở Trung Quốc bằng 8,74% so với Châu Á. Hỏi số người nhiễm ở Trung Quốc là bao nhiêu % so với thế giới?", "has_figure": false, "garbled": false, "answer": "0,850402%", "solution": "Theo bài ra ta có: Châu Á = 9,73% Thế giới; Trung Quốc = 8,74% châu Á.\nTrung Quốc = (8,74% x 9,73%) thế giới = 0,850402% thế giới.", "unit": "u4", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "phần trăm của phần trăm", "nhân số thập phân"], "mock": false, "mc": null, "key": ["0.850402"], "gradable": true}, {"id": "NTT-2020-7", "school": "NTT", "year": "2020", "part": "DT", "q_no": 7, "points": null, "statement": "Nhà A có 56 con gà và vịt. Biết 1/2 số gà bằng 2/3 số vịt, hãy tính số gà?", "has_figure": false, "garbled": false, "answer": "32 con", "solution": "Ta có 1/2 số gà bằng 2/3 số vịt.\nSuy ra số gà so với số vịt là 2/3 : 1/2 = 4/3.\nCoi số gà là 4 phần, số vịt là 3 phần.\nVậy số gà là 56 : (4 + 3) x 4 = 32 (con)\nĐáp số: 32 con", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "tỉ số từ phân số", "chia phân số"], "mock": false, "mc": null, "key": ["32"], "gradable": true}, {"id": "NTT-2020-8", "school": "NTT", "year": "2020", "part": "DT", "q_no": 8, "points": null, "statement": "Cho hình vuông ABCD có AB = 60m, AD = 30m. Điểm E trên cạnh BC sao cho BE = 1/2 BC. Điểm F trên cạnh CD sao cho CF = 2/3 CD. Tính diện tích tứ giác AECF?", "has_figure": false, "garbled": false, "answer": "1050 m2", "solution": "Diện tích hình chữ nhật ABCD là 60 x 30 = 1 800 (m2)\nĐộ dài cạnh BE là 30 : 2 = 15 (m)\nĐộ dài cạnh DF là 60 x 1/3 = 20 (m)\nDiện tích tam giác ABE là 60 x 15 : 2 = 450 (m2)\nDiện tích tam giác ADF là 30 x 20 : 2 = 300 (m2)\nDiện tích tứ giác AECF là 1800 – (450 + 300) = 1050 (m2)\nĐáp số: 1050 m2", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 4, "skills": ["diện tích tam giác", "diện tích hình chữ nhật", "phần bù diện tích"], "mock": false, "mc": null, "key": ["1050", "2"], "gradable": true}, {"id": "NTT-2020-9", "school": "NTT", "year": "2020", "part": "DT", "q_no": 9, "points": null, "statement": "Trong ngày sinh nhật, Vui đã mời 9 bạn đến nhà uống nước. Mỗi người bạn được mời 2 cốc nước ép cam, dứa và cà rốt, mỗi cốc 300ml. Được biết, Vui đã đi mua nguyên liệu ở siêu thị, bao gồm: Hộp 1 l nước cam: 85 000 đồng; Hộp 2 l nước dứa: 95 000 đồng; Hộp 1 l nước cà rốt: 120 000 đồng. Công thức pha chế bao gồm: 150ml nước ép cam, 500ml nước ép dứa và 350ml nước ép cà rốt. Hỏi Vui đã tốn bao nhiêu tiền để mua nguyên liệu?", "has_figure": false, "garbled": false, "answer": "423 000 đồng", "solution": "Đáp án: 423 000 đồng", "unit": "c5", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["bài toán thực tế", "tỉ lệ pha chế", "làm tròn lên số hộp", "tính tiền"], "mock": false, "mc": null, "key": ["0", "423"], "gradable": true}, {"id": "NTT-2020-10", "school": "NTT", "year": "2020", "part": "TN", "q_no": 10, "points": null, "statement": "Tìm 1 số thập phân có 4 đơn vị, 3 phần mười, 5 phần nghìn. Chọn đáp án đúng:\nA. 4,503\nB. 4,35\nC. 4,53\nD. 4,305", "has_figure": false, "garbled": false, "answer": "D", "solution": "Số thập phân có 4 đơn vị, 3 phần mười, 5 phần nghìn là 4,305.\nChọn D.", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["cấu tạo số thập phân", "hàng của số thập phân"], "mock": false, "mc": {"A": "4,503", "B": "4,35", "C": "4,53", "D": "4,305"}, "key": "D", "gradable": true}, {"id": "NTT-2020-11", "school": "NTT", "year": "2020", "part": "TL", "q_no": 11, "points": null, "statement": "Trong câu lạc bộ khoa học, 1/5 số học sinh nam bằng 5/11 số học sinh nữ. Khi thêm 16 học sinh nam thì số học sinh nam gấp 3 lần số học sinh nữ. Tính số học sinh của câu lạc bộ khoa học.", "has_figure": false, "garbled": false, "answer": "72 học sinh", "solution": "Lúc đầu 1/5 số học sinh nam bằng 5/11 số học sinh nữ.\nSố học sinh nam so với số học sinh nữ là 5/11 : 1/5 = 25/11. Hay số học sinh nam bằng 25/11 số học sinh nữ.\nSau khi thêm 16 học sinh nam thì số học sinh nam gấp 3 lần số học sinh nữ.\nVậy 16 học sinh ứng với: 3 – 25/11 = 8/11 (số học sinh nữ)\nSố học sinh nữ là 16 : 8/11 = 22 (học sinh)\nSố học sinh nam lúc đầu là: 22 x 25/11 = 50 (bạn)\nTổng số học sinh của CLB là: 22 + 50 = 72 (bạn)\nĐáp số: 72 bạn", "unit": "c3", "unit_alt": "u3", "difficulty": 3, "vn_grade": 4, "skills": ["hai tỉ số", "tỉ số từ phân số", "tìm số khi biết phân số"], "mock": false, "mc": null, "key": ["72"], "gradable": true}, {"id": "NTT-2020-12", "school": "NTT", "year": "2020", "part": "TL", "q_no": 12, "points": null, "statement": "Hiệp hội ASEAN được thành lập năm 1967. Tính đến năm 2015 thì số năm Việt Nam tham gia bằng 5/12 số năm mà Hiệp hội bắt đầu tổ chức. Hỏi:\na) Năm bao nhiêu thì Việt Nam tham gia hiệp hội.\nb) Biết năm mà Lào tham gia sau Việt Nam nhưng trước 2010. Biết tổng số năm mà Lào và Việt Nam tham gia tính đến năm 2015 chia hết cho 3. Hỏi Lào tham gia vào năm nào?", "has_figure": false, "garbled": true, "answer": "a) 1995; b) 1999", "solution": "a)\nSố năm Việt Nam tham gia hiệp hội là: (2015 – 1967) x 5/12 = 20 (năm)\nViệt Nam tham gia vào năm: 2015 – 20 = 1995\nb)\nTổng số năm mà Lào và Việt Nam tham gia chia hết cho 3 và 4, tức là chia hết cho 12. Ngoài ra, Lào tham gia sau Việt Nam nhưng trước 2010, tức là tính đến năm 2015 số năm Lào tham gia nhỏ hơn 20 năm và lớn hơn 2015 – 2010 = 5 (năm).\nVì vậy tổng số năm mà Lào và Việt Nam tham gia tính đến năm 2015 nhỏ hơn 20 + 20 = 40 (năm) và lớn hơn 20 + 5 = 25 (năm).\nHơn nữa, lại là một số chia hết cho 12 nên chỉ có thể tổng số năm Lào và Việt Nam tham gia là 36 (năm).\nVậy Lào tham gia được: 36 – 20 = 16 (năm)\nLào tham gia vào năm: 2015 – 16 = 1999\nĐáp số:\na) 1995;\nb) 1999", "unit": "c2", "unit_alt": "u3", "difficulty": 3, "vn_grade": 4, "skills": ["chia hết", "suy luận", "phân số của một số", "năm"], "mock": false, "mc": null, "key": ["1995", "1999"], "gradable": true}, {"id": "NTT-2021-1", "school": "NTT", "year": "2021", "part": "DT", "q_no": 1, "points": null, "statement": "Tính: 20 × 55 + 0,21 × 55 + 20,21 × 45", "has_figure": false, "garbled": false, "answer": "2021", "solution": "20 × 55 + 0,21 × 55 + 20,21 × 45 = 55 x (20 + 0,21) + 20,21 × 45 = 55 x 20,21 + 20,21 × 45 = 20,21 x (55 + 45) = 20,21 x 100 = 2021\nĐáp số: 2021", "unit": "c1", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["tính nhanh", "nhân một số với một tổng", "số thập phân"], "mock": false, "mc": null, "key": ["2021"], "gradable": true}, {"id": "NTT-2021-2", "school": "NTT", "year": "2021", "part": "DT", "q_no": 2, "points": null, "statement": "Quãng đường AB dài 36km. Cùng một lúc, bạn Hòa đi từ A đến B với vận tốc 10km/giờ, bạn Bình đi từ B về A với vận tốc 8km/giờ. Hai bạn gặp nhau ở điểm C. Tính quãng đường AC.", "has_figure": false, "garbled": false, "answer": "20 km", "solution": "Thời gian để hai xe đi đến chỗ gặp nhau là 36 : (10 + 8) = 2 (giờ)\nQuãng đường AC là 10 x 2 = 20 (km)\nĐáp số: 20 km", "unit": "c4", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "thời gian gặp nhau", "quãng đường"], "mock": false, "mc": null, "key": ["20"], "gradable": true}, {"id": "NTT-2021-3", "school": "NTT", "year": "2021", "part": "DT", "q_no": 3, "points": null, "statement": "Một người có một mảnh đất hình chữ nhật có chiều dài 20m và chiều rộng 15m. Người đó lấy 45% diện tích mảnh đất để làm nhà, phần còn lại để làm vườn. Tính diện tích đất làm vườn.", "has_figure": false, "garbled": false, "answer": "165 m2", "solution": "Diện tích mảnh đất là 20 x 15 = 300 (m2)\nDiện tích làm nhà là 300 : 100 x 45 = 135 (m2)\nDiện tích làm vườn là 300 – 135 = 165 (m2)\nĐáp số: 165 m2", "unit": "u4", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "diện tích hình chữ nhật"], "mock": false, "mc": null, "key": ["165", "2"], "gradable": true}, {"id": "NTT-2021-4", "school": "NTT", "year": "2021", "part": "DT", "q_no": 4, "points": null, "statement": "Một hình lập phương có diện tích toàn phần là 54cm2. Tính thể tích hình lập phương đó.", "has_figure": false, "garbled": false, "answer": "27 cm3", "solution": "Diện tích toàn phần = cạnh x cạnh x 6 = 54.\nSuy ra: cạnh x cạnh = 54 : 6 = 9.\nVậy cạnh hình lập phương là 3 cm.\nThể tích hình lập phương là 3 x 3 x 3 = 27 (cm3)\nĐáp số: 27 cm3", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích toàn phần hình lập phương", "thể tích hình lập phương"], "mock": false, "mc": null, "key": ["27", "3"], "gradable": true}, {"id": "NTT-2021-5", "school": "NTT", "year": "2021", "part": "DT", "q_no": 5, "points": null, "statement": "Lớp 5A có 40 học sinh, biết rằng 2/5 số học sinh nam bằng 2/3 số học sinh nữ. Tính số học sinh nam.", "has_figure": false, "garbled": false, "answer": "25 học sinh", "solution": "Ta có 2/5 số học sinh nam bằng 2/3 số học sinh nữ.\nVậy số học sinh nam bằng 2/3 : 2/5 = 5/3 số học sinh nữ.\nCoi số học sinh nam là 5 phần, số học sinh nữ là 3 phần.\nSố học sinh nam là 40 : (5 + 3) x 5 = 25 (học sinh)\nĐáp số: 25 học sinh", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "tỉ số từ phân số"], "mock": false, "mc": null, "key": ["25"], "gradable": true}, {"id": "NTT-2021-6", "school": "NTT", "year": "2021", "part": "DT", "q_no": 6, "points": null, "statement": "Đội A làm một công việc xong trong 10 giờ. Cả hai đội A và B cùng làm thì xong trong 6 giờ. Hỏi đội B làm công việc đó một mình thì trong bao lâu sẽ xong?", "has_figure": false, "garbled": false, "answer": "15 giờ", "solution": "Đội A mỗi giờ làm được 1 : 10 = 1/10 (công việc)\nCả hai đội mỗi giờ cùng làm được 1 : 6 = 1/6 (công việc)\nĐội B mỗi giờ làm được 1/6 – 1/10 = 1/15 (công việc)\nĐội B làm một mình thì hết số thời gian là 1 : 1/15 = 15 (giờ)\nĐáp số: 15 giờ", "unit": "c5", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["công việc chung", "phân số", "năng suất"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "NTT-2021-7", "school": "NTT", "year": "2021", "part": "DT", "q_no": 7, "points": null, "statement": "Cho tam giác ABC có diện tích là 5 cm2. Kéo dài AB ra một đoạn sao cho AB = BD. Kéo dài BC ra một đoạn sao cho BC = 1/2 CE. Tính diện tích tam giác ADE.", "has_figure": false, "garbled": false, "answer": "30 cm2", "solution": "Ta có S(ABC) = 1/2 S(ACE) (chung chiều cao hạ từ đỉnh A và đáy BC = 1/2 CE).\nSuy ra S(ACE) = 5 : 1/2 = 10 (cm2)\nS(ABE) = S(ABC) + S(ACE) = 5 + 10 = 15 (cm2)\nMà S(ABE) = S(DBE) (chung chiều cao hạ từ đỉnh E và đáy BA = BD).\nSuy ra S(DBE) = 15 cm2\nVậy S(ADE) = S(ABE) + S(DBE) = 15 + 15 = 30 (cm2)\nĐáp số: 30 cm2", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung chiều cao", "kéo dài cạnh"], "mock": false, "mc": null, "key": ["2", "30"], "gradable": true}, {"id": "NTT-2021-8", "school": "NTT", "year": "2021", "part": "DT", "q_no": 8, "points": null, "statement": "Bạn Hạnh có 20 miếng bìa hình vuông cạnh 1dm. Bạn ấy xếp các bìa đó thành một hình chữ nhật (không đè lên nhau, cạnh khít nhau). Hỏi trong các hình chữ nhật có thể xếp được thì hình nào có chu vi lớn nhất?", "has_figure": false, "garbled": false, "answer": "Hình chữ nhật có chiều dài 20 dm, chiều rộng 1 dm (chu vi 42 dm)", "solution": "Vì bạn ấy xếp 20 miếng bìa hình vuông cạnh 1 dm thành một hình chữ nhật (không đè lên nhau, cạnh khít nhau) nên diện tích hình chữ nhật bằng diện tích của 20 miếng bìa hình vuông.\nDiện tích hình chữ nhật là 1 x 1 x 20 = 20 (dm2)\nKích thước hình chữ nhật có thể là 1 x 20; 2 x 10 hoặc 4 x 5.\nĐể chu vi hình chữ nhật lớn nhất thì tổng chiều dài và chiều rộng phải lớn nhất.\nTa chọn hình chữ nhật có kích thước 1 x 20.\nKhi đó chu vi hình chữ nhật là (20 + 1) x 2 = 42 (dm)\nĐáp số: hình chữ nhật có chiều dài 20 dm, chiều rộng
