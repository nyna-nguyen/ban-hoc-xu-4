ble": true}, {"id": "CG-2019-2", "school": "CG", "year": "2019", "part": "TN", "q_no": 2, "points": null, "statement": "Tìm số thứ 7 của dãy 3; 5; 8; 13; 21; …", "has_figure": false, "garbled": false, "answer": "55", "solution": "Số thứ ba là 3 + 5 = 8; số thứ tư là 5 + 8 = 13; số thứ năm là 8 + 13 = 21; số thứ sáu là 13 + 21 = 34; số thứ bảy là 21 + 34 = 55.\nVậy số thứ 7 là 55.", "unit": "u15", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dãy số", "quy luật dãy số"], "mock": false, "mc": null, "key": ["55"], "gradable": true}, {"id": "CG-2019-3", "school": "CG", "year": "2019", "part": "TN", "q_no": 3, "points": null, "statement": "Tính giá trị biểu thức: 101 x 34 + 10,1 x 130 + 1,01 x 2700", "has_figure": false, "garbled": false, "answer": "2020", "solution": "101 x 34 + 10,1 x 130 + 1,01 x 2700 = 101 x 34 + 101 x 13 + 101 x 27 = 101 x (34 + 13 + 27) = 101 x 20 = 2020. (\nĐáp án in dấu trừ ở hai chỗ nhưng kết quả 2020 chỉ đúng với dấu cộng.)", "unit": "c1", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["tính nhanh", "số thập phân", "nhân một số với một tổng"], "mock": false, "mc": null, "key": ["2020"], "gradable": true}, {"id": "CG-2019-4", "school": "CG", "year": "2019", "part": "TN", "q_no": 4, "points": null, "statement": "Tìm chữ số tận cùng của dãy sau: 11 x 13 x 15 x 17 x 19 x ... x 2019", "has_figure": false, "garbled": false, "answer": "5", "solution": "Dãy 11 x 13 x 15 x 17 x 19 x ... x 2019 là tích của các số lẻ, trong đó có thừa số tận cùng là 5.\nVậy tích trên có chữ số tận cùng là 5.", "unit": "c2", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["chữ số tận cùng", "tích các số lẻ"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "CG-2019-5", "school": "CG", "year": "2019", "part": "TN", "q_no": 5, "points": null, "statement": "Nam có một số bi. Biết nếu xếp mỗi hộp 5 viên bi thì còn dư 3 viên bi. Nếu xếp mỗi hộp 2 hoặc 9 viên bi thì đủ. Hỏi số bi của Nam? Biết Nam có nhiều hơn 110 viên và ít hơn 250 viên.", "has_figure": false, "garbled": false, "answer": "198 viên", "solution": "Ta có 110 < số bi < 250. Gọi số bi là abc. abc chia 5 dư 3 và abc chia hết cho 2 nên c = 8. Mà ab8 chia hết cho 9 nên a + b + 8 chia hết cho 9. Trường hợp 1: a + b = 1 suy ra a = 1, b = 0, được số 108 < 110 (loại).\nTrường hợp 2: a + b = 10 suy ra a = 1, b = 9, được số 198 (thỏa mãn).\nVậy số bi của Nam là 198 viên.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "số dư", "cấu tạo số"], "mock": false, "mc": null, "key": ["198"], "gradable": true}, {"id": "CG-2019-6", "school": "CG", "year": "2019", "part": "TN", "q_no": 6, "points": null, "statement": "Cách đây 4 năm tổng số tuổi 2 chị em là 28 tuổi. Hiện nay tuổi em bằng 4/5 tuổi chị. Tính tuổi em hiện nay.", "has_figure": false, "garbled": false, "answer": "16 tuổi", "solution": "Tổng số tuổi hai chị em hiện nay là 28 + 4 + 4 = 36 (tuổi).\nTuổi em hiện nay là 36 : (4 + 5) x 4 = 16 (tuổi).\nĐáp số: 16 tuổi.", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["bài toán tuổi", "tổng – tỉ"], "mock": false, "mc": null, "key": ["16"], "gradable": true}, {"id": "CG-2019-7", "school": "CG", "year": "2019", "part": "TN", "q_no": 7, "points": null, "statement": "Một mảnh đất hình chữ nhật có diện tích là 2020 m2. Nếu tăng chiều dài lên 50% và giảm chiều rộng đi 20% thì diện tích mới là bao nhiêu hecta?", "has_figure": false, "garbled": false, "answer": "0,2424 ha", "solution": "Chiều dài x chiều rộng = 2020 m2. Chiều dài mới = 150% x chiều dài; chiều rộng mới = 80% x chiều rộng.\nSuy ra S mới = 150% x chiều dài x 80% x chiều rộng = 120% x S cũ = 120% x 2020 = 2424 (m2).\nĐổi 2424 m2 = 0,2424 ha.\nĐáp số: 0,2424 ha.", "unit": "u4", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "diện tích hình chữ nhật", "đổi đơn vị diện tích"], "mock": false, "mc": null, "key": ["0.2424"], "gradable": true}, {"id": "CG-2019-8", "school": "CG", "year": "2019", "part": "TN", "q_no": 8, "points": null, "statement": "Cho một số bóng xanh và vàng. Số bóng vàng bằng 1/3 bóng xanh. Nếu thêm 6 bóng vàng thì bóng vàng bằng 5/9 bóng xanh. Tính số bóng xanh.", "has_figure": false, "garbled": false, "answer": "27 quả", "solution": "6 quả ứng với 5/9 − 1/3 = 2/9 (số bóng xanh).\nVậy số bóng xanh là 6 : 2/9 = 27 (quả).\nĐáp số: 27 quả.", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["bài toán hai tỉ số", "phân số của một số"], "mock": false, "mc": null, "key": ["27"], "gradable": true}, {"id": "CG-2019-TL1", "school": "CG", "year": "2019", "part": "TL", "q_no": 1, "points": null, "statement": "Nam dự định đi từ A đến B với vận tốc 40 km/h. Đi 1/2 quãng đường thì Nam nghỉ 15 phút. Để đến B đúng giờ thì Nam phải đi với vận tốc 50 km/giờ. Tính quãng đường AB.", "has_figure": false, "garbled": false, "answer": "100 km", "solution": "Xét trên 1/2 quãng đường còn lại.\nGọi t1 là thời gian khi đi với vận tốc 40 km/giờ, t2 là thời gian khi đi với vận tốc 50 km/giờ.\nTrên cùng quãng đường thì thời gian và vận tốc tỉ lệ nghịch: v1/v2 = t2/t1 = 40/50 = 4/5.\nTa có t1 − t2 = 15 phút = 0,25 giờ.\nThời gian thực tế đi trên 1/2 quãng đường còn lại là 0,25 x 4 = 1 (giờ).\nQuãng đường AB là 50 x 1 x 2 = 100 (km).\nĐáp số: 100 km.", "unit": "c4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đều", "tỉ lệ nghịch vận tốc – thời gian", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["100"], "gradable": true}, {"id": "CG-2019-TL2", "school": "CG", "year": "2019", "part": "TL", "q_no": 2, "points": null, "statement": "Cho hình tam giác ABC. Lấy M trên AB và N trên AC sao cho AM = BM và 2 x NC = NA.\na) Tính tỉ số diện tích ANM và BMNC.\nb) Cho MN cắt BC ở D. So sánh BC với CD.", "has_figure": false, "garbled": false, "answer": "a) S(AMN) = 1/2 S(BMNC); b) CD = BC", "solution": "a)\nNối N với B.\nS(AMN) = 1/2 S(ANB) (chung chiều cao từ N xuống AB, đáy AM = 1/2 AB).\nS(ANB) = 2/3 S(ABC) (chung chiều cao từ B xuống AC, đáy AN = 2/3 AC).\nSuy ra S(AMN) = 1/2 x 2/3 S(ABC) = 1/3 S(ABC).\nVậy S(AMN) = 1/2 S(BMNC).\nb)\nNối A với D.\nS(AMD) = S(BMD) (chung chiều cao từ D xuống AB, đáy AM = BM).\nHai tam giác này chung đáy MD nên chiều cao hạ từ A xuống MD bằng chiều cao hạ từ B xuống MD.\nKết hợp với chung đáy ND ta có S(AND) = S(BND).\nLại có S(CND) = 1/2 S(AND) (chung chiều cao từ D xuống AC, đáy CN = 1/2 AN).\nSuy ra S(CND) = 1/2 S(BND), mà hai tam giác này chung chiều cao từ N xuống DB nên đáy CD = 1/2 DB, hay CD = BC.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": null, "key": ["1/2"], "gradable": true}, {"id": "CG-2020-1", "school": "CG", "year": "2020", "part": "DT", "q_no": 1, "points": 0.75, "statement": "Tính giá trị biểu thức: B = 13,28 × 9,9 + 13,28 × 0,1", "has_figure": false, "garbled": false, "answer": "132,8", "solution": "13,28 × 9,9 + 13,28 × 0,1 = 13,28 x (9,9 + 0,1) = 13,28 x 10 = 132,8.", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "số thập phân", "nhân một số với một tổng"], "mock": false, "mc": null, "key": ["132.8"], "gradable": true}, {"id": "CG-2020-2", "school": "CG", "year": "2020", "part": "DT", "q_no": 2, "points": 0.75, "statement": "Hùng và Cường hẹn nhau lúc 8 giờ 40 phút. Hùng đến lúc 8 giờ 20 phút. Cường đến muộn 12 phút. Hỏi Hùng phải đợi Cường bao nhiêu lâu?", "has_figure": false, "garbled": false, "answer": "32 phút", "solution": "Cường đến chỗ hẹn lúc 8 giờ 40 phút + 12 phút = 8 giờ 52 phút.\nHùng phải đợi Cường số phút là 8 giờ 52 phút − 8 giờ 20 phút = 32 phút.\nĐáp số: 32 phút.", "unit": "u5", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["thời gian", "cộng trừ số đo thời gian"], "mock": false, "mc": null, "key": ["32"], "gradable": true}, {"id": "CG-2020-3", "school": "CG", "year": "2020", "part": "DT", "q_no": 3, "points": 0.75, "statement": "32% của một số là 6,4. Vậy 5/8 của số đó là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "12,5", "solution": "Số đó là 6,4 : 32 x 100 = 20.\nVậy 5/8 của 20 là 20 x 5/8 = 25/2 = 12,5.", "unit": "u4", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tìm số khi biết phần trăm", "phân số của một số"], "mock": false, "mc": null, "key": ["12.5"], "gradable": true}, {"id": "CG-2020-4", "school": "CG", "year": "2020", "part": "DT", "q_no": 4, "points": 0.75, "statement": "Cho 1 hình lập phương có diện tích toàn phần lớn hơn diện tích xung quanh là 72 cm2. Tính thể tích hình lập phương đó?", "has_figure": false, "garbled": false, "answer": "216 cm3", "solution": "Gọi cạnh của hình lập phương là a (cm).\nTa có a x a x 2 = 72 cm2, suy ra a x a = 72 : 2 = 36 cm2.\nVậy cạnh của hình lập phương là 6 cm.\nThể tích của hình lập phương là 6 x 6 x 6 = 216 (cm3).\nĐáp số: 216 cm3.", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["hình lập phương", "diện tích toàn phần", "thể tích"], "mock": false, "mc": null, "key": ["216", "3"], "gradable": true}, {"id": "CG-2020-5", "school": "CG", "year": "2020", "part": "DT", "q_no": 5, "points": 0.75, "statement": "Lớp 5A có 50 học sinh. Trong đó có 50% bạn thích đá bóng, 12% bạn thích chạy, 18% bạn thích đá cầu. Số còn lại thích chơi cầu lông. Hỏi số bạn thích chơi cầu lông là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "10 bạn", "solution": "Số học sinh thích chơi cầu lông chiếm 100% − (50% + 12% + 18%) = 20%.\nSố bạn thích chơi cầu lông là 50 x 20 : 100 = 10 (bạn).\nĐáp số: 10 bạn.", "unit": "u4", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tính phần trăm của một số"], "mock": false, "mc": null, "key": ["10"], "gradable": true}, {"id": "CG-2020-6", "school": "CG", "year": "2020", "part": "DT", "q_no": 6, "points": 0.75, "statement": "Hai số có hiệu là 1554. Tổng của 2 số là 2x3y chia hết cho 2, 5 và 9. Hỏi số lớn là số nào?", "has_figure": false, "garbled": false, "answer": "1992", "solution": "Số 2x3y chia hết cho 2 và 5 nên y = 0. Số 2x30 chia hết cho 9 nên x = 4.\nSuy ra tổng của hai số là 2430. Số lớn là (2430 + 1554) : 2 = 1992.\nĐáp số: 1992.", "unit": "c2", "unit_alt": "c3", "difficulty": 2, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "cấu tạo số", "tổng – hiệu"], "mock": false, "mc": null, "key": ["1992"], "gradable": true}, {"id": "CG-2020-7", "school": "CG", "year": "2020", "part": "DT", "q_no": 7, "points": 0.75, "statement": "Lúc 14 giờ một xe đi từ A đến B với vận tốc 30 km/giờ. Đến 14 giờ 45 phút, xe đó nghỉ 15 phút. Sau đó xe đó đi nốt quãng đường với vận tốc 40 km/giờ. Đến 16 giờ 12 phút thì xe tới B. Tính độ dài quãng đường AB?", "has_figure": false, "garbled": false, "answer": "70,5 km", "solution": "Thời gian người đó đi trước khi nghỉ là 14 giờ 45 phút − 14 giờ = 45 phút = 0,75 giờ.\nThời gian người đó đi sau khi nghỉ là 16 giờ 12 phút − 14 giờ 45 phút − 15 phút = 1 giờ 12 phút = 1,2 giờ.\nĐộ dài quãng đường AB là 30 x 0,75 + 40 x 1,2 = 70,5 (km).\nĐáp số: 70,5 km.", "unit": "c4", "unit_alt": "u5", "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động đều", "quãng đường = vận tốc × thời gian", "đổi đơn vị thời gian"], "mock": false, "mc": null, "key": ["70.5"], "gradable": true}, {"id": "CG-2020-8", "school": "CG", "year": "2020", "part": "DT", "q_no": 8, "points": 0.75, "statement": "Cho hình vẽ, biết S(KQBC) = 26 cm2 và BQ/AB = 1/6; AK/AC = 1/3. Tính S(AKQ).", "has_figure": true, "garbled": false, "answer": "10 cm2", "solution": "S(AKQ)/S(ABC) = (AK/AC) x (AQ/AB) = 1/3 x 5/6 = 5/18.\nSuy ra S(KQBC)/S(ABC) = 1 − 5/18 = 13/18.\nSuy ra S(ABC) = 26 : 13/18 = 36 (cm2).\nVậy S(AKQ) = 36 x 5/18 = 10 (cm2).\nĐáp số: 10 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": null, "key": ["10", "2"], "gradable": true}, {"id": "CG-2020-9", "school": "CG", "year": "2020", "part": "TL", "q_no": 9, "points": 2, "statement": "Cho kệ sách có 3 tầng với 700 quyển sách. 40% số sách ở tầng 1.\na) Tính số sách ở tầng 1.\nb) Nếu chuyển nửa số sách từ tầng 3 sang tầng 2 thì số sách tầng 3 bằng 2/5 số sách ở tầng 2. Tính số sách mỗi tầng ban đầu?", "has_figure": false, "garbled": false, "answer": "a) 280 quyển; b) tầng 2: 180 quyển, tầng 3: 240 quyển (theo lời giải; dòng Đáp số trong đáp án in ngược là tầng 2: 240, tầng 3: 180)", "solution": "a)\nSố sách ở tầng 1 là 700 x 40 : 100 = 280 (quyển).\nb)\nTổng số sách ở tầng 2 và tầng 3 là 700 − 280 = 420 (quyển).\nSau khi chuyển thì tổng số sách ở hai tầng đó vẫn không thay đổi.\nSố sách ở tầng 3 sau khi chuyển là 420 : (2 + 5) x 2 = 120 (quyển).\nSố sách ở tầng 3 lúc đầu là 120 x 2 = 240 (quyển).\nSố sách ở tầng 2 lúc đầu là 420 − 240 = 180 (quyển).", "unit": "c3", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tổng – tỉ", "chuyển qua lại"], "mock": false, "mc": null, "key": ["180", "180", "2", "2", "240", "240", "280", "3", "3"], "gradable": true}, {"id": "CG-2020-10", "school": "CG", "year": "2020", "part": "TL", "q_no": 10, "points": 2, "statement": "Nam viết lên bảng 3 số 1, 2, 3. Nam xóa đi 2 số a, b và thay bằng một số là c = (a × b)/(a + b). Nam xóa cho đến khi chỉ còn 1 số.\na) Hỏi số đó là số nào? Vì sao?\nb) Nam cũng chơi trò chơi đó, nhưng có 5 số 1, 2, 3, 4, 5. Xong Nam nhận xét lần chơi nào cũng ra số cuối cùng giống nhau. Hỏi Nam nhận xét đúng hay sai? Vì sao?", "has_figure": false, "garbled": false, "answer": "a) 6/11; b) Nam nhận xét đúng, số cuối cùng luôn là 60/137", "solution": "a)\nNếu Nam xóa 2 số là 1 và 2 thì c = (1 x 2)/(1 + 2) = 2/3, được hai số là 2/3 và 3. Tiếp tục xóa hai số trên thì còn một số là c = (2/3 x 3)/(2/3 + 3) = 6/11. Tương tự với hai trường hợp còn lại là xóa 1 và 3 hoặc 2 và 3 thì cũng được kết quả là 6/11.\nVậy số Nam thu được là 6/11.\nb)\nỞ câu a, bắt đầu xóa 1 và 2 được 2/3, xóa tiếp 2/3 và 3 được 6/11. Xóa 6/11 và 4 được c = (6/11 x 4)/(6/11 + 4) = 12/25, còn lại hai số 5 và 12/25. Xóa 5 và 12/25 thì số còn lại cuối cùng là c = (12/25 x 5)/(12/25 + 5) = 60/137. Tương tự như vậy, lần chơi nào cũng ra kết quả giống nhau là 60/137.\nVậy bạn Nam nói đúng.", "unit": "c6", "unit_alt": "u3", "difficulty": 3, "vn_grade": 4, "skills": ["trò chơi", "suy luận logic", "phép tính phân số", "bất biến"], "mock": false, "mc": null, "key": ["6/11", "60/137"], "gradable": true}, {"id": "CG-2021-1", "school": "CG", "year": "2021", "part": "DT", "q_no": 1, "points": 0.75, "statement": "Tính giá trị biểu thức: 4,2 × 13/9 + 4,2 × 5/9", "has_figure": false, "garbled": false, "answer": "8,4", "solution": "4,2 × 13/9 + 4,2 × 5/9 = 4,2 × (13/9 + 5/9) = 4,2 × 18/9 = 4,2 × 2 = 8,4.\nĐáp số: 8,4.", "unit": "c1", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "nhân một số với một tổng", "phân số", "số thập phân"], "mock": false, "mc": null, "key": ["8.4"], "gradable": true}, {"id": "CG-2021-2", "school": "CG", "year": "2021", "part": "DT", "q_no": 2, "points": 0.75, "statement": "3 ha gấp 75 m2 bao nhiêu lần?", "has_figure": false, "garbled": false, "answer": "400 lần", "solution": "Đổi 3 ha = 30 000 m2.\nVậy 3 ha gấp 75 m2 số lần là 30 000 : 75 = 400 (lần).\nĐáp số: 400 lần.", "unit": "u2", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["đổi đơn vị diện tích", "ha", "phép chia"], "mock": false, "mc": null, "key": ["400"], "gradable": true}, {"id": "CG-2021-3", "school": "CG", "year": "2021", "part": "DT", "q_no": 3, "points": 0.75, "statement": "Trong đợt giải cứu nông sản do ảnh hưởng của dịch Covid-19, các nhà cứu trợ đã tổ chức thuê xe vào Bắc Giang thu mua vải thiều. Ngày thứ nhất, để chở 20 tấn vải thiều cần 5 xe ô tô. Ngày thứ hai, để chở 36 tấn vải thiều thì cần bao nhiêu xe ô tô cùng loại?", "has_figure": false, "garbled": false, "answer": "9 xe", "solution": "1 xe chở được số tấn vải là 20 : 5 = 4 (tấn).\nSố xe để chở 36 tấn vải là 36 : 4 = 9 (xe).\nĐáp số: 9 xe.", "unit": "c5", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tỉ lệ thuận", "rút về đơn vị"], "mock": false, "mc": null, "key": ["9"], "gradable": true}, {"id": "CG-2021-4", "school": "CG", "year": "2021", "part": "DT", "q_no": 4, "points": 0.75, "statement": "Một bể nước dạng hình hộp chữ nhật có các kích thước đo ở trong lòng bể là: dài 3 m, rộng 2 m, cao 1,5 m. Một vòi nước chảy vào bể 1 phút được 30 lít (1 dm3 = 1 lít). Thời gian để vòi nước đó chảy đầy bể nước là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "5 giờ", "solution": "Thể tích của bể là 3 x 2 x 1,5 = 9 (m3) = 9 000 dm3. Thời gian để vòi chảy đầy bể là 9 000 : 30 = 300 (phút).\nĐổi 300 phút = 5 giờ.\nĐáp số: 5 giờ.", "unit": "c7", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "đổi đơn vị thể tích", "vòi nước"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "CG-2021-5", "school": "CG", "year": "2021", "part": "DT", "q_no": 5, "points": 0.75, "statement": "Một can chứa 32,5 lít dầu. Sau khi dùng 40% lượng dầu đó thì trong can còn lại bao nhiêu lít dầu?", "has_figure": false, "garbled": false, "answer": "19,5 lít", "solution": "Số lít dầu còn lại chiếm 100% − 40% = 60% (lượng dầu ban đầu).\nSố lít dầu còn lại là 32,5 x 60 : 100 = 19,5 (lít).\nĐáp số: 19,5 lít.", "unit": "u4", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tính phần trăm của một số"], "mock": false, "mc": null, "key": ["19.5"], "gradable": true}, {"id": "CG-2021-6", "school": "CG", "year": "2021", "part": "DT", "q_no": 6, "points": 0.75, "statement": "Cho dãy số: 1; 2; 5; 10; 17; 26; … Số hạng tiếp theo của dãy là số nào?", "has_figure": false, "garbled": false, "answer": "37", "solution": "1 + 1 = 2; 2 + 3 = 5; 5 + 5 = 10; 10 + 7 = 17; 17 + 9 = 26.\nVậy số hạng tiếp theo của dãy số là 26 + 11 = 37.\nĐáp số: 37.", "unit": "u15", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dãy số", "quy luật dãy số"], "mock": false, "mc": null, "key": ["37"], "gradable": true}, {"id": "CG-2021-7", "school": "CG", "year": "2021", "part": "DT", "q_no": 7, "points": 0.75, "statement": "Một cửa hàng có 400 chai nước rửa tay và cồn sát khuẩn. Cửa hàng đó bán đi 20 chai nước rửa tay và 50 chai cồn thì còn lại số chai nước rửa tay bằng 4/7 số chai cồn. Hỏi lúc đầu cửa hàng đó có bao nhiêu chai nước rửa tay?", "has_figure": false, "garbled": false, "answer": "140 chai", "solution": "Tổng số chai nước rửa tay và cồn sát khuẩn còn lại sau khi bán là 400 − 20 − 50 = 330 (chai).\nSố chai nước rửa tay còn lại là 330 : (4 + 7) x 4 = 120 (chai).\nSố chai nước rửa tay lúc đầu là 120 + 20 = 140 (chai).\nĐáp số: 140 chai.", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["140"], "gradable": true}, {"id": "CG-2021-8", "school": "CG", "year": "2021", "part": "DT", "q_no": 8, "points": 0.75, "statement": "Cho hình thang ABCD có AB = 2/3 CD. Trên AD lấy điểm E sao cho AE gấp 2 lần ED. Tính diện tích tam giác ABE, biết diện tích hình thang ABCD là 30 cm2.", "has_figure": false, "garbled": false, "answer": "8 cm2", "solution": "S(ABD)/S(BDC) = 2/3 (chiều cao bằng nhau và đáy AB = 2/3 CD).\nS(ABD) + S(BDC) = S(ABCD) = 30 (cm2).\nSuy ra S(ABD) = 30 : (2 + 3) x 2 = 12 (cm2).\nLại có S(ABE)/S(ABD) = 2/3 (chung chiều cao hạ từ đỉnh B và đáy AE = 2/3 đáy AD).\nSuy ra S(ABE) = 12 x 2/3 = 8 (cm2).\nĐáp số: 8 cm2.", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["hình thang", "tỉ số diện tích tam giác", "chung chiều cao"], "mock": false, "mc": null, "key": ["2", "8"], "gradable": true}, {"id": "CG-2021-9", "school": "CG", "year": "2021", "part": "TL", "q_no": 9, "points": 2, "statement": "Một ô tô khởi hành lúc 7 giờ 15 phút với vận tốc 60 km/giờ. Khi đến B, ô tô nghỉ 1,5 giờ rồi về A với vận tốc 50 km/giờ và về A lúc 14 giờ 15 phút.\na) Nếu không tính thời gian nghỉ thì tổng thời gian cả đi và về là bao nhiêu?\nb) Tính quãng đường AB?", "has_figure": false, "garbled": false, "answer": "a) 5,5 giờ; b) 150 km", "solution": "a)\nNếu không tính thời gian nghỉ thì tổng thời gian cả đi và về là 14 giờ 15 phút − 7 giờ 15 phút − 1 giờ 30 phút = 5 giờ 30 phút = 5,5 giờ.\nb)\nGọi t1 là thời gian khi đi với vận tốc v1 = 60 km/giờ, t2 là thời gian khi về với vận tốc v2 = 50 km/giờ.\nTrên quãng đường AB không đổi, vận tốc và thời gian là hai đại lượng tỉ lệ nghịch: v1/v2 = t2/t1 = 60/50 = 6/5.\nTa có t1 + t2 = 5,5. Thời gian ô tô về là t2 = 5,5 : (5 + 6) x 6 = 3 (giờ).\nQuãng đường AB dài là 50 x 3 = 150 (km).\nĐáp số:\na) 5,5 giờ;\nb) 150 km.", "unit": "c4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đều", "tỉ lệ nghịch vận tốc – thời gian", "tổng – tỉ"], "mock": false, "mc": null, "key": ["150", "5.5"], "gradable": true}, {"id": "CG-2021-10", "school": "CG", "year": "2021", "part": "TL", "q_no": 10, "points": 2, "statement": "Trong giờ sinh hoạt CLB Toán của trường THCS Cầu Giấy, thầy Tùng lấy 3 hộp bi A, B, C chứa số viên bi lần lượt là: 8; 15; 10 và đưa ra câu đố: “Với mỗi lượt chơi, người chơi được chọn 2 hộp bi bất kì và lấy từ mỗi hộp 1 viên bi rồi cho số bi đó vào hộp còn lại. Cứ chơi như vậy cho đến khi số bi trong mỗi hộp đúng với yêu cầu của thầy”.\na) Thầy Tùng yêu cầu A; B; C lần lượt là 10; 11; 12. Lượt 1, Công chọn A, B rồi cho vào C được số bi lần lượt là 7; 14; 12. Ta được bảng tính sau: (bảng). Em hãy giúp Công hoàn thành các ô trống ở lượt 2 và lượt 3.\nb) Thầy Tùng yêu cầu chia mỗi túi có 11 viên. Bạn Công nói: “Mỗi lượt chia, số bi từng túi khi chia 3 sẽ có số dư khác nhau”. Chứng minh rằng bạn Công nói đúng, từ đó suy ra yêu cầu của thầy có thực hiện được không?", "has_figure": true, "garbled": false, "answer": "a) Một cách: sau lượt 2: 9; 13; 11 – sau lượt 3: 11; 12; 10 – sau lượt 4: 10; 11; 12. b) Công nói đúng; yêu cầu của thầy không thực hiện được.", "solution": "Nhận xét 1: Ở mỗi lượt chơi, mỗi hộp chỉ có thể giảm 1 viên hoặc tăng 2 viên.\nHộp A: từ 7 viên lên 10 viên → tăng 3 viên (tăng 2, tăng 2 và giảm 1).\nHộp B: từ 14 viên còn 11 viên → giảm 3 viên (giảm 1, giảm 1, giảm 1).\nHộp C: giữ nguyên 12 viên → giảm 1, giảm 1, tăng 2. Nhận xét 2: Ở mỗi lượt chơi, có 2 hộp giảm và chỉ có 1 hộp tăng.\nBảng: Lúc đầu 8; 15; 10. Sau lượt 1: 7; 14; 12. Sau lượt 2: 9; 13; 11. Sau lượt 3: 11; 12; 10. Sau lượt 4: 10; 11; 12. Lưu ý: có nhiều cách để hoàn thiện bảng nhưng vẫn cần đảm bảo các nhận xét trên. b)\nSố bi ban đầu ở mỗi hộp khi chia 3 có số dư khác nhau, lần lượt là 2; 0 và 1. Giả sử nhận xét của Công là sai, tức là tại một lượt chơi nào đó số dư ở mỗi hộp khi chia 3 đều bằng nhau.\nTH1: đều dư 0. Khi đó, trước lượt chơi này, 2 hộp bị lấy ra 1 bi có số bi chia 3 dư 1; hộp còn lại được thêm 2 bi có số bi chia 3 dư 1.\nVậy mỗi hộp đều có số bi chia 3 dư 1. TH2: đều dư 1 → trước đó mỗi hộp đều chia 3 dư 2. TH3: đều dư 2 → trước đó mỗi hộp đều chia 3 dư 0. Từ 3 trường hợp trên, để có 1 lượt chơi mà số dư mỗi hộp chia cho 3 đều bằng nhau thì các lượt chơi trước, số dư ở mỗi hộp chia cho 3 cũng phải bằng nhau.\nMà ban đầu số dư ở mỗi hộp là khác nhau nên mâu thuẫn.\nVậy bạn Công nói đúng.\nThầy Tùng yêu cầu mỗi hộp đều 11 viên bi, tức là số dư ở mỗi hộp khi chia cho 3 bằng nhau.\nTheo lập luận trên, yêu cầu của thầy không thực hiện được.", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["trò chơi", "suy luận logic", "số dư khi chia cho 3", "bất biến"], "mock": false, "mc": null, "key": ["10", "10", "11", "11", "11", "12", "12", "13", "2", "3", "4", "9"], "gradable": true}, {"id": "CG-2024-1", "school": "CG", "year": "2024", "part": "TN", "q_no": 1, "points": null, "statement": "Hỗn số 2 3/4 được viết dưới dạng số thập phân là:\nA. 2,075\nB. 2,34\nC. 2,75\nD. 27,5", "has_figure": false, "garbled": false, "answer": "C", "solution": "2 3/4 = 2 75/100 = 2,75.\nĐáp án: C.", "unit": "u2", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["hỗn số", "số thập phân", "chuyển phân số sang thập phân"], "mock": false, "mc": {"A": "2,075", "B": "2,34", "C": "2,75", "D": "27,5"}, "key": "C", "gradable": true}, {"id": "CG-2024-2", "school": "CG", "year": "2024", "part": "TN", "q_no": 2, "points": null, "statement": "Đổi 2 ha 15 m2 = .... ha.\nA. 2,0015\nB. 2,15\nC. 2,015\nD. 20 015", "has_figure": false, "garbled": false, "answer": "A", "solution": "2 ha 15 m2 = 2 15/10000 = 2,0015 ha.\nĐáp án: A.", "unit": "u2", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["đổi đơn vị diện tích", "ha", "số thập phân"], "mock": false, "mc": {"A": "2,0015", "B": "2,15", "C": "2,015", "D": "20 015"}, "key": "A", "gradable": true}, {"id": "CG-2024-3", "school": "CG", "year": "2024", "part": "TN", "q_no": 3, "points": null, "statement": "Một người đi xe máy qua 1 cây cầu dài 1 875 m hết 3 phút. Hỏi 1 giờ người đó đi được quãng đường dài bao nhiêu?\nA. 625 m\nB. 37,5 km\nC. 33,75 km\nD. 93,75 km", "has_figure": false, "garbled": false, "answer": "B", "solution": "1 giờ = 60 phút.\n60 phút gấp 3 phút số lần là 60 : 3 = 20 (lần).\n1 giờ người đó đi được quãng đường dài là 1 875 x 20 = 37 500 (m) = 37,5 km.\nĐáp án: B.", "unit": "c4", "unit_alt": "u5", "difficulty": 1, "vn_grade": 5, "skills": ["vận tốc", "đổi đơn vị thời gian", "tỉ lệ thuận"], "mock": false, "mc": {"A": "625 m", "B": "37,5 km", "C": "33,75 km", "D": "93,75 km"}, "key": "B", "gradable": true}, {"id": "CG-2024-4", "school": "CG", "year": "2024", "part": "TN", "q_no": 4, "points": null, "statement": "Một hình hộp chữ nhật có chu vi (đáy) là 36 cm. Chiều rộng bằng 8 cm. Chiều cao bằng 3/4 chiều rộng. Tính thể tích hình này.\nA. 168 cm3\nB. 216 cm3\nC. 285 cm3\nD. 480 cm3", "has_figure": false, "garbled": false, "answer": "D", "solution": "Tổng chiều dài và chiều rộng là 36 : 2 = 18 (cm).\nChiều dài là 18 − 8 = 10 (cm).\nChiều cao của hình hộp chữ nhật là 8 × 3/4 = 6 (cm).\nThể tích của hình hộp chữ nhật là 10 x 8 x 6 = 480 (cm3).\nĐáp án: D.", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "chu vi hình chữ nhật", "phân số của một số"], "mock": false, "mc": {"A": "168 cm3", "B": "216 cm3", "C": "285 cm3", "D": "480 cm3"}, "key": "D", "gradable": true}, {"id": "CG-2024-5", "school": "CG", "year": "2024", "part": "TN", "q_no": 5, "points": null, "statement": "Có 1 500 du khách được hỏi về món ăn yêu thích nhất ở VN thì có 25% số người thích ăn bánh chả, 18% thích ăn bánh mỳ và 43% thích ăn phở, còn lại thích ăn bánh cuốn. Tìm số người thích ăn bánh cuốn.", "has_figure": false, "garbled": false, "answer": "210 người", "solution": "Tỉ số phần trăm người ăn bánh cuốn so với số du khách là 100% − (25% + 18% + 43%) = 14%.\nSố người thích ăn bánh cuốn là 1 500 x 14% = 210 (người).\nĐáp án: 210 người.", "unit": "u4", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tính phần trăm của một số"], "mock": false, "mc": null, "key": ["210"], "gradable": true}, {"id": "CG-2024-6", "school": "CG", "year": "2024", "part": "TN", "q_no": 6, "points": null, "statement": "Quãng đường AB có độ dài 95 km. Lúc 6 giờ một ô tô đi từ A với vận tốc 50 km/giờ, sau 30 phút ô tô giảm vận tốc còn 40 km/giờ. Hỏi ô tô đến B lúc mấy giờ?", "has_figure": false, "garbled": false, "answer": "8 giờ 15 phút", "solution": "Đổi 30 phút = 1/2 giờ.\nSau 30 phút ô tô đã đi được quãng đường là 50 × 1/2 = 25 (km).\nQuãng đường ô tô còn phải đi là 95 − 25 = 70 (km).\nThời gian ô tô cần phải đi với vận tốc 40 km/giờ là 70 : 40 = 7/4 = 1,75 (giờ) = 1 giờ 45 phút.\nÔ tô đến B lúc 6 giờ + 30 phút + 1 giờ 45 phút = 8 giờ 15 phút.\nĐáp án: 8 giờ 15 phút.", "unit": "c4", "unit_alt": "u5", "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động đều", "thời gian = quãng đường : vận tốc", "cộng số đo thời gian"], "mock": false, "mc": null, "key": ["15", "8"], "gradable": true}, {"id": "CG-2024-7", "school": "CG", "year": "2024", "part": "TN", "q_no": 7, "points": null, "statement": "Hiện nay tổng tuổi của bố và con là 50 tuổi. Ba năm trước, tuổi bố gấp 4,5 lần tuổi con. Tính tuổi bố hiện nay.", "has_figure": false, "garbled": false, "answer": "39 tuổi", "solution": "Tổng tuổi hai bố con 3 năm trước là 50 − 3 x 2 = 44 (tuổi).\nTuổi bố 3 năm trước là 44 : (4,5 + 1) x 4,5 = 36 (tuổi).\nTuổi bố hiện nay là 36 + 3 = 39 (tuổi).\nĐáp án: 39 tuổi.", "unit": "c3", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["bài toán tuổi", "tổng – tỉ", "số thập phân"], "mock": false, "mc": null, "key": ["39"], "gradable": true}, {"id": "CG-2024-8", "school": "CG", "year": "2024", "part": "TN", "q_no": 8, "points": null, "statement": "Tính diện tích phần tô đậm. (Hình vẽ bị thiếu; theo lời giải, hình gồm hai hình chữ nhật ADEH kích thước 30 cm × 5 cm và BCFG kích thước 18 cm × 8 cm chồng lên nhau, phần chung IKMN kích thước 8 cm × 5 cm.)", "has_figure": true, "garbled": false, "answer": "254 cm2", "solution": "Diện tích hình chữ nhật ADEH là 5 x 30 = 150 (cm2).\nDiện tích hình chữ nhật BCFG là 8 x 18 = 144 (cm2).\nDiện tích hình chữ nhật IKMN là 8 x 5 = 40 (cm2).\nDiện tích phần tô đậm là 150 + 144 − 40 = 254 (cm2).\nĐáp án: 254 cm2.", "unit": "u6", "unit_alt": "c7", "difficulty": 2, "vn_grade": 4, "skills": ["diện tích hình chữ nhật", "hình ghép", "cắt ghép hình"], "mock": false, "mc": null, "key": ["2", "254"], "gradable": true}, {"id": "CG-2024-9", "school": "CG", "year": "2024", "part": "TL", "q_no": 9, "points": null, "statement": "Để hưởng ứng ngày hội sách bạn Liên đã tham gia đọc 1 cuốn sách dày 375 trang trong 4 ngày. Ngày 1 bạn ấy đọc được số trang bằng với 1/5 tổng số trang của quyển sách. Ngày 2 đọc được số trang bằng với 5/6 số trang mà ngày 3 đọc được. Số trang mà ngày 3 đọc được gấp 1,5 lần số trang mà ngày 4 đọc được.\na) Tìm số trang ngày 1 đã đọc.\nb) Tìm số trang ngày 4 Liên đã đọc.", "has_figure": false, "garbled": false, "answer": "a) 75 trang; b) 80 trang", "solution": "a)\nSố trang sách ngày thứ nhất bạn Liên đã đọc được là 375 × 1/5 = 75 (trang).\nb)\nSau ngày thứ nhất, bạn Liên còn phải đọc số trang sách là 375 − 75 = 300 (trang).\nNgày thứ hai bạn Liên đọc được số phần trang sách so với ngày thứ tư là 5/6 × 1,5 = 5/4 (ngày thứ tư).\nNgày thứ ba bạn Liên đọc được số phần trang sách so với ngày thứ tư là 1,5 = 3/2. 3 ngày còn lại bạn Liên đọc được số phần trang sách so với ngày thứ tư là 5/4 + 3/2 + 1 = 15/4 (ngày thứ tư).\nSố trang ngày thứ tư bạn Liên đã đọc là 300 : 15/4 = 80 (trang).\nĐáp số:\na) 75 trang;\nb) 80 trang.", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 5, "skills": ["phân số của một số", "tỉ số", "tổng – tỉ", "số thập phân"], "mock": false, "mc": null, "key": ["75", "80"], "gradable": true}, {"id": "CG-2024-10", "school": "CG", "year": "2024", "part": "TL", "q_no": 10, "points": null, "statement": "Cho hai số tự nhiên a và b (a <\nb) biết (a x\nb) x (a +\nb) = 30.\na) Tìm các số a và b thỏa mãn điều kiện trên.\nb) Có thể tìm được 2 số tự nhiên a và b để a x b x (a +\nb) = 20242025 hay không? Vì sao?", "has_figure": false, "garbled": false, "answer": "a) a = 1, b = 5 hoặc a = 2, b = 3; b) Không thể", "solution": "a) 30 = 1 x 2 x 15 = 1 x 3 x 10 = 1 x 5 x 6 = 2 x 3 x 5. Có 2 trường hợp thỏa mãn a < b: Trường hợp 1: a x b x (a +\nb) = 1 x 5 x 6 nên a = 1 và b = 5. Trường hợp 2: a x b x (a +\nb) = 2 x 3 x 5 nên a = 2 và b = 3.\nb)\nNếu a và b đều lẻ: a x b lẻ, a + b chẵn nên tích là số chẵn, mà 20242025 là số lẻ nên loại.\nNếu a và b đều chẵn: a x b chẵn, a + b chẵn nên tích là số chẵn, loại.\nNếu a và b có 1 số chẵn và 1 số lẻ: a x b chẵn, a + b lẻ nên tích là số chẵn, loại.\nVậy không thể tìm được 2 số tự nhiên a và b thỏa mãn a x b x (a +\nb) = 20242025.\nĐáp số:\na) a = 1 và b = 5 hoặc a = 2 và b = 3;\nb)\nKhông thể tìm được hai số a và b thỏa mãn đề bài.", "unit": "c2", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["phân tích thừa số", "tính chẵn lẻ", "suy luận logic"], "mock": false, "mc": null, "key": ["1", "2", "3", "5"], "gradable": true}, {"id": "CG-2025-1", "school": "CG", "year": "2025", "part": "TN", "q_no": 1, "points": null, "statement": "Làm tròn 4,65 tấn đến số tự nhiên gần nhất.", "has_figure": false, "garbled": false, "answer": "5 tấn", "solution": "Đáp án: 5 tấn.", "unit": "u1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["làm tròn số", "số thập phân"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "CG-2025-2", "school": "CG", "year": "2025", "part": "TN", "q_no": 2, "points": null, "statement": "Tính 15 dm3 + 11 cm3 = ..........\nA. 15 011 cm³\nB. 26 dm³\nC. 15 110 cm³\nD. 15 000 cm³", "has_figure": false, "garbled": false, "answer": "A (15 011 cm³)", "solution": "15 dm3 = 15 000 cm3; 15 000 cm3 + 11 cm3 = 15 011 cm³.\nĐáp án: 15 011 cm³.", "unit": "u2", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["đổi đơn vị thể tích", "dm3", "cm3"], "mock": false, "mc": {"A": "15 011 cm³", "B": "26 dm³", "C": "15 110 cm³", "D": "15 000 cm³"}, "key": "A", "gradable": true}, {"id": "CG-2025-3", "school": "CG", "year": "2025", "part": "TN", "q_no": 3, "points": null, "statement": "Quãng đường từ nhà A đến nhà B là 800 m. Trên bản đồ có tỉ lệ 1 : 20 000, quãng đường đó dài bao nhiêu?", "has_figure": false, "garbled": false, "answer": "4 cm", "solution": "Trên bản đồ, quãng đường dài là 800 : 20 000 = 0,04 (m) = 4 cm.\nĐáp án: 4 cm.", "unit": "u4", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ lệ bản đồ", "đổi đơn vị độ dài"], "mock": false, "mc": null, "key": ["4"], "gradable": true}, {"id": "CG-2025-4", "school": "CG", "year": "2025", "part": "TN", "q_no": 4, "points": null, "statement": "Tính diện tích toàn phần hình lập phương có cạnh dài 12 cm.", "has_figure": false, "garbled": false, "answer": "864 cm2", "solution": "Diện tích toàn phần hình lập phương là (12 x 12) x 6 = 864 (cm2).\nĐáp án: 864 cm2.", "unit": "c7", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["hình lập phương", "diện tích toàn phần"], "mock": false, "mc": null, "key": ["2", "864"], "gradable": true}, {"id": "CG-2025-5", "school": "CG", "year": "2025", "part": "TN", "q_no": 5, "points": null, "statement": "Nam tung 2 đồng xu và ghi lại các trường hợp như sau: 2 mặt sấp 10 lần, 2 mặt ngửa 8 lần, 1 mặt sấp 1 mặt ngửa 17 lần. Tính tỉ số số lần 2 mặt sấp so với tổng số lần tung đồng xu.", "has_figure": false, "garbled": false, "answer": "2/7", "solution": "Tổng số lần tung đồng xu là 10 + 8 + 17 = 35 (lần).\nTỉ số số lần 2 mặt sấp so với tổng số lần tung đồng xu là 10/35 = 2/7.\nĐáp án: 2/7.", "unit": "u16", "unit_alt": "u4", "difficulty": 1, "vn_grade": 4, "skills": ["xác suất thực nghiệm", "tỉ số", "rút gọn phân số"], "mock": false, "mc": null, "key": ["2/7"], "gradable": true}, {"id": "CG-2025-6", "school": "CG", "year": "2025", "part": "TN", "q_no": 6, "points": null, "statement": "Trên quãng đường AC có 1 điểm B. Một người đi từ A đến B với vận tốc 30 km/h rồi nghỉ. Người đó tiếp tục đi từ B đến C với vận tốc 26 km/h. Hỏi người đó nghỉ bao nhiêu phút. Biết rằng AB bằng 45 km, BC bằng 13 km. Người đó xuất phát từ 7 giờ và đến C lúc 9 giờ 15 phút.", "has_figure": false, "garbled": false, "answer": "15 phút", "solution": "Tổng thời gian cả đi và nghỉ là 9 giờ 15 phút − 7 giờ = 2 giờ 15 phút.\nTổng thời gian đi từ A đến C là 45 : 30 + 13 : 26 = 2 (giờ).\nThời gian nghỉ của người đó là 2 giờ 15 phút − 2 giờ = 15 phút.\nĐáp số: 15 phút.", "unit": "c4", "unit_alt": "u5", "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động đều", "thời gian = quãng đường : vận tốc", "trừ số đo thời gian"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "CG-2025-7", "school": "CG", "year": "2025", "part": "TN", "q_no": 7, "points": null, "statement": "Nam có số bi xanh ít hơn số bi đỏ là 12 viên. Việt cho Nam thêm 4 viên bi xanh nên tỉ số bi xanh và bi đỏ của Nam là 3/5. Tìm số bi đỏ của Nam.", "has_figure": false, "garbled": false, "answer": "20 viên bi", "solution": "Khi có thêm 4 viên bi xanh thì bi đỏ nhiều hơn bi xanh là 12 − 4 = 8 (viên bi).\nSố bi đỏ của Nam là 8 : (5 − 3) x 5 = 20 (viên bi).\nĐáp án: 20 viên bi.", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["hiệu – tỉ", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["20"], "gradable": true}, {"id": "CG-2025-8", "school": "CG", "year": "2025", "part": "TN", "q_no": 8, "points": null, "statement": "Cho một hình thang có diện tích là 100 m2, người ta kéo dài đáy lớn thêm 5 m, diện tích tăng thêm bằng 1/5 diện tích hình thang. Hãy tính tổng đáy lớn và đáy bé sau khi mở rộng?", "has_figure": false, "garbled": false, "answer": "30 m", "solution": "Diện tích tăng thêm khi kéo dài đáy lớn là 100 : 5 = 20 (m2).\nChiều cao của hình thang là 20 x 2 : 5 = 8 (m).\nTổng đáy lớn và đáy bé lúc đầu là 100 x 2 : 8 = 25 (m).\nTổng đáy lớn và đáy bé sau khi mở rộng là 25 + 5 = 30 (m).\nĐáp án: 30 m.", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["hình thang", "diện tích tam giác", "chiều cao", "mở rộng hình"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "CG-2025-9", "school": "CG", "year": "2025", "part": "TL", "q_no": 9, "points": null, "statement": "Một tổ chức thiện nguyện phát quà tại 4 khu A, B, C và D. Ban đầu phát khu A 50 phần quà. Sau đó phát ở khu B 80% phần quà so với khu A.\na) Hỏi cả hai khu A, B phát bao nhiêu phần quà.\nb) Khi đến khu C, đội thiện nguyện phát 5/9 số quà còn lại và 5 món quà. Khi đến khu D đội thiện nguyện phát nốt 4/5 số quà còn lại và 7 phần quà thì hết. Hỏi đội thiện nguyện mang đi tất cả bao nhiêu món quà để phát 4 khu?", "has_figure": false, "garbled": false, "answer": "a) 90 phần quà; b) 180 món quà", "solution": "a)\nKhu B được phát số phần quà là 50 x 80% = 40 (phần quà).\nCả hai khu A và B được phát số phần quà là 40 + 50 = 90 (phần quà).\nb) 7 phần quà tương ứng số phần quà còn lại sau khi phát 3 khu là 1 − 4/5 = 1/5 (số quà còn lại sau 3 lần phát).\nSố quà còn lại sau 3 lần phát là 7 x 5 = 35 (phần quà).\nKhông tính 5 món quà, sau khi phát khu C thì còn lại số món quà là 5 + 35 = 40 (món quà).\n40 món quà tương ứng số phần quà còn lại sau khi phát khu A và B là 1 − 5/9 = 4/9. Số quà còn lại sau khi phát khu A và B là 40 : 4 x 9 = 90 (món quà).\nTổng số quà phát 4 khu A, B, C và D là 90 + 90 = 180 (món quà).\nĐáp số:\na) 90 món quà;\nb) 180 món quà.", "unit": "c3", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tính ngược từ cuối", "phân số của một số"], "mock": false, "mc": null, "key": ["180", "90"], "gradable": true}, {"id": "CG-2025-10", "school": "CG", "year": "2025", "part": "TL", "q_no": 10, "points": null, "statement": "Một hộp đựng 1 thẻ ghi số 2, 2 thẻ ghi số 3, ... và 15 thẻ ghi số 16.\na) Tính tổng số thẻ trong hộp.\nb) Làm thế nào để lấy được 6 thẻ ghi số giống nhau?", "has_figure": false, "garbled": false, "answer": "a) 120 thẻ; b) lấy 66 thẻ", "solution": "a)\nTổng số thẻ trong hộp là 1 + 2 + 3 + ... + 15 = (1 + 15) x 15 : 2 = 120 (thẻ).\nb)\nTrường hợp xấu nhất chỉ lấy 5 thẻ ghi số giống nhau, hay mỗi số lấy được nhiều nhất 5 thẻ.\nCác số có số lượng dưới 6 thẻ là thẻ ghi số 2, 3, 4, 5 và 6: có 5 số.\nSố số có số lượng thẻ lớn hơn 5 là 15 − 5 = 10 (số).\nTrường hợp xấu nhất ta chỉ lấy được 5 thẻ ghi số giống nhau, tổng số thẻ đã lấy là 1 + 2 + 3 + 4 + 5 + 5 x 10 = 65 (thẻ).\nLúc này ta chỉ cần lấy thêm 1 thẻ chứa số bất kì sẽ có được 6 thẻ ghi số giống nhau.\nTổng số thẻ đã lấy để được 6 thẻ ghi số giống nhau là 65 + 1 = 66 (thẻ).\nĐáp số:\na) 120 thẻ;\nb) 66 thẻ.", "unit": "c6", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["nguyên lí Dirichlet", "trường hợp xấu nhất", "tổng dãy số cách đều"], "mock": false, "mc": null, "key": ["120", "66"], "gradable": true}, {"id": "CG-2022-1", "school": "CG", "year": "2022", "part": "TN", "q_no": 1, "points": 0.75, "statement": "Tính: 3,5 × 1/4 − 1,5 × 1/4.\nA. 0\nB. 1/2\nC. 5/4\nD. 1/8", "has_figure": false, "garbled": false, "answer": "B", "solution": "3,5 × 1/4 − 1,5 × 1/4 = (3,5 − 1,5)\n× 1/4 = 2 × 1/4 = 1/2.\nChọn B.", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "nhân một số với một hiệu", "số thập phân", "phân số"], "mock": false, "mc": {"A": "0", "B": "1/2", "C": "5/4", "D": "1/8"}, "key": "B", "gradable": true}, {"id": "CG-2022-2", "school": "CG", "year": "2022", "part": "TN", "q_no": 2, "points": 0.75, "statement": "0,2 m3 gấp 25 dm3 số lần là:\nA. 0,008\nB. 0,8\nC. 8\nD. 80", "has_figure": false, "garbled": false, "answer": "C", "solution": "Đổi 0,2 m3 = 200 dm3. 0,2 m3 gấp 25 dm3 số lần là 200 : 25 = 8 (lần).\nChọn C.", "unit": "u2", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["đổi đơn vị thể tích", "số thập phân"], "mock": false, "mc": {"A": "0,008", "B": "0,8", "C": "8", "D": "80"}, "key": "C", "gradable": true}, {"id": "CG-2022-3", "school": "CG", "year": "2022", "part": "TN", "q_no": 3, "points": 0.75, "statement": "Một ô tô đi với vận tốc 60 km/giờ, tính quãng đường ô tô đi được trong 12 phút.\nA. 0,2 km\nB. 5 km\nC. 720 km\nD. 12 km", "has_figure": false, "garbled": false, "answer": "D", "solution": "Đổi 12 phút = 1/5 giờ.\nQuãng đường ô tô đi được trong 12 phút là 60 × 1/5 = 12 (km).\nChọn D.", "unit": "c4", "unit_alt": "u5", "difficulty": 1, "vn_grade": 5, "skills": ["quãng đường = vận tốc × thời gian", "đổi đơn vị thời gian"], "mock": false, "mc": {"A": "0,2 km", "B": "5 km", "C": "720 km", "D": "12 km"}, "key": "D", "gradable": true}, {"id": "CG-2022-4", "school": "CG", "year": "2022", "part": "TN", "q_no": 4, "points": 0.75, "statement": "Một hình hộp chữ nhật có chiều dài là 12 cm, chiều rộng là 8 cm. Một hình lập phương có cạnh bằng trung bình cộng ba kích thước của hình hộp chữ nhật và có diện tích toàn phần là 486 cm2. Tìm chiều cao của hình hộp chữ nhật.\nA. 7 cm\nB. 8 cm\nC. 9 cm\nD. 81 cm", "has_figure": false, "garbled": false, "answer": "A", "solution": "Diện tích một mặt của hình lập phương là 486 : 6 = 81 (cm2).\nVì 81 = 9 x 9 nên cạnh hình lập phương có độ dài là 9 cm.\nTổng độ dài 3 kích thước của hình hộp chữ nhật là 9 x 3 = 27 (cm).\nChiều cao của hình hộp chữ nhật là 27 − 12 − 8 = 7 (cm).\nChọn A.", "unit": "c7", "unit_alt": "u14", "difficulty": 2, "vn_grade": 5, "skills": ["hình lập phương", "diện tích toàn phần", "trung bình cộng", "hình hộp chữ nhật"], "mock": false, "mc": {"A": "7 cm", "B": "8 cm", "C": "9 cm", "D": "81 cm"}, "key": "A", "gradable": true}, {"id": "CG-2022-5", "school": "CG", "year": "2022", "part": "DT", "q_no": 5, "points": 1, "statement": "Tìm x, biết: 15,25 − 5 × x = 0,75", "has_figure": false, "garbled": false, "answer": "x = 2,9", "solution": "15,25 − 5 × x = 0,75; 5 × x = 15,25 − 0,75; 5 × x = 14,5; x = 14,5 : 5; x = 2,9.", "unit": "u2", "unit_alt": "c1", "difficulty": 1, "vn_grade": 5, "skills": ["tìm x", "số thập phân"], "mock": false, "mc": null, "key": ["2.9"], "gradable": true}, {"id": "CG-2022-6", "school": "CG", "year": "2022", "part": "DT", "q_no": 6, "points": 1, "statement": "Tổng số học sinh khối 5 của một trường tiểu học là một số có ba chữ số và chữ số hàng trăm là 2. Biết khi xếp học sinh thành 10 hàng thì dư 5 học sinh và xếp thành 9 hàng thì không dư. Hỏi số học sinh khối 5 là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "225 học sinh", "solution": "Gọi số học sinh của khối 5 là 2ab.\nVì khi xếp học sinh thành 10 hàng thì dư 5 học sinh nên số học sinh là số chia 10 dư 5, suy ra b = 5. Vì số học sinh xếp thành 9 hàng thì không dư nên 2a5 chia hết cho 9, suy ra (2 + a + 5) chia hết cho 9 nên a = 2.\nVậy khối 5 có 225 học sinh.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "số dư", "cấu tạo số"], "mock": false, "mc": null, "key": ["225"], "gradable": true}, {"id": "CG-2022-7", "school": "CG", "year": "2022", "part": "DT", "q_no": 7, "points": 1, "statement": "Tuổi anh bằng 5/4 tuổi em. Biết hai lần tuổi anh cộng với tuổi em là 28 tuổi. Tính số tuổi của anh.", "has_figure": false, "garbled": false, "answer": "10 tuổi", "solution": "Coi tuổi anh là 5 phần thì tuổi em là 4 phần.\nKhi đó, 2 lần tuổi anh là 10 phần.\n28 tuổi ứng với 10 + 4 = 14 (phần).\nTuổi anh là 28 : 14 x 5 = 10 (tuổi).\nĐáp số: 10 tuổi.", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["bài toán tuổi", "tỉ số", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["10"], "gradable": true}, {"id": "CG-2022-8", "school": "CG", "year": "2022", "part": "DT", "q_no": 8, "points": 1, "statement": "Cho hình thang ABCD có hai đáy AB, CD. Hai đường chéo AC và BD cắt nhau tại O. Biết diện tích tam giác OAD là 11 cm2, diện tích tam giác OAB là 5 cm2. Tính diện tích hình thang ABCD.", "has_figure": true, "garbled": false, "answer": "51,2 cm2", "solution": "S(CAB) = S(DAB) (chung đáy AB và chiều cao bằng nhau).\nMà S(DAB) = S(OAB) + S(OAD) = 5 + 11 = 16 (cm2) nên S(CAB) = 16 cm2. S(OBC) = S(CAB) − S(OAB) = 16 − 5 = 11 (cm2).\nTa có S(AOB)/S(AOD) = OB/OD = 5/11 (hai tam giác có chung chiều cao hạ từ A xuống BD).\nTa có S(OBC)/S(ODC) = OB/OD (hai tam giác có chung chiều cao hạ từ C xuống đáy BD).\nSuy ra 11/S(ODC) = 5/11, S(ODC) = 11 x 11 : 5 = 24,2 (cm2).\nS(ABCD) = S(ABD) + S(OBC) + S(ODC) = 16 + 11 + 24,2 = 51,2 (cm2).\nĐáp số: 51,2 cm2.", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 5, "skills": ["hình thang", "tỉ số diện tích tam giác", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": null, "key": ["2", "51.2"], "gradable": true}, {"id": "CG-2022-TL1", "school": "CG", "year": "2022", "part": "TL", "q_no": 1, "points": 2, "statement": "Một cuộc thi vẽ có 120 học sinh đạt giải. Số học sinh đạt giải nhất bằng 10% tổng số học sinh đạt giải, số học sinh đạt giải nhì bằng 1/5 tổng số học sinh đạt ba giải còn lại, số học sinh đạt giải ba bằng 3/5 số học sinh đạt giải khuyến khích.\na) Tính số học sinh đạt giải nhất.\nb) Tính số học sinh đạt giải khuyến khích.", "has_figure": false, "garbled": false, "answer": "a) 12 học sinh; b) 55 học sinh", "solution": "a)\nSố học sinh đạt giải nhất: 120 x 10 : 100 = 12 (học sinh).\nb)\nVì số học sinh đạt giải nhì bằng 1/5 tổng số học sinh đạt ba giải còn lại nên số học sinh đạt giải nhì bằng 1/6 tổng số học sinh đạt giải.\nSố học sinh đạt giải nhì là 120 × 1/6 = 20 (học sinh).\nTổng số học sinh đạt giải ba và giải khuyến khích là 120 − 12 − 20 = 88 (học sinh).\nSố học sinh đạt giải khuyến khích là 88 : (3 + 5) x 5 = 55 (học sinh).\nĐáp số:\na) 12 học sinh;\nb) 55 học sinh.", "unit": "c3", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tổng – tỉ", "phân số của một số"], "mock": false, "mc": null, "key": ["12", "55"], "gradable": true}, {"id": "CG-2022-TL2", "school": "CG", "year": "2022", "part": "TL", "q_no": 2, "points": 1, "statement": "Trong kì thi chọn HSG có 2 môn thi là Toán và Tiếng Anh. Biết 1/10 số học sinh giỏi Tiếng Anh bằng 6/83 số học sinh giỏi Toán. Số học sinh giỏi Toán hơn số học sinh giỏi Tiếng Anh là một số có hai chữ số, chia cho 5 và 9 đều dư 2. Tính số học sinh giỏi Toán, số học sinh giỏi Tiếng Anh.", "has_figure": false, "garbled": false, "answer": "Học sinh giỏi Toán: 332; học sinh giỏi Tiếng Anh: 240", "solution": "Các số có hai chữ số chia cho 5 và 9 đều dư 2 là 47 và 92.\nDo đó số học sinh giỏi Toán hơn số học sinh giỏi Tiếng Anh là 47 bạn hoặc 92 bạn.\nBiết 1/10 số học sinh giỏi Tiếng Anh bằng 6/83 số học sinh giỏi Toán nên 6/60 số học sinh giỏi Tiếng Anh bằng 6/83 số học sinh giỏi Toán.\nCoi số học sinh giỏi Tiếng Anh là 60 phần thì số học sinh giỏi Toán là 83 phần.\nHiệu số phần bằng nhau là 83 − 60 = 23 (phần).\nVì 47 không chia hết cho 23 và 92 chia hết cho 23 nên số học sinh giỏi Toán hơn số học sinh giỏi Tiếng Anh là 92 bạn.\nSố học sinh giỏi Toán là 92 : 23 x 83 = 332 (học sinh).\nSố học sinh giỏi Tiếng Anh là 92 : 23 x 60 = 240 (học sinh).\nĐáp số: Học sinh giỏi Toán: 332 học sinh; học sinh giỏi Tiếng Anh: 240 học sinh.", "unit": "c3", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["hiệu – tỉ", "số dư", "phân số"], "mock": false, "mc": null, "key": ["240", "332"], "gradable": true}, {"id": "CNN-2019-1", "school": "CNN", "year": "2019", "part": "TN", "q_no": 1, "points": null, "statement": "An nghĩ ra một số, Bình nghĩ ra một số bằng 4/3 số của An. Cường nghĩ ra một số bằng 60% số của Bình. Hỏi số của Cường bằng bao nhiêu phần trăm số của An?\nA. 60%\nB. 80%\nC. 70%\nD. 90%", "has_figure": false, "garbled": false, "answer": "B", "solution": "Gọi số An nghĩ là A.\nSố Bình nghĩ là 4/3 A.\nSố Cường nghĩ là 3/5 × 4/3 A = 4/5 A = 0,8 x A = 80% x A.\nChọn B.", "unit": "u4", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "phân số của một số", "tỉ số"], "mock": false, "mc": {"A": "60%", "B": "80%", "C": "70%", "D": "90%"}, "key": "B", "gradable": true}, {"id": "CNN-2019-2", "school": "CNN", "year": "2019", "part": "TN", "q_no": 2, "points": null, "statement": "Có bao nhiêu số có 2 chữ số mà số đó gấp 4 lần tổng 2 chữ số của nó?\nA. 2\nB. 3\nC. 4\nD. 5", "has_figure": false, "garbled": false, "answer": "C", "solution": "Gọi số cần tìm là ab (a khác 0).\nTa có ab = 4 × (a + b); 10 × a + b = 4 × a + 4 × b; 6 × a = 3 × b; 2 × a = b.\nNếu a = 1 thì b = 2, được số 12. Nếu a = 2 thì b = 4, được số 24. Nếu a = 3 thì b = 6, được số 36. Nếu a = 4 thì b = 8, được số 48.\nVậy có 4 số thỏa mãn đề bài.\nChọn C.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["cấu tạo số", "số có hai chữ số", "phân tích cấu tạo số"], "mock": false, "mc": {"A": "2", "B": "3", "C": "4", "D": "5"}, "key": "C", "gradable": true}, {"id": "CNN-2019-3", "school": "CNN", "year": "2019", "part": "TN", "q_no": 3, "points": null, "statement": "Năm nay tuổi bố gấp 8 lần tuổi bé An, tuổi mẹ gấp 7 lần tuổi bé An và bố hơn mẹ 4 tuổi. Hỏi sang năm bé An bao nhiêu tuổi?\nA. 4\nB. 3\nC. 5\nD. 6", "has_figure": false, "garbled": false, "answer": "C", "solution": "Bố hơn mẹ 4 tuổi, tương ứng 8 − 7 = 1 lần tuổi An, nên tuổi bé An năm nay là 4 (tuổi).\nVậy sang năm bé An 5 tuổi.\nChọn C.", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu – tỉ"], "mock": false, "mc": {"A": "4", "B": "3", "C": "5", "D": "6"}, "key": "C", "gradable": true}, {"id": "CNN-2019-4", "school": "CNN", "year": "2019", "part": "TN", "q_no": 4, "points": null, "statement": "Cho hình vẽ. Tính tỉ số diện tích 2 tam giác BDF và AEF.\nA. 2\nB. 1,5\nC. 3\nD. 1 (Hình vẽ bị thiếu; theo lời giải: E thuộc AC với AE = 1/4 AC, D thuộc BC với BD = 1/3 BC, F là giao điểm của AD và BE.)", "has_figure": true, "garbled": false, "answer": "A", "solution": "Nối F với C.\nTa có S(ABE) = 1/3 S(BEC) (chung chiều cao hạ từ đỉnh B và AE = 1/3 EC) và S(FAE) = 1/3 S(FEC) (chung chiều cao hạ từ đỉnh F và AE = 1/3 EC), suy ra S(BAF) = 1/3 S(BCF).\nTa có S(BFD) = 1/3 S(BFC) (chung chiều cao hạ từ đỉnh F và BD = 1/3 BC).\nSuy ra S(BAF) = S(BFD) (1).\nTa có S(AFB) = 1/2 S(AFC); S(AFE) = 1/4 S(AFC) (chung chiều cao hạ từ đỉnh F và AE = 1/4 AC), suy ra S(AFE) = 1/2 S(BAF) (2).\nTừ (1) và (2) suy ra S(BFD) = 2 x S(AEF).\nChọn A.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": {"A": "2", "B": "1,5", "C": "3", "D": "1 (Hình vẽ bị thiếu; theo lời giải: E thuộc AC với AE = 1/4 AC, D thuộc BC với BD = 1/3 BC, F là giao điểm của AD và BE.)"}, "key": "A", "gradable": true}, {"id": "CNN-2019-5", "school": "CNN", "year": "2019", "part": "TN", "q_no": 5, "points": null, "statement": "Người thứ nhất làm xong công việc trong 5 giờ, người thứ hai làm xong công việc trong 4 giờ. Hỏi cả hai người cùng làm mất bao lâu?\nA. 20 giờ\nB. 9 giờ\nC. 7/20 giờ\nD. 20/9 giờ", "has_figure": false, "garbled": false, "answer": "D", "solution": "Trong 1 giờ người thứ nhất làm được 1 : 5 = 1/5 (công việc).\nTrong 1 giờ người thứ hai làm được 1 : 4 = 1/4 (công việc).\nTrong 1 giờ cả hai người cùng làm được 1/5 + 1/4 = 9/20 (công việc).\nCả hai người cùng làm thì hoàn thành công việc trong 1 : 9/20 = 20/9 (giờ).\nChọn D.", "unit": "c5", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["công việc chung", "phân số", "năng suất"], "mock": false, "mc": {"A": "20 giờ", "B": "9 giờ", "C": "7/20 giờ", "D": "20/9 giờ"}, "key": "D", "gradable": true}, {"id": "CNN-2019-6", "school": "CNN", "year": "2019", "part": "TN", "q_no": 6, "points": null, "statement": "Người ta xây một bể nước, chiều dài 15 m, chiều rộng 10 m, một khu có độ sâu 0,8 m, 1 khu có độ sâu 1 m, hai khu có diện tích mặt nước bằng nhau. Hỏi muốn mặt nước cách mặt bể 10 cm thì phải xả vào bao nhiêu m3 nước, biết bể chưa có nước.\nA. 52,5 m3\nB. 67,5 m3\nC. 100 m3\nD. 120 m3", "has_figure": false, "garbled": false, "answer": "D", "solution": "Đổi 10 cm = 0,1 m.\nĐể mặt nước cách mặt bể 10 cm thì phải xả vào số m3 nước là 15 x 5 x 0,7 + 15 x 5 x 0,9 = 120 (m3).\nĐáp số: 120 m3.\nChọn D.", "unit": "c7", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "hình ghép", "đổi đơn vị"], "mock": false, "mc": {"A": "52,5 m3", "B": "67,5 m3", "C": "100 m3", "D": "120 m3"}, "key": "D", "gradable": true}, {"id": "CNN-2019-7", "school": "CNN", "year": "2019", "part": "TL", "q_no": 7, "points": null, "statement": "Có 3 can dầu. Sau khi can một cho can hai 2 lít, can hai cho can ba 3 lít thì số dầu can một bằng 2/9 tổng số dầu và can hai có số dầu bằng 75% số dầu can ba. Hỏi lúc đầu mỗi can có bao nhiêu lít dầu biết sau khi chuyển thì can ba nhiều hơn can một là 8 lít.", "has_figure": false, "garbled": false, "answer": "Can 1: 10 lít; can 2: 13 lít; can 3: 13 lít", "solution": "Sau khi cho nhận thì số dầu can hai = 75% số dầu can ba = 3/4 số dầu can ba.\nVẽ sơ đồ sau khi cho nhận (can 1: 2 phần trong tổng 9 phần, can 2: 3 phần, can 3: 4 phần; can 3 hơn can 1 là 8 lít ứng với 2 phần).\nSố lít dầu của mỗi can sau khi cho nhận là: can 1 có 8 lít, can 2 có 12 lít, can 3 có 16 lít.\nSố lít dầu của can 1 lúc đầu là 8 + 2 = 10 (lít).\nSố lít dầu của can 2 lúc đầu là 12 − 2 + 3 = 13 (lít).\nSố lít dầu của can 3 lúc đầu là 16 − 3 = 13 (lít).\nĐáp số: Can 1: 10 lít; Can 2: 13 lít; Can 3: 13 lít.", "unit": "c3", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "hiệu – tỉ", "sơ đồ đoạn thẳng", "chuyển qua lại"], "mock": false, "mc": null, "key": ["1", "10", "13", "13", "2", "3"], "gradable": true}, {"id": "CNN-2019-8", "school": "CNN", "year": "2019", "part": "TL", "q_no": 8, "points": null, "statement": "Quãng đường AB dài 60 km. Cùng lúc có xe đi từ A và từ B khởi hành. Sau 2 2/9 giờ thì chúng gặp nhau. Nếu vận tốc xe đi từ B tăng thêm 3 km/giờ thì hai xe sẽ gặp nhau ở chính giữa quãng đường AB. Tính vận tốc mỗi xe lúc đầu.", "has_figure": false, "garbled": false, "answer": "Xe đi từ A: 15 km/giờ; xe đi từ B: 12 km/giờ", "solution": "Gọi vận tốc xe đi từ A là v1, vận tốc xe đi từ B là v2. Tổng vận tốc 2 xe là 60 : 2 2/9 = 27 (km/giờ).\nBiết vận tốc xe đi từ B tăng thêm 3 km/giờ thì hai xe sẽ gặp nhau ở chính giữa quãng đường AB, suy ra v1 − v2 = 3. Vận tốc xe đi từ A là (27 + 3) : 2 = 15 (km/giờ).\nVận tốc xe đi từ B là 27 − 15 = 12 (km/giờ).\nĐáp số: 15 km/giờ; 12 km/giờ.", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "tổng vận tốc", "tổng – hiệu", "hỗn số"], "mock": false, "mc": null, "key": ["12", "15"], "gradable": true}, {"id": "CNN-2021-1", "school": "CNN", "year": "2021", "part": "TN", "q_no": 1, "points": null, "statement": "Cho phân số 16/5. Nếu cộng thêm vào tử số và mẫu số của phân số đã cho cùng một số tự nhiên x thì ta được một phân số mới bằng 2. Hỏi x/2 + 1/(x − 1) bằng bao nhiêu?\nA. 16/5\nB. 7/3\nC. 11/4\nD. 11/3", "has_figure": false, "garbled": false, "answer": "A", "solution": "Nếu cộng thêm vào tử số và mẫu số của phân số đã cho cùng một số tự nhiên x thì hiệu giữa tử số và mẫu số của phân số mới không đổi là 16 − 5 = 11. Lại có phân số mới bằng 2 nên tỉ số của tử số mới và mẫu số mới là 2 : 1. Mẫu số mới là 11, suy ra 5 + x = 11, x = 6.\nTa có x/2 + 1/(x − 1) = 6/2 + 1/(6 − 1) = 3 1/5 = 16/5.\nChọn A.", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["hiệu – tỉ", "phân số", "tính giá trị biểu thức"], "mock": false, "mc": {"A": "16/5", "B": "7/3", "C": "11/4", "D": "11/3"}, "key": "A", "gradable": true}, {"id": "CNN-2021-2", "school": "CNN", "year": "2021", "part": "TN", "q_no": 2, "points": null, "statement": "Gỗ tươi chứa 25% nước. Sau khi sấy, lượng nước trong gỗ khô là 4%. Hỏi khối lượng gỗ khô chiếm bao nhiêu phần trăm khối lượng gỗ tươi ban đầu?\nA. 79%\nB. 78,125%\nC. 80%\nD. 76,875%", "has_figure": false, "garbled": false, "answer": "B", "solution": "Giả sử có 100 tấn gỗ tươi.\nLượng nước có trong 100 tấn gỗ tươi là 100 x 25 : 100 = 25 (tấn).\nKhối lượng gỗ có trong 100 tấn gỗ tươi là 100 − 25 = 75 (tấn).\nKhi lượng nước bay hơi thì khối lượng gỗ không thay đổi.\nSau khi sấy, khối lượng gỗ chiếm 100% − 4% = 96% (khối gỗ khô).\nKhối lượng gỗ sau khi sấy 100 tấn gỗ tươi là 75 : 96 x 100 = 78,125 (tấn) (đáp án in nhầm là 71,825).\nVậy tỉ số phần trăm giữa khối lượng gỗ khô và khối lượng gỗ tươi ban đầu là 78,125%.\nChọn B.", "unit": "u4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tìm số khi biết phần trăm", "bài toán sấy khô"], "mock": false, "mc": {"A": "79%", "B": "78,125%", "C": "80%", "D": "76,875%"}, "key": "B", "gradable": true}, {"id": "CNN-2021-3", "school": "CNN", "year": "2021", "part": "TN", "q_no": 3, "points": null, "statement": "Trong kho nhà Minh có một số gạo, 10 ngày đầu nhà Minh dùng hết 1 yến gạo, 10 ngày tiếp theo nhà Minh dùng hết nửa số gạo còn lại, 10 ngày cuối tháng nhà Minh dùng hết số gạo trong kho và phải mua thêm 3 kg gạo nữa. Biết trong 30 ngày đó, nhà Minh dùng hết tất cả 0,35 tạ gạo. Hỏi 10 ngày cuối tháng, nhà Minh dùng hết bao nhiêu ki-lô-gam gạo?\nA. 12 kg\nB. 13 kg\nC. 15 kg\nD. 14 kg", "has_figure": false, "garbled": false, "answer": "D", "solution": "Đổi 1 yến = 10 kg, 0,35 tạ = 35 kg.\nTrong kho nhà Minh ban đầu có số gạo là 35 − 3 = 32 (kg).\nSau mười ngày đầu, số gạo còn lại là 32 − 10 = 22 (kg).\nMười ngày tiếp theo, nhà Minh dùng số gạo là 22 : 2 = 11 (kg).\nMười ngày cuối tháng, nhà Minh dùng số gạo là 35 − 10 − 11 = 14 (kg).\nĐáp số: 14 kg.\nChọn D.", "unit": "c3", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["đổi đơn vị khối lượng", "tính ngược", "số thập phân"], "mock": false, "mc": {"A": "12 kg", "B": "13 kg", "C": "15 kg", "D": "14 kg"}, "key": "D", "gradable": true}, {"id": "CNN-2021-4", "school": "CNN", "year": "2021", "part": "TN", "q_no": 4, "points": null, "statement": "Một hình hộp chữ nhật có chiều dài gấp hai lần chiều rộng. Nếu tăng chiều dài lên 5 dm và giữ nguyên chiều rộng, chiều cao thì thể tích hình hộp chữ nhật tăng lên 1,2 lần. Hỏi nếu tăng chiều rộng lên 5 dm, giảm chiều dài đi 5 dm và tăng chiều cao lên gấp đôi thì thể tích hình hộp chữ nhật tăng lên bao nhiêu lần?\nA. 1,12 lần\nB. 2,24 lần\nC. 1,44 lần\nD. 2,28 lần", "has_figure": false, "garbled": false, "answer": "B", "solution": "V ban đầu = chiều dài x chiều rộng x chiều cao.\nNếu tăng chiều dài lên 5 dm và giữ nguyên chiều rộng, chiều cao thì V1 = (chiều dài + 5) x chiều rộng x chiều cao = (chiều rộng x 2 + 5) x chiều rộng x chiều cao.\nTheo đề bài V1 = 1,2 x V ban đầu, suy ra chiều rộng x 2 + 5 = 1,2 x chiều rộng x 2 = 2,4 x chiều rộng; 5 = 0,4 x chiều rộng; chiều rộng = 5 : 0,4 = 12,5 (dm).\nChiều dài là 12,5 x 2 = 25 (dm).\nKhi đó V ban đầu = 25 x 12,5 x chiều cao = 312,5 x chiều cao.\nV2 = (25 − 5) x (12,5 + 5) x chiều cao x 2 = 700 x chiều cao.\nVậy thể tích tăng lên số lần là 700 : 312,5 = 2,24 (lần).\nĐáp số: 2,24 lần.\nChọn B.", "unit": "c7", "unit_alt": "c1", "difficulty": 3, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "tỉ số", "số thập phân", "biến đổi kích thước"], "mock": false, "mc": {"A": "1,12 lần", "B": "2,24 lần", "C": "1,44 lần", "D": "2,28 lần"}, "key": "B", "gradable": true}, {"id": "CNN-2021-5", "school": "CNN", "year": "2021", "part": "TN", "q_no": 5, "points": null, "statement": "Cho hình thang ABCD có đáy CD gấp đôi đáy AB, hai đường chéo AC và BD cắt nhau tại điểm O. Điểm M nằm trên cạnh CD sao cho CM = 1/3 CD. Gọi N là giao điểm của AC và BM. Biết diện tích hình thang ABCD là 45 cm2, diện tích tam giác DON bằng bao nhiêu?\nA. 15 cm2\nB. 10 cm2\nC. 8 cm2\nD. 7 cm2", "has_figure": false, "garbled": false, "answer": "C", "solution": "S(ABD)/S(BDC) = 1/2 (chiều cao bằng nhau, đáy AB = 1/2 đáy CD).\nMà S(ABD) + S(BDC) = S(ABCD) = 45 cm2 nên S(ABD) = 45 : (1 + 2) = 15 cm2, S(BDC) = 45 − 15 = 30 cm2. Hai tam giác chung đáy BD nên chiều cao AH/CG = 1/2, hay CG = AH x 2. S(ABD) = S(ABC) (chiều cao bằng nhau, chung đáy AB) suy ra S(AOD) = S(BOC), tức AH x OD = CG x OB = AH x 2 x OB, nên OD = 2 x OB hay OB = 1/2 OD.\nS(BOC)/S(DOC) = 1/2 (chung chiều cao, đáy OB = 1/2 đáy OD).\nMà S(BOC) + S(DOC) = S(BDC) = 30 cm2 nên S(DOC) = 30 : (1 + 2) x 2 = 20 cm2. S(DBM)/S(BDC) = 2/3 (chung chiều cao, đáy DM = 2/3 đáy CD) nên S(DBM) = 2/3 x 30 = 20 cm2 = S(DOC).\nMà S(DOC) = S(DOMN) + S(MNC); S(DBM) = S(DOMN) + S(BON) nên S(MNC) = S(BON).\nLại có S(MNC)/S(DMN) = 1/2 (chung chiều cao, đáy CM = 1/2 đáy DM) và S(BON)/S(DON) = 1/2 (chung chiều cao, đáy OB = 1/2 đáy OD), suy ra S(DMN) = S(DON) = S(MNC) x 2. Mà S(DOC) = S(DMN) + S(DON) + S(MNC) = S(MNC) x 5 = 20 cm2, suy ra S(MNC) = 20 : 5 = 4 cm2.\nVậy S(DON) = 4 x 2 = 8 cm2.\nĐáp số: 8 cm2.\nChọn C.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình thang", "tỉ số diện tích tam giác", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": {"A": "15 cm2", "B": "10 cm2", "C": "8 cm2", "D": "7 cm2"}, "key": "C", "gradable": true}, {"id": "CNN-2021-6", "school": "CNN", "year": "2021", "part": "TN", "q_no": 6, "points": null, "statement": "Hai lớp A và B mỗi lớp được phân công quét một nửa sân trường. Hai lớp bắt đầu quét cùng một lúc. Sau 20 phút lớp A quét xong nửa sân trường được phân cho lớp mình và tiếp tục sang quét cùng lớp B thêm 4 phút nữa thì hai lớp quét xong cả sân trường. Hỏi nếu lớp A không sang hỗ trợ thì lớp B sẽ quét hết nửa sân trường trong bao lâu?\nA. 30 phút\nB. 25 phút\nC. 35 phút\nD. 40 phút", "has_figure": false, "garbled": false, "answer": "A", "solution": "Trong 4 phút, lớp A quét được 4 : 20 = 1/5 (nửa sân trường).\nLớp B quét được 1 − 1/5 = 4/5 (nửa sân trường).\nThời gian lớp B quét được 4/5 nửa sân trường là 20 phút + 4 phút = 24 phút.\nVậy nếu lớp A không sang hỗ trợ thì lớp B sẽ quét hết nửa sân trường trong 24 : 4/5 = 30 (phút).\nĐáp số: 30 phút.\nChọn A.", "unit": "c5", "unit_alt": "u3", "difficulty": 3, "vn_grade": 4, "skills": ["công việc chung", "năng suất", "phân số"], "mock": false, "mc": {"A": "30 phút", "B": "25 phút", "C": "35 phút", "D": "40 phút"}, "key": "A", "gradable": true}, {"id": "CNN-2023-1", "school": "CNN", "year": "2023", "part": "TN", "q_no": 1, "points": null, "statement": "a12b chia hết cho 18 và chia 5 dư 1. Tính giá trị của a × 3 + b × 4.", "has_figure": false, "garbled": false, "answer": "51", "solution": "Điều kiện: a khác 0. Vì a12b chia hết cho 18 nên a12b chia hết cho cả 2 và 9. Để a12b chia hết cho 2 thì b = 0; 2; 4; 6 hoặc 8; a12b chia 5 dư 1 thì b = 1 hoặc b = 6.\nSuy ra b = 6, được số a126. Để a126 chia hết cho 9 thì (a + 1 + 2 + 6) chia hết cho 9, hay a + 9 chia hết cho 9, suy ra a = 9.\nTa có a × 3 + b × 4 = 9 × 3 + 6 × 4 = 51.\nĐáp số: 51.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "số dư", "cấu tạo số"], "mock": false, "mc": null, "key": ["51"], "gradable": true}, {"id": "CNN-2023-2", "school": "CNN", "year": "2023", "part": "TN", "q_no": 2, "points": null, "statement": "Xếp 128 hình lập phương nhỏ thành một hình hộp chữ nhật có chiều dài bằng 2 lần chiều rộng và cũng bằng 2 lần chiều cao (CD = 2 x CR = 2 x CC). Sơn tất cả các mặt ngoài của hình đó. Hỏi có bao nhiêu hình được sơn 2 mặt.", "has_figure": false, "garbled": false, "answer": "40 hình lập phương", "solution": "Ta có 128 = 4 x 4 x 8 nên chiều dài của hình hộp chữ nhật là 8, chiều rộng là 4 và chiều cao là 4. Các hình lập phương được sơn 2 mặt là các hình lập phương nằm trên các cạnh của hình hộp chữ nhật (không tính các hình lập phương ở đỉnh).\nSố hình lập phương được sơn 2 mặt là (8 − 2) x 4 + (4 − 2) x 4 + (4 − 2) x 4 = 40 (hình lập phương).\nĐáp số: 40 hình lập phương.", "unit": "c7", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["hình lập phương", "sơn mặt", "đếm hình", "phân tích thừa số"], "mock": false, "mc": null, "key": ["40"], "gradable": true}, {"id": "CNN-2023-3", "school": "CNN", "year": "2023", "part": "TN", "q_no": 3, "points": null, "statement": "Dung dịch nước muối có chứa 8% muối. Hỏi cần cho thêm vào dung dịch 25 kg bao nhiêu kg nước để dung dịch chứa 5% muối.", "has_figure": false, "garbled": false, "answer": "15 kg nước", "solution": "Khối lượng muối nguyên chất có trong 25 kg dung dịch 8% là 25 x 8 : 100 = 2 (kg).\nKhối lượng của dung dịch khi chứa 5% muối là 2 x 100 : 5 = 40 (kg).\nSố kg nước cần thêm để dung dịch chứa 5% muối là 40 − 25 = 15 (kg).\nĐáp số: 15 kg nước.", "unit": "u4", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "bài toán dung dịch", "tìm số khi biết phần trăm"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "CNN-2023-4", "school": "CNN", "year": "2023", "part": "TN", "q_no": 4, "points": null, "statement": "Tỷ số số kẹo của A và B là 2/5. Nếu B cho đi 6 cái kẹo thì số kẹo của B gấp đôi số kẹo của A. Hỏi nếu B nhận thêm 2 cái kẹo thì tỉ số số kẹo của A và B là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "3/8", "solution": "Vẽ sơ đồ sau khi B cho đi 6 cái kẹo: A là 2 phần, B là 5 phần bớt 6 cái bằng 4 phần, nên 6 cái ứng với 1 phần.\nTừ sơ đồ, số kẹo của A là 6 x 2 = 12 (cái kẹo).\nSố cái kẹo của B sau khi nhận thêm 2 cái kẹo là 6 x 5 + 2 = 32 (cái kẹo).\nSau khi B nhận thêm 2 cái kẹo thì tỉ số số kẹo của A và B là 12 : 32 = 3/8.", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["bài toán hai tỉ số", "sơ đồ đoạn thẳng", "tỉ số"], "mock": false, "mc": null, "key": ["3/8"], "gradable": true}, {"id": "CNN-2023-5", "school": "CNN", "year": "2023", "part": "TN", "q_no": 5, "points": null, "statement": "Cho hình vuông ABCD có cạnh bằng 6 cm. Hai hình vuông nhỏ có cạnh bằng 3 cm. Tính diện tích phần tô đậm. (Hình vẽ bị thiếu.)", "has_figure": true, "garbled": false, "answer": "36 cm2", "solution": "Ta vẽ thêm hình để tạo thành một hình vuông mới.\nĐộ dài cạnh của hình vuông lớn là 6 + 3 = 9 (cm).\nDiện tích hình vuông lớn là 9 x 9 = 81 (cm2).\nDiện tích của hình tam giác FHE là (3 + 3) x (3 + 3) : 2 = 18 (cm2).\nDiện tích của hình tam giác HIC hay diện tích tam giác EKC là 9 x 3 : 2 = 13,5 (cm2).\nDiện tích của hình tam giác được tô đậm là 81 − 18 − 13,5 − 13,5 = 36 (cm2).\nĐáp số: 36 cm2.", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 4, "skills": ["diện tích hình vuông", "diện tích tam giác", "cắt ghép hình", "hình ghép"], "mock": false, "mc": null, "key": ["2", "36"], "gradable": true}, {"id": "CNN-2023-TL1", "school": "CNN", "year": "2023", "part": "TL", "q_no": 1, "points": null, "statement": "Quãng đường AB dài 240 km. Một xe tải đi từ A đến B, một xe khách đi từ B đến A. Nếu xuất phát cùng lúc và vận tốc của 2 xe không thay đổi thì 2 xe sẽ gặp nhau tại điểm C cách A 96 km. Nếu xe khách xuất phát trước xe tải 1 giờ 40 phút thì 2 xe sẽ gặp nhau tại điểm D cách A 72 km. Tính vận tốc của 2 xe?", "has_figure": false, "garbled": false, "answer": "Xe khách: 36 km/giờ; xe tải: 24 km/giờ", "solution": "Khi 2 xe xuất phát cùng lúc: đến khi gặp nhau xe khách đã đi được quãng đường là 240 − 96 = 144 (km).\nTỉ số giữa quãng đường xe tải đi được và xe khách đi được là 96 : 144 = 2/3. Vì trong cùng một thời gian nên vận tốc và quãng đường tỉ lệ thuận với nhau, tỉ số giữa vận tốc của xe tải và xe khách là 2/3. Khi xe khách xuất phát trước xe tải 1 giờ 40 phút: gọi BE là quãng đường xe khách đã đi được trong 1 giờ 40 phút.\nTừ lúc xe tải xuất phát thì xe khách đã đến điểm E và thời gian đi đến điểm gặp nhau của hai xe bằng nhau, nên kể từ khi xe tải xuất phát, tỉ số giữa quãng đường đi được của xe tải và xe khách là 2/3. Từ điểm E, quãng đường xe khách đi được đến khi gặp nhau là 72 : 2/3 = 108 (km).\nQuãng đường xe khách đi được trong 1 giờ 40 phút là 240 − 72 − 108 = 60 (km).\nĐổi 1 giờ 40 phút = 5/3 giờ.\nVận tốc của xe khách là 60 : 5/3 = 36 (km/giờ).\nVận tốc của xe tải là 36 × 2/3 = 24 (km/giờ).\nĐáp số: Xe khách: 36 km/giờ; xe tải: 24 km/giờ.", "unit": "c4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "tỉ lệ thuận vận tốc – quãng đường", "tỉ số"], "mock": false, "mc": null, "key": ["24", "36"], "gradable": true}, {"id": "CNN-2024-1", "school": "CNN", "year": "2024", "part": "TN", "q_no": 1, "points": null, "statement": "Tổng số tuổi của hai chị em 5 năm trước là 25. Hiện nay tuổi em bằng 2/3 tuổi chị. Hỏi năm sau em bao nhiêu tuổi?", "has_figure": false, "garbled": false, "answer": "15 tuổi", "solution": "Tổng số tuổi hiện nay của hai chị em là 25 + 5 + 5 = 35 (tuổi).\nGiá trị một phần là 35 : (2 + 3) = 7 (tuổi).\nHiện nay tuổi em là 7 x 2 = 14 (tuổi).\nNăm sau, tuổi em là 14 + 1 = 15 (tuổi).\nĐáp số: 15 tuổi.", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["bài toán tuổi", "tổng – tỉ"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "CNN-2024-2", "school": "CNN", "year": "2024", "part": "TN", "q_no": 2, "points": null, "statement": "Một đội công nhân có 42 người làm một công việc trong 85 ngày thì xong. Sau 13 ngày thì đội có thêm 12 người nữa. Hỏi đội công nhân chỉ cần thêm bao nhiêu ngày để hoàn thành công việc?", "has_figure": false, "garbled": false, "answer": "56 ngày", "solution": "Sau 13 ngày thì 42 người sẽ hoàn thành công việc còn lại sau số ngày là 85 − 13 = 72 (ngày).\nCoi 1 ngày 1 người làm được 1 phần công việc thì số phần công việc còn lại là 42 x 72 = 3 024 (phần công việc).\nSau khi có thêm 12 người, đội công nhân có số người là 42 + 12 = 54 (người).\nĐội công nhân cần thêm số ngày để hoàn thành công việc là 3 024 : 54 = 56 (ngày).\nĐáp số: 56 ngày.", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "năng suất", "công việc chung"], "mock": false, "mc": null, "key": ["56"], "gradable": true}, {"id": "CNN-2024-3", "school": "CNN", "year": "2024", "part": "TN", "q_no": 3, "points": null, "statement": "Nếu có 11 gam khí CO2 thì điều chế được 8 gam khí O2. Nếu có 35,2 gam CO2 thì điều chế được bao nhiêu gam khí O2?", "has_figure": false, "garbled": false, "answer": "25,6 gam", "solution": "35,2 gam khí CO2 gấp 11 gam khí CO2 số lần là 35,2 : 11 = 3,2 (lần).\n35,2 gam khí CO2 điều chế được số gam khí O2 là 8 x 3,2 = 25,6 (gam).\nĐáp số: 25,6 gam.", "unit": "c5", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ lệ thuận", "số thập phân"], "mock": false, "mc": null, "key": ["25.6"], "gradable": true}, {"id": "CNN-2024-4", "school": "CNN", "year": "2024", "part": "TN", "q_no": 4, "points": null, "statement": "A là số có 2024 chữ số 9. B là số bé nhất thỏa mãn để tổng A + B chia hết cho 45. Tính tích các chữ số của B.", "has_figure": false, "garbled": false, "answer": "18", "solution": "Để (A + B) chia hết cho 45 thì (A + B) chia hết cho 5 và 9. A = 999...99 (2024 chữ số 9) chia hết cho 9 nên B phải là số chia hết cho 9: B có thể là 0, 9, 18, 27, 36, ...\nVì A có chữ số tận cùng là 9 nên chia 5 dư 4, suy ra B chia 5 phải dư 1 thì (A + B) mới chia hết cho 5: B có thể là 1, 6, 11, 16, 21, 26, 31, 36, ...\nĐể B bé nhất chia hết cho 9 và chia 5 dư 1 thì B = 36. Tích các chữ số của B là 3 x 6 = 18.\nĐáp số: 18.", "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "số dư", "chia hết cho 45"], "mock": false, "mc": null, "key": ["18"], "gradable": true}, {"id": "CNN-2024-5", "school": "CNN", "year": "2024", "part": "TN", "q_no": 5, "points": null, "statement": "Cho hình bên dưới được tạo bởi 2 hình hộp chữ nhật có chiều dài là 4 cm, chiều rộng là 4 cm và chiều cao là 2 cm. Tính diện tích toàn phần của hình đó. (Hình vẽ bị thiếu; theo lời giải, hai hình hộp xếp chồng lên nhau với mặt tiếp xúc 4 cm × 2 cm.)", "has_figure": true, "garbled": false, "answer": "112 cm2", "solution": "Diện tích toàn phần của một hình hộp chữ nhật là (4 + 4) x 2 x 2 + 4 x 4 x 2 = 64 (cm2).\nDiện tích toàn phần của 2 hình hộp chữ nhật là 64 x 2 = 128 (cm2).\nVì hình cần tính được tạo bởi 2 hình hộp chữ nhật xếp chồng lên nhau nên diện tích toàn phần hình đó bằng hiệu diện tích toàn phần của 2 hình hộp chữ nhật với 2 lần diện tích mặt tiếp xúc của 2 hình hộp chữ nhật có kích thước 4 cm x 2 cm.\nDiện tích toàn phần của hình đó là 128 − (2 x 4) x 2 = 112 (cm2).\nĐáp số: 112 cm2.", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích toàn phần hình hộp chữ nhật", "hình ghép"], "mock": false, "mc": null, "key": ["112", "2"], "gradable": true}, {"id": "CNN-2024-TL1", "school": "CNN", "year": "2024", "part": "TL", "q_no": 1, "points": null, "statement": "Cho tam giác ABC. Lấy điểm N trên AC sao cho NA = NC x 2 và E trên BC sao cho EC = EB x 3. Nối AE và BN cắt nhau tại I. Biết S(EIB) = 11 cm2. Hỏi:\na) S(ABI)/S(BIC) = ?\nb) Tính S(ABE) biết S(EIB) = 11 cm2.", "has_figure": false, "garbled": false, "answer": "a) S(ABI)/S(BIC) = 2/1 = 2; b) S(ABE) = 99 cm2", "solution": "a)\nTừ A kẻ AH vuông góc với BN và từ C kẻ CK vuông góc với BN.\nTa có S(ABN)/S(CBN) = AN/NC = 2/1 (chung chiều cao từ đỉnh B).\nMà hai tam giác còn chung đáy BN nên chiều cao AH = 2/1 chiều cao CK.\nTa có S(ABI)/S(BIC) = 2/1 vì chung đáy BI, chiều cao AH = 2/1 chiều cao CK.\nb)\nTa có S(BIE)/S(BIC) = BE/BC = 1/4 (chung chiều cao từ I).\nSuy ra S(BIC) = 11 x 4 = 44 (cm2).\nMà S(ABI)/S(BIC) = 2/1 nên S(ABI) = 44 x 2 = 88 (cm2).\nTa có S(BIE) + S(ABI) = S(ABE) nên S(ABE) = 88 + 11 = 99 (cm2).\nĐáp số:\na)\nS(ABI)/S(BIC) = 2/1;\nb)\nS(ABE) = 99 cm2.", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung đáy", "chung chiều cao", "hình học nâng cao"], "mock": false, "mc": null, "key": ["2", "2", "2/1", "99"], "gradable": true}, {"id": "CNN-2024-TL2", "school": "CNN", "year": "2024", "part": "TL", "q_no": 2, "points": null, "statement": "Chú Hải đi Hà Nội từ lúc 8 giờ với vận tốc 35 km/h. Đi một lúc thì bị hỏng xe, dừng lại sửa mất 36 phút. Đi tiếp với vận tốc 50 km/h thì đến nơi đúng với giờ dự định. Biết quãng đường là 105 km.\na) Chú Hải đến nơi lúc mấy giờ?\nb) Chú Hải đi với vận tốc 50 km/giờ trong bao lâu?\nc) Lúc 10 giờ, chú Hải đi được bao nhiêu ki-lô-mét?", "has_figure": false, "garbled": false, "answer": "a) 11 giờ; b) 1 giờ 24 phút; c) 55 km", "solution": "a)\nVì chú Hải đến nơi đúng với giờ dự định nên thời gian chú Hải đi hết quãng đường là 105 : 35 = 3 (giờ).\nThời điểm chú Hải đến Hà Nội là 8 giờ + 3 giờ = 11 (giờ).\nb)\nGọi C là điểm mà xe dừng lại nghỉ.\nKhi đó quãng đường đi còn lại của xe không đổi nên vận tốc tỉ lệ nghịch với thời gian.\nTỉ số vận tốc đi trên AC và đi trên BC là 35 : 50 = 7/10. Tỉ số thời gian đi của xe đi trên AC và đi trên BC là 10/7. Hiệu thời gian mà xe đi được trên hai quãng đường là 36 phút = 3/5 giờ.\nThời gian của xe đi với vận tốc 50 km/giờ là 3/5 : (10 − 7) x 7 = 1,4 (giờ) = 1 giờ 24 phút.\nc)\nThời gian xe đi trên quãng đường AC là 3 giờ − 36 phút − 1 giờ 24 phút = 1 (giờ).\nThời gian xe đi với vận tốc 50 km/giờ từ C đến lúc 10 giờ là 10 giờ − 8 giờ − 1 giờ − 36 phút = 24 phút = 0,4 (giờ).\nLúc 10 giờ chú Hải đi được số ki-lô-mét là 35 x 1 + 50 x 0,4 = 55 (km).\nĐáp số:\na) 11 giờ;\nb) 1 giờ 24 phút;\nc) 55 km.", "unit": "c4", "unit_alt": "c5", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đều", "tỉ lệ nghịc
