 1 dm và chu vi là 42 dm.", "unit": "c6", "unit_alt": "u6", "difficulty": 2, "vn_grade": 4, "skills": ["xếp hình", "ước số", "chu vi hình chữ nhật", "suy luận"], "mock": false, "mc": null, "key": ["1", "20", "42"], "gradable": true}, {"id": "NTT-2021-10", "school": "NTT", "year": "2021", "part": "TL", "q_no": 10, "points": null, "statement": "Có một người mua 1000 quả trứng với giá 27 000 đồng một chục quả. Trong khi vận chuyển, có một số quả trứng bị vỡ. Người đó bán số trứng còn lại với giá 3000 đồng một quả và lãi 10% so với giá vốn. Tính số tiền vốn và số quả trứng bị vỡ.", "has_figure": false, "garbled": false, "answer": "Tiền vốn: 2 700 000 đồng; số quả bị vỡ: 10 quả", "solution": "Giá tiền người đó mua 1 quả trứng là 27 000 : 10 = 2700 (đồng)\nSố tiền vốn là 2700 x 1000 = 2 700 000 (đồng)\nSố tiền lãi là 2 700 000 x 10 : 100 = 270 000 (đồng)\nSố tiền thu được sau khi người đó bán số trứng còn lại là 2 700 000 + 270 000 = 2 970 000 (đồng)\nSố trứng còn lại là 2 970 000 : 3 000 = 990 (quả)\nSố trứng bị vỡ là 1 000 – 990 = 10 (quả)\nĐáp số: Số tiền vốn: 2 700 000 đồng; Số quả bị vỡ: 10 quả", "unit": "c5", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["bài toán mua bán", "tỉ số phần trăm", "lãi so với vốn"], "mock": false, "mc": null, "key": ["0", "10", "2", "700"], "gradable": true}, {"id": "NTT-2021-11", "school": "NTT", "year": "2021", "part": "TL", "q_no": 11, "points": null, "statement": "Có một xe ô tô đi từ A đến B dài 120km. Ô tô đi với vận tốc 50km/giờ và xuất phát lúc 7 giờ. Hỏi:\na) Nếu đi theo dự định thì ô tô đến B khi nào?\nb) Thực tế khi đi đến C, xe đã gặp trục trặc nên phải dừng lại và sửa chữa 5 phút. Sau khi sửa xong thì ô tô đi với vận tốc 60km/giờ và đến B sớm hơn dự kiến 5 phút. Tính quãng đường AC.", "has_figure": false, "garbled": false, "answer": "a) 9 giờ 24 phút; b) 70 km", "solution": "a)\nThời gian ô tô đi từ A đến B theo dự định là: 120 : 50 = 2,4 (giờ).\nĐổi 2,4 giờ = 2 giờ 24 phút.\nNếu đi theo dự định thì ô tô đến B lúc: 7 giờ + 2 giờ 24 phút = 9 giờ 24 phút\nb)\nVì ô tô phải sửa chữa hết 5 phút và đến B sớm hơn dự định 5 phút nên thời gian thực tế đi đoạn CB ít hơn thời gian dự định là 5 phút + 5 phút = 10 phút.\nTrên quãng đường CB thì vận tốc và thời gian là hai đại lượng tỉ lệ nghịch.\nGọi v1, t1 là vận tốc và thời gian theo dự định đi trên quãng đường CB; v2, t2 là vận tốc và thời gian thực tế đi trên quãng đường CB.\nKhi đó v1/v2 = t2/t1 = 50/60 = 5/6\nThời gian thực tế đi trên quãng đường CB là 10 : (6 – 5) x 5 = 50 (phút) = 5/6 giờ\nQuãng đường CB dài là: 60 x 5/6 = 50 (km)\nQuãng đường AC dài là: 120 – 50 = 70 (km)\nĐáp số:\na) 9 giờ 24 phút;\nb) 70 km", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đều", "tỉ lệ nghịch vận tốc – thời gian", "hiệu – tỉ", "đổi giờ – phút"], "mock": false, "mc": null, "key": ["24", "70", "9"], "gradable": true}, {"id": "NTT-2022-1", "school": "NTT", "year": "2022", "part": "TN", "q_no": 1, "points": null, "statement": "Kết quả phép tính 27% x 45,6 + 23% x 45,6 bằng:\nA. 23,8\nB. 22,8\nC. 24,8\nD. 21,8", "has_figure": false, "garbled": false, "answer": "B", "solution": "27% x 45,6 + 23% x 45,6 = (27% + 23%) x 45,6 = 50% x 45,6 = 0,5 x 45,6 = 22,8\nChọn B", "unit": "c1", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "tỉ số phần trăm", "nhân một số với một tổng"], "mock": false, "mc": {"A": "23,8", "B": "22,8", "C": "24,8", "D": "21,8"}, "key": "B", "gradable": true}, {"id": "NTT-2022-2", "school": "NTT", "year": "2022", "part": "TN", "q_no": 2, "points": null, "statement": "Bạn Hà lấy 2/5 số khẩu trang trong hộp của mình tặng cho bạn An thì trong hộp còn lại 12 chiếc khẩu trang. Số khẩu trang trong hộp của bạn Hà lúc đầu là:\nA. 30\nB. 35\nC. 40\nD. 20", "has_figure": false, "garbled": false, "answer": "D", "solution": "Số khẩu trang còn lại chiếm số phần là 1 – 2/5 = 3/5 (số khẩu trang ban đầu)\nSố khẩu trang ban đầu của Hà là 12 : 3/5 = 20 (chiếc)\nĐáp số: 20 chiếc khẩu trang.\nChọn D", "unit": "u3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tìm số khi biết phân số", "phân số của một số"], "mock": false, "mc": {"A": "30", "B": "35", "C": "40", "D": "20"}, "key": "D", "gradable": true}, {"id": "NTT-2022-3", "school": "NTT", "year": "2022", "part": "TN", "q_no": 3, "points": null, "statement": "Bạn Hòa đi học bằng xe đạp với vận tốc v = 12 km/giờ, bạn Hòa đi từ nhà lúc 6 giờ 35 phút sáng và đến trường lúc 7 giờ sáng cùng ngày. Quãng đường từ nhà bạn Hòa đến trường bằng:\nA. 5 km\nB. 4 km\nC. 3 km\nD. 6 km", "has_figure": false, "garbled": false, "answer": "A", "solution": "Thời gian Hòa đi từ nhà đến trường là 7 giờ – 6 giờ 35 phút = 25 phút.\nĐổi 25 phút = 5/12 giờ.\nQuãng đường từ nhà bạn Hòa đến trường là 12 x 5/12 = 5 (km)\nĐáp số: 5 km.\nChọn A", "unit": "c4", "unit_alt": "u5", "difficulty": 1, "vn_grade": 5, "skills": ["quãng đường = vận tốc x thời gian", "đổi phút ra giờ"], "mock": false, "mc": {"A": "5 km", "B": "4 km", "C": "3 km", "D": "6 km"}, "key": "A", "gradable": true}, {"id": "NTT-2022-4", "school": "NTT", "year": "2022", "part": "TN", "q_no": 4, "points": null, "statement": "Một hình hộp chữ nhật có thể tích bằng 336 cm3 và diện tích mặt đáy bằng 48 cm2. Chiều cao của hình hộp chữ nhật bằng:\nA. 5 cm\nB. 6 cm\nC. 7 cm\nD. 8 cm", "has_figure": false, "garbled": false, "answer": "C", "solution": "Chiều cao của hình hộp chữ nhật là 336 : 48 = 7 (cm)\nChọn C", "unit": "c7", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "tìm chiều cao"], "mock": false, "mc": {"A": "5 cm", "B": "6 cm", "C": "7 cm", "D": "8 cm"}, "key": "C", "gradable": true}, {"id": "NTT-2022-5", "school": "NTT", "year": "2022", "part": "DT", "q_no": 5, "points": null, "statement": "Biết tổng của ba số tự nhiên liên tiếp bằng 2022. Tìm số lớn nhất trong ba số đó.", "has_figure": false, "garbled": false, "answer": "675", "solution": "Gọi ba số tự nhiên liên tiếp là a – 1, a, a + 1. Tổng của ba số là a – 1 + a + a + 1 = 2022.\nSuy ra 3 x a = 2022, a = 2022 : 3 = 674.\nSố lớn nhất trong ba số là a + 1 = 674 + 1 = 675\nĐáp số: 675", "unit": "u15", "unit_alt": "c3", "difficulty": 1, "vn_grade": 4, "skills": ["số tự nhiên liên tiếp", "trung bình cộng", "tổng – hiệu"], "mock": false, "mc": null, "key": ["675"], "gradable": true}, {"id": "NTT-2022-6", "school": "NTT", "year": "2022", "part": "DT", "q_no": 6, "points": null, "statement": "Kết thúc SEA Games 31, tổng số huy chương vàng và huy chương bạc của Đoàn thể thao Việt Nam là 330 huy chương. Biết rằng, số huy chương bạc bằng 25/41 số huy chương vàng. Tính số huy chương vàng của Đoàn thể thao Việt Nam.", "has_figure": false, "garbled": false, "answer": "205 huy chương vàng", "solution": "Coi số huy chương bạc là 25 phần, số huy chương vàng là 41 phần.\nTổng số phần bằng nhau là 25 + 41 = 66 (phần)\nSố huy chương vàng là 330 : 66 x 41 = 205 (huy chương)\nĐáp số: 205 huy chương vàng", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tổng – tỉ", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["205"], "gradable": true}, {"id": "NTT-2022-7", "school": "NTT", "year": "2022", "part": "DT", "q_no": 7, "points": null, "statement": "Cửa hàng bán một chiếc quạt điện giá 1 800 000 đồng được lãi 20% so với tiền vốn. Hỏi tiền vốn chiếc quạt điện đó là bao nhiêu đồng?", "has_figure": false, "garbled": false, "answer": "1 500 000 đồng", "solution": "Coi tiền vốn của cái quạt là 100%.\nGiá bán chiếc quạt chiếm 100% + 20% = 120% (tiền vốn)\nTiền vốn của chiếc quạt đó là 1 800 000 : 120 x 100 = 1 500 000 (đồng)\nĐáp số: 1 500 000 đồng", "unit": "u4", "unit_alt": "c5", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tìm số khi biết phần trăm", "lãi so với vốn"], "mock": false, "mc": null, "key": ["0", "1", "500"], "gradable": true}, {"id": "NTT-2022-8", "school": "NTT", "year": "2022", "part": "DT", "q_no": 8, "points": null, "statement": "Cho hai hình vuông ABCD và AEFG như hình vẽ bên, biết cạnh của hình vuông ABCD là 12 cm. Tính diện tích tam giác BDF.", "has_figure": true, "garbled": false, "answer": "72 cm2", "solution": "S(BDF) = S(BDFG) – S(BFG) = (S(ABD) + S(ADFG)) – S(BFG) = S(ABD) + (FG + AD) x AG/2 – 1/2 x GF x BG\nMà FG = GA, AD = AB nên FG + AD = BG.\nSuy ra (FG + AD) x AG/2 = 1/2 x GF x BG.\nVậy S(BDF) = S(ABD) = 1/2 x 12 x 12 = 72 (cm2)\nĐáp số: 72 cm2", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 4, "skills": ["diện tích tam giác", "hình ghép", "diện tích hình thang", "cộng trừ diện tích"], "mock": false, "mc": null, "key": ["2", "72"], "gradable": true}, {"id": "NTT-2022-9", "school": "NTT", "year": "2022", "part": "TL", "q_no": 9, "points": null, "statement": "Một cửa hàng có hai thùng chứa dầu, lúc đầu số lít dầu trong thùng thứ hai bằng 3/7 số lít dầu trong thùng thứ nhất. Sau đó, người ta chuyển 8 lít dầu từ thùng thứ nhất sang thùng thứ hai thì số lít dầu trong hai thùng bằng nhau.\na) Tìm tỉ số của số lít dầu trong thùng thứ nhất lúc ban đầu so với tổng số lít dầu trong cả hai thùng.\nb) Tính tổng số lít dầu trong cả hai thùng.", "has_figure": false, "garbled": false, "answer": "a) 7/10; b) 40 lít", "solution": "a)\nCoi số lít dầu thùng thứ hai là 3 phần thì số lít dầu thùng thứ nhất là 7 phần.\nSuy ra, số lít dầu ở cả hai thùng là: 3 + 7 = 10 (phần)\nTỉ số số lít dầu thùng thứ nhất với số lít dầu cả hai thùng là 7 : 10 = 7/10\nb)\nVì khi chuyển 8 lít dầu từ thùng thứ nhất sang thùng thứ hai thì cả hai thùng có số lít dầu bằng nhau nên thùng thứ nhất hơn thùng thứ hai số lít dầu là: 8 + 8 = 16 (lít dầu)\n1 phần ứng với: 16 : (7 – 3) = 4 (lít dầu)\nThùng thứ nhất có số lít dầu là: 4 x 7 = 28 (lít dầu)\nCả hai thùng có số lít dầu là 28 : 7/10 = 40 (lít dầu)\nĐáp số:\na) 7/10;\nb) 40 lít", "unit": "c3", "unit_alt": "u4", "difficulty": 2, "vn_grade": 4, "skills": ["hiệu – tỉ", "tỉ số", "chuyển qua lại"], "mock": false, "mc": null, "key": ["40", "7/10"], "gradable": true}, {"id": "NTT-2022-10", "school": "NTT", "year": "2022", "part": "TL", "q_no": 10, "points": null, "statement": "Lúc 8 giờ sáng, một nhóm du khách đi thuyền xuôi dòng từ bến A đến bến B trên sông Hương để ngắm cảnh. Khi đến bến B thuyền lập tức quay lại bến A và về đến bến A lúc 9 giờ sáng cùng ngày. Biết vận tốc của thuyền khi đi xuôi dòng là 9 km/giờ và bằng 3/2 vận tốc của thuyền khi đi ngược dòng.\na) Tính vận tốc của thuyền khi đi ngược dòng.\nb) Tính quãng đường từ bến A đến bến B.", "has_figure": false, "garbled": false, "answer": "a) 6 km/giờ; b) 3,6 km", "solution": "a)\nVận tốc ngược dòng là 9 : 3/2 = 6 (km/giờ)\nb)\nTổng thời gian ca nô đi từ A đến B sau đó từ B về A là: 9 giờ – 8 giờ = 1 giờ.\nTrên cùng quãng đường AB, thời gian và vận tốc tỉ lệ nghịch với nhau.\nNên vận tốc xuôi dòng bằng 3/2 vận tốc ngược dòng thì thời gian xuôi dòng bằng 2/3 thời gian ngược dòng.\nTổng thời gian xuôi dòng và ngược dòng là 1 giờ.\nThời gian ca nô xuôi dòng là 1 : (2 + 3) x 2 = 0,4 (giờ)\nĐộ dài quãng đường AB là 9 x 0,4 = 3,6 (km)\nĐáp số:\na)\nVận tốc ngược dòng: 6 km/giờ;\nb)\nQuãng đường AB: 3,6 km", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động dòng nước", "tỉ lệ nghịch vận tốc – thời gian", "tổng – tỉ"], "mock": false, "mc": null, "key": ["3.6", "6"], "gradable": true}, {"id": "NTT-2023-1", "school": "NTT", "year": "2023", "part": "TN", "q_no": 1, "points": null, "statement": "Kết quả phép tính 2,75 x 0,99 + 2,75 : 100 bằng:\nA. 0,275\nB. 2,75\nC. 27,5\nD. 275", "has_figure": false, "garbled": false, "answer": "B", "solution": "2,75 x 0,99 + 2,75 : 100 = 2,75 x 0,99 + 2,75 x 0,01 = 2,75 x (0,99 + 0,01) = 2,75 x 1 = 2,75\nChọn B", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "số thập phân", "nhân một số với một tổng"], "mock": false, "mc": {"A": "0,275", "B": "2,75", "C": "27,5", "D": "275"}, "key": "B", "gradable": true}, {"id": "NTT-2023-2", "school": "NTT", "year": "2023", "part": "TN", "q_no": 2, "points": null, "statement": "Một bể bóng trong khu vui chơi có 360 quả bóng bao gồm bóng màu vàng và bóng màu xanh, 3/5 số quả bóng trong bể có màu xanh. Số quả bóng màu vàng trong bể đó là:\nA. 225 quả\nB. 135 quả\nC. 144 quả\nD. 216 quả", "has_figure": false, "garbled": false, "answer": "C", "solution": "Số bóng xanh trong bể là 3/5 x 360 = 216 (quả)\nSố quả bóng vàng trong bể là 360 – 216 = 144 (quả)\nChọn C", "unit": "u3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["phân số của một số", "phần còn lại"], "mock": false, "mc": {"A": "225 quả", "B": "135 quả", "C": "144 quả", "D": "216 quả"}, "key": "C", "gradable": true}, {"id": "NTT-2023-3", "school": "NTT", "year": "2023", "part": "TN", "q_no": 3, "points": null, "statement": "Một bể kính dạng hình hộp chữ nhật có chiều dài 1 m, chiều rộng 5 dm, chiều cao 6 dm (bỏ qua độ dày của các tấm kính). Hiện mực nước trong bể cao bằng 2/3 chiều cao của bể. Lượng nước đang có trong bể kính đó là:\nA. 200 dm3\nB. 300 dm3\nC. 200 m3\nD. 30 dm3", "has_figure": false, "garbled": false, "answer": "A", "solution": "Đổi: 1 m = 10 dm.\nChiều cao mực nước trong bể là 2/3 x 6 = 4 (dm)\nThể tích nước có trong bể kính đó là: 10 x 5 x 4 = 200 (dm3)\nChọn A", "unit": "c7", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "đổi đơn vị độ dài", "phân số của một số"], "mock": false, "mc": {"A": "200 dm3", "B": "300 dm3", "C": "200 m3", "D": "30 dm3"}, "key": "A", "gradable": true}, {"id": "NTT-2023-4", "school": "NTT", "year": "2023", "part": "TN", "q_no": 4, "points": null, "statement": "Biểu đồ cột dưới đây cho biết số lượng học sinh khối 6 tham gia câu lạc bộ nghệ thuật trong hè 2023 của trường THCS và THPT Nguyễn Tất Thành. [Theo lời giải, số liệu các cột là 15, 20, 30, 25, 20, 10; Guitar có 30 học sinh.] Tỉ số phần trăm của số học sinh học Guitar so với tổng số học sinh tham gia câu lạc bộ nghệ thuật hè 2023 của trường THCS và THPT Nguyễn Tất Thành là:\nA. 25%\nB. 30%\nC. 12,5%\nD. 75%", "has_figure": true, "garbled": false, "answer": "A", "solution": "Tổng số học sinh tham gia câu lạc bộ nghệ thuật hè là: 15 + 20 + 30 + 25 + 20 + 10 = 120 (học sinh)\nTỉ số phần trăm của số học sinh học Guitar so với tổng số học sinh tham gia câu lạc bộ nghệ thuật hè 2023 là: 30 : 120 x 100% = 25%\nChọn A", "unit": "u14", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["biểu đồ cột", "tỉ số phần trăm"], "mock": false, "mc": {"A": "25%", "B": "30%", "C": "12,5%", "D": "75%"}, "key": "A", "gradable": true}, {"id": "NTT-2023-5", "school": "NTT", "year": "2023", "part": "DT", "q_no": 5, "points": null, "statement": "Trung bình cộng của 3 số bằng 15,3. Trung bình cộng của số thứ nhất và số thứ hai bằng 12,1. Tìm số thứ ba.", "has_figure": false, "garbled": false, "answer": "21,7", "solution": "Tổng của ba số là 15,3 x 3 = 45,9\nTổng của số thứ nhất và số thứ hai là 12,1 x 2 = 24,2\nSố thứ ba là 45,9 – 24,2 = 21,7\nĐáp số: 21,7", "unit": "u14", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["trung bình cộng", "số thập phân"], "mock": false, "mc": null, "key": ["21.7"], "gradable": true}, {"id": "NTT-2023-6", "school": "NTT", "year": "2023", "part": "DT", "q_no": 6, "points": null, "statement": "Nhân dịp ngày Quốc tế Thiếu nhi mùng 1 tháng 6, một cửa hàng quần áo trẻ em giảm giá 15% tất cả các sản phẩm so với giá niêm yết. Mẹ bạn Mai mua một bộ váy tại cửa hàng đó và đã trả 212 500 đồng. Hỏi bộ váy đó có giá niêm yết là bao nhiêu tiền?", "has_figure": false, "garbled": false, "answer": "250 000 đồng", "solution": "Giá bán của chiếc váy chiếm 100% – 15% = 85% (giá niêm yết)\nGiá niêm yết của chiếc váy đó là 212 500 : 85 x 100 = 250 000 (đồng)\nĐáp số: 250 000 đồng", "unit": "u4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "giảm giá", "tìm số khi biết phần trăm"], "mock": false, "mc": null, "key": ["0", "250"], "gradable": true}, {"id": "NTT-2023-7", "school": "NTT", "year": "2023", "part": "DT", "q_no": 7, "points": null, "statement": "Tìm số tự nhiên lớn nhất có dạng a1024b. Biết số đó có sáu chữ số và chia hết cho 45.", "has_figure": false, "garbled": false, "answer": "610245", "solution": "Để số a1024b chia hết cho 45 thì a1024b chia hết cho 5 và 9.\nĐể số a1024b chia hết cho 5 thì b = 0 hoặc b = 5.\nTrường hợp 1: b = 0.\nTa có số a10240 chia hết cho 9, suy ra a + 7 chia hết cho 9.\nDo đó a = 2.\nTa có số 210240.\nTrường hợp 2: b = 5.\nTa có số a10245 chia hết cho 9, suy ra a + 12 chia hết cho 9.\nDo đó a = 6.\nTa có số 610245.\nVậy số cần tìm là 610245\nĐáp số: 610245", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "chia hết cho 45", "cấu tạo số"], "mock": false, "mc": null, "key": ["610245"], "gradable": true}, {"id": "NTT-2023-8", "school": "NTT", "year": "2023", "part": "DT", "q_no": 8, "points": null, "statement": "Hình chữ nhật ABCD có cạnh AD bằng 4 cm. Hình tròn tâm D, bán kính DA và hình tròn tâm C, bán kính CB có vị trí như hình bên. Hãy tính độ dài cạnh CD biết diện tích phần tô đậm bằng diện tích phần gạch chéo.", "has_figure": true, "garbled": false, "answer": "6,28 cm", "solution": "Diện tích 1/4 hình tròn tâm D, bán kính DA là 1/4 x 4 x 4 x 3,14 = 12,56 (cm2)\nDiện tích 1/4 hình tròn tâm C, bán kính CB là 1/4 x 4 x 4 x 3,14 = 12,56 (cm2)\nVì diện tích phần tô đậm bằng diện tích phần gạch chéo nên diện tích hình chữ nhật ABCD là: 12,56 + 12,56 = 25,12 (cm2)\nĐộ dài cạnh CD là 25,12 : 4 = 6,28 (cm)\nĐáp số: 6,28 cm", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 5, "skills": ["diện tích hình tròn", "diện tích hình chữ nhật", "phần chung diện tích"], "mock": false, "mc": null, "key": ["6.28"], "gradable": true}, {"id": "NTT-2023-9", "school": "NTT", "year": "2023", "part": "TL", "q_no": 9, "points": null, "statement": "Hai bạn An và Bình cùng đạp xe từ trường đến sân vận động để tham gia thi đấu thể thao. Thời gian An đạp xe từ trường đến sân vận động bằng 5/4 thời gian Bình đạp xe từ trường đến sân vận động. Biết trong 6 phút bạn An đạp xe được quãng đường dài 1,2 km.\n1. Tính vận tốc của bạn An.\n2. Tính độ dài quãng đường từ trường đến sân vận động biết rằng nếu trên cùng quãng đường đó và cùng một lúc An xuất phát từ trường còn Bình xuất phát từ sân vận động thì sau 12 phút 2 bạn sẽ gặp nhau. (Biết vận tốc của 2 bạn không thay đổi)", "has_figure": false, "garbled": false, "answer": "1) 12 km/giờ; 2) 5,4 km", "solution": "1. Đổi: 6 phút = 1/10 giờ.\nVận tốc của An là: 1,2 : 1/10 = 12 (km/giờ)\n2. Trên cùng một quãng đường thì thời gian và vận tốc tỉ lệ nghịch với nhau: t An : t Bình = v Bình : v An = 5/4\nVận tốc của Bình là 12 x 5/4 = 15 (km/giờ)\nTổng vận tốc của An và Bình là 12 + 15 = 27 (km/giờ)\nĐổi: 12 phút = 1/5 giờ\nQuãng đường từ trường đến sân vận động là 27 x 1/5 = 5,4 (km)\nĐáp số: 1) 12 km/giờ; 2) 5,4 km", "unit": "c4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["vận tốc", "tỉ lệ nghịch vận tốc – thời gian", "chuyển động ngược chiều"], "mock": false, "mc": null, "key": ["1", "12", "2", "5.4"], "gradable": true}, {"id": "NTT-2023-10", "school": "NTT", "year": "2023", "part": "TL", "q_no": 10, "points": null, "statement": "Cho hình chữ nhật ABCD. Trên AB lấy điểm E sao cho AB = AE x 3, DB cắt EC tại G. Biết diện tích hình chữ nhật ABCD là 144 cm2, tính:\n1. Diện tích tam giác AED.\n2. Diện tích tứ giác AEGD.", "has_figure": true, "garbled": false, "answer": "1) 24 cm2; 2) 52,8 cm2", "solution": "1. S(ABD) = S(BDC) = 1/2 S(ABCD) = 144 : 2 = 72 (cm2)\nS(AED) = 1/3 S(ABD) (hai tam giác có chung chiều cao hạ từ đỉnh D và đáy AE = 1/3 AB).\nSuy ra S(AED) = 1/3 x 72 = 24 (cm2)\n2.\nTa có S(DEB) = 2/3 S(DAB) = 2/3 S(CDB) nên chiều cao hạ từ E xuống BD bằng 2/3 chiều cao từ C xuống BD.\nSuy ra S(EDG) = 2/3 S(CDG) = 2/5 S(ECD)\nS(ECD) = AD x DC : 2 = S(ABCD) : 2 = 144 : 2 = 72 (cm2)\nS(EDG) = 2/5 x 72 = 28,8 (cm2)\nS(AEGD) = 24 + 28,8 = 52,8 (cm2)", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung đáy – chiều cao", "hình chữ nhật", "diện tích tứ giác"], "mock": false, "mc": null, "key": ["1", "2", "2", "2", "24", "52.8"], "gradable": true}, {"id": "NTT-2024-1", "school": "NTT", "year": "2024", "part": "TN", "q_no": 1, "points": null, "statement": "Kết quả phép tính 17,2 x 95 + 17,2 x 5 bằng:\nA. 1720\nB. 172\nC. 17,2\nD. 127", "has_figure": false, "garbled": false, "answer": "A", "solution": "17,2 x 95 + 17,2 x 5 = 17,2 x (95 + 5) = 17,2 x 100 = 1720\nChọn A", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "nhân một số với một tổng", "số thập phân"], "mock": false, "mc": {"A": "1720", "B": "172", "C": "17,2", "D": "127"}, "key": "A", "gradable": true}, {"id": "NTT-2024-2", "school": "NTT", "year": "2024", "part": "TN", "q_no": 2, "points": null, "statement": "Sau khi kiểm tra 1000 sản phẩm xuất xưởng, người ta nhận thấy có 8 sản phẩm bị lỗi. Tỉ số phần trăm của số sản phẩm bị lỗi và số sản phẩm đã được kiểm tra là\nA. 0,08%\nB. 125%\nC. 0,8%\nD. 8%", "has_figure": false, "garbled": false, "answer": "C", "solution": "Tỉ số phần trăm của số sản phẩm bị lỗi và số sản phẩm đã được kiểm tra là: 8 : 1000 x 100 = 0,8%\nChọn C", "unit": "u4", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tìm tỉ số phần trăm của hai số"], "mock": false, "mc": {"A": "0,08%", "B": "125%", "C": "0,8%", "D": "8%"}, "key": "C", "gradable": true}, {"id": "NTT-2024-3", "school": "NTT", "year": "2024", "part": "TN", "q_no": 3, "points": null, "statement": "Trong phòng thi có 24 thí sinh. Biết 1/2 số thí sinh nam bằng số thí sinh nữ. Số thí sinh nam trong phòng thi đó là\nA. 8\nB. 16\nC. 24\nD. 4", "has_figure": false, "garbled": false, "answer": "B", "solution": "Tổng số phần bằng nhau là: 1 + 2 = 3 (phần)\nSố thí sinh nam trong phòng thi đó là: 24 : 3 x 2 = 16 (thí sinh)\nChọn B", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tổng – tỉ", "sơ đồ đoạn thẳng"], "mock": false, "mc": {"A": "8", "B": "16", "C": "24", "D": "4"}, "key": "B", "gradable": true}, {"id": "NTT-2024-4", "school": "NTT", "year": "2024", "part": "TN", "q_no": 4, "points": null, "statement": "Tại nhà bóng của một khu vui chơi, các nhân viên đã thống kê số lượng bóng theo màu của 2000 quả bóng và vẽ được biểu đồ sau (biểu đồ hình quạt; theo lời giải, các màu khác chiếm 25%, 40%, 15%). Số lượng bóng màu đỏ trong số 2000 quả bóng đó là\nA. 200 quả\nB. 600 quả\nC. 40 quả\nD. 400 quả", "has_figure": true, "garbled": false, "answer": "D", "solution": "Số bóng màu đỏ chiếm số phần trăm trong số 2000 quả bóng là: 100% – 25% – 40% – 15% = 20%\nSố lượng bóng màu đỏ là: 2000 : 100 x 20 = 400 (quả)\nChọn D", "unit": "u14", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["biểu đồ hình quạt", "tỉ số phần trăm", "phần trăm của một số"], "mock": false, "mc": {"A": "200 quả", "B": "600 quả", "C": "40 quả", "D": "400 quả"}, "key": "D", "gradable": true}, {"id": "NTT-2024-5", "school": "NTT", "year": "2024", "part": "TN", "q_no": 5, "points": null, "statement": "Một cái bể nước có lòng bể dạng hình hộp chữ nhật có chiều dài bằng 2m; chiều rộng bằng 1m và chiều cao bằng 1/2 chiều dài. Hiện tại, bể đang chứa 1100 lít nước. Để vừa đầy bể, cần bơm thêm số lít nước nữa là\nA. 2 lít\nB. 2000 lít\nC. 900 lít\nD. 1098 lít", "has_figure": false, "garbled": false, "answer": "C", "solution": "Chiều cao của bể nước là: 2 x 1/2 = 1 (m)\nThể tích của bể nước là: 2 x 1 x 1 = 2 (m3).\nĐổi 2 m3 = 2 000 dm3 = 2000 lít\nĐể vừa đầy bể, cần bơm thêm số lít nước là: 2000 – 1100 = 900 (lít)\nChọn C", "unit": "c7", "unit_alt": "u6", "difficulty": 1, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "đổi m3 – lít"], "mock": false, "mc": {"A": "2 lít", "B": "2000 lít", "C": "900 lít", "D": "1098 lít"}, "key": "C", "gradable": true}, {"id": "NTT-2024-6", "school": "NTT", "year": "2024", "part": "TN", "q_no": 6, "points": null, "statement": "Bạn An vẽ một hình trái tim bằng cách sau: vẽ một hình vuông cạnh 20 cm, sau đó vẽ hai đường tròn có đường kính lần lượt là hai cạnh kề nhau của hình vuông, rồi tô màu (xem hình minh họa dưới đây). Diện tích hình trái tim đó là\nA. 1000cm2\nB. 714cm2\nC. 1656cm2\nD. 400cm2", "has_figure": true, "garbled": false, "answer": "B", "solution": "Hai nửa hình tròn tạo thành một hình tròn hoàn chỉnh có đường kính dài 20 cm.\nBán kính của hình tròn là: 20 : 2 = 10 (cm)\nDiện tích hình tròn là: 10 x 10 x 3,14 = 314 (cm2)\nDiện tích hình vuông là: 20 x 20 = 400 (cm2)\nDiện tích hình trái tim là: 314 + 400 = 714 (cm2)\nChọn B", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích hình tròn", "diện tích hình vuông", "hình ghép"], "mock": false, "mc": {"A": "1000cm2", "B": "714cm2", "C": "1656cm2", "D": "400cm2"}, "key": "B", "gradable": true}, {"id": "NTT-2024-7", "school": "NTT", "year": "2024", "part": "DT", "q_no": 7, "points": null, "statement": "Hiện nay, tổng số tuổi của hai anh em là 20 tuổi. Biết số tuổi của anh hơn số tuổi của em là 4 tuổi. Tính số tuổi của em hiện nay.", "has_figure": false, "garbled": false, "answer": "8 tuổi", "solution": "Số tuổi của em hiện nay là: (20 – 4) : 2 = 8 (tuổi)\nĐáp số: 8 tuổi", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tổng – hiệu", "bài toán tuổi"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "NTT-2024-8", "school": "NTT", "year": "2024", "part": "DT", "q_no": 8, "points": null, "statement": "Một đội có 15 người thì hoàn thành công việc được giao trong 20 ngày. Hỏi nếu đội có 10 người thì sẽ hoàn thành công việc đó trong bao nhiêu ngày? (Năng suất của mỗi người là như nhau)", "has_figure": false, "garbled": false, "answer": "30 ngày", "solution": "1 người hoàn thành công việc trong số ngày là: 20 x 15 = 300 (ngày)\n10 người hoàn thành công việc trong số ngày là: 300 : 10 = 30 (ngày)\nĐáp số: 30 ngày", "unit": "c5", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "rút về đơn vị", "năng suất"], "mock": false, "mc": null, "key": ["30"], "gradable": true}, {"id": "NTT-2024-9", "school": "NTT", "year": "2024", "part": "DT", "q_no": 9, "points": null, "statement": "Một ô tô chở học sinh lớp 6A của Trường THCS & THPT Nguyễn Tất Thành đi dã ngoại xuất phát từ trường lúc 6 giờ 30 phút với vận tốc 50 km/giờ. Khi đến khu dã ngoại, học sinh tham gia các hoạt động trải nghiệm trong 3 giờ. Sau đó, ô tô chở học sinh quay về với vận tốc 40 km/giờ và về đến trường lúc 10 giờ 24 phút cùng ngày. Biết quãng đường đi và quãng đường về bằng nhau. Tính quãng đường từ trường đến khu dã ngoại.", "has_figure": false, "garbled": false, "answer": "20 km", "solution": "Tổng thời gian di chuyển từ trường tới khu dã ngoại và trở về trường của lớp 6A là: 10 giờ 24 phút – 6 giờ 30 phút – 3 giờ = 54 phút.\nĐổi 54 phút = 0,9 giờ\nTỉ số vận tốc lúc đi và vận tốc lúc về là: 50/40 = 5/4\nTrên cùng một quãng đường, thời gian và vận tốc là hai đại lượng tỉ lệ nghịch với nhau.\nVậy tỉ số thời gian lúc đi và thời gian lúc về là 4/5.\nThời gian lúc đi là: 0,9 : (4 + 5) x 4 = 0,4 (giờ)\nĐộ dài quãng đường từ trường đến khu dã ngoại là: 50 x 0,4 = 20 (km)\nĐáp số: 20 km", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động đi – về", "tỉ lệ nghịch vận tốc – thời gian", "tổng – tỉ", "đổi phút ra giờ"], "mock": false, "mc": null, "key": ["20"], "gradable": true}, {"id": "NTT-2024-10", "school": "NTT", "year": "2024", "part": "DT", "q_no": 10, "points": null, "statement": "Cho hình minh họa bên. Biết có tất cả 12 hình vuông nhỏ, mỗi hình vuông nhỏ có diện tích là 16cm2. Tính diện tích của phần tô màu đậm theo đơn vị xăng-ti-mét vuông.", "has_figure": true, "garbled": false, "answer": "48 cm2", "solution": "Hình vẽ trên gồm 12 hình vuông nhỏ có diện tích 16cm2.\nTa thấy hình số 1 và hình số 2, mỗi hình bao gồm 1,5 hình vuông được tô đậm.\nSố hình vuông được tô đậm là: 1,5 + 1,5 = 3 (hình vuông)\nDiện tích phần được tô đậm là: 16 x 3 = 48 (cm2)\nĐáp số: 48cm2", "unit": "c7", "unit_alt": "u8", "difficulty": 2, "vn_grade": 4, "skills": ["đếm ô vuông", "diện tích phần tô màu", "lưới ô vuông"], "mock": false, "mc": null, "key": ["2", "48"], "gradable": true}, {"id": "NTT-2024-11", "school": "NTT", "year": "2024", "part": "TL", "q_no": 11, "points": null, "statement": "Đầu năm học, câu lạc bộ “Em yêu Toán” có 30 học sinh nữ và chiếm 60% tổng số học sinh của câu lạc bộ đó.\n1. Tính số học sinh nam của câu lạc bộ “Em yêu Toán”.\n2. Hết học kì I, câu lạc bộ “Em yêu Toán” không có học sinh nào chuyển đi mà có một số học sinh nữ và một số học sinh nam từ các câu lạc bộ khác cùng chuyển sang câu lạc bộ này. Số học sinh nam và số học sinh nữ chuyển đến như nhau. Khi đó, số học sinh nữ bằng 140% số học sinh nam. Tính số học sinh nữ đã chuyển đến.", "has_figure": false, "garbled": false, "answer": "1) 20 học sinh; 2) 5 học sinh", "solution": "1. Tổng số học sinh của câu lạc bộ là: 30 x 100 : 60 = 50 (học sinh)\nSố học sinh nam của câu lạc bộ là: 50 – 30 = 20 (học sinh)\n2. Ban đầu, hiệu số học sinh nữ và số học sinh nam là: 30 – 20 = 10 (học sinh)\nVì số học sinh nữ và số học sinh nam chuyển đến như nhau nên hiệu số học sinh nữ và số học sinh nam không thay đổi.\nĐổi 140% = 7/5, số học sinh nữ bằng 7/5 số học sinh nam.\nSố học sinh nữ lúc sau là: 10 : (7 – 5) x 7 = 35 (học sinh)\nSố học sinh nữ đã chuyển đến là: 35 – 30 = 5 (học sinh)\nĐáp số:\na) 20 học sinh;\nb) 5 học sinh", "unit": "c3", "unit_alt": "u4", "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "hiệu – tỉ", "hiệu không đổi"], "mock": false, "mc": null, "key": ["1", "2", "20", "5"], "gradable": true}, {"id": "NTT-2024-12", "school": "NTT", "year": "2024", "part": "TL", "q_no": 12, "points": null, "statement": "Cho hình thang ABCD (AB và CD là hai cạnh đáy), CD = 2 x AB. Trên đoạn thẳng AC lấy điểm M sao cho AM = MC. Trên đoạn thẳng DM lấy điểm N sao cho MN = 2 x DN. Kéo dài AN cắt DC tại P. Biết diện tích hình tam giác ABC bằng 60cm2.\n1. Tính diện tích hình thang ABCD.\n2. Tính diện tích tam giác DNP.", "has_figure": true, "garbled": false, "answer": "1) 180 cm2; 2) 4 cm2", "solution": "1. Vì AB song song với CD nên hai tam giác ABC và ADC có chiều cao bằng nhau.\nS(ADC) = 2 x S(ABC) = 2 x 60 = 120 (cm2) (vì CD = 2 x AB và chiều cao bằng nhau).\nDo đó, S(ABCD) = S(ABC) + S(ADC) = 60 + 120 = 180 (cm2)\n2. Nối điểm N với điểm C.\nTa có S(DAM) = S(DCM) = 1/2 S(ADC) = 1/2 x 120 = 60 (cm2) (vì AM = MC và chung chiều cao hạ từ D xuống AC).\nS(DAN) = 1/3 S(DAM) = 1/3 x 60 = 20 (cm2) (vì MN = 2 x DN nên DN = 1/3 DM và chung chiều cao hạ từ A xuống DM).\nSuy ra S(NAM) = S(DAM) – S(DAN) = 60 – 20 = 40 (cm2)\nCó S(NAM) = S(NCM) = 40 (cm2) (AM = CM, chung chiều cao hạ từ N xuống AC).\nDo đó S(ANC) = S(NAM) + S(NCM) = 40 + 40 = 80 (cm2)\nMà S(DAM) – S(NAM) = S(DCM) – S(NCM) nên S(DAN) = S(DCN) = 20 (cm2)\nTa có S(DAN)/S(ANC) = 20/80 = 1/4 nên chiều cao hạ từ D xuống AN bằng 1/4 chiều cao hạ từ C xuống AN.\nCó S(DNP) = 1/4 S(CNP) (chung đáy NP và chiều cao hạ từ D xuống AN bằng 1/4 chiều cao hạ từ C xuống AN).\nMà S(DNP) + S(CNP) = S(DCN) nên S(DNP) = 1/5 S(DCN) = 1/5 x 20 = 4 (cm2)\nĐáp số:\na)\nS(ABCD) = 180cm2;\nb)\nS(DNP) = 4 cm2", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình thang", "tỉ số diện tích tam giác", "chung đáy – chiều cao", "tỉ số chiều cao"], "mock": false, "mc": null, "key": ["1", "180", "2", "2", "2", "4"], "gradable": true}, {"id": "NTT-2025-1", "school": "NTT", "year": "2025", "part": "TN", "q_no": 1, "points": 0.5, "statement": "Cho biểu đồ như hình dưới đây (biểu đồ hình quạt số học sinh các khối; theo lời giải: khối 6 chiếm 1/4 hình tròn, các khối khác 12,5% và 40%). Tìm tỉ số phần trăm số học sinh khối 9 so với số học sinh toàn trường.\nA. 22,5%\nB. 12,5%\nC. 32%\nD. 25%", "has_figure": true, "garbled": false, "answer": "A", "solution": "Số học sinh khối 6 được biểu diễn là 1/4 hình tròn nên số học sinh khối 6 chiếm 25% so với toàn trường.\nTỉ số phần trăm học sinh khối 9 là: 100% – (12,5% + 40% + 25%) = 22,5%\nĐáp số: 22,5%", "unit": "u14", "unit_alt": "u4", "difficulty": 1, "vn_grade": 5, "skills": ["biểu đồ hình quạt", "tỉ số phần trăm"], "mock": false, "mc": {"A": "22,5%", "B": "12,5%", "C": "32%", "D": "25%"}, "key": "A", "gradable": true}, {"id": "NTT-2025-2", "school": "NTT", "year": "2025", "part": "TN", "q_no": 2, "points": 0.5, "statement": "Gieo 1 viên xúc xắc 20 lần liên tiếp, kết quả nhận được như bảng sau (bảng bị thiếu; theo lời giải, số lần xuất hiện mặt 1, 3, 5 chấm lần lượt là 5, 3, 1). Tỉ số giữa số lần xuất hiện mặt có số chấm là số lẻ và tổng số lần đã gieo là bao nhiêu?\nA. 9/20\nB. 11/20\nC. 3/20\nD. 1/20", "has_figure": true, "garbled": false, "answer": "A", "solution": "Số lần xuất hiện mặt có chấm là số lẻ là: 5 + 3 + 1 = 9 (lần)\nTỉ số giữa số lần xuất hiện mặt số chấm là số lẻ và tổng số lần đã gieo là: 9 : 20 = 9/20\nĐáp số: 9/20", "unit": "u16", "unit_alt": "u12", "difficulty": 1, "vn_grade": 4, "skills": ["xác suất thực nghiệm", "đọc bảng số liệu", "tỉ số"], "mock": false, "mc": {"A": "9/20", "B": "11/20", "C": "3/20", "D": "1/20"}, "key": "A", "gradable": true}, {"id": "NTT-2025-3", "school": "NTT", "year": "2025", "part": "TN", "q_no": 3, "points": 0.5, "statement": "Tìm số tự nhiên thích hợp điền vào chỗ trống: 5/26 < ..../26 < 6/25\nA. 3\nB. 4\nC. 5\nD. 6", "has_figure": false, "garbled": false, "answer": "D", "solution": "Số tự nhiên cần điền là: 6 (vì 5/26 < 6/26 < 6/25).\nĐáp án: 6", "unit": "u3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["so sánh phân số", "cùng mẫu số", "cùng tử số"], "mock": false, "mc": {"A": "3", "B": "4", "C": "5", "D": "6"}, "key": "D", "gradable": true}, {"id": "NTT-2025-4", "school": "NTT", "year": "2025", "part": "TN", "q_no": 4, "points": 0.5, "statement": "Tính kết quả của phép tính: 20,26 x 42,6 + 20,26 x 57,4\nA. 20,26\nB. 202,6\nC. 2026\nD. 2025", "has_figure": false, "garbled": false, "answer": "C", "solution": "20,26 x 42,6 + 20,26 x 57,4 = 20,26 x (42,6 + 57,4) = 20,26 x 100 = 2026\nĐáp án: 2026", "unit": "c1", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tính nhanh", "nhân một số với một tổng", "số thập phân"], "mock": false, "mc": {"A": "20,26", "B": "202,6", "C": "2026", "D": "2025"}, "key": "C", "gradable": true}, {"id": "NTT-2025-5", "school": "NTT", "year": "2025", "part": "TN", "q_no": 5, "points": 0.5, "statement": "Nhà bác An có một mảnh đất. Bác An dùng 3/5 diện tích để trồng cây ăn quả. Phần còn lại có diện tích là 60m2. Tính diện tích mảnh đất.\nA. 36m²\nB. 100 m²\nC. 24 m²\nD. 150 m²", "has_figure": false, "garbled": false, "answer": "D", "solution": "Coi diện tích mảnh đất là 1 đơn vị.\nPhân số chỉ 60 m2 là: 1 – 3/5 = 2/5 (diện tích mảnh đất)\nDiện tích mảnh đất là: 60 : 2 x 5 = 150 (m2)\nĐáp án: 150 m2", "unit": "u3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tìm số khi biết phân số", "phần còn lại"], "mock": false, "mc": {"A": "36m²", "B": "100 m²", "C": "24 m²", "D": "150 m²"}, "key": "D", "gradable": true}, {"id": "NTT-2025-6", "school": "NTT", "year": "2025", "part": "TN", "q_no": 6, "points": 0.5, "statement": "Một miếng bìa hình chữ nhật có chiều dài là 25cm và chiều rộng là 20cm. Người ta cắt 4 góc miếng bìa hình vuông có cạnh là 5cm và gấp thành hình hộp chữ nhật (như hình dưới). Tính thể tích hình hộp chữ nhật đó.\nA. 200cm³\nB. 1500cm³\nC. 750cm³\nD. 600cm³", "has_figure": true, "garbled": false, "answer": "C", "solution": "Chiều rộng của hình hộp chữ nhật là: 20 – (5 + 5) = 10 (cm)\nChiều dài của hình hộp chữ nhật là: 25 – (5 + 5) = 15 (cm)\nChiều cao của hình hộp chữ nhật là 5cm.\nThể tích của hình đó là: 15 x 10 x 5 = 750 (cm3)\nĐáp án: 750 cm3", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "cắt ghép", "gấp hộp"], "mock": false, "mc": {"A": "200cm³", "B": "1500cm³", "C": "750cm³", "D": "600cm³"}, "key": "C", "gradable": true}, {"id": "NTT-2025-7", "school": "NTT", "year": "2025", "part": "TN", "q_no": 7, "points": 0.5, "statement": "Cho nửa hình tròn có đường kính 40cm, người thợ mộc cắt 2 nửa hình tròn có đường kính bằng bán kính của hình tròn trước. Tính diện tích của hình tròn mới bị cắt.\nA. 314 cm²\nB. 628 cm²\nC. 942 cm²\nD. 154 cm²", "has_figure": true, "garbled": false, "answer": "A", "solution": "Đường kính hình tròn mới là: 40 : 2 = 20 (cm)\nBán kính hình tròn mới là: 20 : 2 = 10 (cm)\nDiện tích hình tròn mới bị cắt là: 10 x 10 x 3,14 = 314 (cm2)\nĐáp án: 314 cm2", "unit": "u6", "unit_alt": "c7", "difficulty": 1, "vn_grade": 5, "skills": ["diện tích hình tròn", "bán kính – đường kính"], "mock": false, "mc": {"A": "314 cm²", "B": "628 cm²", "C": "942 cm²", "D": "154 cm²"}, "key": "A", "gradable": true}, {"id": "NTT-2025-8", "school": "NTT", "year": "2025", "part": "TN", "q_no": 8, "points": 0.5, "statement": "Có bao nhiêu số có 2 chữ số mà chữ số hàng chục lớn hơn chữ số hàng đơn vị là 4.\nA. 3\nB. 4\nC. 5\nD. 6", "has_figure": false, "garbled": false, "answer": "D", "solution": "Các số thỏa mãn là: 40; 51; 62; 73; 84; 95.\nVậy có 6 số thỏa mãn yêu cầu bài toán.\nĐáp án: 6 số", "unit": "c2", "unit_alt": "c6", "difficulty": 1, "vn_grade": 4, "skills": ["cấu tạo số", "liệt kê", "đếm số"], "mock": false, "mc": {"A": "3", "B": "4", "C": "5", "D": "6"}, "key": "D", "gradable": true}, {"id": "NTT-2025-9", "school": "NTT", "year": "2025", "part": "DT", "q_no": 9, "points": 0.75, "statement": "Một chiếc áo có giá 500 000 đồng. Vì không ai mua nên giảm giá 20% so với giá ban đầu. Nhưng vẫn không ai mua nên giảm giá tiếp 40% so với giá giảm lần đầu. Hỏi giá chiếc áo sau 2 lần giảm là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "240 000 đồng", "solution": "Giá chiếc áo sau khi giảm lần đầu là: 500 000 – 500 000 × 20 : 100 = 400 000 (đồng)\nGiá chiếc áo sau khi giảm lần hai là: 400 000 – 400 000 × 40 : 100 = 240 000 (đồng)\nĐáp số: 240 000 đồng", "unit": "u4", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "giảm giá liên tiếp"], "mock": false, "mc": null, "key": ["0", "240"], "gradable": true}, {"id": "NTT-2025-10", "school": "NTT", "year": "2025", "part": "DT", "q_no": 10, "points": 0.75, "statement": "Trên quãng đường AB dài 200km có hai người đi ngược chiều nhau. Lúc 7 giờ 30 phút có 1 xe tải đi từ A đến B với vận tốc 40km/giờ. Sau 30 phút có 1 xe khách đi từ B đến A với vận tốc 60km/giờ. Hỏi lúc 9 giờ cùng ngày hai xe cách nhau bao nhiêu ki-lô-mét?", "has_figure": false, "garbled": false, "answer": "80 km", "solution": "Đổi: 30 phút = 0,5 giờ\nLúc 9 giờ xe tải đi được số giờ là: 9 giờ – 7 giờ 30 phút = 1 giờ 30 phút = 1,5 giờ\nLúc 9 giờ quãng đường xe tải đã đi được là: 40 x 1,5 = 60 (km)\nLúc 9 giờ xe khách đi được số giờ là: 9 giờ – 7 giờ 30 phút – 30 phút = 1 (giờ)\nLúc 9 giờ quãng đường xe khách đã đi được là: 60 x 1 = 60 (km)\nLúc 9 giờ hai xe cách nhau là: 200 – 60 – 60 = 80 (km)\nĐáp số: 80km", "unit": "c4", "unit_alt": "u5", "difficulty": 2, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "khoảng cách hai xe", "tính thời gian"], "mock": false, "mc": null, "key": ["80"], "gradable": true}, {"id": "NTT-2025-11", "school": "NTT", "year": "2025", "part": "DT", "q_no": 11, "points": 0.75, "statement": "Tổng số học sinh lớp 5A là 45 học sinh. Biết số học sinh nam bằng 4/5 số học sinh nữ. Tính số học sinh nữ.", "has_figure": false, "garbled": false, "answer": "25 học sinh", "solution": "Số học sinh nữ là: 45 : (4 + 5) x 5 = 25 (học sinh)\nĐáp số: 25 học sinh", "unit": "c3", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["tổng – tỉ"], "mock": false, "mc": null, "key": ["25"], "gradable": true}, {"id": "NTT-2025-12", "school": "NTT", "year": "2025", "part": "DT", "q_no": 12, "points": 0.75, "statement": "Có 15 hình lập phương nhỏ có cạnh 1cm. Người ta xếp 15 hình lập phương này thành một hình hộp chữ nhật. Hỏi diện tích toàn phần lớn nhất của hình hộp chữ nhật là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "62 cm2", "solution": "Ta có: 15 = 1 x 1 x 15 = 1 x 3 x 5\nKích thước của hình hộp chữ nhật sau khi xếp có thể là: 1cm x 1cm x 15cm hoặc 1cm x 3cm x 5cm.\nTrường hợp kích thước 1cm x 1cm x 15cm thì diện tích toàn phần là: (1 + 15) x 2 x 1 + 1 x 15 x 2 = 62 (cm²)\nTrường hợp kích thước 1cm x 3cm x 5cm diện tích toàn phần là: (1 + 5) x 2 x 3 + 1 x 5 x 2 = 46 (cm2)\nVậy diện tích toàn phần lớn nhất là 62cm2\nĐáp số: 62cm2", "unit": "c7", "unit_alt": "c6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích toàn phần hình hộp chữ nhật", "xếp hình lập phương", "phân tích thừa số"], "mock": false, "mc": null, "key": ["2", "62"], "gradable": true}, {"id": "NTT-2025-13", "school": "NTT", "year": "2025", "part": "TL", "q_no": 13, "points": 1, "statement": "Để lập ra quỹ ủng hộ, lớp 6A và 6B bán đồ handmade, số tiền mà lớp 6B nhận được nhiều hơn số tiền lớp 6A nhận được là 2 triệu đồng. Trung bình cộng số tiền hai lớp thu được là 5 triệu đồng. Hỏi mỗi lớp nhận được bao nhiêu tiền?", "has_figure": false, "garbled": false, "answer": "6A: 4 triệu đồng; 6B: 6 triệu đồng", "solution": "Tổng số tiền lớp 6A và 6B là: 5 x 2 = 10 (triệu đồng)\nSố tiền lớp 6B nhận được là: (10 + 2) : 2 = 6 (triệu đồng)\nSố tiền lớp 6A nhận được là: 10 – 6 = 4 (triệu đồng)\nĐáp số: 6A: 4 triệu đồng; 6B: 6 triệu đồng", "unit": "c3", "unit_alt": "u14", "difficulty": 1, "vn_grade": 4, "skills": ["tổng – hiệu", "trung bình cộng"], "mock": false, "mc": null, "key": ["4", "6", "6", "6"], "gradable": true}, {"id": "NTT-2025-14", "school": "NTT", "year": "2025", "part": "TL", "q_no": 14, "points": 1, "statement": "Cho quãng đường AB có độ dài là 180km. Vận tốc xe máy là 45km/giờ, xe ô tô là 60km/giờ. Hỏi sau bao lâu thì quãng đường còn lại của xe máy gấp đôi ô tô biết 2 xe đi cùng chiều (cùng xuất phát từ A đi về B).", "has_figure": true, "garbled": false, "answer": "2,4 giờ", "solution": "Gọi quãng đường đã đi của ô tô là AC, quãng đường còn lại là CB.\nQuãng đường đã đi của xe máy là AD, quãng đường còn lại là DB.\nTa có CB = 1/2 DB nên CD = 1/2 DB.\nTỉ số vận tốc xe máy và ô tô là: 45 : 60 = 3/4\nCùng thời gian thì vận tốc và quãng đường tỉ lệ thuận với nhau, suy ra tỉ lệ quãng đường đã đi của xe máy và ô tô là 3/4 hay AD/AC = 3/4.\nCoi AC là 4 phần, AD là 3 phần.\nDC là 1 phần, CB là 1 phần.\nSuy ra AB là 5 phần.\nQuãng đường đã đi của ô tô là: 180 : 5 x 4 = 144 (km)\nThời gian đã đi của 2 xe là: 144 : 60 = 2,4 (giờ)\nĐáp số: 2,4 giờ", "unit": "c4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động cùng chiều", "tỉ lệ thuận vận tốc – quãng đường", "sơ đồ đoạn thẳng"], "mock": false, "mc": null, "key": ["2.4"], "gradable": true}, {"id": "NTT-2025-15", "school": "NTT", "year": "2025", "part": "TL", "q_no": 15, "points": 1, "statement": "Cho tam giác ABC. Trên AB lấy điểm D sao cho AD = 2 BD. Trên BC lấy điểm E sao cho BE = 2 CE. Đoạn thẳng AD, CE cắt nhau tại F [theo lời giải: CD và AE cắt nhau tại F]. Biết diện tích tam giác ACF là 20 cm2. Tính diện tích tam giác ABC.", "has_figure": true, "garbled": true, "answer": "70 cm2", "solution": "Nối B với F.\nHai tam giác ADC và tam giác CBD có chung chiều cao hạ từ C và AD = 2 x BD.\nSuy ra: S(ADC) = 2 x S(CBD)\nHai tam giác AFD và BFD có chung chiều cao hạ từ F và AD = 2 x BD.\nSuy ra: S(AFD) = 2 x S(BFD)\nTừ đó suy ra: S(ADC) – S(AFD) = 2 x (S(CBD) – S(BFD)) hay S(AFC) = 2 x S(BFC)\nS(BFC) = 20 : 2 x 1 = 10 (cm2)\nLàm tương tự ta được: S(AFC) = 1/2 S(AFB), S(AFB) = 20 x 2 = 40 (cm2)\nS(ABC) = S(BFC) + S(AFB) + S(AFC) = 10 + 40 + 20 = 70 (cm2)\nĐáp số: 70 cm2", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích tam giác", "chung chiều cao", "hiệu diện tích"], "mock": false, "mc": null, "key": ["2", "70"], "gradable": true}, {"id": "TDN-2022-1", "school": "TDN", "year": "2022", "part": "DT", "q_no": 1, "points": 2, "statement": "Trong cách ghi ngày 13/01/2022 thì tổng của năm chữ số đầu và tổng năm chữ số cuối bằng nhau. Hỏi ngày cuối cùng trong năm 2022 có cùng tính chất như vậy là ngày nào? Ngày đó là: ………………………", "has_figure": false, "garbled": false, "answer": "30/12/2022", "solution": null, "unit": "c6", "unit_alt": "u5", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "lịch", "tổng các chữ số"], "mock": false, "mc": null, "key": ["2022", "30/12"], "gradable": true}, {"id": "TDN-2022-2", "school": "TDN", "year": "2022", "part": "DT", "q_no": 2, "points": 2, "statement": "Cho A = 1 + 3 + 5 + … + 2021 + 2023 và B = 2 + 4 + 6 + … + 2020 + 2022. Tính A – B. Kết quả: A – B = …………………", "has_figure": false, "garbled": false, "answer": "A – B = 1012", "solution": "Số số hạng của A là (2023 – 1) : 2 + 1 = 1012 (số hạng).\nA = (1 + 2023) x 1012 : 2 = 1 024 144. Số số hạng của B là: (2022 – 2) : 2 + 1 = 1011 (số hạng).\nB = (2 + 2022) x 1011 : 2 = 1 023 132.\nVậy A - B = 1 024 144 - 1 023 132 = 1012. Kết quả: A – B = 1012", "unit": "u15", "unit_alt": "c1", "difficulty": 2, "vn_grade": 4, "skills": ["dãy số cách đều", "tổng dãy số", "tính nhanh"], "mock": false, "mc": null, "key": ["1012"], "gradable": true}, {"id": "TDN-2022-3", "school": "TDN", "year": "2022", "part": "DT", "q_no": 3, "points": 2, "statement": "Từ 400 đến 900, có bao nhiêu số tự nhiên mà tổng các chữ số của số đó bằng 10? Kết quả là: ............................... số", "has_figure": false, "garbled": false, "answer": "25 số", "solution": "Gọi số cần tìm là abc (400 ≤ abc ≤ 900).\nĐể tổng các chữ số của số cần tìm bằng 10 thì abc có dạng: 4bc → b + c = 6 → (b,\nc) có thể là (6; 0), (5; 1), (4; 2), (3; 3) → có 2 + 2 + 2 + 1 = 7 (số).\n5bc → b + c = 5 → (b,\nc) có thể là (5; 0), (4; 1), (3; 2) → có 2 + 2 + 2 = 6 (số).\n6bc → b + c = 4 → (b,\nc) có thể là (4; 0), (3; 1), (2; 2) → có 2 + 2 + 1 = 5 (số).\n7bc → b + c = 3 → (b,\nc) có thể là (3; 0), (2; 1) → có 2 + 2 = 4 (số).\n8bc → b + c = 2 → (b,\nc) có thể là (2; 0), (1; 1) → có 2 + 1 = 3 (số).\nVậy từ 400 đến 900 có 7 + 6 + 5 + 4 + 3 = 25 số tự nhiên mà tổng các chữ số của số đó bằng 10. Kết quả là: 25 (số)", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["đếm số", "tổng các chữ số", "liệt kê có hệ thống"], "mock": false, "mc": null, "key": ["25"], "gradable": true}, {"id": "TDN-2022-4", "school": "TDN", "year": "2022", "part": "TL", "q_no": 4, "points": 9, "statement": "Một xe máy đi từ A lúc 6 giờ 47 phút với vận tốc 36 km/giờ. Đến 7 giờ 2 phút, một ô tô cũng đi từ A đuổi theo xe máy với vận tốc 54 km/giờ.\na) Hỏi ô tô đuổi kịp xe máy lúc mấy giờ?\nb) Sau khi hai xe gặp nhau tại C, xe máy quay về A, còn ô tô tiếp tục đi thêm một quãng đường nữa đến D rồi mới quay về A. Hỏi quãng đường CD dài bao nhiêu ki-lô-mét, biết rằng ô tô về đến A cùng lúc với xe máy? (Hình vẽ: các điểm A, C, D trên một đường thẳng.)", "has_figure": true, "garbled": false, "answer": "a) 7 giờ 32 phút; b) CD = 6,75 km", "solution": "a) 7 giờ 2 phút - 6 giờ 47 phút = 15 phút = 1/4 giờ.\nSau 15 phút, xe máy đi được: 36 × 1/4 = 9 (km).\nMỗi giờ ô tô gần xe máy: 54 – 36 = 18 (km).\nThời gian ô tô đuổi kịp xe máy: 9 : 18 = 1/2 (giờ) = 30 phút.\nVậy ô tô đuổi kịp xe máy lúc 7 giờ 32 phút.\nb)\nThời gian xe máy từ C về đến A: 30 + 15 = 45 (phút).\nDo đó để gặp xe máy tại A, ô tô cũng phải đi 45 phút.\nTrong 45 phút = 3/4 giờ, ô tô đi được: 54 × 3/4 = 40,5 (km).\nQuãng đường AC dài: 54 × 1/2 = 27 (km).\nQuãng đường CD dài: (40,5 – 27) : 2 = 6,75 (km)", "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động cùng chiều", "đuổi kịp", "vận tốc – quãng đường – thời gian"], "mock": false, "mc": null, "key": ["32", "6.75", "7"], "gradable": true}, {"id": "TDN-2023-1", "school": "TDN", "year": "2023", "part": "DT", "q_no": 1, "points": 3, "statement": "Điền số thích hợp vào chỗ trống. Có ...... số tự nhiên mà khi chia 86 cho các số đó đều có dư là 5.", "has_figure": false, "garbled": false, "answer": "3", "solution": "Gọi số tự nhiên cần tìm là a (a khác 0; 1 và a > 5).\nTa có 86 chia cho a có dư là 5 nên (86 – 5) chia hết cho a.\nHay 81 chia hết cho a.\nMà a khác 1 và a > 5 → a = 9; 27; 81.\nVậy có 3 số tự nhiên mà khi chia 86 cho các số đó đều có dư là 5.\nĐáp án: 3", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["số dư", "chia hết", "ước số"], "mock": false, "mc": null, "key": ["3"], "gradable": true}, {"id": "TDN-2023-2", "school": "TDN", "year": "2023", "part": "DT", "q_no": 2, "points": 3, "statement": "Điền số thích hợp vào chỗ trống. An và Bình cùng tham gia đua xe đạp. Các vận động viên xuất phát cùng một lúc tại điểm xuất phát và về đích tại các thời điểm khác nhau. An về ngay sau Bình và xếp ở vị trí thứ 15, Bình xếp thứ tư tính từ dưới lên. Vậy có tất cả ...... vận động viên tham gia cuộc đua.", "has_figure": false, "garbled": false, "answer": "17", "solution": "An về ngay sau Bình và xếp ở vị trí thứ 15 nên Bình xếp ở vị trí 14. Bình xếp thứ tư tính từ dưới lên → Có tất cả 17 vận động viên tham gia cuộc đua.\nĐáp án: 17", "unit": "c6", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["suy luận", "thứ tự", "đếm"], "mock": false, "mc": null, "key": ["17"], "gradable": true}, {"id": "TDN-2023-3", "school": "TDN", "year": "2023", "part": "DT", "q_no": 3, "points": 3, "statement": "Các số tự nhiên lẻ 1, 3, 5, 7, …, 2021, 2023, … được điền vào một bảng dưới đây. Trong đó các số ở hàng lẻ được sắp xếp theo thứ tự tăng dần từ trái sang phải còn các số ở hàng chẵn được sắp xếp theo thứ tự tăng dần từ phải sang trái. Hỏi số 2023 nằm ở hàng mấy? Cột nào? Bảng (cột A, B, C, D): Hàng Một: 1, 3, 5, 7; Hàng Hai: 15, 13, 11, 9; Hàng Ba: 17, 19, 21, 23; Hàng Bốn: 31, 29, 27, 25; … Điền đáp số vào chỗ trống. Hàng: ...... Cột: ......", "has_figure": false, "garbled": false, "answer": "Hàng: 253; Cột: D", "solution": "Số 2023 là số hạng thứ (2023 – 1) : 2 + 1 = 1012 của dãy số đã cho.\nTa thấy cứ 4 số được xếp vào 1 hàng.\nMà 1012 : 4 = 253 nên số 2023 nằm ở hàng thứ 253. Lại có 1012 chia hết cho 4 nên số 2023 nằm ở cột D.\nĐáp án: Hàng: 253 (1,5 điểm); Cột: D (1,5 điểm)", "unit": "u15", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["dãy số", "quy luật bảng", "số lẻ", "tìm vị trí"], "mock": false, "mc": null, "key": ["253"], "gradable": true}, {"id": "TDN-2023-4", "school": "TDN", "year": "2023", "part": "TL", "q_no": 4, "points": 6, "statement": "Một mảnh đất hình chữ nhật có chiều dài gấp ba lần chiều rộng. Nếu tăng chiều dài thêm 1 m và tăng chiều rộng thêm 1 m thì được mảnh đất hình chữ nhật mới có diện tích hơn diện tích mảnh đất lúc đầu là 17 m2.\na) Vẽ một hình biểu diễn mảnh đất lúc đầu và lúc sau.\nb) Tính diện tích của mảnh đất lúc đầu.", "has_figure": false, "garbled": false, "answer": "b) 48 m2", "solution": "a)\nHình vẽ, trong đó: Vẽ được mảnh đất lúc đầu, lúc sau (1 điểm).\nThể hiện được 4 hình chữ nhật bằng nhau (0,5 điểm).\nThể hiện được hình vuông cạnh 1 m (0,5 điểm).\nb)\nTheo hình vẽ, phần diện tích tăng thêm 17 m2 bao gồm bốn hình chữ nhật nhỏ bằng nhau chiều rộng bằng 1 m và một hình vuông cạnh bằng 1 m.\nDiện tích hình vuông: 1 x 1 = 1 (m2).\nDiện tích hình chữ nhật nhỏ: (17 – 1) : 4 = 4 (m2).\nChiều dài hình chữ nhật nhỏ cũng chính là chiều rộng mảnh đất: 4 : 1 = 4 (m).\nChiều dài mảnh đất: 4 x 3 = 12 (m).\nDiện tích mảnh đất: 12 x 4 = 48 (m2).\nĐáp số: 48 m2", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 4, "skills": ["diện tích hình chữ nhật", "cắt ghép hình", "vẽ hình", "tổng – tỉ"], "mock": false, "mc": null, "key": ["2", "48"], "gradable": true}, {"id": "TDN-2024-1", "school": "TDN", "year": "2024", "part": "DT", "q_no": 1, "points": 6, "statement": "Có 100 chiếc lồng đèn được đánh số từ 1 đến 100. Bật sáng tất cả các lồng đèn, sau đó tắt các lồng đèn có số chia hết cho 3.\na) Hỏi có bao nhiêu lồng đèn đã tắt?\nb) Tiếp tục tắt các lồng đèn có số chia hết cho 5. Hỏi sau hai lần tắt, có bao nhiêu lồng đèn còn sáng? Điền kết quả vào ô trống:\na) _________\nb) _________", "has_figure": false, "garbled": false, "answer": "a) 33 chiếc lồng đèn; b) 53 chiếc lồng đèn", "solution": "a)\nCác lồng đèn có số chia hết cho 3 sẽ bắt đầu từ lồng đèn đánh số 3 đến lồng đèn đánh số 99. Mỗi số trên lồng đèn chia hết cho 3 cách nhau 3 đơn vị.\nSố lồng đèn đã tắt là: (99 – 3) : 3 + 1 = 33 (chiếc lồng đèn).\nb)\nCác lồng đèn có số chia hết cho 5 sẽ bắt đầu từ lồng đèn đánh số 5 đến lồng đèn đánh số 95. Mỗi số trên lồng đèn chia hết cho 5 cách nhau 5 đơn vị.\nSố lồng đèn chia hết cho 5 bị tắt là: (95 – 5) : 5 + 1 = 20 (chiếc lồng đèn).\nSố lồng đèn bị tắt được đánh số vừa chia hết cho 3 vừa chia hết cho 5 bắt đầu từ lồng đèn đánh số 15 đến lồng đèn đánh số 90. Mỗi số trên lồng đèn chia hết cho 3 và 5 cách nhau 15 đơn vị.\nSố lồng đèn được đánh số chia hết cho 3 và cho 5 đã tắt là: (90 – 15) : 15 + 1 = 6 (chiếc lồng đèn).\nTổng số lồng đèn bị tắt là: 33 + 20 – 6 = 47 (chiếc lồng đèn).\nSố lồng đèn còn lại là: 100 – 47 = 53 (chiếc lồng đèn).\nĐáp số:\na) 33 chiếc lồng đèn;\nb) 53 chiếc lồng đèn", "unit": "c2", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["chia hết", "đếm số hạng dãy cách đều", "bao hàm – loại trừ"], "mock": false, "mc": null, "key": ["33", "53"], "gradable": true}, {"id": "TDN-2024-2", "school": "TDN", "year": "2024", "part": "DT", "q_no": 2, "points": 3, "statement": "Mùa giải Bundesliga (giải vô địch bóng đá Đức) năm 2024, đội Bayer Leverkusen lên ngôi vô địch với thành tích không thua trận nào sau 34 trận đấu, giành được 90 điểm. Hỏi trong 34 trận trên, đội này có bao nhiêu trận thắng? Biết rằng mỗi trận thắng được 3 điểm, hòa được 1 điểm và thua thì không có điểm. Điền kết quả vào chỗ trống: _________", "has_figure": false, "garbled": false, "answer": "28 trận", "solution": "Nếu đội giành được 34 trận đấu thắng thì số điểm đội có là: 3 x 34 = 102 (điểm).\nSố điểm nếu đội giành được 34 trận đấu thắng nhiều hơn số điểm thực tế là: 102 – 90 = 12 (điểm).\nSố điểm của trận thắng nhiều hơn số điểm của trận hòa là: 3 – 1 = 2 (điểm).\nSố trận hòa của đội là: 12 : 2 = 6 (trận).\nSố trận thắng của đội là: 34 – 6 = 28 (trận).\nĐáp số: 28 trận", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["giả thiết tạm", "bài toán thực tế"], "mock": false, "mc": null, "key": ["28"], "gradable": true}, {"id": "TDN-2024-3", "school": "TDN", "year": "2024", "part": "TL", "q_no": 3, "points": 6, "statement": "Để chuẩn bị sân khấu cho buổi lễ tổng kết năm học, nhà trường cần sơn các mặt của bậc tam cấp gỗ. Mỗi bậc tam cấp đều có chiều rộng 3 dm, chiều dài 12 dm và chiều cao 2 dm (xem hình vẽ). Tính tổng diện tích các mặt cần sơn của bậc tam cấp trên. Biết rằng không sơn mặt đáy và mặt sau của bậc tam cấp.", "has_figure": true, "garbled": false, "answer": "252 dm2", "solution": "Tổng diện tích các mặt trước là: 2 x 12 x 3 + 3 x 12 x 3 = 180 (dm2).\nTổng diện tích các mặt bên là: (2 x 9 + 2 x 6 + 2 x 3) x 2 = 72 (dm2).\nTổng diện tích các mặt cần sơn là: 180 + 72 = 252 (dm2).\nĐáp số: 252 (dm2)", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 5, "skills": ["hình ghép", "diện tích các mặt", "hình hộp chữ nhật"], "mock": false, "mc": null, "key": ["2", "252"], "gradable": true}], UNITS=[["u1", "1.1 Số tự nhiên & giá trị theo hàng", "Cambridge"], ["u2", "1.2 Số thập phân", "Cambridge"], ["u3", "1.3 Phân số", "Cambridge"], ["u4", "1.4 Tỉ số & phần trăm", "Cambridge"], ["u5", "2.1 Thời gian", "Cambridge"], ["u6", "2.2 Hình, góc, chu vi, diện tích", "Cambridge"], ["u7", "2.3 Đối xứng", "Cambridge"], ["u8", "2.4 Tọa độ", "Cambridge"], ["u12", "3.4 Bảng & biểu đồ", "Cambridge"], ["u14", "3.6 Trung bình cộng & biểu đồ", "Cambridge"], ["u15", "3.7 Dãy số & quy luật", "Cambridge"], ["u16", "3.8 Xác suất", "Cambridge"], ["c1", "4.1 Tính nhanh & biểu thức", "Toán chuyên"], ["c2", "4.2 Cấu tạo số, chia hết, chữ số", "Toán chuyên"], ["c3", "4.3 Tìm hai số, tuổi, tỉ số", "Toán chuyên"], ["c4", "4.4 Chuyển động đều", "Toán chuyên"], ["c5", "4.5 Công việc, năng suất, kinh tế", "Toán chuyên"], ["c6", "4.6 Suy luận logic & đếm", "Toán chuyên"], ["c7", "4.7 Hình học nâng cao &   let fee=0;if(p.a===1){if(G.coins<FEE){p.msg=`Không đủ xu để nộp lại (cần ${FEE} xu).`;p.msgKind='info';return rerenderOne(r.id);}G.coins-=FEE;fee=FEE;}

  if(ok){const w=winOf(r);p.ok=true;G.coins+=w;p.msg=r.vn_grade===5?`Đúng rồi! Bài lớp 5 — +${w} xu.`:`Đúng rồi! +${w} xu.`;logEv(r,'submit',`Lần ${p.a}: trả lời "${p.draft}" — đúng`,w-fee);}
  else{G.coins-=LOSE;p.msgKind='bad';logEv(r,'submit',`Lần ${p.a}: trả lời "${p.draft}" — sai`,-LOSE-fee);p.msg=p.a<2?`Chưa đúng. −${LOSE} xu. Con được nộp lại 1 lần nữa (phí ${FEE} xu).`:`Chưa đúng. −${LOSE} xu. Hết lượt nộp — con có thể xem đáp án.`;}
  bump();rerenderOne(r.id);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-period],[data-goto],[data-u],[data-s],[data-g],[data-d],[data-back],[data-pick],[data-submit],[data-ask],[data-yes],[data-no],[data-view],[data-toggle],[data-info],[data-ppw],[data-ppwgo],[data-ppwno],[data-pplock],[data-period]');if(!t)return;
  const ex=t.closest('[data-ex]');const r=ex?DATA.find(x=>x.id===ex.dataset.ex):null;
  if(t.dataset.toggle&&r){open.has(r.id)?open.delete(r.id):open.add(r.id);return rerenderOne(r.id);}
  if(t.dataset.info&&r){infoOpen.has(r.id)?infoOpen.delete(r.id):infoOpen.add(r.id);return rerenderOne(r.id);}
  if(t.dataset.pick&&r){P(r.id).draft=t.dataset.pick;return rerenderOne(r.id);}
  if(t.dataset.submit&&r)return submit(r);
  if(t.dataset.ask&&r){pend[r.id]=true;return rerenderOne(r.id);}
  if(t.dataset.no&&r){delete pend[r.id];return rerenderOne(r.id);}
  if(t.dataset.yes&&r){delete pend[r.id];if(G.coins<PEEK)return rerenderOne(r.id);G.coins-=PEEK;P(r.id).seen=true;logEv(r,'peek','Mở khóa đáp án',-PEEK);bump();open.add(r.id);if(st.tab==='ans'){return rerenderOne(r.id);}st.tab='ans';st.target=r.id;return render();}
  if(t.dataset.ppw&&r){pwPend.add(r.id);pwErr.delete(r.id);rerenderOne(r.id);const f=document.getElementById('ppw-'+r.id);if(f)f.focus();return;}
  if(t.dataset.ppwno&&r){pwPend.delete(r.id);pwErr.delete(r.id);return rerenderOne(r.id);}
  if(t.dataset.pplock&&r){parentPeek.delete(r.id);open.delete(r.id);pwPend.delete(r.id);pwErr.delete(r.id);return rerenderOne(r.id);}
  if(t.dataset.ppwgo&&r){const f=document.getElementById('ppw-'+r.id);const v=f?f.value:'';if(f)f.value='';return ppwApply(r,v);}
  if(t.dataset.period){st.period=t.dataset.period;render();return;}
  if(t.dataset.goto){st.tab='ans';st.target=t.dataset.goto;infoOpen.add(st.target);render();return;}
  if(t.dataset.view&&r){if(r.gradable&&!(G.p[r.id]||{}).seen)logEv(r,'view','Xem lại đáp án (bài đã đúng)',0);st.tab='ans';st.target=r.id;return render();}
  if(t.dataset.back){const rr=DATA.find(x=>x.id===t.dataset.back);st.tab=rr&&!rr.gradable?'no':'ex';st.target=null;render();
    const el=document.querySelector(`.ex[data-ex="${CSS.escape(t.dataset.back)}"]`);if(el)el.scrollIntoView({block:'center'});return;}
  if(t.dataset.u){st.unit=t.dataset.u}else if(t.dataset.s){st.school=t.dataset.s}else if(t.dataset.g){st.grade=t.dataset.g}else if(t.dataset.d){st.diff=t.dataset.d}
  st.shown=60;st.target=null;st._top=true;render();});
document.addEventListener('input',e=>{const inp=e.target.closest('.inp');if(!inp)return;const ex=inp.closest('.ex');const p=P(ex.dataset.ex);p.draft=inp.value.trim();
  const b=ex.querySelector('[data-submit]');if(b)b.disabled=!p.draft;save();});
document.addEventListener('keydown',e=>{const pf=e.target.closest('.ppwi');if(pf&&e.key==='Enter'){e.preventDefault();const ex=pf.closest('[data-ex]');const r=ex?DATA.find(x=>x.id===ex.dataset.ex):null;const v=pf.value;pf.value='';if(r)ppwApply(r,v);return;}
if(e.key==='Enter'&&e.target.closest('.inp')){const ex=e.target.closest('.ex');const r=DATA.find(x=>x.id===ex.dataset.ex);if(r)submit(r);}});
$('#tabEx').onclick=()=>{st.tab='ex';st.target=null;st._top=true;render()};$('#tabNo').onclick=()=>{st.tab='no';st.target=null;st._top=true;render()};$('#tabAns').onclick=()=>{st.tab='ans';st.target=null;st._top=true;render()};$('#tabLog').onclick=()=>{st.tab='log';st.target=null;st._top=true;render()};
$('#hideDone').onchange=e=>{st.hideDone=e.target.checked;render()};$('#hideMock').onchange=e=>{st.hideMock=e.target.checked;render()};$('#parent').onchange=e=>{st.parent=e.target.checked;render()};
$('#collapse').onclick=()=>{st.side=!st.side;document.querySelector('.grid').classList.toggle('collapsed',!st.side);save();};
document.querySelector('.grid').classList.toggle('collapsed',!st.side);
$('#unitSel').onchange=e=>{st.unit=e.target.value;st.shown=60;st.target=null;st._top=true;render()};$('#sideBtn').onclick=()=>{const sd=document.querySelector('.side');sd.classList.toggle('show');$('#sideBtn').textContent=sd.classList.contains('show')?'Ẩn bộ lọc':'Bộ lọc';};
$('#q').oninput=e=>{st.q=e.target.value;st.shown=60;render()};$('#more').onclick=()=>{st.shown+=60;render()};
function resetClick(){$('#resetBox').innerHTML=`<div class="confirm"><span>Xóa hết xu và bài đã làm, về 50 xu?</span><button type="button" class="btn" id="resetYes">Xóa</button><button type="button" class="btn ghost" id="resetNo">Thôi</button></div>`;
  $('#resetYes').onclick=()=>{const old=G.log||[];G={coins:START,p:{},log:old};G.log.push({t:Date.now(),id:'',unit:'',kind:'reset',detail:'Đặt lại xu & bài làm',delta:0,coins:START});try{localStorage.removeItem('khode-game');localStorage.removeItem('khode-v3');}catch(e){}save();location.reload();};
  $('#resetNo').onclick=()=>{$('#resetBox').innerHTML='<button class="btn ghost" id="reset" type="button">Đặt lại xu & bài làm</button>';bindReset();};}
bindReset();
function bindReset(){const b=$('#reset');if(b)b.onclick=resetClick;}
render();
</script>
