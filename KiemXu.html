ố bị phá trong bản trích xuất; tái dựng theo cấu trúc"}, {"id": "AMS-2021-13", "school": "AMS", "year": "2021", "part": "TL", "q_no": 13, "points": null, "statement": "Lớp 5A có số học sinh nam gấp đôi số học sinh nữ. Sau khi chuyển đi 2 học sinh nữ thì số học sinh nam bằng 5/2 số học sinh nữ. Hỏi ban đầu lớp đó có bao nhiêu học sinh?", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["bài toán hai tỉ số", "đại lượng không đổi"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2021-14", "school": "AMS", "year": "2021", "part": "TL", "q_no": 14, "points": null, "statement": "Minh đi từ A đến B, cùng lúc đó Ngọc đi từ B về A. Hai bạn gặp nhau lần thứ nhất ở điểm cách A 7 km. Sau đó, Minh lại đi tiếp tới B, Ngọc lại đi tiếp tới A rồi hai bạn quay trở về. Họ gặp nhau lần thứ hai ở điểm cách B 5 km. Hỏi quãng đường AB dài bao nhiêu km?", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "gặp nhau hai lần", "quãng đường"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2021-15", "school": "AMS", "year": "2021", "part": "TL", "q_no": 15, "points": null, "statement": "Cho hình thang ABCD, lấy điểm M trên đường chéo AC sao cho AM = 2 MC. Lấy điểm N bên cạnh CD sao cho BDNM là hình thang.\na) So sánh diện tích hai tam giác BDN và BDM.\nb) Tính tỉ số S(ABND) / S(BNC).", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình thang", "tỉ số diện tích", "tam giác chung đáy"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2023-1", "school": "AMS", "year": "2023", "part": "DT", "q_no": 1, "points": null, "statement": "Thực hiện phép tính: (96 × 0,25 – 2,1 : 0,1) + (250 × 0,1 – 80 : 4)", "has_figure": false, "garbled": false, "answer": "8", "solution": "(96 × 0,25 – 2,1 : 0,1) + (250 × 0,1 – 80 : 4) = (24 – 21) + (25 – 20) = 3 + 5 = 8.\nĐáp số: 8", "unit": "u2", "unit_alt": "c1", "difficulty": 1, "vn_grade": 5, "skills": ["số thập phân", "thứ tự thực hiện phép tính"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "AMS-2023-2", "school": "AMS", "year": "2023", "part": "DT", "q_no": 2, "points": null, "statement": "Biết số 224ab chia hết cho 2; 3 và 5. Tìm a × b.", "has_figure": false, "garbled": false, "answer": "0", "solution": "Vì số 224ab chia hết cho 2 và 5 nên b = 0.\nDo đó a × b = a × 0 = 0.\nĐáp số: 0", "unit": "c2", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dấu hiệu chia hết", "chia hết cho 2, 3, 5"], "mock": false, "mc": null, "key": ["0"], "gradable": true}, {"id": "AMS-2023-3", "school": "AMS", "year": "2023", "part": "DT", "q_no": 3, "points": null, "statement": "Trung bình cộng 25 số chẵn liên tiếp bằng 32. Hỏi tỉ số giữa số nhỏ nhất và số lớn nhất là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "1/7", "solution": "Vì 25 số đã cho là 25 số chẵn liên tiếp nên trung bình cộng của 25 số này bằng trung bình cộng của số nhỏ nhất và số lớn nhất.\nTổng số nhỏ nhất và số lớn nhất là: 32 × 2 = 64. Số chẵn lớn nhất hơn số chẵn bé nhất là: (25 − 1)\n× 2 = 48. Số chẵn bé nhất là: (64 – 48) : 2 = 8. Số chẵn lớn nhất là: 64 – 8 = 56. Tỉ số giữa số nhỏ nhất và số lớn nhất là 8 : 56 = 1/7.\nĐáp số: 1/7", "unit": "u14", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["trung bình cộng", "dãy số chẵn liên tiếp", "tỉ số"], "mock": false, "mc": null, "key": ["1/7"], "gradable": true}, {"id": "AMS-2023-4", "school": "AMS", "year": "2023", "part": "DT", "q_no": 4, "points": null, "statement": "Một khối lượng gạo dự tính đủ cho 15 người ăn trong 14 ngày. Vì số người thực tế nhiều hơn dự kiến nên số gạo đó chỉ đủ ăn trong 6 ngày. Tính số người tăng thêm, biết khẩu phần gạo của mỗi người trong 1 ngày như nhau.", "has_figure": false, "garbled": false, "answer": "20 người", "solution": "1 người ăn hết số gạo trong thời gian là: 14 × 15 = 210 (ngày).\nSố người để ăn hết số gạo trong thời gian 6 ngày là: 210 : 6 = 35 (người).\nSố người tăng thêm là: 35 – 15 = 20 (người).\nĐáp số: 20 người", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "rút về đơn vị"], "mock": false, "mc": null, "key": ["20"], "gradable": true}, {"id": "AMS-2023-5", "school": "AMS", "year": "2023", "part": "DT", "q_no": 5, "points": null, "statement": "Một tờ giấy có dạng như hình vẽ. Bạn Chúc gấp tờ giấy theo các nét đứt để làm thành một chiếc hộp hình lập phương không có nắp. Hỏi chữ cái ghi ở đáy của chiếc hộp là chữ cái nào?", "has_figure": true, "garbled": false, "answer": "Chữ N", "solution": "Ba chữ cái R, Q, M ở ba ô thẳng hàng nên sẽ nằm ở ba mặt bên của hình lập phương.\nDo đó chữ cái nằm ở đáy của chiếc hộp là chữ cái N.\nĐáp số: Chữ N", "unit": "c6", "unit_alt": "c7", "difficulty": 2, "vn_grade": 4, "skills": ["gấp hình lập phương", "hình khai triển", "suy luận"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-2023-6", "school": "AMS", "year": "2023", "part": "DT", "q_no": 6, "points": null, "statement": "Một tờ giấy hình chữ nhật có kích thước 15 cm × 20 cm. Người ta cắt mỗi góc của tờ giấy đó một hình vuông cạnh 5 cm. Sau đó gấp phần còn lại thành một hộp giấy hình hộp chữ nhật (không có nắp). Tính tổng diện tích 5 mặt trong của hộp giấy đó.", "has_figure": false, "garbled": false, "answer": "200 cm2", "solution": "Chiều rộng của hình hộp chữ nhật là: 15 – 5 × 2 = 5 (cm).\nChiều dài của hình hộp chữ nhật là: 20 − 5 × 2 = 10 (cm).\nDiện tích xung quanh của hình hộp chữ nhật là: (10 + 5)\n× 2 × 5 = 150 (cm2).\nDiện tích đáy của hình hộp chữ nhật là: 10 × 5 = 50 (cm2).\nDiện tích cần tính là: 150 + 50 = 200 (cm2).\nĐáp số: 200 cm2", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["hình hộp chữ nhật", "diện tích xung quanh", "cắt gấp"], "mock": false, "mc": null, "key": ["2", "200"], "gradable": true}, {"id": "AMS-2023-7", "school": "AMS", "year": "2023", "part": "DT", "q_no": 7, "points": null, "statement": "Mẹ chia 7 phong bao lì xì chứa số tiền bên trong là: 1; 3; 9; 27; 81; 243; 729 (đơn vị tính: nghìn đồng) cho hai anh em. Sau khi mở ra, Bình nhận thấy số tiền của mình ít hơn của em là 367 nghìn đồng. Hỏi Bình có bao nhiêu bao lì xì?", "has_figure": false, "garbled": false, "answer": "5 bao lì xì", "solution": "Tổng số tiền mẹ chia cho hai anh em là: 1 + 3 + 9 + 27 + 81 + 243 + 729 = 1093 (nghìn đồng).\nSố tiền Bình nhận được là: (1093 – 367) : 2 = 363 (nghìn đồng).\nSố tiền em Bình nhận được là: 1093 – 363 = 730 (nghìn đồng).\nVì số tiền của Bình nhận nhỏ hơn phong bao lì xì chứa số tiền 729 nghìn đồng nên em Bình là người nhận được phong bao lì xì 729 nghìn đồng.\nMà em Bình nhận được tổng số tiền là 730 nghìn đồng nên em Bình nhận được 2 bao lì xì là 1 nghìn đồng và 729 nghìn đồng.\nDo đó Bình nhận được 5 bao lì xì.\nĐáp số: 5 bao lì xì", "unit": "c6", "unit_alt": "c3", "difficulty": 3, "vn_grade": 4, "skills": ["tổng–hiệu", "suy luận", "lũy thừa của 3"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "AMS-2023-8", "school": "AMS", "year": "2023", "part": "DT", "q_no": 8, "points": null, "statement": "Cho một số tự nhiên có hai chữ số ab sao cho số đó gấp 8 lần tổng hai chữ số của nó. Tính a × 8 + b × 5.", "has_figure": false, "garbled": false, "answer": "66", "solution": "Theo đề bài ta có: ab = 8 × (a + b), tức 10 × a + b = 8 × a + 8 × b, suy ra 2 × a = 7 × b.\nMà a, b là các chữ số nên a = 7 và b = 2.\nVậy a × 8 + b × 5 = 7 × 8 + 2 × 5 = 66.\nĐáp số: 66", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["cấu tạo số", "phân tích cấu tạo số"], "mock": false, "mc": null, "key": ["66"], "gradable": true}, {"id": "AMS-2023-9", "school": "AMS", "year": "2023", "part": "DT", "q_no": 9, "points": null, "statement": "Cô giáo An cho một số và yêu cầu thực hiện phép tính đem số đó cộng với 5 rồi chia cho 6. Nhưng do nghe nhầm nên An cộng với 6 rồi chia cho 5 nên kết quả sai là 2429. Tìm kết quả đúng.", "has_figure": false, "garbled": false, "answer": "2024", "solution": "Số trước khi An đem chia cho 5 là: 2429 × 5 = 12145. Số cô giáo cho An là: 12145 – 6 = 12139. Kết quả đúng là: (12139 + 5) : 6 = 2024.\nĐáp số: 2024", "unit": "c1", "unit_alt": "u1", "difficulty": 1, "vn_grade": 4, "skills": ["tính ngược", "tìm số chưa biết"], "mock": false, "mc": null, "key": ["2024"], "gradable": true}, {"id": "AMS-2023-10", "school": "AMS", "year": "2023", "part": "DT", "q_no": 10, "points": null, "statement": "Có một cửa hàng bán xăng dầu vào quý I. Vào quý II, cửa hàng tăng giá 12% so với quý I. Vào quý III, cửa hàng tăng 10% nữa so với quý II. Quý IV, cửa hàng bán xăng giảm 10% so với quý III. Hỏi so với quý I thì giá xăng quý IV của cửa hàng tăng hay giảm bao nhiêu phần trăm.", "has_figure": false, "garbled": false, "answer": "tăng 10,88%", "solution": "Giá bán xăng của cửa hàng quý II so với quý I là: 100% + 12% = 112% (giá xăng quý I).\nGiá bán xăng của cửa hàng quý III so với quý I là: 112% × 110% = 123,2% (giá xăng quý I).\nGiá bán xăng của cửa hàng quý IV so với quý I là: 123,2% × 90% = 110,88% (giá xăng quý I).\nGiá bán xăng của cửa hàng quý IV tăng so với quý I là: 110,88% – 100% = 10,88% (giá xăng quý I).\nĐáp số: tăng 10,88%", "unit": "u4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tăng giảm giá liên tiếp"], "mock": false, "mc": null, "key": ["10.88"], "gradable": true}, {"id": "AMS-2023-11", "school": "AMS", "year": "2023", "part": "DT", "q_no": 11, "points": null, "statement": "Tìm chữ số tận cùng của số: A = 8 × 8 × 8 × ... × 8 + 1 (2024 thừa số 8).", "has_figure": false, "garbled": false, "answer": "7", "solution": "Tích của 4 số 8 (8 × 8 × 8 × 8) có tận cùng là chữ số 6. Mà 2024 chia hết cho 4 nên A có tận cùng là 7.\nĐáp số: 7", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["chữ số tận cùng", "chu kỳ"], "mock": false, "mc": null, "key": ["7"], "gradable": true}, {"id": "AMS-2023-12", "school": "AMS", "year": "2023", "part": "DT", "q_no": 12, "points": null, "statement": "Cho A = 1/(1 × 300) + 1/(2 × 301) + 1/(3 × 302) + ... + 1/(101 × 400) và B = 1/(1 × 102) + 1/(2 × 103) + 1/(3 × 104) + ... + 1/(299 × 400). Tính tỉ số A/B.", "has_figure": false, "garbled": false, "answer": "A/B = 101/299", "solution": "Ta có 299 × A = 299/(1 × 300) + 299/(2 × 301) + 299/(3 × 302) + ... + 299/(101 × 400) = (1 − 1/300) + (1/2 − 1/301) + (1/3 − 1/302) + ... + (1/101 − 1/400) = (1 + 1/2 + 1/3 + ... + 1/101) − (1/300 + 1/301 + 1/302 + ... + 1/400).\nTa có 101 × B = 101/(1 × 102) + 101/(2 × 103) + 101/(3 × 104) + ... + 101/(299 × 400) = (1 − 1/102) + (1/2 − 1/103) + (1/3 − 1/104) + ... + (1/299 − 1/400) = (1 + 1/2 + 1/3 + ... + 1/299) − (1/102 + 1/103 + 1/104 + ... + 1/400) = (1 + 1/2 + 1/3 + ... + 1/101) − (1/300 + 1/301 + 1/302 + ... + 1/400).\nSuy ra 299 × A = 101 × B hay A/B = 101/299.", "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh", "so sánh biểu thức"], "mock": false, "mc": null, "key": ["101/299"], "gradable": true}, {"id": "AMS-2023-TL1", "school": "AMS", "year": "2023", "part": "TL", "q_no": 1, "points": null, "statement": "Cho hình vẽ. Biết hình vuông nhỏ có cạnh 4 cm, hình vuông lớn có cạnh 6 cm. Tính diện tích phần tô đậm.", "has_figure": true, "garbled": false, "answer": "3,2 cm2", "solution": "Gọi tên các điểm như hình vẽ.\nTổng diện tích hai hình vuông là: 6 × 6 + 4 × 4 = 52 (cm2).\nDiện tích tam giác ADE là: 6 × (6 − 4) : 2 = 6 (cm2).\nDiện tích tam giác EFG là: 4 × 4 : 2 = 8 (cm2).\nDiện tích tam giác ABG là: 6 × (6 + 4) : 2 = 30 (cm2).\nDiện tích tam giác AEG là: 52 – 6 – 8 – 30 = 8 (cm2).\nXét tam giác AEH và tam giác GEH có chung đáy EH nên S(AEH)/S(GEH) = AD/GC = 6/4 = 3/2.\nSuy ra diện tích tam giác GEH là 8 : (3 + 2)\n× 2 = 3,2 (cm2).\nĐáp số: 3,2 cm2", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["diện tích phần tô đậm", "tỉ số diện tích", "hình vuông ghép"], "mock": false, "mc": null, "key": ["2", "3.2"], "gradable": true}, {"id": "AMS-2023-TL2", "school": "AMS", "year": "2023", "part": "TL", "q_no": 2, "points": null, "statement": "Lớp 5A có 36 học sinh, cứ 2 bạn ngồi 1 bàn. Cô giáo nhận thấy 50% số bạn nam ngồi cạnh bạn nữ và 40% số bạn nữ ngồi cạnh bạn nam. Hỏi có bao nhiêu bàn có 2 bạn nữ.", "has_figure": false, "garbled": false, "answer": "6 bàn", "solution": "Vì 50% số bạn nam ngồi cạnh bạn nữ và 40% số bạn nữ ngồi cạnh bạn nam nên 50% số bạn nam bằng 40% số bạn nữ.\nTỉ số giữa số học sinh nam so với số học sinh nữ là: 40% : 50% = 4/5. Số học sinh nữ là: 36 : (4 + 5)\n× 5 = 20 (học sinh).\nSố học sinh nữ ngồi cạnh các bạn nam là: 20 × 40 : 100 = 8 (học sinh).\nSố bàn có 2 bạn nữ là: (20 – 8) : 2 = 6 (bàn).\nĐáp số: 6 bàn", "unit": "u4", "unit_alt": "c3", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tổng–tỉ", "suy luận"], "mock": false, "mc": null, "key": ["6"], "gradable": true}, {"id": "AMS-2023-TL3", "school": "AMS", "year": "2023", "part": "TL", "q_no": 3, "points": null, "statement": "Đăng và Khoa chạy trên một đường tròn khép kín, hai bạn xuất phát cùng một vị trí nhưng ngược chiều nhau. Đăng và Khoa lần lượt chạy hết đường tròn trong 5 phút và 6 phút. Hỏi sau bao nhiêu lần gặp nhau thì hai bạn gặp nhau lần đầu ở điểm xuất phát (không tính lần gặp nhau khi xuất phát).", "has_figure": false, "garbled": false, "answer": "10 lần", "solution": "Khi hai bạn gặp nhau lần đầu tiên ở điểm xuất phát (không tính lần gặp nhau khi xuất phát) thì hai bạn đã chạy được tròn các số vòng.\nDo đó thời gian bạn Đăng chạy được sẽ là số chia hết cho 5, thời gian bạn Khoa chạy được sẽ là số chia hết cho 6. Mà thời gian hai bạn chạy là bằng nhau (xuất phát cùng lúc) nên khi gặp nhau lần đầu tiên ở điểm xuất phát thì thời gian chạy của hai bạn là số chia hết cho cả 5 và 6.\nSuy ra sau 30 phút, hai bạn gặp nhau lần đầu ở điểm xuất phát.\nKhi đó, Đăng chạy được 6 vòng và Khoa chạy được 5 vòng.\nTổng hai bạn chạy được 6 + 5 = 11 (vòng).\nDo đó, số lần hai bạn gặp nhau trước khi gặp nhau ở điểm xuất phát là: 11 – 1 = 10 (lần).", "unit": "c4", "unit_alt": "c6", "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động tròn", "bội chung nhỏ nhất", "gặp nhau"], "mock": false, "mc": null, "key": ["10"], "gradable": true}, {"id": "AMS-1993-1", "school": "AMS", "year": "1993", "part": "TL", "q_no": 1, "points": 2.5, "statement": "Hai ô tô cùng xuất phát đi ngược chiều nhau trên đường Hà Nội - Hải Phòng, gặp nhau cách Hà Nội 40 km. Sau khi gặp nhau ô tô đi từ Hà Nội tiếp tục về Hải Phòng và sau đó quay về Hà Nội ngay; ô tô đi từ Hải Phòng cũng tiếp tục đi Hà Nội và sau đó cũng quay về Hải Phòng ngay. Hai ô tô gặp nhau lần thứ hai cách Hải Phòng 18 km. Tính quãng đường Hà Nội - Hải Phòng.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "gặp nhau hai lần", "quãng đường"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-1993-2", "school": "AMS", "year": "1993", "part": "TL", "q_no": 2, "points": 2.5, "statement": "Hãy chứng tỏ rằng tổng A = 1 + 2 + 3 + … + n (n là số tự nhiên) không thể tận cùng là 2, 4, 7, 9.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c2", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["chữ số tận cùng", "tổng dãy cách đều", "chứng minh"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-1993-3", "school": "AMS", "year": "1993", "part": "TL", "q_no": 3, "points": 2.5, "statement": "Năm học sinh được thưởng 35 quyển vở. Số vở của học sinh được thưởng nhiều nhất gấp 4 số vở của học sinh được thưởng ít nhất. Hỏi mỗi học sinh có thể được thưởng bao nhiêu quyển vở, biết rằng số vở được thưởng của mỗi học sinh khác nhau.", "has_figure": false, "garbled": false, "answer": null, "solution": null, "unit": "c6", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["suy luận", "thử chọn", "tổng các số khác nhau"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "AMS-1993-4", "school": "AMS", "year": "1993", "part": "TL", "q_no": 4, "points": 2.5, "statement": "Hãy điền các số vào các ô còn trống của bảng dưới đây sao cho tổng các số trong 3 ô liền nhau bất kì theo hàng dọc cũng như hàng ngang đều bằng 10.", "has_figure": true, "garbled": true, "answer": null, "solution": null, "unit": "c6", "unit_alt": "u12", "difficulty": 3, "vn_grade": 4, "skills": ["điền số vào bảng", "suy luận", "quy luật"], "mock": false, "mc": null, "key": [], "gradable": false, "ed_note": "bảng có 4 hàng × 6 cột; một số ô đã điền sẵn các số 1, 2, 4, 5 — bảng không tái dựng được chính xác từ bản trích xuất"}, {"id": "ARC-2020-CB-1", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 1, "points": null, "statement": "Từ 1 đến 100 có bao nhiêu chữ số 1?", "has_figure": false, "garbled": false, "answer": "21", "solution": "Từ 1 đến 100 có: Chữ số 1 thuộc hàng trăm: 100 → 1 chữ số 1. Chữ số 1 thuộc hàng chục: 10, 11, 12, …, 19 → 10 chữ số 1. Chữ số 1 thuộc hàng đơn vị: 91, 81, 71, 61, 51, 41, 31, 21, 11, 1 → 10 chữ số 1.\nVậy từ 1 đến 100 có số chữ số 1 là: 1 + 10 + 10 = 21 (chữ số 1).\nĐáp số: 21", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["đếm chữ số", "cấu tạo số"], "mock": false, "mc": null, "key": ["21"], "gradable": true}, {"id": "ARC-2020-CB-2", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 2, "points": null, "statement": "3,6 x 7,4 = ?", "has_figure": false, "garbled": false, "answer": "26,64", "solution": "3,6 x 7,4 = 26,64", "unit": "u2", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["nhân số thập phân"], "mock": false, "mc": null, "key": ["26.64"], "gradable": true}, {"id": "ARC-2020-CB-3", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 3, "points": null, "statement": "60% của 7,5 là ?", "has_figure": false, "garbled": false, "answer": "4,5", "solution": "60% của 7,5 là 7,5 x 60 : 100 = 4,5", "unit": "u4", "unit_alt": "u2", "difficulty": 1, "vn_grade": 5, "skills": ["tỉ số phần trăm", "phần trăm của một số"], "mock": false, "mc": null, "key": ["4.5"], "gradable": true}, {"id": "ARC-2020-CB-4", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 4, "points": null, "statement": "Có 3 loại mảnh ghép hình tam giác, hình vuông và hình chữ nhật, tất cả có 240 hình. Số mảnh hình tam giác bằng 1/3 số mảnh hình vuông và hình chữ nhật. Số mảnh hình chữ nhật hơn số mảnh hình vuông là 40. Tìm số mảnh hình chữ nhật.", "has_figure": false, "garbled": false, "answer": "110 mảnh ghép", "solution": "Số mảnh hình tam giác bằng 1/3 số mảnh hình vuông và hình chữ nhật ⇒ Số mảnh hình tam giác bằng 1/4 tổng số mảnh ghép.\nSố mảnh ghép hình tam giác là: 240 x 1/4 = 60 (mảnh).\nSố mảnh ghép hình chữ nhật và hình vuông là: 240 - 60 = 180 (mảnh).\nSố mảnh hình chữ nhật là: (180 + 40) : 2 = 110 (mảnh).\nĐáp số: 110 mảnh ghép", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "tổng – hiệu", "phân số của một số"], "mock": false, "mc": null, "key": ["110"], "gradable": true}, {"id": "ARC-2020-CB-5", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 5, "points": null, "statement": "Tìm một số có hai chữ số. Biết rằng nếu viết thêm chữ số 1 vào giữa hai chữ số đó thì ta được số mới hơn 8 lần số ban đầu là 14 đơn vị. Tìm số ban đầu.", "has_figure": false, "garbled": false, "answer": "38", "solution": "Gọi số cần tìm là ab.\nTheo đề bài ta có a1b = ab x 8 + 14; a x 100 + 10 + b = a x 80 + b x 8 + 14; a x 20 = b x 7 + 4.\nSuy ra a = 3, b = 8.\nVậy số cần tìm là 38.", "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "viết thêm chữ số", "tìm số"], "mock": false, "mc": null, "key": ["38"], "gradable": true}, {"id": "ARC-2020-CB-6", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 6, "points": null, "statement": "Một lớp có 32 học sinh, tổng điểm kiểm tra môn Toán của tất cả các bạn là 292 điểm. Số học sinh điểm 9 gấp đôi số bạn học sinh được điểm 10. Tính số học sinh được điểm 8. Biết các bạn chỉ có thể đạt điểm 8; 9 hoặc 10.", "has_figure": false, "garbled": false, "answer": "5 bạn", "solution": "Giả sử cả 32 học sinh đều đạt điểm 8 thì tổng số điểm của cả lớp là: 32 x 8 = 256 (điểm).\nSố điểm hụt đi so với số điểm thực tế là 292 – 256 = 36 (điểm).\nSố bạn đạt điểm 10 là 36 : 4 = 9 (bạn).\nSố bạn đạt điểm 9 là 9 x 2 = 18 (bạn).\nSố bạn đạt điểm 8 là: 32 – 9 – 18 = 5 (bạn).\nĐáp số: 5 bạn", "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["giả thiết tạm", "tổng – tỉ"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "ARC-2020-CB-7", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 7, "points": null, "statement": "Cho B = 135791113….2021. Hỏi chữ số thứ 2020 là số mấy?", "has_figure": false, "garbled": false, "answer": "8", "solution": "Từ 1 đến 9 có số chữ số là: [(9 – 1) : 2 + 1] x 1 = 5 (chữ số).\nTừ 11 đến 99 có: [(99 - 11) : 2 + 1] x 2 = 90 (chữ số).\nTừ 101 đến 999 có: [(999 – 101) : 2 + 1] x 3 = 1350 (chữ số).\nTừ 1 đến 999 có: 5 + 90 + 1350 = 1445 (chữ số).\nSố chữ số còn lại ghi số có 4 chữ số là: 2020 – 1445 = 575 (chữ số).\nTa có: 575 : 4 = 143 (dư 3).\nSuy ra chữ số thứ 2020 thuộc chữ số thứ 3 của số có bốn chữ số thứ 144. Số có bốn chữ số thứ 144 là: 1001 + (144 – 1) x 2 = 1287.\nVậy chữ số thứ 2020 là số 8.", "unit": "c2", "unit_alt": "u15", "difficulty": 3, "vn_grade": 4, "skills": ["đếm chữ số", "dãy số", "số lẻ"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "ARC-2020-CB-8", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 8, "points": null, "statement": "Lúc 6 giờ sáng, một xe máy đi từ A đến B với vận tốc 40 km/giờ. Lúc 7 giờ, một ô tô đi từ B về A với vận tốc 60 km/giờ. Biết hai xe gặp nhau ở chính giữa AB. Hỏi ô tô đi từ B về A lúc mấy giờ?", "has_figure": false, "garbled": false, "answer": "11 giờ", "solution": "Xe máy đi trước xe ô tô số ki-lô-mét là: 40 x (7 – 6) = 40 (km).\nTrong cùng một khoảng thời gian, quãng đường và vận tốc là hai đại lượng tỉ lệ thuận với nhau.\nTỉ số vận tốc của xe máy và ô tô là: 40/60 = 2/3. Tỉ số quãng đường của xe máy và ô tô đi được kể từ lúc 7 giờ đến khi gặp nhau là: 2/3. Hiệu quãng đường là 40 km.\nQuãng đường ô tô đi được: 40 : (3 – 2) x 3 = 120 (km).\nThời gian ô tô đi nửa quãng đường AB là: 120 : 60 = 2 (giờ).\nÔ tô đi từ B đến A lúc là: 7 giờ + (2 x 2) giờ = 11 giờ.\nĐáp số: 11 giờ", "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "tỉ số vận tốc", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["11"], "gradable": true}, {"id": "ARC-2020-CB-9", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 9, "points": null, "statement": "Hiện nay tuổi bố gấp 5 lần tuổi con. Sau 10 năm nữa tuổi bố gấp 2,5 lần tuổi con. Tính tuổi con hiện nay.", "has_figure": false, "garbled": false, "answer": "6 tuổi", "solution": "Hiện nay, tuổi con bằng 1/4 (hiệu số tuổi của hai bố con).\nSau 10 năm nữa, tuổi con bằng 2/3 (hiệu số tuổi của hai bố con).\nSuy ra, 10 năm tương ứng với 2/3 - 1/4 = 5/12 (hiệu số tuổi của hai bố con).\nHiệu số tuổi của hai bố con là 10 : 5/12 = 24 (tuổi).\nTuổi con hiện nay là: 24 : (5 – 1) x 1 = 6 (tuổi).\nĐáp số: 6 tuổi", "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["bài toán tuổi", "hiệu – tỉ", "hai tỉ số"], "mock": false, "mc": null, "key": ["6"], "gradable": true}, {"id": "ARC-2020-CB-10", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 10, "points": null, "statement": "Một hình hộp chữ nhật có chiều dài 8 dm, chiều rộng 4 dm, chiều cao là 5 dm được xếp bởi các hình lập phương có cạnh là 1 dm. Người ta sơn các mặt của hình hộp chữ nhật (không sơn mặt tiếp đất). Hỏi có bao nhiêu hình lập phương được sơn 1 mặt?", "has_figure": false, "garbled": false, "answer": "76 hình", "solution": "Số hình lập phương được sơn 1 mặt thuộc mặt trên của hình hộp chữ nhật là: (8 – 2) x (4 – 2) = 12 (hình).\nSố hình lập phương được sơn 1 mặt thuộc các mặt bên của hình hộp chữ nhật là: (8 – 2) x (5 – 1) x 2 + (5 – 1) x (4 – 2) x 2 = 64 (hình).\nSố hình lập phương được sơn 1 mặt là: 12 + 64 = 76 (hình).\nĐáp số: 76 hình", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình hộp chữ nhật", "đếm hình lập phương", "sơn mặt"], "mock": false, "mc": null, "key": ["76"], "gradable": true}, {"id": "ARC-2020-CB-11", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 11, "points": null, "statement": "Một quả bóng rổ sau khi được giảm giá 30% có giá là 455 000 đồng. Hỏi giá của quả bóng rổ trước đó là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "650 000 đồng", "solution": "Giá của quả bóng sau khi giảm bằng 70% giá trước đó.\nGiá của quả bóng rổ trước đó là 455 000 : 70 x 100 = 650 000 (đồng).\nĐáp số: 650 000 đồng", "unit": "u4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "giảm giá", "tìm số khi biết %"], "mock": false, "mc": null, "key": ["0", "650"], "gradable": true}, {"id": "ARC-2020-CB-12", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 12, "points": null, "statement": "7 công nhân làm trong 6 giờ được 21 sản phẩm. Hỏi 5 công nhân làm trong 16 giờ được bao nhiêu sản phẩm? (Biết rằng công suất mỗi người làm đều như nhau)", "has_figure": false, "garbled": false, "answer": "40 sản phẩm", "solution": "7 công nhân làm trong 16 giờ được số sản phẩm là: 16 x 21 : 6 = 56 (sản phẩm).\n5 công nhân làm trong 16 giờ được số sản phẩm là: 5 x 56 : 7 = 40 (sản phẩm).\nĐáp số: 40 sản phẩm", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tỉ lệ thuận", "năng suất", "rút về đơn vị"], "mock": false, "mc": null, "key": ["40"], "gradable": true}, {"id": "ARC-2020-CB-13", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 13, "points": null, "statement": "Có một hình chữ nhật, chiều dài hơn chiều rộng 10 m. Nếu tăng chiều rộng thêm 25% và giảm chiều dài đi 8 m thì diện tích không thay đổi. Tính diện tích hình chữ nhật.", "has_figure": false, "garbled": false, "answer": "1200 m2", "solution": "Theo đề bài ta có: Chiều dài x chiều rộng = (chiều dài – 8) x 125/100 x chiều rộng.\nChiều dài x chiều rộng = 5/4 x chiều dài x chiều rộng – 10 x chiều rộng.\n1/4 x chiều dài x chiều rộng = 10 x chiều rộng.\n1/4 x chiều dài = 10.\nSuy ra: chiều dài = 40 (m).\nChiều rộng là 40 – 10 = 30 (m).\nDiện tích hình chữ nhật là 40 x 30 = 1200 (m2).\nĐáp số: 1200 m2", "unit": "c7", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["diện tích hình chữ nhật", "tỉ số phần trăm", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["1200", "2"], "gradable": true}, {"id": "ARC-2020-CB-14", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 14, "points": null, "statement": "Tính tổng dãy số cách đều sau 3 + 5 + 7 + 9 + … + 35", "has_figure": false, "garbled": false, "answer": "323", "solution": "Số số hạng của dãy số trên là: (35 – 3) : 2 + 1 = 17 (số hạng).\nTổng dãy số đã cho là (3 + 35) x 17 : 2 = 323.\nĐáp số: 323", "unit": "u15", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dãy số cách đều", "tổng dãy số"], "mock": false, "mc": null, "key": ["323"], "gradable": true}, {"id": "ARC-2020-CB-15", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 15, "points": null, "statement": "Tìm hai số tròn chục liên tiếp có tổng bằng 570.", "has_figure": false, "garbled": false, "answer": "280 và 290", "solution": "Hai số tròn chục liên tiếp có hiệu là 10. Số bé là: (570 – 10) : 2 = 280. Số lớn là: 570 – 280 = 290", "unit": "c3", "unit_alt": "u1", "difficulty": 1, "vn_grade": 4, "skills": ["tổng – hiệu", "số tròn chục"], "mock": false, "mc": null, "key": ["280", "290"], "gradable": true}, {"id": "ARC-2020-CB-16", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 16, "points": null, "statement": "Trung bình cộng của bốn số là 17, thêm số thứ năm vào thì trung bình cộng của năm số là 19. Tính số thứ năm.", "has_figure": false, "garbled": false, "answer": "27", "solution": "Tổng của bốn số là: 17 x 4 = 68. Tổng của năm số là 19 x 5 = 95. Số thứ năm là 95 – 68 = 27", "unit": "u14", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["trung bình cộng"], "mock": false, "mc": null, "key": ["27"], "gradable": true}, {"id": "ARC-2020-CB-17", "school": "ARC", "year": "2020-CB", "part": "DT", "q_no": 17, "points": null, "statement": "Khi viết thêm số 9 vào bên phải của một số thì được số mới tăng thêm .... lần và … đơn vị.", "has_figure": false, "garbled": false, "answer": "10 lần và 9 đơn vị", "solution": "Khi viết thêm số 9 vào bên phải của một số thì được số mới gấp 10 lần số cũ và thêm 9 đơn vị.", "unit": "c2", "unit_alt": "u1", "difficulty": 1, "vn_grade": 4, "skills": ["cấu tạo số", "viết thêm chữ số"], "mock": false, "mc": null, "key": ["10", "9"], "gradable": true}, {"id": "ARC-2020-1", "school": "ARC", "year": "2020", "part": "DT", "q_no": 1, "points": null, "statement": "Tính A = 7,5 x 7,67 + 75 x 0,212 + 0,75 x 2,1", "has_figure": false, "garbled": false, "answer": "A = 75", "solution": "A = 7,5 x 7,67 + 75 x 0,212 + 0,75 x 2,1 = 7,5 x 7,67 + 7,5 x 2,12 + 7,5 x 0,21 = 7,5 x (7,67 + 2,12 + 0,21) = 7,5 x 10 = 75", "unit": "c1", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["tính nhanh", "nhân số thập phân", "thừa số chung"], "mock": false, "mc": null, "key": ["75"], "gradable": true}, {"id": "ARC-2020-2", "school": "ARC", "year": "2020", "part": "DT", "q_no": 2, "points": null, "statement": "Tìm x biết: x × 3 + x × 4 + x : 3 + x : 4 = 546", "has_figure": false, "garbled": false, "answer": "x = 72", "solution": "x × 3 + x × 4 + x : 3 + x : 4 = 546; x × 3 + x × 4 + x × 1/3 + x × 1/4 = 546; x × (3 + 4 + 1/3 + 1/4) = 546; x × 91/12 = 546; x = 546 : 91/12; x = 72", "unit": "c1", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["tìm x", "thừa số chung", "phân số"], "mock": false, "mc": null, "key": ["72"], "gradable": true}, {"id": "ARC-2020-3", "school": "ARC", "year": "2020", "part": "DT", "q_no": 3, "points": null, "statement": "Tính B = 3/(1×5) + 3/(5×9) + 3/(9×13) + ... + 3/(2017×2021)", "has_figure": false, "garbled": false, "answer": "B = 1515/2021", "solution": "B = 3/(1×5) + 3/(5×9) + 3/(9×13) + ... + 3/(2017×2021).\nB : 3 × 4 = 4/(1×5) + 4/(5×9) + 4/(9×13) + ... + 4/(2017×2021).\nB : 3 × 4 = 1 − 1/2021 = 2020/2021. B = 2020/2021 : 4 × 3 = 1515/2021", "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh", "phân số"], "mock": false, "mc": null, "key": ["1515/2021"], "gradable": true}, {"id": "ARC-2020-4", "school": "ARC", "year": "2020", "part": "DT", "q_no": 4, "points": null, "statement": "Cho phân số 49/73. Phải cùng bớt ở tử số và mẫu số bao nhiêu đơn vị để được phân số có giá trị là 7/11.", "has_figure": false, "garbled": false, "answer": "7 đơn vị", "solution": "Cùng bớt ở tử số và mẫu số một số đơn vị như nhau thì hiệu giữa tử số và mẫu số không đổi và bằng 73 – 49 = 24. Từ đó ta có sơ đồ lúc sau (tử số 7 phần, mẫu số 11 phần).\nTử số mới là 24 : (11 – 7) x 7 = 42. Phải cùng bớt ở tử số và mẫu số số đơn vị là: 49 – 42 = 7 (đơn vị).\nĐáp số: 7 đơn vị", "unit": "c3", "unit_alt": "u3", "difficulty": 2, "vn_grade": 4, "skills": ["hiệu – tỉ", "phân số", "hiệu không đổi"], "mock": false, "mc": null, "key": ["7"], "gradable": true}, {"id": "ARC-2020-5", "school": "ARC", "year": "2020", "part": "DT", "q_no": 5, "points": null, "statement": "Một hình hộp chữ nhật có diện tích xung quanh là 640 cm2 và chiều cao là 16 cm. Hiệu giữa chiều dài và chiều rộng là 4 cm. Tính thể tích hình đó.", "has_figure": false, "garbled": false, "answer": "1536 cm3", "solution": "Chu vi đáy của hình hộp chữ nhật là: 640 : 16 = 40 (cm).\nNửa chu vi là: 40 : 2 = 20 (cm).\nChiều dài là: (20 + 4) : 2 = 12 (cm).\nChiều rộng là: 20 – 12 = 8 (cm).\nThể tích hình hộp chữ nhật là: 12 x 8 x 16 = 1536 (cm3).\nĐáp số: 1536 cm3", "unit": "c7", "unit_alt": "c3", "difficulty": 2, "vn_grade": 5, "skills": ["hình hộp chữ nhật", "diện tích xung quanh", "thể tích", "tổng – hiệu"], "mock": false, "mc": null, "key": ["1536", "3"], "gradable": true}, {"id": "ARC-2020-6", "school": "ARC", "year": "2020", "part": "DT", "q_no": 6, "points": null, "statement": "Giá một cân thịt bò vào tháng 6 tăng 10% so với tháng 5, giá một cân thịt bò tháng 7 tăng 15% so với tháng 6. Biết giá một cân thịt bò tháng 7 cao hơn tháng 5 là 53000 đồng. Tính giá một cân thịt bò tháng 7.", "has_figure": false, "garbled": false, "answer": "253000 đồng", "solution": "Coi giá thịt bò tháng 5 là 100%.\nGiá thịt bò tháng 6 là: 100% + 10% = 110% (giá tháng 5).\nGiá thịt bò tháng 7 là: 110% x (100% + 15%) = 126,5% (giá tháng 5).\nGiá thịt bò tháng 7 tăng so với tháng 5 là: 126,5% - 100% = 26,5% (giá tháng 5).\nGiá thịt bò tháng 7 là: 53000 : 26,5 x 126,5 = 253000 (đồng).\nĐáp số: 253000 đồng", "unit": "c5", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "tăng giá nhiều bước", "bài toán kinh tế"], "mock": false, "mc": null, "key": ["253000"], "gradable": true}, {"id": "ARC-2020-7", "school": "ARC", "year": "2020", "part": "DT", "q_no": 7, "points": null, "statement": "Số hạng thứ 2020 của dãy số 1; 3; 2; 4; 3; 5; … là số nào?", "has_figure": false, "garbled": false, "answer": "1012", "solution": "Chia dãy số đề bài thành 2 dãy: Dãy 1 gồm các số 1; 2; 3; ...\nDãy 2 gồm các số 3; 4; 5; ...\nSố hạng thứ 2020 của dãy ban đầu chính là số hạng thứ 2020 : 2 = 1010 của dãy số 2. Số hạng thứ 1010 của dãy 2 là: (1010 - 1) : 1 + 3 = 1012.\nĐáp số: 1012", "unit": "u15", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["dãy số", "quy luật", "tìm số hạng"], "mock": false, "mc": null, "key": ["1012"], "gradable": true}, {"id": "ARC-2020-8", "school": "ARC", "year": "2020", "part": "DT", "q_no": 8, "points": null, "statement": "Tổ A có 8 công nhân, 1 ngày làm 8 giờ, xong công việc trong 15 ngày. Tổ B có 12 công nhân, 1 ngày làm 5 giờ sẽ xong công việc trong bao nhiêu ngày?", "has_figure": false, "garbled": false, "answer": "16 ngày", "solution": "8 công nhân xong công việc trong số giờ là: 15 x 8 = 120 (giờ).\nMột công nhân hoàn thành công việc trong số giờ là: 120 x 8 = 960 (giờ).\n12 công nhân, 1 ngày làm 5 giờ sẽ xong công việc trong số ngày là: 960 : 5 : 12 = 16 (ngày).\nĐáp số: 16 ngày", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tỉ lệ nghịch", "năng suất", "rút về đơn vị"], "mock": false, "mc": null, "key": ["16"], "gradable": true}, {"id": "ARC-2020-9", "school": "ARC", "year": "2020", "part": "DT", "q_no": 9, "points": null, "statement": "Hiệu 2 số thập phân là 66,8. Nếu dịch dấu phẩy của số bé sang trái 1 hàng thì hiệu mới là 117,83. Tìm số lớn.", "has_figure": false, "garbled": false, "answer": "123,5", "solution": "Nếu dịch dấu phẩy của số bé sang trái một hàng thì số bé giảm đi 10 lần.\n9 lần số bé mới là: 117,83 – 66,8 = 51,03. Số bé mới là: 51,03 : 9 = 5,67. Số bé ban đầu là 56,7. Số lớn là: 56,7 + 66,8 = 123,5.\nĐáp số: 123,5", "unit": "c3", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["số thập phân", "dịch dấu phẩy", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["123.5"], "gradable": true}, {"id": "ARC-2020-10", "school": "ARC", "year": "2020", "part": "DT", "q_no": 10, "points": null, "statement": "A là tích các số chẵn từ 1 đến 23, B là tích các số lẻ từ 2 đến 22. Tìm chữ số tận cùng của hiệu giữa A và B.", "has_figure": false, "garbled": false, "answer": "5", "solution": "A có tận cùng là 0 vì trong các số chẵn từ 1 đến 23 có thừa số 10. B có tận cùng là 5 vì trong các số lẻ từ 2 đến 22 có thừa số 5, mà 5 nhân với các số lẻ thì đều có tận cùng là 5.\nVậy A - B có tận cùng là 5.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["chữ số tận cùng", "tích các số"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "ARC-2020-11", "school": "ARC", "year": "2020", "part": "DT", "q_no": 11, "points": null, "statement": "Cô giáo viết lên bảng một số tự nhiên chia hết cho 9. An thấy số đó chia 5 hay 8 đều cùng số dư. Tìm số đó, biết số đó có 2 chữ số.", "has_figure": false, "garbled": false, "answer": "81", "solution": "Các số có hai chữ số chia hết cho 9 là: 18, 27, 36, 45, 54, 63, 72, 81. Mà số đó chia 5 hay 8 đều cùng số dư.\nVậy số cần tìm là 81.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["chia hết", "số dư", "dấu hiệu chia hết cho 9"], "mock": false, "mc": null, "key": ["81"], "gradable": true}, {"id": "ARC-2020-12", "school": "ARC", "year": "2020", "part": "DT", "q_no": 12, "points": null, "statement": "Tìm số có 4 chữ số khác nhau, nếu xóa chữ số hàng chục và đơn vị thì số đó giảm 108 lần.", "has_figure": false, "garbled": false, "answer": "1296", "solution": "Gọi số cần tìm là abcd.\nTheo đề bài ta có: abcd = ab × 108; ab × 100 + cd = ab × 108; cd = ab × 8.\nSuy ra ab = 12, cd = 96.\nVậy số cần tìm là 1296.", "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "xóa chữ số", "tìm số"], "mock": false, "mc": null, "key": ["1296"], "gradable": true}, {"id": "ARC-2020-13", "school": "ARC", "year": "2020", "part": "DT", "q_no": 13, "points": null, "statement": "Số thứ nhất bằng 1/4 trung bình cộng của 3 số. Số thứ hai hơn số thứ nhất 48 đơn vị. Số thứ ba bằng 3/2 trung bình cộng của 3 số. Tìm số thứ ba.", "has_figure": false, "garbled": false, "answer": "72", "solution": "Số thứ nhất bằng 1/4 trung bình cộng của 3 số ⇒ Số thứ nhất bằng 1/4 × 1/3 = 1/12 tổng của ba số.\nSố thứ ba bằng 3/2 trung bình cộng của 3 số ⇒ Số thứ ba bằng 3/2 × 1/3 = 1/2 tổng của ba số.\nPhân số chỉ số thứ hai là: 1 − 1/12 − 1/2 = 5/12 (tổng ba số).\n48 đơn vị ứng với 5/12 − 1/12 = 1/3 (tổng ba số).\nTổng của ba số là: 48 : 1/3 = 144. Số thứ ba là: 144 × 1/2 = 72.\nĐáp số: 72", "unit": "c3", "unit_alt": "u14", "difficulty": 3, "vn_grade": 4, "skills": ["trung bình cộng", "phân số của tổng", "hiệu – tỉ"], "mock": false, "mc": null, "key": ["72"], "gradable": true}, {"id": "ARC-2020-14", "school": "ARC", "year": "2020", "part": "DT", "q_no": 14, "points": null, "statement": "Tuổi mẹ 5 năm trước bằng 3 lần tuổi con hiện nay. Hai lần tuổi con 8 năm nữa bằng tuổi mẹ hiện nay. Tính tuổi mẹ hiện nay.", "has_figure": false, "garbled": false, "answer": "38 tuổi", "solution": "Tuổi mẹ 5 năm trước bằng 3 lần tuổi con hiện nay ⇒ 3 lần tuổi con hiện nay kém tuổi mẹ hiện nay là 5 tuổi.\nHai lần tuổi con 8 năm nữa bằng tuổi mẹ hiện nay ⇒ 2 lần tuổi con hiện nay kém tuổi mẹ hiện nay là 16 tuổi.\nTuổi con hiện nay là 16 – 5 = 11 (tuổi).\nTuổi mẹ hiện nay là: 11 x 2 + 16 = 38 (tuổi).\nĐáp số: 38 tuổi", "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["bài toán tuổi", "khử", "hiệu"], "mock": false, "mc": null, "key": ["38"], "gradable": true}, {"id": "ARC-2020-15", "school": "ARC", "year": "2020", "part": "DT", "q_no": 15, "points": null, "statement": "Lớp 5A làm bài kiểm tra. Tất cả các bạn được 9 hoặc 10 điểm. Tổng điểm là 365 và số bạn được 10 điểm hơn số bạn được 9 điểm là 8 bạn. Tìm số học sinh của lớp 5A.", "has_figure": false, "garbled": false, "answer": "38 bạn", "solution": "Giả sử bớt đi 8 bạn được 10 điểm thì lúc này số bạn được 10 bằng số bạn được 9 thì tổng số điểm là 365 – 10 x 8 = 285 (điểm).\nSố bạn được điểm 9 (hoặc 10) lúc này là: 285 : (10 + 9) = 15 (bạn).\nSố bạn được điểm 10 thực tế là: 15 + 8 = 23 (bạn).\nTổng số học sinh là 23 + 15 = 38 (bạn).\nĐáp số: 38 bạn", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["giả thiết tạm", "tổng – hiệu"], "mock": false, "mc": null, "key": ["38"], "gradable": true}, {"id": "ARC-2020-16", "school": "ARC", "year": "2020", "part": "DT", "q_no": 16, "points": null, "statement": "Minh đọc quyển sách trong 4 ngày. Ngày thứ nhất đọc 15% số trang và thêm 6 trang nữa. Ngày thứ hai đọc 60% số trang còn lại và 30 trang nữa. Ngày thứ ba đọc 50% số trang còn lại và 15 trang nữa. Ngày thứ tư đọc nốt 30 trang. Hỏi cuốn sách đó có bao nhiêu trang?", "has_figure": false, "garbled": false, "answer": "360 trang", "solution": "Số trang sách còn lại sau ngày thứ hai là: (30 + 15) : (100% - 50%) = 90 (trang).\nSố trang sách còn lại sau ngày thứ nhất là: (90 + 30) : (100% - 60%) = 300 (trang).\nTổng số trang sách ban đầu là: (300 + 6) : (100% - 15%) = 360 (trang).\nĐáp số: 360 trang", "unit": "c3", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["tính ngược từ cuối", "tỉ số phần trăm"], "mock": false, "mc": null, "key": ["360"], "gradable": true}, {"id": "ARC-2020-17", "school": "ARC", "year": "2020", "part": "DT", "q_no": 17, "points": null, "statement": "Có bao nhiêu số có 4 chữ số chia hết cho 5. Biết số cần tìm có 4 chữ số khác nhau và các chữ số tăng dần từ trái sang phải.", "has_figure": false, "garbled": false, "answer": "4 số", "solution": "Các số có 4 chữ số khác nhau chia hết cho 5 và các chữ số tăng dần từ trái sang phải là: 1235, 1245, 1345, 2345.\nĐáp số: 4 số", "unit": "c6", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["đếm số", "chia hết cho 5", "liệt kê"], "mock": false, "mc": null, "key": ["4"], "gradable": true}, {"id": "ARC-2020-18", "school": "ARC", "year": "2020", "part": "DT", "q_no": 18, "points": null, "statement": "Xếp các hình lập phương nhỏ cạnh 1 cm thành hình lập phương lớn. Số hình không được sơn mặt nào gấp rưỡi số hình được sơn 1 mặt. Tính thể tích hình lập phương đó.", "has_figure": false, "garbled": false, "answer": "1331 cm3", "solution": "Giả sử trên mỗi cạnh hình lập phương lớn có n hình lập phương nhỏ.\nSố hình lập phương nhỏ được sơn 1 mặt là 6 x (n − 2) x (n − 2).\nSố hình lập phương nhỏ không sơn mặt nào là (n − 2) x (n − 2) x (n − 2).\nTheo đề bài [(n − 2) x (n − 2) x (n − 2)] / [6 x (n − 2) x (n − 2)] = 3/2, hay (n − 2)/6 = 3/2.\nSuy ra n = 11, cạnh của hình lập phương lớn là 11 cm.\nThể tích hình lập phương đó là 11 x 11 x 11 = 1331 (cm3).\nĐáp số: 1331 cm3", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình lập phương", "sơn mặt", "thể tích"], "mock": false, "mc": null, "key": ["1331", "3"], "gradable": true}, {"id": "ARC-2020-19", "school": "ARC", "year": "2020", "part": "DT", "q_no": 19, "points": null, "statement": "Biết abcd + affe = cbbd và abcd chia hết cho 15. Tìm abcdef (a, b, c, d, e, f khác nhau).", "has_figure": false, "garbled": false, "answer": "367509", "solution": "Vì abcd chia hết cho 15 tức là chia hết cho cả 3 và 5 nên d = 0 hoặc d = 5. Nếu d = 0, xét phép cộng ở hàng đơn vị của phép tính abcd + affe = cbbd ta có 0 + e = 0 nên e = 0 (loại vì e khác d).\nVậy d = 5. Khi đó ta được 5 + e = 5 nên e = 0.\nTa có abc5 + aff0 = cbb5. Nhận thấy phép tính ở hàng chục c + f được b phải có nhớ 1 sang hàng trăm (do c khác b).\nSuy ra, ở hàng trăm ta có b + f + 1 được b dẫn đến f + 1 được 0 (nhớ 1).\nSuy ra f = 9. Ở hàng nghìn ta được a + a + 1 = c ⇒ c = 3; 7 (c khác f và d nên không bằng 5; 9).\nThử c = 3; c = 7 ta tìm được số cần tìm là 367509.", "unit": "c2", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["cấu tạo số", "phép cộng có nhớ", "chia hết cho 15", "tìm chữ số"], "mock": false, "mc": null, "key": ["367509"], "gradable": true}, {"id": "ARC-2020-20", "school": "ARC", "year": "2020", "part": "DT", "q_no": 20, "points": null, "statement": "An và Bình cùng xuất phát đi từ A đến B với vận tốc là 35 km/h và 45 km/h. Cùng lúc đó Chi đi từ B đến A với vận tốc là 50 km/h. Biết quãng đường AB dài 132 km. Hỏi sau bao nhiêu phút thì Chi ở chính giữa An và Bình.", "has_figure": false, "garbled": false, "answer": "88 phút", "solution": "Giả sử bạn Long có vận tốc bằng trung bình cộng vận tốc của An và Bình, xuất phát cùng lúc với 2 bạn thì bạn Long luôn ở chính giữa An và Bình.\nLúc này thì bài toán quy về việc bạn Chi sẽ gặp bạn Long sau bao lâu.\nVận tốc của bạn Long là (35 + 45) : 2 = 40 (km/giờ).\nBạn Chi gặp bạn Long sau số phút là: 132 : (40 + 50) = 22/15 (giờ) = 88 (phút).\nĐáp số: 88 phút", "unit": "c4", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["chuyển động ngược chiều", "vận tốc trung bình", "điểm giữa"], "mock": false, "mc": null, "key": ["88"], "gradable": true}, {"id": "ARC-2021-1", "school": "ARC", "year": "2021", "part": "TN", "q_no": 1, "points": null, "statement": "Tính giá trị của biểu thức: A = 77 x 5,55 + 60,12 x 7,45 + 16,88 x 7,45", "has_figure": false, "garbled": false, "answer": "A = 1001", "solution": "A = 77 x 5,55 + 60,12 x 7,45 + 16,88 x 7,45 = 77 x 5,55 + 7,45 x (60,12 + 16,88) = 77 x 5,55 + 7,45 x 77 = 77 x (5,55 + 7,45) = 77 x 13 = 1001", "unit": "c1", "unit_alt": "u2", "difficulty": 2, "vn_grade": 5, "skills": ["tính nhanh", "thừa số chung", "số thập phân"], "mock": false, "mc": null, "key": ["1001"], "gradable": true}, {"id": "ARC-2021-2", "school": "ARC", "year": "2021", "part": "TN", "q_no": 2, "points": null, "statement": "Tìm số tự nhiên n biết rằng: (1 + 1/1) × (1 + 1/2) × (1 + 1/3) × .... × (1 + 1/n) = 2070", "has_figure": false, "garbled": false, "answer": "n = 2069", "solution": "(1 + 1/1)\n× (1 + 1/2)\n× (1 + 1/3)\n× ....\n× (1 + 1/n) = 2070; 2/1 × 3/2 × 4/3 × ....\n× (n + 1)/n = 2070; n + 1 = 2070; n = 2069", "unit": "c1", "unit_alt": "u3", "difficulty": 3, "vn_grade": 4, "skills": ["tích phân số đặc biệt", "rút gọn", "tìm n"], "mock": false, "mc": null, "key": ["2069"], "gradable": true}, {"id": "ARC-2021-3", "school": "ARC", "year": "2021", "part": "TN", "q_no": 3, "points": null, "statement": "Một số tự nhiên được gọi là số tiến nếu các chữ số của nó đôi một khác nhau và chữ số liền sau lớn hơn chữ số liền trước. Ví dụ: 13579 và 24689 là các số tiến; nhưng 11345 không phải là số tiến. Hỏi trong các số tự nhiên từ 2021 đến 2401, có bao nhiêu số là số tiến?", "has_figure": false, "garbled": false, "answer": "15 số", "solution": "Các số tiến từ 2021 đến 2401 gồm có 2345 đến 2349 (5 số), 2356 đến 2359 (4 số), 2367, 2368, 2369, 2378, 2379, 2389 (6 số).\nVậy có 15 số tiến từ 2021 đến 2401.", "unit": "c6", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["đếm số", "liệt kê", "cấu tạo số"], "mock": false, "mc": null, "key": ["15"], "gradable": true}, {"id": "ARC-2021-4", "school": "ARC", "year": "2021", "part": "TN", "q_no": 4, "points": null, "statement": "Một hình chữ nhật có chu vi 200 cm. Người ta giảm chiều dài và chiều rộng đi cùng một độ dài thì được một hình chữ nhật mới có chu vi là 160 cm. Hỏi diện tích của phần giảm đi là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "900 cm2", "solution": "Nửa chu vi ban đầu là: 200 : 2 = 100 (cm).\nNửa chu vi lúc sau: 160 : 2 = 80 (cm).\nChiều dài và chiều rộng cùng giảm đi: (100 – 80) : 2 = 10 (cm).\nPhần diện tích giảm đi là: (100 – 10) x 10 = 900 (cm2).\nĐáp số: 900 cm2", "unit": "c7", "unit_alt": "u6", "difficulty": 3, "vn_grade": 4, "skills": ["chu vi hình chữ nhật", "diện tích", "cắt ghép hình"], "mock": false, "mc": null, "key": ["2", "900"], "gradable": true}, {"id": "ARC-2021-5", "school": "ARC", "year": "2021", "part": "TN", "q_no": 5, "points": null, "statement": "Cách đây 6 năm, tổng số tuổi của Nam và anh trai Nam là 18 tuổi. Hiện tại, số tuổi của Nam bằng 2/3 số tuổi của anh trai Nam. Hỏi hiện tại Nam bao nhiêu tuổi?", "has_figure": false, "garbled": false, "answer": "12 tuổi", "solution": "Tổng số tuổi của Nam và anh trai Nam hiện nay là: 18 + 6 + 6 = 30 (tuổi).\nTuổi của Nam hiện nay là: 30 : (2 + 3) x 2 = 12 (tuổi).\nĐáp số: 12 tuổi", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["bài toán tuổi", "tổng – tỉ"], "mock": false, "mc": null, "key": ["12"], "gradable": true}, {"id": "ARC-2021-6", "school": "ARC", "year": "2021", "part": "TN", "q_no": 6, "points": null, "statement": "Vào ngày 18/04/2021, một cửa hàng thịt treo biển khuyến mãi: “Duy nhất ngày hôm nay, thăn bò Úc giảm 40%, chỉ 117000 đồng nửa ký!”. Hỏi, giá thịt thăn bò Úc tại cửa hàng đó trước khi khuyến mãi là bao nhiêu một kg (tính theo đồng)?", "has_figure": false, "garbled": false, "answer": "390000 đồng", "solution": "Giá một kg thịt bò sau khi giảm 40% là: 117000 x 2 = 234000 (đồng).\nGiá 1 kg thịt thăn bò Úc tại cửa hàng đó trước khi khuyến mãi là: 234000 : 60 x 100 = 390000 (đồng).\nĐáp số: 390000 đồng", "unit": "u4", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ số phần trăm", "giảm giá", "tìm số khi biết %"], "mock": false, "mc": null, "key": ["390000"], "gradable": true}, {"id": "ARC-2021-7", "school": "ARC", "year": "2021", "part": "TN", "q_no": 7, "points": null, "statement": "Xét biểu thức: A = 45 + 45 x 45 + 45 x 45 x 45 + …. + 45 x 45 x …. x 45 (số hạng cuối gồm 2021 thừa số 45). Hỏi khi tính giá trị biểu thức A, giá trị thu được có chữ số hàng đơn vị là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "5", "solution": "A có 2021 số hạng, mỗi số hạng đều có chữ số hàng đơn vị là 5.\nSuy ra A có chữ số hàng đơn vị là hàng đơn vị của tích 5 x 2021.\nVậy A có chữ số tận cùng là 5.", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["chữ số tận cùng", "lũy thừa"], "mock": false, "mc": null, "key": ["5"], "gradable": true}, {"id": "ARC-2021-8", "school": "ARC", "year": "2021", "part": "TN", "q_no": 8, "points": null, "statement": "Trong dãy 15 ô vuông bên dưới, người ta điền vào mỗi ô vuông một số tự nhiên sao cho tổng các số ở ba ô liên tiếp bất kỳ luôn bằng 39. Tìm số được điền vào ô vuông tô đậm. (Hình vẽ: dãy 15 ô, ô thứ nhất ghi 20, ô thứ ba ghi 11, một ô được tô đậm.)", "has_figure": true, "garbled": false, "answer": "8", "solution": "Ô thứ 3 trong dãy là 11.\nSuy ra ô thứ hai trong dãy là: 39 – 20 – 11 = 8. Vì tổng các số ở ba ô liên tiếp bất kỳ luôn bằng 39 nên các số lặp lại theo thứ tự 20, 8, 11.\nVậy số điền vào ô màu xanh là số 8.", "unit": "c6", "unit_alt": "u15", "difficulty": 2, "vn_grade": 4, "skills": ["suy luận", "quy luật lặp", "dãy ô vuông"], "mock": false, "mc": null, "key": ["8"], "gradable": true}, {"id": "ARC-2021-9", "school": "ARC", "year": "2021", "part": "TN", "q_no": 9, "points": null, "statement": "Trong hình vẽ dưới, D là điểm trên cạnh AC của tam giác ABC và AD = DC; E là điểm trên đoạn BD thỏa mãn BE : BD = 3 : 5. Biết rằng diện tích tam giác ADE là 96 cm2. Tính diện tích tam giác ABC.", "has_figure": true, "garbled": false, "answer": "480 cm2", "solution": "S_ABD / S_ADE = 5/2 (Hai tam giác có chung chiều cao hạ từ đỉnh A và đáy BD = 5/2 DE).\nSuy ra S_ABD = 5/2 × S_ADE = 5/2 × 96 = 240 (cm2).\nTa có S_ABC = 2 × S_ABD (Hai tam giác có chung chiều cao hạ từ B và đáy AC = 2 x AD).\nVậy S_ABC = 240 × 2 = 480 (cm2)", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "tam giác chung chiều cao", "hình học"], "mock": false, "mc": null, "key": ["2", "480"], "gradable": true}, {"id": "ARC-2021-10", "school": "ARC", "year": "2021", "part": "TN", "q_no": 10, "points": null, "statement": "Nam có bốn quyển sách gồm Toán, Tiếng Việt, Tiếng Anh và Lịch Sử. Nam muốn xếp bốn quyển sách này lên một kệ sách trống sao cho quyển sách Toán và quyển sách Lịch Sử không nằm cạnh nhau. Hỏi có bao nhiêu cách xếp?", "has_figure": false, "garbled": false, "answer": "12 cách", "solution": "Các cách xếp sao cho quyển sách Toán và quyển sách Lịch Sử không nằm cạnh nhau là: Toán, Tiếng Việt, Tiếng Anh, Lịch sử; Toán, Tiếng Việt, Lịch sử, Tiếng Anh; Toán, Tiếng Anh, Tiếng Việt, Lịch sử; Toán, Tiếng Anh, Lịch sử, Tiếng Việt; Tiếng Việt, Toán, Tiếng Anh, Lịch sử; Tiếng Việt, Lịch sử, Tiếng Anh, Toán; Tiếng Anh, Toán, Tiếng Việt, Lịch sử; Tiếng Anh, Lịch sử, Tiếng Việt, Toán; Lịch sử, Tiếng Anh, Tiếng Việt, Toán; Lịch sử, Tiếng Anh, Toán, Tiếng Việt; Lịch sử, Tiếng Việt, Tiếng Anh, Toán; Lịch sử, Tiếng Việt, Toán, Tiếng Anh.\nVậy có 12 cách xếp.", "unit": "c6", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["đếm – tổ hợp", "liệt kê", "hoán vị"], "mock": false, "mc": null, "key": ["12"], "gradable": true}, {"id": "ARC-2021-11", "school": "ARC", "year": "2021", "part": "TL", "q_no": 11, "points": null, "statement": "Trong một cuộc thi, có năm thí sinh tham dự là A, B, C, D và E. Trước khi cuộc thi diễn ra, có bốn dự đoán về kết quả xếp hạng của năm thí sinh như sau: Dự đoán thứ nhất: “B sẽ đứng thứ tư và E sẽ đứng thứ hai.” Dự đoán thứ hai: “D sẽ đứng thứ nhất và C sẽ đứng thứ ba.” Dự đoán thứ ba: “E sẽ đứng thứ ba và A sẽ đứng thứ tư.” Dự đoán thứ tư: “A sẽ đứng thứ ba và B sẽ đứng thứ nhất.” Kết thúc cuộc thi, người ta nhận thấy mỗi người dự đoán đều đúng cho một thí sinh nào đó và sai cho người còn lại. Biết rằng không có hai thí sinh nào có cùng thứ hạng, hỏi ai đứng thứ ba ở cuộc thi đó?", "has_figure": false, "garbled": false, "answer": "C đứng thứ ba (B nhất, E nhì, C ba, A tư)", "solution": "Xuất phát từ dự đoán thứ nhất: Nếu B đứng thứ 4 là đúng và E đứng thứ hai là sai, khi đó ở dự đoán thứ 3, E đứng thứ ba sẽ đúng và A đứng thứ 4 sẽ sai.\nỞ dự đoán thứ tư, A đứng thứ ba sẽ sai và B đứng thứ nhất sẽ đúng (vô lý vì B không thể vừa đứng thứ tư, vừa đứng thứ nhất).\nDo vậy ở dự đoán thứ nhất, B đứng thứ tư là sai và E đứng thứ hai là đúng.\nLúc này ở dự đoán số 3, E đứng thứ ba là sai và A đứng thứ tư đúng.\nỞ dự đoán thứ tư, A đứng thứ ba sai và B đứng thứ nhất đúng.\nỞ dự đoán số hai, D đứng nhất sai và C đứng thứ ba đúng.\nVậy B đứng thứ nhất, E đứng thứ hai, C đứng thứ ba và A đứng thứ tư.", "unit": "c6", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["suy luận logic", "giả sử – phản chứng"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "ARC-2021-12", "school": "ARC", "year": "2021", "part": "TL", "q_no": 12, "points": null, "statement": "Trong hình vẽ dưới, ABDC và CEFG là hai hình chữ nhật, trong đó điểm B nằm trên cạnh FG của hình chữ nhật CEFG và điểm E nằm trên cạnh AB của hình chữ nhật ABCD thỏa mãn AE : EB = 3 : 2. Biết rằng diện tích hình chữ nhật ABCD là 35 cm2, tính diện tích hình chữ nhật CEFG?", "has_figure": true, "garbled": false, "answer": "14 cm2", "solution": "S_ABC = 1/2 × S_ABCD = 1/2 × 35 = 35/2 (cm2).\nTa có S_EBC / S_ABC = 2/5 (Hai tam giác có chung chiều cao hạ từ C và EB = 2/5 AB).\nSuy ra S_EBC = 2/5 × 35/2 = 7 (cm2).\nTa có S_CEFG = 2 × S_EBC = 2 × 7 = 14 (cm2).\nĐáp số: 14 cm2", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["tỉ số diện tích", "tam giác trong hình chữ nhật", "chung chiều cao"], "mock": false, "mc": null, "key": ["14", "2"], "gradable": true}, {"id": "ARC-2021-13", "school": "ARC", "year": "2021", "part": "TL", "q_no": 13, "points": null, "statement": "Cho 16 số tự nhiên phân biệt khác 0 thỏa mãn tích của năm số bất kì trong 16 số này là số chẵn. Gọi S là tổng của 16 số này. Biết rằng S là số lẻ, hỏi S có thể nhận giá trị nhỏ nhất là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "191", "solution": "Do tích của 5 số bất kỳ luôn chẵn nên số lượng số lẻ tối đa là 4 số lẻ.\nNgoài ra do tổng của 16 số này là lẻ nên chỉ có thể có 1 số lẻ hoặc 3 số lẻ.\nNếu có 1 số lẻ thì tổng 16 số nhỏ nhất là 1 + 2 + 4 + 6 + 8 + ... + 30 = 241. Nếu có 3 số lẻ thì tổng 16 số nhỏ nhất là 1 + 3 + 5 + 2 + 4 + 6 + ….. + 26 = 191.\nVậy tổng S nhỏ nhất là 191", "unit": "c6", "unit_alt": "c2", "difficulty": 3, "vn_grade": 4, "skills": ["chẵn lẻ", "suy luận", "giá trị nhỏ nhất"], "mock": false, "mc": null, "key": ["191"], "gradable": true}, {"id": "ARC-2021-14", "school": "ARC", "year": "2021", "part": "TL", "q_no": 14, "points": null, "statement": "Cho số A = 206920692069…2069 (A gồm 250 số 2069 viết liền nhau). Người ta muốn xóa một số chữ số của số A sao cho số thu được có tổng tất cả các chữ số bằng 2021. Hỏi, có thể xóa được nhiều nhất bao nhiêu chữ số? Khi đó, số lớn nhất có thể thu được là bao nhiêu?", "has_figure": false, "garbled": false, "answer": "Xóa nhiều nhất 774 chữ số; số lớn nhất là 999…9662 (223 chữ số 9 rồi 662)", "solution": "A đang có tổng các chữ số là (2 + 0 + 6 + 9) x 250 = 4250. Tổng các chữ số cần xóa đi: 4250 – 2021 = 2229. Trước tiên ta xóa hết 250 chữ số 0. Tiếp theo, nhận thấy 2229 chia hết cho 3, các chữ số 6 và 9 cũng chia hết cho 3 nên số lượng chữ số 2 xóa đi cũng phải chia hết cho 3. Có 250 chữ số 2, vậy ta xóa đi 249 chữ số 2. Lúc này tổng các chữ số 6 và 9 cần xóa là: 2229 – 249 x 2 = 1731. Nhận thấy số lượng chữ số 6 cần xóa phải nhiều nhất có thể, có 250 chữ số 6 nên ta thử: +)\nNếu xóa hết 250 chữ số 6 thì tổng các chữ số 9 cần xóa là 1731 – 250 x 6 = 231 không chia hết cho 9. +)\nNếu xóa 249 chữ số 6 thì tổng các chữ số 9 cần xóa là 1731 – 249 x 6 = 237 không chia hết cho 9. +)\nNếu xóa 248 chữ số 6 thì tổng các chữ số 9 cần xóa là 1731 – 248 x 6 = 243 chia hết cho 9, cần xóa 243 : 9 = 27 chữ số 9.\nVậy cần xóa nhiều nhất 250 chữ số 0; 249 chữ số 2; 248 chữ số 6 và 27 chữ số 9, tức là 250 + 249 + 248 + 27 = 774 chữ số.\nLúc này còn lại 226 chữ số gồm 1 chữ số 2; 2 chữ số 6 và 223 chữ số 9. Số lớn nhất có thể thu được là 9999…9999662.", "unit": "c2", "unit_alt": "c6", "difficulty": 3, "vn_grade": 4, "skills": ["xóa chữ số", "tổng các chữ số", "chia hết", "số lớn nhất"], "mock": false, "mc": null, "key": ["223", "662", "774", "9", "9662", "999"], "gradable": true}, {"id": "ARC-2022-CB-1", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 1, "points": null, "statement": "Diện tích hình tròn có bán kính 3 cm là\nA. 18,84 cm2\nB. 28,26 cm2\nC. 7,065 cm2\nD. 9,42 cm2", "has_figure": false, "garbled": false, "answer": "B", "solution": "Diện tích hình tròn có bán kính 3cm là 3 x 3 x 3,14 = 28,26 (cm2)", "unit": "u6", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["diện tích hình tròn"], "mock": false, "mc": {"A": "18,84 cm2", "B": "28,26 cm2", "C": "7,065 cm2", "D": "9,42 cm2"}, "key": "B", "gradable": true}, {"id": "ARC-2022-CB-2", "school": "ARC", "year": "2022-CB", "part": "TN", rt": "TN", "q_no": 23, "points": null, "statement": "Hai anh em có 22 cái kẹo, nếu anh cho em 2 cái thì số kẹo của anh vẫn nhiều hơn của em 2 cái. Số kẹo của em là:\nA. 12\nB. 14\nC. 8\nD. 10", "has_figure": false, "garbled": false, "answer": "C", "solution": "Số kẹo của em sau khi được anh cho 2 cái là: (22 – 2) : 2 = 10 (cái).\nSố kẹo của em ban đầu là: 10 – 2 = 8 (cái)", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng – hiệu", "cho – nhận"], "mock": false, "mc": {"A": "12", "B": "14", "C": "8", "D": "10"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-24", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 24, "points": null, "statement": "Cho dãy số có quy luật 3, 4, 6, 9, 13, 18, 24, … Số tiếp theo là\nA. 30\nB. 32\nC. 31\nD. 33", "has_figure": false, "garbled": false, "answer": "C", "solution": "4 = 3 + 1; 6 = 4 + 2; 9 = 6 + 3; 13 = 9 + 4; 18 = 13 + 5; 24 = 18 + 6. Số tiếp theo là 24 + 7 = 31", "unit": "u15", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dãy số", "quy luật"], "mock": false, "mc": {"A": "30", "B": "32", "C": "31", "D": "33"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-25", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 25, "points": null, "statement": "Cần cộng thêm số nào dưới đây với số 2032022 để được một số chia hết cho 3? A. 15 B. 35 C. 25", "has_figure": false, "garbled": false, "answer": "C", "solution": "Ta có 2032022 : 3 dư 2 nên số cần cộng thêm phải chia 3 dư 1 thì tổng tìm được chia hết cho 3.", "unit": "c2", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["chia hết cho 3", "số dư"], "mock": false, "mc": null, "key": [], "gradable": false}, {"id": "ARC-2022-CB-26", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 26, "points": null, "statement": "Trong các số dưới đây, số chia hết cho 12 là\nA. 2220\nB. 2032\nC. 2022\nD. 2312", "has_figure": false, "garbled": false, "answer": "A", "solution": "Số chia hết cho 12 trong các số đã cho là: 2220", "unit": "c2", "unit_alt": null, "difficulty": 1, "vn_grade": 4, "skills": ["dấu hiệu chia hết"], "mock": false, "mc": {"A": "2220", "B": "2032", "C": "2022", "D": "2312"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-27", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 27, "points": null, "statement": "Khi nhân một số với 23, bạn Khanh đã để các tích riêng thẳng cột nên tích mới giảm 1584 đơn vị so với tích đúng. Tích đúng là\nA. 1978\nB. 1965\nC. 2001\nD. 2024", "has_figure": false, "garbled": false, "answer": "D", "solution": "Gọi thừa số còn lại là a.\nKhi nhân số a với 23, bạn Khanh đã để các tích riêng thẳng cột nên tích tìm được là 5 x a.\nTa có 23 x a – 5 x a = 18 x a = 1584. Thừa số còn lại là a = 1584 : 18 = 88. Tích đúng là: 88 x 23 = 2024", "unit": "c2", "unit_alt": "c1", "difficulty": 2, "vn_grade": 4, "skills": ["tích riêng thẳng cột", "phép nhân", "tìm số"], "mock": false, "mc": {"A": "1978", "B": "1965", "C": "2001", "D": "2024"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-28", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 28, "points": null, "statement": "Một khu vườn trồng 203 cây gồm 3 loại cam, quýt, bưởi. Biết số cây cam gấp 2 lần số cây quýt, còn số cây quýt gấp 2 lần số cây bưởi. Số cây quýt trong vườn là:\nA. 58 cây\nB. 116 cây\nC. 68 cây\nD. 29 cây", "has_figure": false, "garbled": false, "answer": "A", "solution": "Coi số cây bưởi là 1 phần, số cây quýt là 2 phần, số cây cam là 4 phần.\nTổng số phần bằng nhau là: 1 + 2 + 4 = 7 (phần).\nSố cây quýt là 203 : 7 x 2 = 58 (cây)", "unit": "c3", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["tổng – tỉ", "ba đại lượng"], "mock": false, "mc": {"A": "58 cây", "B": "116 cây", "C": "68 cây", "D": "29 cây"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-29", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 29, "points": null, "statement": "Để pha được 800 g dung dịch nước muối chứa chín phần nghìn muối cần số gam muối là\nA. 72 g\nB. 64 g\nC. 7,2 g\nD. 8,1 g", "has_figure": false, "garbled": false, "answer": "C", "solution": "Số gam muối là 800 × 9/1000 = 7,2 (g)", "unit": "u4", "unit_alt": "u3", "difficulty": 1, "vn_grade": 5, "skills": ["phần nghìn", "tỉ số", "phân số của một số"], "mock": false, "mc": {"A": "72 g", "B": "64 g", "C": "7,2 g", "D": "8,1 g"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-30", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 30, "points": null, "statement": "Một tập tài liệu có 320 trang. Số chữ số để đánh số trang liền nhau của tập tài liệu đó từ trang số 1 là\nA. 852\nB. 663\nC. 849\nD. 960", "has_figure": false, "garbled": false, "answer": "A", "solution": "Từ trang 1 đến trang 9 có 9 trang → cần 9 chữ số.\nTừ trang 10 đến trang 99 có 90 trang → cần 90 x 2 = 180 chữ số.\nTừ trang 100 đến trang 320 có 221 trang → cần 221 x 3 = 663 chữ số.\nSố chữ số để đánh số trang liền nhau của tập tài liệu đó từ trang số 1 là: 9 + 180 + 663 = 852 (chữ số)", "unit": "c2", "unit_alt": null, "difficulty": 2, "vn_grade": 4, "skills": ["số trang sách", "đếm chữ số"], "mock": false, "mc": {"A": "852", "B": "663", "C": "849", "D": "960"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-31", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 31, "points": null, "statement": "Một đơn vị vận chuyển 3 tấn hàng, quãng đường 200 km chi phí hết 18 triệu đồng. Hỏi vẫn đơn vị đó vận chuyển 7 tấn hàng, quãng đường 120 km hết bao nhiêu tiền?\nA. 31,5 triệu\nB. 70 triệu\nC. 21 triệu\nD. 25,2 triệu", "has_figure": false, "garbled": false, "answer": "D", "solution": "Vận chuyển 3 tấn hàng với quãng đường 120 km hết số tiền là: 120 x 18 : 200 = 10,8 (triệu).\nVận chuyển 7 tấn hàng với quãng đường 120 km hết số tiền là: 7 x 10,8 : 3 = 25,2 (triệu)", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["tỉ lệ thuận", "hai đại lượng", "rút về đơn vị"], "mock": false, "mc": {"A": "31,5 triệu", "B": "70 triệu", "C": "21 triệu", "D": "25,2 triệu"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-32", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 32, "points": null, "statement": "Tính A = 1/6 + 1/12 + 1/20 + .... + 1/240\nA. 4/15\nB. 15/16\nC. 7/16\nD. 13/30", "has_figure": false, "garbled": false, "answer": "C", "solution": "A = 1/6 + 1/12 + 1/20 + .... + 1/240 = 1/(2×3) + 1/(3×4) + 1/(4×5) + .... + 1/(15×16) = 1/2 − 1/3 + 1/3 − 1/4 + 1/4 − 1/5 + .... + 1/15 − 1/16 = 1/2 − 1/16 = 7/16", "unit": "c1", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["dãy phân số đặc biệt", "tính nhanh"], "mock": false, "mc": {"A": "4/15", "B": "15/16", "C": "7/16", "D": "13/30"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-33", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 33, "points": null, "statement": "Ba bạn Mai, Hoa và Trang có 48 bông hoa. Nếu Mai cho Hoa 3 bông; Hoa cho Trang 2 bông; còn Trang lại cho Mai 6 bông thì số hoa của ba bạn bằng nhau. Số hoa ban đầu của Trang là\nA. 15 bông\nB. 13 bông\nC. 20 bông\nD. 16 bông", "has_figure": false, "garbled": false, "answer": "C", "solution": "Số hoa của mỗi bạn lúc sau là: 48 : 3 = 16 (bông).\nSố hoa của Trang ban đầu là 16 + 6 – 2 = 20 (bông)", "unit": "c3", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["cho – nhận", "tính ngược"], "mock": false, "mc": {"A": "15 bông", "B": "13 bông", "C": "20 bông", "D": "16 bông"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-34", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 34, "points": null, "statement": "Người thứ nhất làm một mình xong một công việc trong 4 giờ, người thứ hai làm một mình xong công việc đó trong 6 giờ. Thời gian để cả hai người cùng làm xong công việc đó là:\nA. 2 giờ 36 phút\nB. 2 giờ\nC. 2 giờ 24 phút\nD. 3 giờ", "has_figure": false, "garbled": false, "answer": "C", "solution": "Trong 1 giờ người thứ nhất làm được 1/4 công việc.\nTrong 1 giờ người thứ hai làm được 1/6 công việc.\nTrong 1 giờ cả hai người làm được 1/4 + 1/6 = 5/12 công việc.\nThời gian để cả hai người cùng làm xong công việc đó là: 1 : 5/12 = 12/5 = 2,4 (giờ) = 2 giờ 24 phút", "unit": "c5", "unit_alt": null, "difficulty": 2, "vn_grade": 5, "skills": ["công việc chung", "phân số"], "mock": false, "mc": {"A": "2 giờ 36 phút", "B": "2 giờ", "C": "2 giờ 24 phút", "D": "3 giờ"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-35", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 35, "points": null, "statement": "Một thửa ruộng hình thang có đáy lớn gấp 2 lần đáy bé và chiều cao ngắn hơn đáy lớn 4 m nhưng dài hơn đáy bé 5 m. Diện tích của thửa ruộng là\nA. 378 m2\nB. 175,5 m2\nC. 351 m2\nD. 189 m2", "has_figure": false, "garbled": false, "answer": "D", "solution": "Gọi đáy bé là a, đáy lớn là 2 x a.\nChiều cao ngắn hơn đáy lớn 4m nên chiều cao là 2 x a – 4. Chiều cao dài hơn đáy bé 5m nên 2 x a – 4 = a + 5.\nSuy ra a = 9 (m).\nHay đáy bé là 9m, đáy lớn là 18m, chiều cao là 14 m.\nDiện tích của thửa ruộng là (18 + 9) x 14 : 2 = 189 (m2)", "unit": "u6", "unit_alt": "c3", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích hình thang", "hiệu – tỉ"], "mock": false, "mc": {"A": "378 m2", "B": "175,5 m2", "C": "351 m2", "D": "189 m2"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-36", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 36, "points": null, "statement": "Một bể nước có chiều dài 1,2 m, chiều rộng 8 dm và chiều cao là 6 dm (các kích thước được đo bên trong lòng bể). Trong bể có 432 lít nước. Mặt nước cách thành bể\nA. 15 cm\nB. 22,5 cm\nC. 37,5 cm\nD. 45 cm", "has_figure": false, "garbled": false, "answer": "A", "solution": "Đổi 1,2m = 12 dm; 432 lít = 432 dm3. Diện tích đáy bể là 12 x 8 = 96 (dm2).\nChiều cao mực nước trong bể là 432 : 96 = 4,5 (dm).\nMặt nước cách thành bể là 6 – 4,5 = 1,5 (dm) = 15 cm", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["thể tích hình hộp chữ nhật", "đổi đơn vị", "chiều cao mực nước"], "mock": false, "mc": {"A": "15 cm", "B": "22,5 cm", "C": "37,5 cm", "D": "45 cm"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-37", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 37, "points": null, "statement": "Một lớp học có 32 học sinh. Trong đó, có 22 bạn thích ăn táo, 23 bạn thích ăn xoài và mỗi bạn đều thích ăn ít nhất 1 trong 2 loại trái cây trên. Số bạn thích ăn cả táo và xoài là\nA. 9 bạn\nB. 8 bạn\nC. 10 bạn\nD. 13 bạn", "has_figure": false, "garbled": false, "answer": "D", "solution": "Số bạn thích ăn cả táo và xoài là 22 + 23 – 32 = 13 (bạn)", "unit": "c6", "unit_alt": "u12", "difficulty": 2, "vn_grade": 4, "skills": ["sơ đồ Venn", "bao hàm – loại trừ"], "mock": false, "mc": {"A": "9 bạn", "B": "8 bạn", "C": "10 bạn", "D": "13 bạn"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-38", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 38, "points": null, "statement": "Trên bến đò có một đoàn khách tham quan. Biết nếu 6 khách một đò thì thiếu 1 đò còn 8 khách một đò thì thừa 1 đò. Hỏi có tất cả bao nhiêu người trên bến?\nA. 55 người\nB. 64 người\nC. 48 người\nD. 36 người", "has_figure": false, "garbled": false, "answer": "C", "solution": "Trên bến có 48 người.", "unit": "c3", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["giả thiết tạm", "thừa – thiếu"], "mock": false, "mc": {"A": "55 người", "B": "64 người", "C": "48 người", "D": "36 người"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-39", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 39, "points": null, "statement": "Cho hai hình chữ nhật có kích thước như hình vẽ bên. Diện tích tam giác màu xanh là\nA. 6 cm2\nB. 3 cm2\nC. 4,5 cm2\nD. 7,5 cm2", "has_figure": true, "garbled": false, "answer": "C", "solution": "Độ dài cạnh BD là 3 + 6 = 9 (cm).\nDiện tích tam giác ABD là 6 x 9 : 2 = 27 (cm2).\nDiện tích hình thang ABCE là (6 + 3) x 3 : 2 = 13,5 (cm2).\nDiện tích tam giác ECD là 3 x 6 : 2 = 9 (cm2).\nDiện tích tam giác màu xanh là 27 – (13,5 + 9) = 4,5 (cm2)", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["diện tích tam giác", "cắt ghép hình", "hình thang"], "mock": false, "mc": {"A": "6 cm2", "B": "3 cm2", "C": "4,5 cm2", "D": "7,5 cm2"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-40", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 40, "points": null, "statement": "Cho tứ giác ABCD với các kích thước như hình vẽ bên. Diện tích tứ giác ABCD là:\nA. 34,5 cm2\nB. 54 cm2\nC. 71 cm2\nD. 35,5 cm2", "has_figure": true, "garbled": false, "answer": "D", "solution": "Diện tích tam giác ABH là 3 x 5 : 2 = 7,5 (cm2).\nDiện tích tam giác CKD là 4 x 5 : 2 = 10 (cm2).\nDiện tích hình thang BCKH là (5 + 4) x 4 : 2 = 18 (cm2).\nDiện tích tứ giác ABCD là 7,5 + 10 + 18 = 35,5 (cm2)", "unit": "c7", "unit_alt": "u6", "difficulty": 2, "vn_grade": 5, "skills": ["diện tích tứ giác", "chia hình", "hình thang"], "mock": false, "mc": {"A": "34,5 cm2", "B": "54 cm2", "C": "71 cm2", "D": "35,5 cm2"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-41", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 41, "points": null, "statement": "Thêm vào số bị trừ 3 đơn vị và thêm vào số trừ 20 đơn vị thì được hiệu mới là 17. Hiệu ban đầu của phép trừ là\nA. 40\nB. 34\nC. 0\nD. 17", "has_figure": false, "garbled": false, "answer": "B", "solution": "Số bị trừ + 3 – (số trừ + 20) = 17. Số bị trừ + 3 – số trừ - 20 = 17. Số bị trừ - số trừ = 17 + 20 – 3 = 34", "unit": "c1", "unit_alt": "u1", "difficulty": 2, "vn_grade": 4, "skills": ["thành phần phép trừ", "thay đổi số bị trừ số trừ"], "mock": false, "mc": {"A": "40", "B": "34", "C": "0", "D": "17"}, "key": "B", "gradable": true}, {"id": "ARC-2022-CB-42", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 42, "points": null, "statement": "Bán kính của chiếc bánh xe đạp là 4 dm. Nếu bánh xe quay 200 vòng thì xe đạp chạy được số mét là\nA. 251,2 m\nB. 50,24 m\nC. 25,12 m\nD. 502,4 m", "has_figure": false, "garbled": false, "answer": "D", "solution": "Chu vi bánh xe là 4 x 2 x 3,14 = 25,12 (dm).\nNếu bánh xe quay 200 vòng thì xe đạp chạy được số mét là 25,12 x 200 = 5024 (dm) = 502,4 m", "unit": "u6", "unit_alt": null, "difficulty": 1, "vn_grade": 5, "skills": ["chu vi hình tròn", "đổi đơn vị"], "mock": false, "mc": {"A": "251,2 m", "B": "50,24 m", "C": "25,12 m", "D": "502,4 m"}, "key": "D", "gradable": true}, {"id": "ARC-2022-CB-43", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 43, "points": null, "statement": "Tổng các số chia hết cho 6 và nhỏ hơn 203 là\nA. 3366\nB. 3636\nC. 3267\nD. 3264", "has_figure": false, "garbled": false, "answer": "A", "solution": "Các số chia hết cho 6 và nhỏ hơn 203 là 6; 12; 18; ….; 198. Số các số hạng trong dãy trên là (198 – 6) : 6 + 1 = 33 (số hạng).\nTổng các số chia hết cho 6 và nhỏ hơn 203 là (6 + 198) x 33 : 2 = 3366", "unit": "u15", "unit_alt": "c2", "difficulty": 2, "vn_grade": 4, "skills": ["dãy số cách đều", "tổng dãy số", "chia hết"], "mock": false, "mc": {"A": "3366", "B": "3636", "C": "3267", "D": "3264"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-44", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 44, "points": null, "statement": "Nam viết 3 số 90; 72 và 18 lên bảng. Sau đó, Nam xóa 2 trong 3 số đó và thay vào là trung bình cộng của hai số vừa xóa cho đến khi trên bảng chỉ còn 1 số. Số nào dưới đây không phải là kết quả sau cùng thu được ở trên bảng?\nA. 67,5\nB. 54\nC. 49,5\nD. 63", "has_figure": false, "garbled": false, "answer": "B", "solution": null, "unit": "c6", "unit_alt": "u14", "difficulty": 2, "vn_grade": 5, "skills": ["trung bình cộng", "thử các trường hợp", "suy luận"], "mock": false, "mc": {"A": "67,5", "B": "54", "C": "49,5", "D": "63"}, "key": "B", "gradable": true}, {"id": "ARC-2022-CB-45", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 45, "points": null, "statement": "Em có số bi gấp 2 lần số bi của anh. Nếu em cho anh 3 viên thì số bi của em gấp 1,5 lần số bi của anh. Tổng số bi của hai anh em là\nA. 75 viên\nB. 45 viên\nC. 90 viên\nD. 60 viên", "has_figure": false, "garbled": false, "answer": "B", "solution": "Ban đầu, số bi của em bằng 2/1 số bi của anh ⇒ Số bi của em bằng 2/3 tổng số bi của hai anh em.\nNếu em cho anh 3 viên thì số bi của em bằng 3/2 số bi của anh ⇒ Số bi của em bằng 3/5 tổng số bi của hai anh em.\n3 viên bi ứng với 2/3 − 3/5 = 1/15 (tổng số bi của hai anh em).\nTổng số bi của hai anh em là 3 : 1/15 = 45 (viên bi)", "unit": "c3", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["hai tỉ số", "tổng không đổi", "phân số"], "mock": false, "mc": {"A": "75 viên", "B": "45 viên", "C": "90 viên", "D": "60 viên"}, "key": "B", "gradable": true}, {"id": "ARC-2022-CB-46", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 46, "points": null, "statement": "Ba lớp 5A, 5B, 5C tổ chức liên hoan kem. Lớp 5A mang đi 12 kg kem, lớp 5B mang đi 8 kg kem, còn lớp 5C không mua được kem nên đưa số tiền 800 000 đồng dự định mua kem cho hai lớp kia và ba lớp sẽ ăn kem chung. Nếu lượng kem mỗi lớp ăn là như nhau thì số tiền lớp 5A nhận được là\nA. 560 000 đồng\nB. 640 000 đồng\nC. 480 000 đồng\nD. 400 000 đồng", "has_figure": false, "garbled": false, "answer": "C", "solution": "Tổng số kg kem của 3 lớp là 12 + 8 = 20 (kg).\nGiá tiền của mỗi kg kem là 800 000 : 20 = 40 000 (đồng).\nLớp 5A được nhận số tiền là: 40 000 x 12 = 480 000 (đồng)", "unit": "c5", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["bài toán chia tiền", "suy luận", "rút về đơn vị"], "mock": false, "mc": {"A": "560 000 đồng", "B": "640 000 đồng", "C": "480 000 đồng", "D": "400 000 đồng"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-47", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 47, "points": null, "statement": "Một cửa hàng nhập hoa về bán trong 3 ngày. Ngày thứ nhất, bán giá gấp đôi so với giá nhập và bán được 34% số hoa. Ngày thứ hai, bán giá bằng 120% giá nhập nên bán được một nửa số hoa còn lại. Ngày thứ ba, chấp nhận bán bằng nửa giá nhập nên bán được hết số hoa. Tính phần trăm lãi của cửa hàng đó so với số tiền bỏ ra nhập hoa.\nA. 36%\nB. 21,4%\nC. 24,1%\nD. 19%", "has_figure": false, "garbled": false, "answer": "C", "solution": "Coi số tiền nhập hoa là 100%.\nSố tiền ngày thứ nhất bán được: 100% x 2 x 34% = 68% (số tiền nhập hoa).\nNgày thứ hai bán được: (100% - 34%) : 2 = 33% (số hoa).\nSố tiền ngày thứ hai bán được bằng: 120% x 33% = 39,6% (số tiền nhập hoa).\nNgày thứ ba bán được: 100% - 34% - 33% = 33%.\nSố tiền ngày thứ ba bán được bằng 50% x 33% = 16,5% (số tiền nhập hoa).\nSố phần trăm lãi của cửa hàng đó so với số tiền bỏ ra nhập hoa: (68% + 39,6% + 16,5%) – 100% = 24,1%", "unit": "c5", "unit_alt": "u4", "difficulty": 3, "vn_grade": 5, "skills": ["tỉ số phần trăm", "lãi – vốn", "bài toán kinh tế"], "mock": false, "mc": {"A": "36%", "B": "21,4%", "C": "24,1%", "D": "19%"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-48", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 48, "points": null, "statement": "Có 203 bóng đèn được xếp thành một vòng tròn và đều đang bật. Người ta tắt bóng ở vị trí thứ nhất sau đó bỏ cách một bóng đang bật và tắt bóng tiếp theo. Cứ thực hiện như vậy cho đến khi trên vòng tròn chỉ còn một bóng đang bật. Bóng đèn đó ở vị trí số:\nA. 150\nB. 22\nC. 126\nD. 86", "has_figure": false, "garbled": false, "answer": "A", "solution": null, "unit": "c6", "unit_alt": null, "difficulty": 3, "vn_grade": 4, "skills": ["bài toán Josephus", "suy luận", "quy luật"], "mock": false, "mc": {"A": "150", "B": "22", "C": "126", "D": "86"}, "key": "A", "gradable": true}, {"id": "ARC-2022-CB-49", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 49, "points": null, "statement": "Tỉ giá giao dịch ở một chợ động vật là: 5 con bò đổi được 3 con ngựa. Một con bò và 1 con ngựa đổi được 44 con thỏ. Muốn đổi được 4 con ngựa thì cần số con thỏ là\nA. 100 con thỏ\nB. 132 con thỏ\nC. 110 con thỏ\nD. 121 con thỏ", "has_figure": false, "garbled": false, "answer": "C", "solution": "1 con bò và 1 con ngựa đổi được 44 con thỏ ⇒ 5 con bò và 5 con ngựa đổi được 44 x 5 = 220 con thỏ.\nTa có: 5 con bò đổi được 3 con ngựa ⇒ 8 con ngựa đổi được 220 con thỏ ⇒ 4 con ngựa đổi được 220 : 2 = 110 con thỏ", "unit": "c3", "unit_alt": "c6", "difficulty": 2, "vn_grade": 4, "skills": ["khử", "thay thế", "suy luận"], "mock": false, "mc": {"A": "100 con thỏ", "B": "132 con thỏ", "C": "110 con thỏ", "D": "121 con thỏ"}, "key": "C", "gradable": true}, {"id": "ARC-2022-CB-50", "school": "ARC", "year": "2022-CB", "part": "TN", "q_no": 50, "points": null, "statement": "Người ta dùng 64 hình lập phương nhỏ bằng nhau để xếp thành một hình lập phương lớn sau đó sơn tất cả các mặt của hình lập phương lớn đó. Số mặt không được sơn của các hình lập phương nhỏ là:\nA. 288\nB. 8\nC. 256\nD. 144", "has_figure": false, "garbled": false, "answer": "A", "solution": "Ta có 64 = 4 x 4 x 4 nên 64 hình lập phương nhỏ xếp thành một hình lập phương lớn có độ dài cạnh bằng 4 lần độ dài cạnh hình lập phương nhỏ.\n64 hình lập phương nhỏ có số mặt là: 64 x 6 = 384 (mặt).\nSố hình lập phương được sơn 3 mặt là 8 hình → 24 mặt được sơn.\nSố hình lập phương được sơn 2 mặt là: 24 hình → 48 mặt được sơn.\nSố hình lập phương được sơn 1 mặt là: 24 hình → 24 mặt được sơn.\nSố mặt không được sơn của các hình lập phương nhỏ là: 384 – 24 – 48 – 24 = 288 (mặt)", "unit": "c7", "unit_alt": null, "difficulty": 3, "vn_grade": 5, "skills": ["hình lập phương", "sơn mặt", "đếm mặt"], "mock": false, "mc": {"A": "288", "B": "8", "C": "256", "D": "144"}, "key": "A", "gradable": true}, {"id": "CG-2019-1", "school": "CG", "year": "2019", "part": "TN", "q_no": 1, "points": null, "statement": "Tìm số tự nhiên x biết: 134247/1000 < 134,2x7 < 134267/1000.", "has_figure": false, "garbled": false, "answer": "x = 5", "solution": "Ta có 134,247 < 134,2x7 < 134,267.\nSuy ra 4 < x < 6.\nVậy x = 5.", "unit": "u2", "unit_alt": "c2", "difficulty": 1, "vn_grade": 5, "skills": ["số thập phân", "so sánh số thập phân", "tìm chữ số"], "mock": false, "mc": null, "key": ["5"], "grada
