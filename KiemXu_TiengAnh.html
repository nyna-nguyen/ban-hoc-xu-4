:true,"i":1137,"sk":530000},{"id":"tdn-2026-q12","p":"tdn-2026","s":"TDN","k":"official","t":"cloze","f":"mc","st":"(8) ______, Ms. Thao just smiled and gave us a big thumbs-up","o":["Therefore","Moreover","However"],"a":"C","x":"","pid":"tdn-2026-P3","lv":5,"u":5,"n":"","num":"8","ins":"Read the following letter. Choose the best option (A, B, or C) to fill in the blank.","gp":"linking words: contrast","g":true,"i":1138,"sk":530000},{"id":"tdn-2026-q13","p":"tdn-2026","s":"TDN","k":"official","t":"build","f":"txt","st":"Remember / turn / light / before / leave / save / electric //","o":[],"a":"Remember to turn off the lights / turn the lights off before leaving / you leave to save electricity.","x":"","pid":null,"lv":6,"u":null,"n":"Ví dụ in trong đề: 'We / have / make / quick / decide / yesterday // → We had to make a quick decision yesterday.'","num":"1","ins":"Write complete sentences with the given cues. You must write NO MORE THAN fifteen words for each sentence.","gp":"remember to V; before V-ing; to-infinitive of purpose; word form (electricity)","g":false,"i":1139,"sk":630000},{"id":"tdn-2026-q14","p":"tdn-2026","s":"TDN","k":"official","t":"build","f":"txt","st":"childhood, / Lan / usual / go / jog / mom / evening //","o":[],"a":"In / During (her) childhood, Lan usually went jogging / for a jog with her mom every evening / in the evening.","x":"","pid":null,"lv":6,"u":1,"n":"","num":"2","ins":"Write complete sentences with the given cues. You must write NO MORE THAN fifteen words for each sentence.","gp":"past simple; adverb of frequency (usually); go + V-ing","g":false,"i":1140,"sk":630000}], PASS={"ams-2019-P1":{"title":"Fish farming in Japan","text":"People in many countries grow fresh water fish from eggs. They move the small fish into lakes and rivers. The fish live and (1) ______ there. People go (2) ______ in these lakes and rivers. They enjoy catching fish because fish is also good food. Now the Japanese grow salt water fish. Most of them are yellow tail fish. Workers grow the fish from eggs. Every time they feed the fish, they play (3) ______ of piano music. The fish (4) ______ that piano music means food. When the fish are small, the Japanese put them into the ocean near the land. The fish find some of their (5) ______ food. Workers also feed them. They play the same piano music. The fish (6) ______ know the music. They swim toward it and (7) ______ the food. In (8) ______ months the fish are large. The Japanese play the same music. The fish swim toward it and the workers (9) ______ them. The Japanese get about 15 percent of their seafood (10) ______ farms in the ocean."},"ams-2019-P2":{"title":"Past explorers","text":"Past explorers have made vast contributions to our knowledge of the world today. They braved the oceans to discover the world and to bring their goods to other countries to trade.\n\nMany explorers had to overcome their fear of the unknown to travel around the world on their sailing ships. Submitting themselves to unpredictable weather conditions, each explorer either traveled further than his predecessor or tried to find a different route to already discovered countries. For example, Vasco Da Gama, a Portuguese explorer, established a sea route from Europe to India. He had extended the sea route that Bartolomeu Dias had already done when he later sailed around the Cape of Good Hope in southern Africa.\n\nMore importantly, explorers first closed the gap between the east and the west by trading their local goods with foreign ones. India was known for its spices such as nutmeg and cinnamon while China was known for its silk. A part of the east was brought to the west when western gourmets developed a taste for eastern spices in their food. People in the east dressed in clothes that were previously only worn in the west. Without the explorers, many of us would still be living in our own enclave with little knowledge of the vast world and what other foreign countries have to offer us."},"ams-2024-P2":{"title":"Volunteering","text":"Volunteering is a beneficial activity for students in many ways. Firstly, it allows students (26) ______ empathy and compassion towards others. By taking part (27) ______ volunteer work, they can understand the difficulties and challenges that many individuals and communities have to face.\n\nSecondly, volunteering (28) ______ an opportunity for students to improve valuable skills. They can learn teamwork, leadership, communication, and problem-solving skills. These skills are essential for their (29) ______ and professional growth. Additionally, volunteering allows students to make a positive impact on society. Whether it's helping the elderly, assisting in community projects, or supporting charitable organizations, their contributions can bring about meaningful change.\n\nLastly, the (30) ______ gained through volunteering can benefit students in the future. It enhances their resumes, demonstrates their commitment to social responsibility, and can even open doors to scholarships, internships, and career opportunities."},"ams-2024-P3":{"title":"Wildlife in danger","text":"Nowadays people are more aware that wildlife all over the world is in (31) ______. Many species of animals are threatened, and could easily become extinct if we do not (32) ______ an effort to protect them. There are many reasons (33) ______ this. In some cases, animals are hunted for their fur or for other valuable parts of their bodies. Some birds, such as parrots, are caught alive and sold as pets. For many animals and birds, the problem is that their habitat - the place where they live - is disappearing. More land is used for farms, houses or industry, and there are fewer open spaces than there once were. Farmers use powerful chemicals to help them grow better crops, but these chemicals pollute the environment and harm wildlife. The most successful animals on earth - human (34) ______ - will soon be the only ones left unless we can (35) ______ this problem."},"ams-2024-P4":{"title":"American breakfast","text":"Americans, in general, are big eaters and one of the greatest pleasures of the day is sitting down to a hearty breakfast. Most neighborhood diners and cafeterias offer breakfast specials. Some can be as simple as buttered toast with coffee. Others can almost be equivalent to a full course meal which can provide enough calories for the entire day. The breakfast special is offered daily and runs usually from seven until eleven in the morning after which the prices change and everything is ordered a la carte.\n\nSome fast food restaurants offer an \"all-you-can-eat\" buffet breakfast which may include more than thirty choices of every breakfast item imaginable. For a set price one can get as many refills as one wants. A complete breakfast will cost less than five dollars with tips included.\n\nSome regional favorites also add variety to the American breakfast. In the south, grits with butter may replace hash brown, and hot spicy biscuits and gravy seasoned with bits of meat make up a meal in themselves. Fortified with a hearty breakfast, Americans find it easier to face the challenges of another day."},"arc-2024-thu-P1":{"title":"Hoa's meals","text":"Hoa lives with her parents. She has three meals a day: breakfast, lunch and dinner. She usually has breakfast at home with her parents and her brother. She has bread, eggs and milk for breakfast. Sometimes, she likes to have some noodles for her breakfast. Her favorite food is rice and vegetables. When she's tired, she often drinks orange juice or apple juice. At school, she and her friends always have lunch at half past eleven. They often have fish, beef and vegetables for lunch. She has dinner with her parents at home at a quarter to seven. They often have chicken and soup for dinner. After dinner, they eat some bananas and grapes for dessert. Hoa likes having dinner because it is a big and happy meal of the day. Her family goes out for dinner twice a month."},"arc-2024-thu-P2":{"title":"Clarence Birdseye and frozen food","text":"In 1912, Clarence Birdseye went to live with the Inuit people of the North American Arctic. The Inuit taught him how to fish under the ice. As Birdseye pulled the fish from the water, he put them on the snow and continued fishing. The fish froze almost immediately because of the cold Arctic air.\n\nBirdseye went to eat the fish a few days later. He noticed that they tasted as fresh as the day he caught them. Usually, frozen fish tasted old, and less flavorful. He wondered why the fish tasted better. Maybe it was because of how fast they froze.\n\nBirdseye moved to Massachusetts and began experimenting with freezing food. He developed a new way to freeze it. He blasted the food with air chilled to -43℃. After he developed this method, he founded the General Seafood Corporation. Soon, Birdseye began experimenting with freezing other types of food.\n\nFrozen food was a success! It revolutionized the food industry. Now people could enjoy fresh tasting food at any time of the year. They could even eat food that was packaged far away. Clarence Birdseye has changed the way we eat."},"cg-2022-P1":{"title":"Travelling to London","text":"If you travel to London by train you can (0) buy your ticket at the local train station using a credit card. At certain times of the day, there is a discount on the fare so you can get a(n) (28) ______ ticket. It's a good idea to have plenty of (29) ______ so that you can use it to (30) ______ for your underground ticket from a machine. If you don't have the correct money, you will probably (31) ______ queue at the ticket office.\n\nOf course you can also go to London by coach. This is not as (32) ______ as the train, but it takes longer."},"cg-2022-P2":{"title":"Pop singer Charlotte Bond talks about living in London.","text":"I live in the center of London. I love it because there’s always something happening and there are people around whatever time it is. Famous people like it too – they often come here for the restaurants and shops.\n\nI’ve lived here all my life. When I was little, I had singing lessons at a place near where I live now. I was afraid of the teacher at first, and some of the songs we did together were quite hard to learn. But she was good at what she did and I learned a lot of things that have helped me in my career.\n\nWhen friends visit me now, I enjoy taking them sightseeing. You can get a bus around the city, but we prefer to walk. I’ve got a little car and I love driving, but there’s so much traffic here, and it’s hard to find parking spaces.\n\nOne building I love is the Natural History Museum. They sometimes hold parties there, and last December my band and I played at one. I’ll never forget it. When I go to exhibitions at the museum with my friends, I tell them all about that night and how amazing it was.\n\nSoon I’ll be leaving London to go on tour with my band. We’re playing in lots of new cities and I can’t wait to explore them. We’ve sold lots of tickets, which is great. I’ll be away from my family for six months, but they’re coming to see me sing, so it’s fine."},"cva-2023-de02-P1":{"title":"Tests and exams","text":"Tests and exams are part of our school life. They play (18) ______ important role in students’ learning and education. Preparing (19) ______ exams is a skill and not every student knows how to do it. Many students think that the (20) ______ way is to learn everything by heart, but this isn’t always the case. Knowledge is something more than remembering facts - it also involves understanding the information you learn. (21) ______ you study for an exam, try to understand everything. Also, (22) ______ attention to details. Another mistake that students make is listening to music and chatting on Facebook while they’re learning. This does not help concentration!"},"cva-2023-de02-P2":{"title":"The importance of pets","text":"When they were asked, six million people in Britain said they own a pet cat. That’s strange, as only four million cats are known to be living in Britain! Perhaps some cats have more than one owner. What’s clear, however, is that cats are popular with people in Britain.\n\nDoctors have known for some time that a link exists between animals and human health. In a special report, they express the importance of pets to people in Britain. They say that pet owners are less likely to have a heart attack than people who do not own a pet. Although the favourite pets in Britain are cats and dogs, doctors think that all pets are good for people’s health, even pet goldfish! What is the reason for this? Doctors believe that people need to have someone or something to care for and take care of. Then they don’t think about themselves so much. They forget their own problems and thus feel better."},"lmn-2021-P1":{"title":"Paragraph 1 (headings)","text":"In the future, we will have lots of clever robots called nanobots. Nanobots will be very small, but they will be everywhere. They will clean our homes, mend our clothes and make our meals."},"lmn-2021-P2":{"title":"Paragraph 2 (headings)","text":"Computers will be more intelligent. They will understand what we say, what we think and how we feel. In the future, humans and computers will be part of a huge radio network. We will send messages from our brain to our computer and the computer will send messages straight to our brain, without using wires. When you want to learn something new, your computer will send the information straight to your brain."},"lmn-2021-P3":{"title":"Paragraph 3 (headings)","text":"In a few years there will be clothes with soft TV screens in them. You will be able to change the pattern on your T-shirt. You will be able to show music videos on your clothes while you are dancing. Before long, there will be jackets with a soft watch on the sleeve."},"lmn-2021-P4":{"title":"Paragraph 4 (headings)","text":"Children will still go to school, but schools will be very different. There will still be teachers, but computers will teach some lessons. Some students will stay at home and learn in virtual classrooms. Virtual reality will give them images of a classroom in three dimensions - or 3D. They will see their teacher and their friends, so they will feel like they are really at school."},"lmn-2021-P5":{"title":"Paragraph 5 (headings)","text":"TV channels will be a thing of the past. People will choose TV programs from a menu on their computer. In the future, TV programs, films, music and books will all come to us through our computers. We will say to the computer, \"I want to watch a funny film\" or \"I'd like to hear some dance music.\" The computer will understand us and choose the film or the music."},"lmn-2021-P6":{"title":"Christina's birthday party","text":"My name is Christina. Last week, I had a birthday party at home. My parents and I prepared for this day. I invited my friends and relatives to the party. My father and I went to the shop to buy some things for the party. My mother stayed at home. She cleaned the flat, made cakes and set the tables. At four o'clock, my relatives and friends came to my house. I was very happy to see them. They brought me lots of nice presents. Then, we enjoyed food, danced and sang together. After that, we told stories and funny jokes. It was a happy day."},"lmn-2021-P7":{"title":"Life today","text":"Life in the present day has changed from years ago. Today everything is instant. Cars are fast. Food is fast. Technology is fast. Traveling is also different today. Some people travel by car, bus, truck, or subway. Other people travel in planes. They can move us from one part of the world to another in only one day. Astronauts travel to the moon in space shuttles. Shuttles travel faster than planes or cars. Communication has become very fast as well. People can use cell phones and computers to deliver messages instantly. Televisions and radios broadcast the news that is happening right now. We no longer have to wait months to receive information from other parts of the world."},"mc-2020-P1":{"title":"How Nam has improved his English","text":"In the first year of lower secondary school I had some difficulties in learning English. My English pronunciation was really bad and my English grammar was worse.\n\nI did not know how to improve them. I didn't want my father and mother to know about this. One afternoon after the lesson, my teacher of English told me to wait for her outside the classroom. She took me to the school library and showed me tapes of pronunciation drills kept in a glass bookcase. She also told me how to use an English-English dictionary to improve my English grammar. \"Now I think you know what you should do,\" she said. I made much progress and only one year later, I won the first prize in the English Speaking Contest held for secondary school students in my hometown."},"mc-2022-P1":{"title":"A very clever family","text":"The Smiths are possibly the cleverest family in the country, and now the youngest member, ten-year-old Charlotte, has won a national spelling competition to add to the family's successes. Charlotte is the youngest ever winner of the National Young Spelling Bee Competition – the youngest winner before her was her older sister, Helen, who won it when she was eleven. Charlotte and Helen's older brother, Mark, is also very clever. He finished school early and went to university at the age of fifteen, three years before most young people start their university studies. The children's parents, Charles and Vivien, are both teachers and say their children's success comes from working hard, playing hard, and following strict rules about homework and bedtimes. \"Other people think that Charles and I don't let the children have any time to relax and play and that we're always making them do their homework. But it's not true!\" says Vivien. \"We have lots of fun time in the family. But there's a time for fun and there's a time for work, and we make sure the children understand that work comes before play.\" When Charlotte took part in the spelling competition, the whole family, including her grandparents, went to watch her. Helen took a day off school – the first day in her life that she missed going to school. \"I felt bad about missing school,\" Helen said, \"but I think it was important to Charlotte that I was there.\""},"mc-2024-P1":{"title":"Becoming a Celebrity","text":"Some people work for years to become a celebrity, only to find that fame wasn't as great as they expected. It's not that they dislike it exactly, they just realize that there is more to life than being famous.\n\nFormed in 2005, The Jonas Brothers quickly became world-famous. Their albums sold in millions and they played to thousands of fans. But Kevin, one of three brothers in the band, suddenly decided he'd had enough. But why? Had he fought with his brothers? Or found something better? Actually, he felt the group were no longer making music he wanted to listen to, so he left. He created a restaurant-searching app called Yood shortly after quitting, and he's a dad too these days. He'll certainly have more time for his children now he's not touring and recording!\n\nFreddie Prinze Junior became famous after appearing in well-known Hollywood films such as I Know What You Did Last Summer. Recently, however, he decided to stop acting to follow another of his passions: cooking. He grew up seeing his mum creating amazing dishes for the family – she's worked in restaurants all her life – and has been trying to cook as well as her ever since. He hasn't launched a career as a celebrity television chef yet, but he's written a book containing seventy-five of his favourite recipes.\n\nWhen rapper Vanilla Ice released Ice Ice Baby in 1990, it became a huge hit. Although he still makes music, he's never been able to repeat this success, at least musically. Ice bought his first house long before recording Ice Ice Baby. He was only seventeen, but even back then realized he could make money by buying and selling property. So that's what he did after his musical success disappeared. He also started racing jet-skis, and became one of the best jet-skiers in the world.\n\nResearch suggests that wanting to be famous comes from a basic human need to be part of a group. This makes us want other people to like us. As these celebrities perhaps demonstrate, achieving fame doesn't always meet this need and looking for other things in life is actually more likely to give us what we want."},"ngt-2023-de01-P1":{"title":"Letter from Jane","text":"Hi Sammy,\n\nI’m here in the United States and having a great time! We arrived (13) ______ Wednesday and visited the Lincoln Memorial and Georgetown. Georgetown is a historic area in Washington, D.C. The food here is great. I ate a hot dog. It’s a (14) ______ street food in America. I really liked it. Tomorrow, we’re going to the White House with a tour guide and taking a boat trip along the Potomac River. We’re going to the National Air and Space Museum on our last day in Washington, D.C. On Friday, we will go to the airport to get a (15) ______ to New York City. I’m looking forward to going on the Staten Island Ferry to see the Statue of Liberty and going to Yankee Stadium. I wish you were here.\n\nJane"},"ngt-2023-de01-P2":{"title":"The importance of pets","text":"When they were asked, six million people in Britain said they own a pet cat. That’s strange, as only four million cats are known to be living in Britain! Perhaps some cats have more than one owner. What’s clear, however, is that cats are popular with people in Britain.\n\nDoctors have known for some time that a link exists between animals and human health. In a special report, they express the importance of pets to people in Britain. They say that pet owners are less likely to have a heart attack than people who do not own a pet. Although the favourite pets in Britain are cats and dogs, doctors think that all pets are good for people’s health, even pet goldfish! What is the reason for this? Doctors believe that people need to have someone or something to care for and take care of. Then they don’t think about themselves so much. They forget their own problems and thus feel better."},"ngt-2024-de03-P1":{"title":"Global citizens","text":"Being a global citizen doesn’t mean you need to travel around the world. It means you understand and care about (13) ______ is happening in other countries, and you try to make a (14) ______ where you live. Global citizens respect diversity, promote peace, and take action to solve global issues like poverty, pollution, or education. One way to become a global citizen is by learning a foreign language. This helps you (15) ______ with people from different cultures and understand their way of life. Watching international news or joining student exchange programs are also great ways to stay informed and open-minded."},"ngt-2024-de03-P2":{"title":"Why We Should Learn English","text":"English is one of the most widely spoken languages in the world. It is the official language in many countries and is used as a global language for business, education, and travel. Learning English can help people communicate with others from different countries and cultures. English also gives people more opportunities. Many top universities and companies require good English skills. Students who are fluent in English can read international books, watch movies, and study materials that are not available in their native language.\n\nTo improve English, learners should practice regularly, listen to English songs or podcasts, and try to speak with native speakers whenever possible."},"nn-2019-P1":{"title":"Hoa and Ann","text":"Hoa: Hello Ann.\nAnn: Hi, Hoa. (1) ______.\nHoa: Nice to meet you, too.\nAnn: What do you often do in the morning?\nHoa: (2) ______.\nAnn: Do you usually read books in the morning?\nHoa: Yes. (3) ______.\nAnn: How often do you go to the library?\nHoa: (4) ______. How about you? (5) ______?\nAnn: I go there once a week.\nHoa: (6) ______.\nAnn: OK. Bye."},"nn-2019-P2":{"title":"The seasons","text":"It was the first lesson after the summer holidays at Bill's school. The lesson was (1) ______ the seasons of the year. \"There are four (2) ______ in a year,\" said the teacher. \"They are spring, summer, autumn and winter. In spring it is warm and everything (3) ______ to grow. In (4) ______ it is hot and there are (5) ______ flowers in the fields and gardens. In autumn there are many vegetables and fruit. Everybody likes to eat fruit. In winter it is (6) ______ and it often rains. Sometimes there is snow on the ground.\""},"nn-2019-P3":{"title":"Alternative sources of energy","text":"The search for alternative sources of energy has led in various directions. Many communities are burning garbage and other biological waste products to produce electricity. Converting waste products to gases or oil is also an efficient way to dispose of waste.\n\nExperimental work is being done to derive synthetic fuels from coal, oil shale and coal tars. But to date, that process has proven expensive. Other experiments are underway to harness power with giant windmills. Geothermal power, heat from the earth, is also being tested.\n\nSome experts expect utility companies to revive hydroelectric power derived from streams and rivers. Fifty years ago hydroelectric power provided one third of the electricity used in the United States, but today it supplies only four percent. The oceans are another potential source of energy. Scientists are studying ways to convert the energy of ocean currents, tides, and waves to electricity. Experiments are also underway to make use of the temperature differences in ocean water to produce energy."},"nn-2020-P1":{"title":"Pietro and Valerie","text":"Valerie: So, our friend wants to learn a new language?\nPietro: (1) ______\nValerie: No, he can't. Let's start by talking about which of them will be useful.\nPietro: (2) ______\nValerie: OK. Shall we start with this one, the dictionary?\nPietro: (3) ______\nValerie: Yes, I agree, and it's also good for checking spelling. But what about a textbook? They're useful too.\nPietro: (4) ______\nValerie: Possibly, or he may get one free when he pays for the course.\nPietro: (5) ______\nValerie: Then what do you think about these books? \"Learning Spanish 1 and 2 for Beginners\"?\nPietro: (6) ______"},"nn-2020-P2":{"title":"Volcanoes","text":"There are volcanoes all over the earth. They can be on land, (1) ______, or under the sea. They can be dormant, which means they may erupt again, or they can be extinct, which means they will not erupt again. There are different types of volcanoes and some are more dangerous than others. Volcanoes become dangerous when they erupt.\n\nVolcanoes erupt when red-hot rock, called magma, (2) ______ from inside the earth and comes out of a (3) ______ in the ground. Some of it flies into the air, along with black (4) ______. You can see this from many kilometres away. When the rock comes out of the hole, it is called lava, and it is so hot it is (5) ______. It can move (6) ______ the land. Lava can destroy trees, roads and homes."},"nn-2020-P3":{"title":"Second Life","text":"As computer technology has improved, today's online environments have become more complex and realistic. One website that has attracted over six million Internet users is Second Life.\n\nSecond Life is a three-dimensional (3-D) online world where people work, shop, sell and trade items, meet others, go to concerts, and much more. Users, who are called \"residents,\" create their own characters, or \"avatars.\" They use their avatars to explore Second Life's virtual world.\n\nJust like any country, Second Life has its own economy. Using a credit card, users can buy \"Linden Dollars,\" the official currency of Second Life. With Linden Dollars, they can buy land or even an entire island where they can build and decorate their own house, start a garden, or even set up their own store. Land is treated as a valuable commodity in Second Life. Residents can choose to rent or sell their land to other users, and they can earn real money from these transactions. Some users have reported making tens of thousands of dollars from selling Second Life real estate.\n\nWhen residents want to be social (and most of them do) they can use their avatars to interact with others. There are games, shopping malls, clubs, and many kinds of stores available to residents. Avatars can also attend conferences, art shows, and concerts. Real rock bands such as the British pop group Duran Duran have even given live concerts on Second Life. With so many opportunities for interesting things to do and see, it's easy to see why so many users spend so much time on the site.\n\nSecond Life offers users a quick and easy escape from the real world. Many residents see this as one of the main benefits of using the site. Spending time on Second Life allows them to escape the stresses and problems of their daily lives. If a user is having a stressful day at work, she can visit a beautiful island, go skiing, or even fly to another planet during her lunch break. If she is tired at the end of a long day, she can go to a classical music concert while dinner is cooking and never leave home. Users can even visit other planets to help them forget their \"first-life\" problems for a little while.\n\nIn addition to escaping the stress of their daily lives, users can also escape who they are in the real world and live out their fantasies. For example, residents can change their occupations, physical appearance, and even their nationalities. A doctor from the United States can be a Brazilian musician on Second Life, or a banker can choose to be an Olympic basketball player. Basically, Second Life lets users live in a world without limitations. This is very exciting to many people.\n\nAlthough Second Life started as a way for people to escape the real world, it has become more and more like the real world in many ways. Now on Second Life, some countries have virtual embassies, businesses have meetings in virtual rooms, and universities have places where students can view the campus and take classes. Today, Second Life allows users to experience both fantasy and reality in the same place."},"nn-2023-thu-P1":{"title":"Polly and Max","text":"Polly: Hi, Max. Have you got any plans for this summer vacation?\nMax: I was thinking about joining the Student Running Club at the local football stadium. Do you want to come?\nPolly: Sounds good to me. Is it hard to enrol?\nMax: (25) ______. You can come in person on days they meet. But make sure you're there by 5.30 p.m. at the latest.\nPolly: I suppose fees won't cost much, will they?\nMax: (26) ______. A two-hundred-thousand-VND payment will allow you to run in all Friday races throughout the summer. You'll even get a sports bag with a club logo free of charge.\nPolly: That sounds appealing, but I'm just a newbie at running. (27) ______ that I could not keep up with the others.\nMax: Don't worry. Runners are grouped according to experience. You'll train and compete against runners at your same level."},"nn-2023-thu-P2":{"title":"Kids and nature","text":"Every kid deserves to see the stars, so why don't kids spend more time in nature? There are many benefits Mother Nature brings to children. First, nature (28) ______ countless opportunities for kids to think, ask questions, create something new and solve problems. Also, when children take chances, try and fail but try again, they gain confidence. That's (29) ______ we call intellectual benefits. Second, it is true that being outside feels good. When children do outdoor activities, they can be (30) ______ positive emotions. As a result of being free to run, jump, climb, roll and shout, kids relax and reduce their tension and anxiety. Furthermore, a sense of peace occurs when children spend quality time doing whatever they like such as digging a hole in the sand, watching a ladybug crawl or chasing butterflies. This sort of benefit is hard to find in a(n) (31) ______ environment. Additionally, the advantages related to social matters should be mentioned. In nature, children can play alone or connect with other kids. They have a good chance to interact with new and different playmates. They learn to share and problem-solve. What they achieve by doing outdoor activities is not only fun but also builds healthy relationships. And the last benefit worth noting is physical growth. The fresh air and light from the sun help their bodies by producing vitamin D. Outdoor play also allows a child (32) ______ more calories, consequently improving their fitness. In short, being in nature is a right of every kid despite their economic situation or where they are."},"nn-2023-thu-P3":{"title":"Underwater volcano in Tonga","text":"A mighty underwater volcano recently erupted on the Pacific Island of Hunga Tonga-Hunga Ha'apai. The island is part of the nation of Tonga. Millions of people around the world saw video of the spectacular explosion. The event was caught by the GOES West satellite. This U.S.-operated satellite has the mission of observing our planet. The video shows a vast ash cloud in the shape of a giant mushroom rising high into the atmosphere. A shockwave caused by the explosion is seen moving outward from Hunga Tonga-Hunga Ha'apai. The eruption caused a four-foot tsunami that hit Tonga's capital of Nuku'alofa, which is about 65 kilometres south of the volcano. A sonic boom from the eruption was heard across the Pacific Ocean, reaching as far away as Alaska. Reports said Nuku'alofa was covered in a thick layer of volcanic dust.\n\nMost volcanoes on our planet are indeed underwater. This is nothing peculiar. They just erupt very quietly so nobody takes notice. But Tonga's violent underwater volcanic eruption in mid-January has drawn people's attention to volcanoes beneath the ocean. Actually, there is no real difference in how submarine (underwater) and subaerial (on land) volcanoes are formed. They are created when molten rock is produced in the second layer of the Earth's interior and makes its way through the crust.\n\nThe impact of an underwater volcanic eruption depends on how close it is to the water's surface. At two kilometres and below, seawater is quite cold. Any molten rock exposed here cools very quickly. The water will get hot, but it won't turn into steam. But, where the water is shallower, magma can heat the water to the point that it converts to steam. This creates a large change in volume. Steam explosions are quite destructive because a small volume of water turns into a huge volume of steam. Aside from the risk of tsunamis, the ash thrown into the air when a volcano erupts in shallow water can have a serious impact on people's health. The falling ash and released gases not only pollute the air but can affect access to electricity and clean water."},"nn-2024-thu-P2":{"title":"Japanese cuisine","text":"Japanese cuisine has been influenced by the food customs of other nations, but has adopted and refined them to create its own unique cooking style and eating habits.\n\nThe first foreign influence on Japan was China around 300 B.C., (8) ______ the Japanese learned to cultivate rice. The use of chopsticks and the consumption of soy sauce and soybean curd (tofu) also came from China. The Buddhist religion was another important influence on the Japanese diet. In the A.D. 700s, the rise of Buddhism (9) ______ a ban on eating meat. The popular dish, sushi (raw fish with rice), came (10) ______ as a result of this ban. In the 1800s, cooking styles became simpler. A wide variety of vegetarian foods were served in small portions, using one of five standard cooking techniques. All foods were divided into five colour groups (green, red, yellow, white, and black-purple) and six tastes (bitter, sour, sweet, hot, salty, and delicate).\n\nBeginning in the early 1600s, trade with other countries began (11) ______ Western-style influences to Japan. The Dutch introduced corn, potatoes, and sweet potatoes. The Portuguese introduced tempura. Western foods, such as bread, coffee, and ice cream, became popular during the late twentieth century. Another Western influence has been the introduction of timesaving cooking methods. These include the electric rice cooker, packaged foods such as instant noodles, instant miso soup, and instant pickling mixes. However, the Japanese are still (12) ______ to their classic cooking traditions."},"nn-2024-thu-P3":{"title":"Teacher gifts","text":"Schools have different opinions about teacher gifts. In some schools, the parents' association buys each teacher a gift. In others, parents can give what they wish to teachers and other staff. Some schools provide rules for parents to follow, while others leave this completely up to the students and their families. While some families like to find the perfect gift for the teacher, others choose homemade gifts or treats. Others may look for gifts that help the teachers in the classroom.\n\nAs for what gift to choose for the teacher, consider a book. Many bookstores have a section for books to give as gifts. Books of poetry make especially good teacher's presents. And don't forget about blank books that can be used as a diary. If you are still unsure about a specific item to choose, perhaps you should get a gift card. With a gift card, you choose how much money you want to spend, and the store puts that value into the card. Then, the teacher trades the card's value for the book or another item they choose. Other places that often offer gift cards are restaurants and coffee shops, if you know a place the teacher enjoys.\n\nTeachers often require books or DVDs that they need in their classrooms, but their school can't afford. It may be a good idea to talk with your school's librarian before buying a teacher a gift. The librarian may know what the teacher needs. These could be items for the teacher's curriculum or DVDs that support their teaching. You can also give books or DVDs to the library or pay for a magazine subscription.\n\nLastly, remember that a cookie and a note go a long way. The best gifts for a teacher can be kind notes written by students and their parents. Many teachers keep every single one of them. Some teachers even pin thank-you notes to their bulletin board. They look at these thoughtful notes on bad days. They are wonderful things that remind teachers why they do the hard work that they do all year. Accompanying the note with a coffee mug is a good idea. Or you can bake some cookies to go along with the note. Nothing would be sweeter."},"nn-2025-on1-P1":{"title":"Mia and Tom","text":"Mia: (5) ______\nTom: Yes, I'm going to the park with my family.\nMia: (6) ______ What will you do there?\nTom: We'll have a picnic and play some games.\nMia: Nice! (7) ______\nTom: That sounds great! What movie are you going to see?"},"nn-2025-on1-P2":{"title":"A school trip","text":"Last Friday, our class went on a school trip to a science museum. My classmates and I were very excited! The bus (8) ______ was really fun, and we sang fun songs together. When we arrived at the museum, we saw a lot of interesting (9) ______. My favourite was the dinosaur section because we were provided information about (10) ______ types of dinosaurs and their fossils. We also watched a cool 3D movie about (11) ______ space. After lunch, we had time to explore the museum with our friends. It was a great day (12) ______ with learning and laughter. Everyone enjoyed the trip, and we can't wait for our next adventure!"},"nn-2025-on1-P3":{"title":"Raising a pet","text":"Raising a pet can be a fun and rewarding experience! However, it comes with responsibilities. First, choose the right pet for your lifestyle. Dogs and cats need a lot of attention, while fish or hamsters might be easier to care for.\n\nOnce you have your pet, make sure to provide a safe and comfortable home. This means a clean space, fresh water, and proper food. Regular exercise is also important, especially for dogs. Take them for walks or play with them daily.\n\nDon't forget about regular vet visits! Pets need check-ups and vaccinations to stay healthy. Also, spend time bonding with your pet. Play, cuddle, and train them to build a strong relationship.\n\nFinally, be patient. Pets can be challenging at times, but with love and care, they can become your best friends. Remember, a happy pet means a happy home!"},"nn-2025-on2-P1":{"title":"Ella and Noah","text":"Ella: What's your favourite subject in school?\nNoah: (5) ______ It's so interesting!\nElla: Science is great! I like history because of the stories.\nNoah: (6) ______ Do you have a favourite topic?\nElla: (7) ______ It's fascinating!\nNoah: That is cool! We should study together for our next test."},"nn-2025-on2-P2":{"title":"Hobbies","text":"Hobbies are enjoyable activities that we engage in during our leisure time. Some individuals prefer to (8) ______ the Internet to search for fascinating information or play games. I don't often spend much time online because I prefer being (9) ______. One of the hobbies I love most is playing soccer with my friends. We gather every weekend to practise and have a great time. Additionally, I enjoy assisting my mom in (10) ______ garden. I water the plants and observe their growth. Occasionally, I even conduct a survey with my friends to find (11) ______ what activities they like. It's fascinating to discover how different we (12) ______ are! Hobbies allow us to unwind and explore new interests, making life more enjoyable. What hobbies do you like?"},"nn-2025-on2-P3":{"title":"Mrs. Johnson","text":"Mrs. Johnson is a wonderful teacher at Maplewood School. She teaches fifth grade and always makes her classroom a happy place. Every morning, she greets her students with a big smile and a warm \"Good morning!\" Mrs. Johnson believes that every student is special and has unique talents.\n\nIn her class, she encourages everyone to share their ideas. If a student is shy, she gently helps him/her feel comfortable. She often says, \"It's okay to make mistakes; that's how we learn!\" This makes her students feel safe and confident.\n\nMrs. Johnson also cares about her students outside of school. She remembers their birthdays and brings in treats to celebrate. If a student is having a tough day, she takes the time to listen and offer support. She believes that a little kindness can go a long way.\n\nHer lessons are fun and engaging. She uses games and group activities to help students learn. Mrs. Johnson loves to see her students succeed, and she always cheers them on. Because of her caring nature, her students look forward to coming to school every day. They know they can count on her for help and encouragement. Mrs. Johnson truly makes a difference in their lives!"},"nn-2025-on3-P1":{"title":"Sarah and Tom","text":"Sarah: Hey, Tom! Are you ready for your presentation today?\nTom: Not really. I'm a bit nervous. What if I forget what to say?\nSarah: (5) ______ You've worked hard on it. There's no need to rush. Remember to speak slowly.\nTom: That's good advice. I've practised a lot, but I still feel anxious.\nSarah: It's normal to feel that way. Try to make eye contact with your classmates and smile. They're supportive!\nTom: (6) ______ I'll focus on them instead of my nerves.\nSarah: Exactly! You'll do great. Just share your passion for the topic!\nTom: Thanks, Sarah! (7) ______"},"nn-2025-on3-P2":{"title":"Healthy activities for children","text":"Engaging in beneficial activities is important for children's growth and happiness. There are many fun ways for kids to (8) ______ active and cultivate good habits.\n\nOne great activity is playing outside. Children can run, jump, and explore nature in parks or backyards. Games (9) ______ tag, hide and seek, or soccer are not only entertaining but also help build physical fitness. Riding bikes or skating with friends is (10) ______ fun way to stay active.\n\nOne healthy indoor activity is cooking. Involving children in meal preparation encourages them to try new foods and learn about nutrition. They can help parents wash vegetables, prepare ingredients, and then choose (11) ______ to make food. This fosters a positive relationship with food. Reading and crafting can also be engaging indoor activities. These enhance creativity and imagination while also offering a relaxing experience.\n\nBy participating in these healthy activities, children can enjoy a balanced lifestyle, build (12) ______ friendships, and develop lifelong habits, which support their well-being. It's important for parents and caregivers to encourage these activities for a happy and healthy childhood."},"nn-2025-on3-P3":{"title":"Willow Creek","text":"In the heart of Humboldt County, California lies a beautiful neighbourhood called Willow Creek. This area is known for its charming streets with colourful houses and lovely gardens. Every spring, flowers bloom, filling the air with sweet scents and bright colours.\n\nOne of the highlights of Willow Creek is the small park in the centre. Families gather there for picnics, and children play on the swings and slides. The park also has a pond where ducks swim, adding to the peaceful atmosphere. On weekends, you can often find local artists painting or musicians playing cheerful tunes.\n\nThe community spirit in Willow Creek is strong. Neighbours often come together for events like street fairs and farmers' markets. Here, you can find fresh fruits and vegetables, homemade jams, and handmade crafts. Everyone knows each other very well, and it is common to see friendly smiles and waves as people walk by.\n\nAnother lovely feature of this neighbourhood is the tree-lined streets. The tall trees provide people with shade in the summer and beautiful colours of leaves in the fall. Many people love walking or cycling along the streets, enjoying the sights and sounds of nature."},"ntt-2018-P1":{"title":"Tom's birthday","text":"My name's Tom and yesterday it was my birthday. I was nine and I got a lot of presents. Mum took pictures when I opened my presents. I got a red football and a blue sweater, my favorite color! But my favorite present was a new bike. It's great. My old bike was small so I didn't like it. After school I went to the swimming pool with three friends. When we were there, we didn't want to swim at first because the water was very cold, but when we did we had great fun. Then Mum shouted \"Time to go home!\" so we had a shower and got dressed quickly."},"ntt-2020-P1":{"title":"Weather forecast","text":"Earlier morning: 24°C – Hazy\n\nRight now: 21°C – Hazy\n\nTonight: 12°C – Partly cloudy – Chance of rain 10%"},"ntt-2020-P2":{"title":"Message 1","text":"Peter,\nWe're outside the cinema. Text if you're going to be late and we'll wait and watch the next film. If you're not coming, we'll go in now.\nStefan"},"ntt-2020-P4":{"title":"Guide to the Library","text":"Carol, Evan, Gary and Anna go to the library. They read this sign at the library.\n\nBook check out – ground floor\nNew library cards for checking out books – 1st floor\nNewspapers and magazines – 1st floor\nTravel books – 2nd floor\nScience books – 3rd floor\nHistory books – 4th floor\nStory books – 5th floor"},"ntt-2020-P5":{"title":"George at the pet store","text":"George is at the pet store, looking at what kind of pet he might want to get for his birthday. George asks if he can have a horse, but his parents say no because horses are too big. First, he sees dogs and cats. Baby dogs are called puppies. Baby cats are called kittens. George likes them because they are easy to take care of and can play a lot, but they will get bigger. George wants a small pet.\n\nThen George sees animals that have to live in a cage. He sees rabbits, guinea pigs, and mice. Mice are what you call more than one mouse. He likes these animals because they are small.\n\nBirds live in cages too. George sees a parrot and a canary. He likes them all, but he doesn't want to clean the cage."},"ntt-2021-P1":{"title":"Class 5A's Garden Party","text":"Class 5A's Garden Party\n1 August – 4.30\nBecause of bad weather, our party will now be in the School Hall."},"ntt-2021-P2":{"title":"Message","text":"Hi Ben,\nI've booked concert tickets for both of us online. Can you give me the money this afternoon when I see you?\nTim"},"ntt-2021-P3":{"title":"Ants","text":"Ants are incredible creatures. Each colony has its own smell. Each of the ants in the colony knows the smell. Enemies will not be able to enter their camp without being discovered. Several types of ants have a sting to protect their nest when strangers get in.\n\nThe queen ant is the only one who can lay eggs for the colony. None of the other ants can lay eggs at all. The worker ants cannot lay eggs. They take care of new-born baby ants. They also search for food. These worker ants protect their nest from enemies. They also keep the nest spick and span. They take out the \"trash\" from the nest and place it in one area.\n\nSlave-maker ants rob the nest of other ants. They steal the pupae, the cases that hold the ant eggs. Then they bring the pupae back to their camp. When the stolen cases hatch, these stolen ants become slaves."},"ntt-2022-P1":{"title":"Adventure World","text":"ADVENTURE WORLD\nOpen from March 14th to October 31st\nFree shows – 2pm and 4pm daily\nPrices: Over 12 – £24.00; Under 12 – £16.00"},"ntt-2022-P2":{"title":"Cake-making course","text":"CAKE-MAKING COURSE\nSaturday 6 July, 9 a.m. – 5 p.m.\nTop chef Frank Martin will teach you to make cakes and biscuits.\n£50\nLunch in Frank's café\nCall Frank on 866354"},"ntt-2022-P3":{"title":"Message to Lan","text":"Hi Lan,\nI have my piano exam next week. The school is closed, and I need a piano to practise on. Please can I come to your house on Saturday afternoon and practise on your piano?\nThanks,\nHuong"},"ntt-2022-P4":{"title":"Forests","text":"Forests can be found all around the world. There are many different plants and animals that use the forest as their home.\n\nIn the forest, small animals eat the fruits, nuts, mushrooms, and insects. Larger animals eat smaller animals. Other animals eat seeds and shrubs. Most animals are scared of humans, but they are never far away. An ant, bat, snake, deer, or turkey may hide among the leaves, sit in the trees or run on the ground.\n\nMany different types of trees live in the forest. Trees drop their leaves during the fall to save water on the floor of the forest. After the animals and plants die, their bodies break down. This makes the earth rich with nutrients.\n\nForests are fun places to visit. A person who wants to see and hear the real sounds of the forest should listen with his or her eyes and ears."},"ntt-2022-P5":{"title":"Helping other people","text":"Do you want to help other people but think you are too young? There are many opportunities for kids like you to do this. Some activities may seem small, but they make other people happy.\n\nOne activity you can do is to make greeting cards for people in a retirement home. You can brighten their day with a cheerful card. You can also visit them and read your card to them. You can read your favorite book to them, or play a card game.\n\nAnother group of people you can help is children in hospitals. You can visit a hospital and play board games with them. You might want to read picture books to the younger children, or give them some of your toys.\n\nThere are many things you can do to make someone's day brighter. You don't need money or a lot of skills. You can make a big difference in a person's life just by being willing to spend some of your time."},"ntt-2023-P1":{"title":"Holiday Sports Club","text":"Holiday Sports Club\n27 London Road\nJuly – August\nfor young people (10–18 years)\nPlay a different sport every day! (football, basketball, volleyball, tennis and baseball)\nPrice £25 a week"},"ntt-2023-P2":{"title":"Yoga class","text":"YOGA CLASS\nEvery Tuesday at 1.30 p.m.\nMeeting room 7\n$10 for four 30-minute classes\nBring comfortable clothes. The class will provide the yoga mats."},"ntt-2023-P3":{"title":"Message to Jane","text":"Hi Jane,\nThank you for telling us again that Lee is moving to a new school next week. Art class is his favourite class, and I thought we could make a painting for him as a present. I do not have any paint at home, so I am going to the art store tomorrow. After that, we can work on the painting together. Lee's last day at our school is Friday, so we have to finish it before then.\nLet me know what you think.\nDavid"},"ntt-2023-P4":{"title":"Cycling in London","text":"If you enjoy cycling for pleasure, doing it in London can be a shock. There are not many lanes especially for bikes, and making your way through the traffic can be very dangerous. But if you have a great passion, cycling in London can be exciting, and it is an expensive way of keeping fit if you live there. Some cyclists don't mind spending a lot of money on expensive bikes. However, if you just want a basic bike, there are many cheap choices at bicycle markets. In most cases, cheap bikes still look good and are in good condition. You should buy a cycling helmet if you want to cycle in London. Wearing a cycling helmet is not a must in Britain, but it is a good idea to wear one for protection."},"ntt-2023-P5":{"title":"Jenny and Tobi","text":"Jenny likes elephants very much. On Saturday and Sunday mornings, she often helps her uncle at the zoo. One Saturday, a small baby elephant called Tobi had a very bad cough. Jenny's uncle tried to give Tobi some medicine, but he couldn't. Jenny's uncle decided to take Tobi to the zoo hospital.\n\nThat week, Jenny had a holiday from school, so she helped her uncle with Tobi every day. After six days, the baby elephant was much better, so Jenny's uncle took Tobi home to his mother.\n\nJenny was sad when she had to say goodbye to Tobi. Jenny's uncle understood the problem. \"When Tobi was ill in the hospital, he liked you because you helped him. He doesn't need you now because he's with his mother. But he's happy, isn't he?\"\n\n\"You're right,\" said Jenny, \"so I'll be happy, too.\""},"ntt-2024-thu1-P1":{"title":"Football lessons","text":"FOOTBALL LESSONS\nTuesdays and Fridays\n6 – 8 p.m.\n£3 per lesson\nMust wear football boots\nNORTH ROAD SPORTS CENTRE"},"ntt-2024-thu1-P2":{"title":"Pedro's Pizza Bar","text":"Pedro's Pizza Bar\nBuy two pizzas at the same time, and we'll give you a third one for free!\nThis offer is Mon-Fri only."},"ntt-2024-thu1-P3":{"title":"Concert note","text":"Unfortunately, due to bad weather, the concert scheduled on Friday, March 24th has been postponed. We apologize for any inconvenience this may cause. The new date for the concert is Sunday, March 26th at 5 p.m. Thank you for your understanding."},"ntt-2024-thu1-P4":{"title":"Stonehenge","text":"Stonehenge is one of the world's most famous monuments. It is a circle of huge stones in the south of England. People started making it 5,000 years ago, but they took over 1,000 years to build it. If you visit Stonehenge today, you will see many stones still standing, but it is a mystery how people brought them there. The stones are very heavy: the smaller stones are about 3,600 kilograms each, and the bigger ones are about 22,000 kilograms! Archaeologists believe that people carried some stones 32 kilometres, but it is possible that the bigger ones came from 225 kilometres away in Wales. They think that people carried the stones to a river and put them on simple boats. They then took them to the stone circle."},"ntt-2024-thu1-P5":{"title":"A rainy day","text":"It was a rainy day, and Ben felt very bored. He was ten years old and loved playing outside, but today he had to stay inside. His little sister, Lily, who was seven, felt bored too.\n\nTheir mother gave them a large box of old clothes and hats. \"Why don't you play dress-up?\" she suggested. Ben and Lily thought it was a great idea. They put on funny hats, silly glasses, and old coats. Ben pretended to be a pirate, and Lily acted like a princess.\n\nThey created an adventure in the living room. The sofa became a pirate ship, and the coffee table turned into a treasure island. They laughed and played for hours, inventing stories and finding hidden treasures.\n\nWhen their mother returned, she smiled and said, \"It looks like you had a lot of fun!\" Ben and Lily agreed. The rainy day turned into a wonderful adventure indoors."},"tdn-2022-P2":{"title":"Email from Ngoc Mai","text":"Hi Minh Anh,\n\nHow are you? How was your holiday in Dalat? It seems like a long time since we saw each other on the last day of school. It’s nice to have some time off because when we get back to school we will have a math test during the first week.\n\nI’m sending this email from London. We arrived here last Wednesday. Our trip started from Hanoi and we had a ten-hour wait in Dubai. It was really boring because we couldn’t leave the airport.\n\nWe have visited many tourist attractions including Buckingham Palace, where the Queen lives, and we fed pigeons at Trafalgar Square. London is an interesting city and the people are very friendly.\n\nYesterday we took a boat trip along the river Thames – it was great fun. We even had our lunch in the restaurant on the boat. It was delicious but very expensive.\n\nI can’t wait to meet up with you when I get home next week!\n\nSee you next week,\nNgoc Mai"},"tdn-2023-P2":{"title":"Recycling around the World","text":"New statistics give a view of recycling around the world. Here are three of the countries in the report.\n\nSwitzerland\nThe Swiss score well at recycling. With so many different types of recycling bins, local people only have to throw away a few household items. For example, they recycle 80% of their plastic bottles. That’s much higher than other countries in Europe with plastic recycling levels of only between 24-40%.\n\nThe United States of America\nOverall the USA doesn’t recycle as much rubbish as Switzerland but it has introduced a lot of new projects in recent years and so its record is really improving quickly. This year it recycled 48% of its paper, 40% of its plastic bottles and 55% of its cans.\n\nSenegal\nSenegal only recycles a little of its waste industrially. However, people don’t throw away any items that they can use for something else. For example, you can buy shoes made from old plastic bags, and drinking cups from tin cans. Here, everything has another purpose."},"tdn-2024-P2":{"title":"Folktales about the Moon","text":"The Moon is the biggest and brightest object in the night sky. When we look at the Moon, we can see the surface is covered with dark spots. For centuries, people around the world have looked up at the Moon’s spots and seen different images. To explain these images, they told folktales.\n\nA Hawaiian tale explains that a woman got tired of working and went to the Moon to rest by walking on a rainbow bridge.\n\nA Native American story tells how a frog jumped to the Moon to escape a wolf that was madly in love with her.\n\nIn the Japanese version of an Indian tale, the god Sakra disguised himself as a beggar and asked a monkey, a fox and a rabbit for food. The rabbit offered its own body as food and jumped into a fire. Sakra saved the rabbit for its generosity and took it to the Moon, where it works making mochi (rice cakes).\n\nThe Kimbundu tribe of Angola see a frog who acted as messenger between the king of Earth and the king of the Moon.\n\nOne Mexican tale explains how two gods wanted to be the Sun. As only one god could become the Sun, a rabbit is thrown into the face of one of the two gods, making it darker and turning it into the Moon.\n\n(From TakeAway English 3, McGraw Hill)"},"tdn-2026-P2":{"title":"June 21, 2026","text":"Did you know that June 21, 2026, was a very special day? For one thing, it was Father’s Day. Not only did those celebrating Father’s Day get gifts, but they also enjoyed extra daylight this year. This was because it was the June solstice in the Northern Hemisphere, which marked the official start of summer. It was the longest day of the year for places north of the equator. However, if you live in the Southern Hemisphere, June 21 was the shortest day of the year and the start of winter.\n\nPeople have celebrated the summer solstice for thousands of years. The most famous celebration happens at Stonehenge in England. Stonehenge is a massive, 4,000-year-old circle of giant stones. On this special day, the sun rises perfectly in line with these ancient stones. Every year, thousands of people gather there to watch this magical sunrise together."},"tdn-2026-P3":{"title":"Letter from Minh Thanh","text":"Hi Nhat Linh,\n\nI hope you're doing well. I have to tell you about my favourite subject this year: Science! Our teacher, Ms. Thao, is amazing. She makes every lesson (5) ______ like an adventure, and what’s more, she never gets angry at us. Yesterday, we did a crazy chemistry experiment in pairs. My (6) ______ partner, Khang, was so nervous that his hands were shaking! We had to mix a bright blue (7) ______ with a strange white powder. Suddenly, it started fizzing and bubbling into a giant purple foam! Khang jumped back in shock and let out a loud scream, which surprised everyone. (8) ______, Ms. Thao just smiled and gave us a big thumbs-up for a successful experiment. The whole class had a very exciting time.\n\nWhat about you? How are your lessons this year?\n\nMinh Thanh"}}, PAPERS=[{"slug":"cg-2026","s":"CG","y":2026,"k":"official","v":""},{"slug":"cg-2025","s":"CG","y":2025,"k":"official","v":""},{"slug":"cg-2024","s":"CG","y":2024,"k":"official","v":""},{"slug":"cg-2023","s":"CG","y":2023,"k":"official","v":""},{"slug":"cg-2022","s":"CG","y":2022,"k":"official","v":""},{"slug":"cg-2021","s":"CG","y":2021,"k":"official","v":   h+=`<div class="form">`;
  if(un)h+=`<button type="button" class="btn ${isOpen?'ghost':''}" data-toggle="1">${isOpen?'Ẩn đáp án':'Xem đáp án'}</button>${parentPeek.has(r.id)?`<button type="button" class="btn ghost ppw-on" data-pplock="1" title="Khoá lại — ẩn đáp án">${UNLOCK_I}</button>`:''}`;
  else h+=`<button type="button" class="btn" data-ask="1" ${G.coins>=PEEK?'':'disabled'}>Mở khóa đáp án (${PEEK} xu)</button><button type="button" class="btn ghost" data-ppw="1" title="Phụ huynh mở đáp án">${LOCK_I}</button><span class="cnt">${G.coins<PEEK?'Không đủ xu':'Bài chưa mở khóa'}</span>`;
  h+=`</div>`;
  if(pwPend.has(r.id))h+=ppwRow(r);
  if(pwErr.has(r.id))h+=`<div class="fb bad">Sai mật khẩu.</div>`;
  if(pend[r.id])h+=`<div class="confirm"><span>Mở khóa sẽ mất ${PEEK} xu và bài này không nộp được nữa. Chắc chưa?</span><button type="button" class="btn" data-yes="1">Mở khóa</button><button type="button" class="btn ghost" data-no="1">Thôi</button></div>`;
  if(un&&isOpen)h+=`<div class="body"><h4>${r.g?'Đáp án':'Bài mẫu / gợi ý'}</h4><p class="final">${fmt(ansText(r))}</p>${r.x?`<h4>Giải thích</h4><p>${fmt(r.x)}</p>`:''}</div>`;
  if(st.parent)h+=meta(r);
  return h+`</div>`;}
/* ---------- log ---------- */
function fmtT(t){const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`;}
const pad=n=>String(n).padStart(2,'0');
function dKey(t){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function wKey(t){const d=new Date(t);const day=(d.getDay()+6)%7;const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);return dKey(m.getTime());}
function mKey(t){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function lbl(kind,k){if(kind==='m'){const [y,m]=k.split('-');return `Tháng ${m}/${y}`;}
  const [y,m,d]=k.split('-').map(Number);if(kind==='d')return `${pad(d)}/${pad(m)}/${y}`;
  const e=new Date(y,m-1,d+6);return `Tuần ${pad(d)}/${pad(m)} – ${pad(e.getDate())}/${pad(e.getMonth()+1)}`;}
function periodBox(){const L=G.log||[];if(!L.length)return '';
  const kind=st.period||'d';const kf={d:dKey,w:wKey,m:mKey}[kind];const agg={};
  L.forEach(e=>{if(e.kind==='reset')return;const k=kf(e.t);const a=agg[k]=agg[k]||{plus:0,minus:0,net:0,ok:0,bad:0,peek:0,ids:new Set()};
    a.net+=e.delta||0;if(e.delta>0)a.plus+=e.delta;if(e.delta<0)a.minus+=-e.delta;
    if(e.kind==='submit'){a.ids.add(e.id);if(/— đúng$/.test(e.detail))a.ok++;else a.bad++;}if(e.kind==='peek')a.peek++;});
  const keys=Object.keys(agg).sort().reverse();
  let h=`<div class="box" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">Tổng kết xu</h2>
    <div class="chips"><span class="chip ${kind==='d'?'on':''}" data-period="d">Theo ngày</span><span class="chip ${kind==='w'?'on':''}" data-period="w">Theo tuần</span><span class="chip ${kind==='m'?'on':''}" data-period="m">Theo tháng</span></div></div>
    <div class="mwrap" style="margin-top:8px"><table class="matrix"><tr><th>${kind==='d'?'Ngày':kind==='w'?'Tuần':'Tháng'}</th><th>Bài đã nộp</th><th>Đúng</th><th>Sai</th><th>Mở đáp án</th><th>Xu được</th><th>Xu mất</th><th>Xu ròng</th></tr>`;
  keys.forEach(k=>{const a=agg[k];h+=`<tr><td>${lbl(kind,k)}</td><td>${a.ids.size}</td><td>${a.ok}</td><td>${a.bad}</td><td>${a.peek}</td><td class="pos">+${a.plus}</td><td class="neg">−${a.minus}</td><td class="${a.net>=0?'pos':'neg'}">${a.net>=0?'+':''}${a.net}</td></tr>`;});
  return h+`</table></div></div>`;}
function renderLog(){
  const L=(G.log||[]).slice().reverse();const ps=Object.entries(G.p).filter(([id,p])=>p.a>0||p.seen);
  const sub=L.filter(e=>e.kind==='submit').length,ok=ps.filter(([,p])=>p.ok).length,wrong=ps.filter(([,p])=>!p.ok&&p.a>0).length,peek=L.filter(e=>e.kind==='peek').length;
  const byT={};ps.forEach(([id,p])=>{const r=BYID[id];if(!r)return;const u=byT[r.t]=byT[r.t]||{n:0,ok:0,peek:0};u.n++;if(p.ok)u.ok++;if(p.seen)u.peek++;});
  let h=`<div class="kpis"><div class="kpi"><b>${G.coins}</b><span>xu hiện có</span></div><div class="kpi"><b>${ps.length}</b><span>bài đã làm</span></div><div class="kpi"><b>${ok}</b><span>làm đúng</span></div><div class="kpi"><b>${wrong}</b><span>chưa đúng</span></div><div class="kpi"><b>${peek}</b><span>lần mở đáp án</span></div><div class="kpi"><b>${sub}</b><span>lượt nộp</span></div></div>`;
  if(Object.keys(byT).length){h+=`<div class="box" style="margin-top:12px"><h2>Theo dạng bài</h2><div class="mwrap"><table class="matrix"><tr><th>Dạng bài</th><th>Đã làm</th><th>Đúng</th><th>Mở đáp án</th></tr>`+TYPES.filter(t=>byT[t[0]]).map(t=>`<tr><td>${t[1]}</td><td>${byT[t[0]].n}</td><td>${byT[t[0]].ok}</td><td>${byT[t[0]].peek}</td></tr>`).join('')+`</table></div></div>`;}
  h+=periodBox();
  h+=`<div class="box" style="margin-top:12px"><h2>Nhật ký tương tác (mới nhất trước)</h2>`;
  if(!L.length)h+=`<div class="empty">Con chưa làm bài nào.</div>`;
  else h+=`<div class="mwrap"><table class="matrix log"><tr><th>Thời gian</th><th>Bài</th><th>Dạng bài</th><th>Hành động</th><th>Xu</th><th>Còn</th></tr>`+L.map(e=>{const r=BYID[e.id];const stem=r?r.st.replace(/\s+/g,' ').slice(0,70)+(r.st.length>70?'…':''):'';
    return `<tr class="${e.kind}"><td>${fmtT(e.t)}</td><td>${r?`<button type="button" class="lnk" data-goto="${esc(e.id)}">${esc(stem)}</button>`:''}</td><td>${r?esc(TN[r.t]||''):''}</td><td>${esc(e.detail)}</td><td class="${e.delta>0?'pos':e.delta<0?'neg':''}">${e.delta>0?'+':''}${e.delta||''}</td><td>${e.coins}</td></tr>`;}).join('')+`</table></div>`;
  h+=`</div>`;$('#list').innerHTML=h;$('#more').hidden=true;$('#count').textContent='';}
/* ---------- render ---------- */
function listHtml(f,fn){let h='',prev=null;f.slice(0,st.shown).forEach((r,i)=>{h+=headFor(r,prev)+fn(r,i);prev=r;});return h;}
function render(){renderSide();
  if(st.tab==='log'){$('#ctx').textContent='Nhật ký học của con';renderLog();if(st._top){window.scrollTo(0,0);st._top=false;}save();return;}
  const f=filt();
  $('#ctx').textContent=selName()+(st.tab==='ans'?' — Đáp án':st.tab==='wr'?' — Luyện viết':'');$('#count').textContent=`${f.length} bài`;
  if(st.tab==='ans'&&st.target){const r=BYID[st.target];const k=f.findIndex(x=>x.id===st.target);$('#count').textContent='';open.add(st.target);
    $('#list').innerHTML=(r?headFor(r,null)+ansItem(r,k>=0?k:0):'')+`<button type="button" class="back" data-back="${esc(st.target)}">← Quay lại bài tập</button>`;$('#more').hidden=true;window.scrollTo(0,0);save();return;}
  const fn=st.tab==='ex'?exItem:st.tab==='wr'?wrItem:ansItem;
  $('#list').innerHTML=f.length?listHtml(f,fn):`<div class="empty">${st.tab==='wr'?'Mục này không có bài luyện viết.':'Không có bài nào. Con thử chọn mức khác hoặc chủ đề khác nhé.'}</div>`;
  $('#more').hidden=f.length<=st.shown;
  if(st._top){window.scrollTo(0,0);st._top=false;}save();}
function rerenderOne(id){const old=document.querySelector(`.ex[data-ex="${CSS.escape(id)}"],.ans[data-ex="${CSS.escape(id)}"]`);if(!old)return render();
  const f=filt();let k=f.findIndex(r=>r.id===id);const r0=BYID[id];if(k<0)k=0;
  const fn=old.classList.contains('ans')?ansItem:(st.tab==='wr'?wrItem:exItem);const tmp=document.createElement('div');tmp.innerHTML=fn(r0,k);old.replaceWith(tmp.firstElementChild);$('#coinN').textContent=G.coins;save();}
function logEv(r,kind,detail,delta){G.log.push({t:Date.now(),id:r.id,kind,detail,delta,coins:G.coins});if(G.log.length>3000)G.log.splice(0,G.log.length-3000);}
function bump(){const c=$('#coins');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');}
function shown(r,v){return r.f==='mc'?v+'. '+(r.o[LET.indexOf(v)]||''):v;}
function submit(r){const p=P(r.id);if(p.ok||p.seen||p.a>=2||!p.draft)return;
  let fee=0;if(p.a===1){if(G.coins<FEE){p.msg=`Không đủ xu để nộp lại (cần ${FEE} xu).`;p.msgKind='info';return rerenderOne(r.id);}G.coins-=FEE;fee=FEE;}
  p.a++;p.last=shown(r,p.draft);const ok=grade(r,p.draft);
  if(ok){const w=winOf(r);p.ok=true;G.coins+=w;p.msg=r.lv>=5?`Đúng rồi! Bài khó — +${w} xu.`:`Đúng rồi! +${w} xu.`;logEv(r,'submit',`Lần ${p.a}: "${p.last}" — đúng`,w-fee);}
  else{G.coins-=LOSE;p.lost=(p.lost||0)+LOSE+fee;p.msgKind='bad';logEv(r,'submit',`Lần ${p.a}: "${p.last}" — sai`,-LOSE-fee);p.msg=p.a<2?`Chưa đúng. −${LOSE} xu. Con được nộp lại 1 lần nữa (phí ${FEE} xu).`:`Chưa đúng. −${LOSE} xu. Hết lượt nộp — con có thể xem đáp án.`;}
  bump();rerenderOne(r.id);}
function override(r){const p=P(r.id);if(p.ok)return;const w=winOf(r)+(p.lost||0);p.ok=true;p.seen=false;G.coins+=w;p.msg=`Bố mẹ chấm đúng — trả lại xu đã mất và +${winOf(r)} xu.`;logEv(r,'submit',`Bố mẹ chấm lại "${p.last}" — đúng`,w);bump();rerenderOne(r.id);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-period],[data-goto],[data-sel],[data-m],[data-s],[data-g],[data-back],[data-pick],[data-submit],[data-ask],[data-yes],[data-no],[data-view],[data-toggle],[data-ovr],[data-ppw],[data-ppwgo],[data-ppwno],[data-pplock]');if(!t)return;
  const ex=t.closest('[data-ex]');const r=ex?BYID[ex.dataset.ex]:null;
  if(t.dataset.toggle&&r){open.has(r.id)?open.delete(r.id):open.add(r.id);return rerenderOne(r.id);}
  if(t.dataset.pick&&r){P(r.id).draft=t.dataset.pick;return rerenderOne(r.id);}
  if(t.dataset.submit&&r)return submit(r);
  if(t.dataset.ovr&&r)return override(r);
  if(t.dataset.ppw&&r){pwPend.add(r.id);pwErr.delete(r.id);rerenderOne(r.id);const f=document.getElementById('ppw-'+r.id);if(f)f.focus();return;}
  if(t.dataset.ppwno&&r){pwPend.delete(r.id);pwErr.delete(r.id);return rerenderOne(r.id);}
  if(t.dataset.pplock&&r){parentPeek.delete(r.id);open.delete(r.id);pwPend.delete(r.id);pwErr.delete(r.id);return rerenderOne(r.id);}
  if(t.dataset.ppwgo&&r){const f=document.getElementById('ppw-'+r.id);const v=f?f.value:'';if(f)f.value='';return ppwApply(r,v);}
  if(t.dataset.ask&&r){pend[r.id]=true;return rerenderOne(r.id);}
  if(t.dataset.no&&r){delete pend[r.id];return rerenderOne(r.id);}
  if(t.dataset.yes&&r){delete pend[r.id];if(G.coins<PEEK)return rerenderOne(r.id);G.coins-=PEEK;P(r.id).seen=true;logEv(r,'peek','Mở khóa đáp án',-PEEK);bump();open.add(r.id);if(st.tab==='ans'){return rerenderOne(r.id);}st.tab='ans';st.target=r.id;return render();}
  if(t.dataset.period){st.period=t.dataset.period;render();return;}
  if(t.dataset.goto){st.tab='ans';st.target=t.dataset.goto;render();return;}
  if(t.dataset.view&&r){st.tab='ans';st.target=r.id;return render();}
  if(t.dataset.back){const rr=BYID[t.dataset.back];st.tab=rr&&!rr.g?'wr':'ex';st.target=null;render();
    const el=document.querySelector(`.ex[data-ex="${CSS.escape(t.dataset.back)}"]`);if(el)el.scrollIntoView({block:'center'});return;}
  if(t.dataset.sel){st.sel=t.dataset.sel;const sd=document.querySelector('.side');}
  else if(t.dataset.m){st.mode=t.dataset.m;st.sel='';}
  else if(t.dataset.s){st.school=t.dataset.s}else if(t.dataset.g){st.grade=t.dataset.g}
  st.shown=40;st.target=null;st._top=true;render();});
document.addEventListener('input',e=>{const inp=e.target.closest('.inp');if(inp&&inp.classList.contains('ppwi'))return;if(!inp)return;const ex=inp.closest('.ex');const p=P(ex.dataset.ex);p.draft=inp.classList.contains('wr')?inp.value:inp.value.trim();
  const b=ex.querySelector('[data-submit]');if(b)b.disabled=!p.draft;save();});
document.addEventListener('keydown',e=>{const pf=e.target.closest('.ppwi');if(pf&&e.key==='Enter'){e.preventDefault();const ex=pf.closest('[data-ex]');const r=ex?BYID[ex.dataset.ex]:null;const v=pf.value;pf.value='';if(r)ppwApply(r,v);return;}
  if(e.key==='Enter'&&e.target.closest('input.inp')){const ex=e.target.closest('.ex');const r=BYID[ex.dataset.ex];if(r)submit(r);}});
const setTab=t=>{st.tab=t;st.target=null;st._top=true;render()};
$('#tabEx').onclick=()=>setTab('ex');$('#tabWr').onclick=()=>setTab('wr');$('#tabAns').onclick=()=>setTab('ans');$('#tabLog').onclick=()=>setTab('log');
$('#hideDone').onchange=e=>{st.hideDone=e.target.checked;render()};$('#hideMock').onchange=e=>{st.hideMock=e.target.checked;render()};$('#parent').onchange=e=>{st.parent=e.target.checked;render()};
$('#collapse').onclick=()=>{st.side=!st.side;document.querySelector('.grid').classList.toggle('collapsed',!st.side);save();};
document.querySelector('.grid').classList.toggle('collapsed',!st.side);
$('#unitSel').onchange=e=>{st.sel=e.target.value;st.shown=40;st.target=null;st._top=true;render()};$('#sideBtn').onclick=()=>{const sd=document.querySelector('.side');sd.classList.toggle('show');$('#sideBtn').textContent=sd.classList.contains('show')?'Ẩn bộ lọc':'Bộ lọc';};
$('#q').oninput=e=>{st.q=e.target.value;st.shown=40;render()};$('#more').onclick=()=>{st.shown+=40;render()};
function resetClick(){$('#resetBox').innerHTML=`<div class="confirm"><span>Xóa hết xu và bài đã làm, về 50 xu?</span><button type="button" class="btn" id="resetYes">Xóa</button><button type="button" class="btn ghost" id="resetNo">Thôi</button></div>`;
  $('#resetYes').onclick=()=>{const old=G.log||[];G={coins:START,p:{},log:old};G.log.push({t:Date.now(),id:'',kind:'reset',detail:'Đặt lại xu & bài làm',delta:0,coins:START});save();location.reload();};
  $('#resetNo').onclick=()=>{$('#resetBox').innerHTML='<button class="btn ghost" id="reset" type="button">Đặt lại xu &amp; bài làm</button>';bindReset();};}
function bindReset(){const b=$('#reset');if(b)b.onclick=resetClick;}
bindReset();
render();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
