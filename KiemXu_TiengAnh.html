<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bàn học">
<meta name="theme-color" content="#3E7A54">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kiếm Xu · Giải đề Tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same engine & layout as Kiếm Xu (Toán): sidebar of topics + exercise list; palette follows Bàn học (sage paper, Kiếm Xu teal, coin gold). */
:root{
  --paper:#F6F7F0; --card:#FDFDF6; --ink:#202B21; --ink-2:#4B5A4C; --ink-3:#7A8577; --line:#DADFCB;
  --blue:#3E7A54; --blue-tint:#E4EEE3; --green:#2C5A3E; --green-tint:#DFEDE2; --red:#8E3B55; --red-tint:#F1D9E1;
  --gold:#B07F23; --gold-tint:#F3E3C2; --sel:#EDF2E4; --btn-off:#CBD2BC; --en:#8E3B55; --en-tint:#F6EAEE;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121a13; --card:#1a231b; --ink:#E8ECE2; --ink-2:#AEBBAA; --ink-3:#8A9689; --line:#2B362B;
  --blue:#7FC499; --blue-tint:#1E3324; --green:#A8DAB8; --green-tint:#1E3A2A; --red:#E39FB1; --red-tint:#3A2530;
  --gold:#E3B65C; --gold-tint:#3A2F19; --sel:#22301F; --btn-off:#3A463A; --en:#E39FB1; --en-tint:#2A2025; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#121a13; --card:#1a231b; --ink:#E8ECE2; --ink-2:#AEBBAA; --ink-3:#8A9689; --line:#2B362B;
  --blue:#7FC499; --blue-tint:#1E3324; --green:#A8DAB8; --green-tint:#1E3A2A; --red:#E39FB1; --red-tint:#3A2530;
  --gold:#E3B65C; --gold-tint:#3A2F19; --sel:#22301F; --btn-off:#3A463A; --en:#E39FB1; --en-tint:#2A2025; color-scheme:dark }
*{box-sizing:border-box}
button,input,select,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:calc(14px + env(safe-area-inset-top)) calc(60px + env(safe-area-inset-bottom))}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:"Be Vietnam Pro",sans-serif;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--en)}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{all:unset;padding:10px 14px;min-height:44px;box-sizing:border-box;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--blue);color:var(--card)}
.tabs button:focus-visible{outline:2px solid var(--blue)}
.coins{display:flex;align-items:center;gap:8px;background:var(--gold-tint);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.coins svg{width:22px;height:22px}
.coins.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.coins.bump{animation:none}}
.grid{display:grid;grid-template-columns:290px 1fr;gap:18px}
.collapse{min-width:44px;padding:0 12px;font-size:18px}
.grid.collapsed{grid-template-columns:1fr}.grid.collapsed .side{display:none}.grid.collapsed .mbar{display:flex}.grid.collapsed .side.show{display:flex}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.gradebar button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:center}
.gradebar button b{font-size:17px;color:var(--ink)}
.gradebar button span{font-size:12px;color:var(--ink-3)}
.gradebar button.on{border-color:var(--blue);background:var(--blue-tint)}
.gradebar button.on b{color:var(--blue)}
.gradebar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:560px){.gradebar button span{display:none}.gradebar button{min-height:48px}.gradebar button b{font-size:15px}}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rules .r{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.rules .r b{color:var(--ink)}
.rules .r.good{background:var(--green-tint);border-color:transparent;color:var(--green)}.rules .r.good b{color:var(--green)}
.rules .r.bad{background:var(--red-tint);border-color:transparent;color:var(--red)}.rules .r.bad b{color:var(--red)}
.rules .r.warn{background:var(--gold-tint);border-color:transparent;color:var(--gold)}.rules .r.warn b{color:var(--gold)}
.mbar{display:none;gap:8px;margin-bottom:12px;align-items:center}
.mbar select{flex:1;min-width:0;min-height:44px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.mbar .btn.ghost{white-space:nowrap}
.side{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.seg button{all:unset;text-align:center;padding:8px 4px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--blue)}
.ulist{display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto}
.ulist button{all:unset;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 8px;min-height:40px;box-sizing:border-box;border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px}
@media(hover:hover){.ulist button:hover{background:var(--sel)}}
.ulist button.on{background:var(--blue-tint);color:var(--blue);font-weight:600}
.ulist button:focus-visible{outline:2px solid var(--blue)}
.ulist .grp{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 2px;padding-left:8px}
.cnt{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;line-height:1.2;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
label.opt{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;min-height:36px;color:var(--ink-2)}
input[type=search]{width:100%;padding:10px 12px;font-size:16px;-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.toolbar h3{margin:0;font-size:18px;font-weight:700}
.toolbar span{color:var(--ink-3);font-size:13px}
.list{display:flex;flex-direction:column;gap:12px}
.ghead{font-size:13.5px;font-style:italic;color:var(--ink-2);padding:4px 2px 0;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.list>.ghead:first-child{border-top:0;margin-top:0;padding-top:0}
.passage{background:var(--en-tint);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.passage summary{cursor:pointer;font-weight:700;color:var(--en);min-height:28px}
.passage .ptext{white-space:pre-wrap;margin-top:8px;line-height:1.75;max-height:60vh;overflow:auto}
.ex,.ans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:start}
.ex.ok{border-color:var(--green)}.ex.locked{opacity:.92}
.num{font-weight:700;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.stmt,.ans p{line-height:1.7}
.stmt{white-space:pre-wrap;margin:0;overflow-wrap:anywhere;min-width:0;font-size:16px}
.stmt u,.opt-btn u,.ans u{text-decoration-color:var(--en);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
main{min-width:0}.ex,.ans{min-width:0}.ans p,.fb,.meta span{overflow-wrap:anywhere}
.form{grid-column:2;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.opts{grid-column:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px}
.opt-btn{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:44px;cursor:pointer;background:var(--card);font:inherit;font-size:15.5px;color:inherit;text-align:left;width:100%}
.opt-btn b{color:var(--blue);min-width:18px}
.opt-btn.sel{border-color:var(--blue);background:var(--blue-tint)}
.opt-btn.right{border-color:var(--green);background:var(--green-tint)}
.opt-btn:disabled{cursor:default}
.opt-btn:focus-visible{outline:2px solid var(--blue)}
.inp{flex:1 1 260px;min-width:0;padding:11px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.inp{flex-basis:100%;min-height:140px;resize:vertical;line-height:1.6}
.inp:focus{outline:2px solid var(--blue);border-color:transparent}
.btn{padding:11px 18px;min-height:44px;border-radius:8px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:var(--card)}
.btn:disabled{background:var(--btn-off);color:var(--paper);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:600}
.btn.ghost:disabled{background:transparent;color:var(--ink-3)}
.btn.par{background:var(--gold-tint);color:var(--gold);border:1px solid var(--gold)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint{grid-column:2;font-size:12.5px;color:var(--ink-3)}
.fb{grid-column:2;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.fb.good{background:var(--green-tint);color:var(--green)}.fb.bad{background:var(--red-tint);color:var(--red)}.fb.info{background:var(--sel);color:var(--ink-2);font-weight:500}
.confirm{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--gold-tint);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;color:var(--ink)}
.ans.lockedA{border-style:dashed}
.ans .body{grid-column:2;display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ans h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.ans p{margin:0;white-space:pre-wrap}
.final{font-weight:700;color:var(--green);font-size:16px}
.none{color:var(--ink-3);font-style:italic}
.meta{grid-column:2;display:grid;gap:3px;font-size:12.5px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.meta b{font-weight:600;color:var(--ink-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;margin-right:6px}
.meta .warn{color:var(--gold)}
.src{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3)}
.back{all:unset;grid-column:2;justify-self:start;font-size:14px;padding:10px 0;color:var(--blue);cursor:pointer;margin-top:4px}
.more{align-self:center;margin-top:14px;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:110px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.mwrap{overflow-x:auto}.matrix{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.matrix th{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.matrix td.pos{color:var(--green);font-weight:600}.matrix td.neg{color:var(--red);font-weight:600}
.matrix tr.peek td{background:var(--gold-tint)}.matrix tr.reset td{color:var(--ink-3);font-style:italic}
.lnk{all:unset;color:var(--blue);cursor:pointer;padding:4px 0;display:inline-block}@media(hover:hover){.lnk:hover{text-decoration:underline}}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Fredoka',ui-rounded,'Segoe UI Rounded',system-ui,sans-serif;font-weight:600;}
.box h2{font-family:"Be Vietnam Pro",system-ui,sans-serif}
.home-link{display:inline-flex;align-items:center;gap:0.32rem;font-family:'Fredoka',sans-serif;font-weight:600;font-size:0.72rem;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:0.14rem 0.6rem;background:var(--card);white-space:nowrap;}
.home-link:hover{border-color:var(--blue);}
.build-stamp{font-size:0.6rem;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.2;}
.lk{display:inline-block;vertical-align:-3px;}
.fb .lk,.confirm .lk{vertical-align:-4px;margin-right:2px;}
.ppw-row{align-items:center;}
.ppwi{flex:0 1 190px;min-width:120px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;}
.ppwi:focus{outline:none;border-color:var(--blue);}
.ppw-on{border-color:var(--gold)!important;background:var(--gold-tint)!important;}
.ppw-on .lk-open{color:var(--gold);}
.ex .body{grid-column:2;display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ex .body h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.ex .body p{margin:0;white-space:pre-wrap}
@media(max-width:820px){.ex .body{grid-column:1}}
@media print{.side,.tabs,.more,.back,.form,.btn{display:none}.grid{grid-template-columns:1fr}.ex,.ans{break-inside:avoid}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{display:none}.side.show{display:flex}.mbar{display:flex}h1{font-size:20px}.tabs button{padding:10px 10px;font-size:14px}.right{width:100%;justify-content:space-between}.ex,.ans{padding:12px 12px;grid-template-columns:1fr;gap:6px}.form,.opts,.fb,.confirm,.meta,.back,.ans .body,.hint{grid-column:1}.num{font-size:13px}.ulist{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div style="display:flex;align-items:center;gap:10px"><a class="home-link" href="Ban_hoc.html" title="Về Bàn học"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>Bàn học</a><button type="button" class="btn ghost collapse" id="collapse" title="Thu gọn / mở thanh bên" aria-label="Thu gọn thanh bên">☰</button><div><h1 style="margin:0"><small>Kiếm Xu</small>Giải đề Tiếng Anh</h1><div class="build-stamp">Bản dựng · 11/10/2026 19:09 (GMT+7)</div></div></div>
  <div class="right">
    <div class="tabs"><button id="tabEx" class="on">Bài tập</button><button id="tabWr">Luyện viết</button><button id="tabAns">Đáp án</button><button id="tabLog">Nhật ký</button></div>
    <div class="coins" id="coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--gold)"/><circle cx="12" cy="12" r="7" fill="none" stroke="var(--gold-tint)" stroke-width="1.5"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="var(--gold-tint)">X</text></svg><span id="coinN">50</span>&nbsp;xu</div>
  </div>
</header>
<div class="grid">
  <aside class="side">
    <div class="box"><h2>Chọn bài theo</h2>
      <div class="seg" id="seg"><button type="button" data-m="t">Dạng bài</button><button type="button" data-m="u">Chủ đề</button><button type="button" data-m="p">Cả đề</button></div>
      <div class="ulist" id="ulist"></div></div>
    <div class="box" id="filters"><h2>Bộ lọc</h2>
      <div class="chips" id="schools"></div><div style="height:8px"></div>
      <label class="opt"><input type="checkbox" id="hideDone"> Ẩn bài đã làm đúng</label>
      <label class="opt"><input type="checkbox" id="hideMock"> Ẩn đề thi thử &amp; đề ôn</label>
      <label class="opt"><input type="checkbox" id="parent"> Chế độ bố mẹ: xem mọi đáp án</label>
      <div style="height:8px"></div><input type="search" id="q" placeholder="Tìm…" aria-label="Tìm bài">
      <div style="height:10px"></div><div id="resetBox"><button class="btn ghost" id="reset" type="button">Đặt lại xu &amp; bài làm</button></div>
      
    </div>
  </aside>
  <main>
    <div class="gradebar" id="gradebar">
      <button type="button" data-g="4"><b>Lớp 4</b><span>Kiến thức con đã học</span></button>
      <button type="button" data-g="5"><b>Lớp 5</b><span>Đúng +15 xu</span></button>
      <button type="button" data-g="6"><b>Nâng cao</b><span>Ngữ pháp khó · +15 xu</span></button>
      <button type="button" data-g="all"><b>Tất cả</b><span>Mọi mức</span></button>
    </div>
    <div class="rules" id="rules">
      <span class="r good">Đúng: <b>+10 xu</b></span>
      <span class="r good">Đúng bài lớp 5 / nâng cao: <b>+15 xu</b></span>
      <span class="r bad">Sai: <b>−5 xu</b></span>
      <span class="r">Nộp lại lần 2: <b>phí 5 xu</b></span>
      <span class="r warn">Mở đáp án: <b>20 xu</b>, hết lượt nộp</span>
    </div>
    <div class="mbar"><select id="unitSel" aria-label="Chủ đề"></select><button type="button" class="btn ghost" id="sideBtn">Bộ lọc</button></div>
    <div class="toolbar"><h3 id="ctx"></h3><span id="count"></span></div>
    <div class="list" id="list"></div>
    <button class="more" id="more" hidden>Hiện thêm</button>
  </main>
</div>
